<!DOCTYPE html>
<!--
  =========================================================
  우성고 카드 시스템 - single-file organized version
  =========================================================
  작업 기준:
  - 기능 로직은 최대한 그대로 둠
  - 한 파일 구조 유지
  - Ctrl+F 검색용 @SECTION 태그 추가
  - CSS/HTML/JS의 큰 구역만 정리
  - 2차 정리: JS 내부를 기능 단위로 더 세분화
  - 3차 정리: state 필드를 용도별로 재배치하고 누락 상태값을 명시
  - 4차 정리: UIManager를 화면/잠금/로딩/타이머 단위로 세분화
  - 5차 정리: CardLogic 내부 영수증/OCR/반납 흐름을 PHASE 태그로 세분화
  - 6차 정리: CSS cascade/patch/override 영역에 지도와 SUBSECTION 태그 추가
  - 동작 리스크를 낮추기 위해 핵심 호출 흐름/함수명은 유지

  빠른 검색어:
  @SECTION: CSS_THEME_BASE
  @SECTION: CSS_CASCADE_GUIDE
  @SECTION: CSS_THEME_BLUE_OVERRIDE_MAP
  @SECTION: CSS_MOBILE_SAFETY_PATCH
  @SECTION: CSS_MOBILE_PATCH_MAP
  @SUBSECTION: CSS_PATCH_TOKENS_ZINDEX
  @SUBSECTION: CSS_PATCH_VIEWPORT_INPUT
  @SUBSECTION: CSS_PATCH_SCHOOL_MARKS
  @SUBSECTION: CSS_PATCH_LAYOUT_OVERFLOW
  @SUBSECTION: CSS_PATCH_SAFE_AREA_ZINDEX
  @SUBSECTION: CSS_PATCH_SWAL_MODAL_BASE
  @SUBSECTION: CSS_PATCH_SWAL_MODAL_FINAL
  @SUBSECTION: CSS_PATCH_RECEIPT_OVERLAY
  @SUBSECTION: CSS_PATCH_RECEIPT_OVERLAY_ANIMATION
  @SUBSECTION: CSS_PATCH_SAVING_PURPLE
  @SECTION: CSS_FINAL_HOTFIX_ANALYSIS_OVERLAY
  @SECTION: HTML_LOGIN_SCREEN
  @SECTION: HTML_CARD_SELECTION_SCREEN
  @SECTION: HTML_RETURN_SCREEN
  @SECTION: JS_CONFIG
  @SECTION: JS_STATE
  @SECTION: JS_STATE_FIELD_MAP
  @SUBSECTION: JS_STATE_SYNC
  @SUBSECTION: JS_STATE_LOGIN
  @SUBSECTION: JS_STATE_RECEIPT

      2) CSS_MOBILE_SAFETY_PATCH: 모바일 안정화, SweetAlert 안정화, 영수증 처리 상태 오버레이

      - 기존 규칙 삭제보다 아래쪽 패치로 덮어쓰는 방식을 우선
      - 순서를 바꾸면 !important cascade가 달라질 수 있으므로 style 블록 순서 유지
    ========================================================= -->

:root{--bg-color:#e0e5ec;--primary-color:#007aff;--primary-gradient:linear-gradient(135deg,#00c6ff,#0072ff);--accent-color:#ff9500;--danger-color:#ff3b30;--success-color:#28a745;--text-primary:#4a5568;--text-secondary:#718096;--shadow-light:rgba(255,255,255,0.9);--shadow-dark:rgba(163,177,198,0.6);--font-main:'Pretendard',sans-serif;}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;outline:none;user-select:none;-webkit-user-select:none;cursor:default;touch-action:manipulation;}html,body{font-family:var(--font-main);color:var(--text-primary);width:100%;min-height:100%;background-color:var(--bg-color);-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-y:auto;}[hidden]{display:none !important;}.text-gradient{background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:var(--primary-color);}.swal2-input-new,input[type="text"],input[type="number"],input[inputmode="numeric"],input[inputmode="decimal"]{user-select:auto;-webkit-user-select:auto;cursor:text;}

der-radius:6px;position:relative;box-shadow:inset 1px 1px 2px rgba(0,0,0,0.3);}.card-school-icon{font-size:2.2rem;color:rgba(255,255,255,0.95);filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2));}.card-middle{display:flex;justify-content:center;margin-top:15px;position:relative;z-index:1;}.card-number{font-size:1.4rem;font-weight:600;letter-spacing:3px;color:rgba(255,255,255,0.95);text-shadow:1px 1px 2px rgba(0,0,0,0.6);font-family:monospace;white-space:nowrap;}.card-bottom{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;}.card-holder{text-transform:uppercase;font-size:0.75rem;font-weight:500;letter-spacing:1px;color:rgba(255,255,255,0.8);}.card-nfc{transform:rotate(90deg);font-size:1.6rem;color:rgba(255,255,255,0.7);}.lock-text{font-size:1.3rem;font-weight:700;letter-spacing:2px;color:var(--text-secondary);margin-top:40px;text-shadow:1px 1px 2px var(--shadow-light),-1px -1px 2px var(--shadow-dark);animation:soft-pulse 3s infinite ease-in-out;text-align:center;width:100%;transition:opacity 0.2s ease-out;}@keyframes soft-pulse{0%,100%{opacity:0.6;}50%{opacity:1;}}
/* @SECTION: CSS_WELCOME_LOADER - 초기 로딩 화면 */
#welcome-screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10001;background:var(--bg-color);opacity:0;visibility:hidden;transition:opacity 0.4s ease-out,visibility 0.4s;}#welcome-screen.is-visible{opacity:1;visibility:visible;}.hybrid-loader-container{display:flex;flex-direction:column;align-items:center;gap:30px;transform:translateY(-20px);}.circle-loader-wrapper{width:100px;height:100px;position:relative;border-radius:50%;background:var(--bg-color);box-shadow:-6px -6px 14px var(--shadow-light),6px 6px 14px var(--shadow-dark),inset -2px -2px 6px var(--shadow-light),inset 2px 2px 6px var(--shadow-dark);display:flex;justify-content:center;align-items:center;}.circle-spinner{position:absolute;inset:5px;border-radius:50%;border:4px solid transparent;border-top-color:var(--primary-color);border-left-color:var(--primary-color);animation:spin 1.5s cubic-bezier(0.68,-0.55,0.265,1.55) infinite;filter:drop-shadow(0 0 4px rgba(0,122,255,0.5));}.circle-icon{font-size:1.8rem;color:var(--primary-color);animation:pulse 2s infinite;}.tube-gauge-wrapper{width:200px;height:12px;background:#dbe1e8;border-radius:10px;box-shadow:inset 2px 2px 5px var(--shadow-dark),inset -2px -2px 5px var(--shadow-light);overflow:hidden;position:relative;}.tube-fill{width:0%;height:100%;background:linear-gradient(90deg,#2b86c5,#007aff);border-radius:10px;transition:width 0.4s ease-out;box-shadow:0 0 8px rgba(0,122,255,0.5);}.loader-status-text{font-size:0.95rem;font-weight:600;color:var(--text-secondary);height:20px;display:flex;align-items:center;min-width:180px;justify-content:center;}@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.7;transform:scale(0.95);}}:focus{outline:none !important;}:focus-visible{outline:none !important;}.loading-progress-bar{width:150px;height:15px;background:var(--bg-color);border-radius:1 /* @SECTION: CSS_APP_LAYOUT - 공통 레이아웃/화면 컨테이너 */
.content-wrapper{width:100%;min-height:100vh;min-height:100dvh;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);overflow:visible;transition:opacity 0.6s ease,transform 0.6s ease;}.content-wrapper.fade-in-up{animation:fadeInUp 0.8s cubic-bezier(0.2,0.8,0.2,1) forwards;}@keyframes fadeInUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}.container{width:100%;max-width:680px;min-height:100%;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;}#main-title-container{width:100%;max-width:420px;margin:0 auto 10px;display:flex;justify-content:center;opacity:0;transform:translateY(15px);transition:all 0.8s cubic-bezier(0.2,0.8,0.2,1);flex-shrink:0;}#main-title-container.is-visible{opacity:1;transform:translateY(0);}.inset-box{width:100%;background-color:var(--bg-color);padding:18px 0;border-radius:30px;display:flex;justify-content:center;align-items:center;transition:all 0.4s ease;box-shadow:inset 10px 10px 20px var(--shadow-dark),inset -10px -10px 20px var(--shadow-light);border:1px solid rgba(255,255,255,0.1);}.inset-box h2{display:block !important;margin:0 !important;font-size:2.0rem !important;font-weight:900 !important;white-space:nowrap;letter-spacing:-1px;color:var(--text-primary) !important;text-shadow:0 1px 0 #ccc,0 2px 0 #c9c9c9,0 3px 0 #bbb,0 4px 0 #b9b9b9,0 5px 0 #aaa,0 6px 1px rgba(0,0,0,.1),0 0 5px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.3),0 3px 5px rgba(0,0,0,.2),0 5px 10px rgba(0,0,0,.25) !important;background:none !important;-webkit-text-fill-color:initial !important;}.screen{display:flex;flex-direction:column;width:100%;padding:32px;background:var(--bg-color);border-radius:35px;box-shadow:20px 20px 40px var(--shadow-dark),-20px -20px 40px var(--shadow-light);transition:opacity 0.4s ease-in-out;}.screen.is-hiding{opacity:0;}.hidden{display:none !important;}
/* @SECTION: CSS_LOGIN_KEYPAD - 로그인/키패드 화면 */
#screen-login{max-width:440px;margin:0 auto;padding:32px 18px;background:var(--bg-color);border-radius:40px;box-shadow:20px 20px 60px var(--shadow-dark),-20px -20px 60px var(--shadow-light);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.4);height:auto;max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch;}#screen-login-skeleton{max-width:380px;margin:0 auto;box-shadow:none;background:transparent;}.header-dashboard{width:100%;height:75px;padding:0 15px;border-radius:20px;box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light);display:flex;justify-content:space-around;align-items:center;margin-bottom:12px;transition:all 0.3s ease;position:relative;overflow:hidden;}.stat-item{text-align:center;transition:opacity 0.2s ease;}.stat-label{font-size:0.8rem;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;}.stat-value{font-size:1.4rem;font-weight:800;color:var(--primary-color);}.stat-divider{width:1px;height:30px;background:var(--shadow-dark);opacity:0.5;transition:opacity 0.2s ease;}#login-user-tags{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;gap:8px;padding:0 10px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none;opacity:0;pointer-events:none;transition:opacity 0.3s ease;}#login-user-tags.active{opacity:1;pointer-events:auto;}#login-user-tags::-webkit-scrollbar{display:none;}.user-tag{display:inline-flex;align-items:center;justify-content:center;background-color:var(--bg-color);padding:8px 16px;border-radius:12px;font-weight:600;color:var(--primary-color);box-shadow:3px 3px 6px var(--shadow-dark),-3px -3px 6px var(--shadow-light);flex:0 0 auto;border:none;transition:all 0.2s ease;margin-top:2px;margin-bottom:2px;}.user-tag button{background:none;border:none;color:var(--danger-color);margin-left:8px;cursor:pointer;font-size:1.1rem;}.logi     call: async (func, ...args) => {
        if (IS_GAS) {
            return new Promise((resolve, reject) => {
                google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[func](...args);
            });
        }

        const response = await fetch(WORKER_API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ func, args })
        });

        const data = await response.json();
        if (!response.ok || !data.ok) {
            throw new Error(data && data.error ? data.error : `HTTP_${response.status}`);
        }
        return data.result;
    }

function triggerKeypadVisualPress(key){
    try{
        let selector = null;
        if (/^[0-9]$/.test(String(key))) selector = `.keypad-btn[data-key="${key}"]`;
        else if (key === 'Backspace') selector = '#keypad-back-btn';
        else if (key === 'Enter') selector = '#keypad-submit-btn';
        else if (key === '+') selector = '#keypad-add-btn';
        if (!selector) return;
        const btn = document.querySelector(selector);
        if (!btn) return;
        btn.classList.remove('pressed');
        void btn.offsetWidth;
        btn.classList.add('pressed');
        clearTimeout(btn._pressedTimer);
        btn._pressedTimer = setTimeout(() => {
            btn.classList.remove('pressed');
        }, 120);
    } catch(e) {}
}

        /* =========================================================
        @SUBSECTION: JS_UI_MANAGER_LOADER_SEQUENCE
        초기 연결/보안 확인 로더 진행 애니메이션
        ========================================================= */
        async runRandomLoader(chk) {
            const step1Text = '학교 시스템 연결 중...';
            const step2Text = '보안 정보 확인 중...';
            const doneText = '시스템 접속 완료';

            const titleMain = document.getElementById('loader-title-main');
            const titleSub = document.getElementById('loader-title-sub');
            const percentEl = document.getElementById('loader-percent');
            const step1El = document.getElementById('loader-step-1');
            const step2El = document.getElementById('loader-step-2');

            const wait = (ms) => new Promise(r => setTimeout(r, ms));

            let currentStep = 1;
            let currentPercent = 0;

            const stepVisuals = {
                1: {
                    bar: 'linear-gradient(90deg,#3b82f6 0%,#2563eb 100%)',
                    percent: 'linear-gradient(135deg,#2563eb 0%,#3b82f6 100%)'
                },
                2: {
                    bar: 'linear-gradient(90deg,#3b82f6 0%,#6366f1 58%,#7c3aed 100%)',
                    percent: 'linear-gradient(135deg,#2563eb 0%,#7c3aed 100%)'
                },
                3: {
                    bar: 'linear-gradient(90deg,#10b981 0%,#2563eb 100%)',
                    percent: 'linear-gradient(135deg,#10b981 0%,#2563eb 100%)'
                }
            };

            const setStep = (step) => {
                currentStep = step;
                if (step1El && step2El) {
                    step1El.classList.remove('active', 'done');
                    step2El.classList.remove('active', 'done');

                    if (step === 1) {
                        step1El.classList.add('active');
                    } else if (step === 2) {
                        step1El.classList.add('done');
                        step2El.classList.add('active');
                    } else {
                        step1El.classList.add('done');
                        step2El.classList.add('done');
                    }
                }

                const visual = stepVisuals[step] || stepVisuals[1];
                if (elements.loaderBar) elements.loaderBar.style.background = visual.bar;
                if (percentEl) {
                    percentEl.style.background = visual.percent;
                    percentEl.style.webkitBackgroundClip = 'text';
                    percentEl.style.webkitTextFillColor = 'transparent';
                    percentEl.style.backgroundClip = 'text';
                }
            };

            const updateUI = (percent, text) => {
                const safePercent = Math.max(0, Math.min(100, percent));
                if (elements.loaderBar) elements.loaderBar.style.width = `${safePercent}%`;
                if (percentEl) percentEl.textContent = `${Math.round(safePercent)}%`;

                if (currentStep === 1) {
                    if (titleMain) titleMain.textContent = '시스템 연결 중...';
                    if (titleSub) titleSub.textContent = '안전하게 접속을 준비하고 있습니다';
                } else if (currentStep === 2) {
                    if (titleMain) titleMain.textContent = '보안 확인 중...';
                    if (titleSub) titleSub.textContent = '보안 토큰과 사용자 정보를 검증하고 있습니다';
                } else {
                    if (titleMain) titleMain.textContent = '시스템 접속 완료';
                    if (titleSub) titleSub.textContent = '로그인 화면으로 이동합니다';
                }

            };

            if (elements.loaderBar) {
                elements.loaderBar.style.transition = 'width 140ms linear, background 240ms ease';
            }
            if (percentEl) {
                percentEl.style.transition = 'background 240ms ease';
            }

            setStep(1);
            updateUI(0, step1Text);

            while (!(chk && chk())) {
                if (currentPercent < 48) {
                    setStep(1);
                    currentPercent = Math.min(48, currentPercent + 4.0);
                    updateUI(currentPercent, step1Text);
                    await wait(110);
                    continue;
                }

                setStep(2);
                if (currentPercent < 90) {
                    currentPercent = Math.min(90, currentPercent + 2.8);
                    updateUI(currentPercent, step2Text);
                    await wait(110);
                } else {
                    currentPercent = Math.min(97, currentPercent + 0.55);
                    updateUI(currentPercent, step2Text);
                    await wait(170);
                }
            }

            setStep(3);
            if (elements.loaderBar) {
                elements.loaderBar.style.transition = 'width 220ms ease-out, background 240ms ease';
            }
            updateUI(100, doneText);
            await wait(700);
        },
        /* =========================================================
        @SUBSECTION: JS_UI_MANAGER_CONFIRMATION_SCREEN
        완료 화면 표시, 카운트다운, 잠금 화면 자동 복귀
        ========================================================= */
        showConfirmationScreen: (title, detailsHtml) => {
            Utils.haptic([30, 50, 30]);
            document.getElementById('confirmation-title').textContent = title;
            document.getElementById('confirmation-details').innerHTML = detailsHtml;
            UIManager.showScreen('confirmation');
            clearTransitionTimers();

            const totalSec = 5;
            let sec = totalSec;
            const cd = document.getElementById('confirmation-countdown');
            const ringDash = 201;

            const showAppToast = (message) => {
                try {
                    document.querySelectorAll('.app-toast').forEach(el => el.remove());
                    const toast = document.createElement('div');
                    toast.className = 'app-toast';
                    toast.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${Utils.esc(message)}</span>`;
                    document.body.appendChild(toast);
                    requestAnimationFrame(() => toast.classList.add('show'));
                    setTimeout(() => {
                        toast.classList.remove('show');
                        setTimeout(() => toast.remove(), 280);
                    }, 1800);
                } catch (_) {}
            };

            const returnNow = () => {
                clearTransitionTimers();
                if (cd) {
                    cd.innerHTML = '<div class="confirm-timer-caption">첫 화면으로 복귀 중...</div>';
                }
                showAppToast('첫 화면으로 복귀합니다');
                document.getElementById('screen-confirmation').classList.add('is-hiding');
                state.confirmLeaveTimeout2 = setTimeout(() => { state.forceSyncOnNextUnlock = true; UIManager.showLockScreen(); }, 250);
            };

            const renderCountdown = () => {
                const ratio = Math.max(0, Math.min(1, (totalSec - sec) / totalSec));
                const offset = Math.round(ringDash * ratio);
                cd.innerHTML = `
                    <div class="confirm-circular-timer" aria-label="${sec}초 뒤 복귀">
                        <svg viewBox="0 0 74 74" aria-hidden="true">
                            <circle class="confirm-timer-bg" cx="37" cy="37" r="32"></circle>
                            <circle class="confirm-timer-ring" cx="37" cy="37" r="32" style="stroke-dashoffset:${offset}"></circle>
                        </svg>
                        <div class="confirm-timer-text">${sec}</div>
                    </div>
                    <div class="confirm-timer-caption">${sec}초 뒤 첫 화면으로 복귀</div>
                `;
            };

            renderCountdown();
            state.countdownInterval = setInterval(() => {
                sec--;
                if (sec > 0) renderCountdown();
                else returnNow();
            }, 1000);
        }
    };
    /* ===== KEYPAD LOGIC ===== */
    /* Login keypad input, display masking, and security scan flow. */
    /* =========================================================
    @SECTION: JS_KEYPAD_LOGIC
    로그인 키패드, 내선번호 입력, 추가 사용자, 보안 스캔 처리
    ========================================================= */
    const KeypadLogic = {
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_STATE_FLAGS
        로그인 화면 입력 활성 여부/타이핑 상태 플래그
        ========================================================= */
        isUserActive: () => {
            if (state.currentScreen !== 'login') return false;
            return !!state.loginTyping;
        },
        markTyping: () => { if (state.currentScreen === 'login') state.loginTyping = true; },
        clearTyping: () => { state.loginTyping = false; },
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_INIT_DASHBOARD
        키패드 버튼 생성과 대시보드 숫자 갱신
        ========================================================= */
        initializeKeypad: () => {
            if (state.__keypadInited) return;
            state.__keypadInited = true;
            elements.keypadContainer.innerHTML = '';
            [{v:'1'},{v:'2'},{v:'3'},{v:'4'},{v:'5'},{v:'6'},{v:'7'},{v:'8'},{v:'9'},{v:'add',c:`<i class="fa-solid fa-user-plus"></i>`},{v:'0'},{v:'bs',c:`<i class="fa-solid fa-delete-left"></i>`}]
            .forEach(({v,c}) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'keypad-btn';
                if (v === 'add') {
                    btn.dataset.key = '+';
                    btn.id = 'keypad-add-btn';
                    btn.addEventListener('click', KeypadLogic.handleAddUser);
                } else if (v === 'bs') {
                    btn.dataset.key = 'Backspace';
                    btn.id = 'keypad-back-btn';
                    btn.addEventListener('click', KeypadLogic.processBackspace);
                } else {
                    btn.dataset.key = v;
                    btn.addEventListener('click', () => KeypadLogic.processKeyInput(v));
                }
                btn.innerHTML = `<span class="btn-icon">${c||v}</span>`;
                elements.keypadContainer.appendChild(btn);
            });
            elements.keypadSubmitBtn.addEventListener('click', () => { if (!elements.keypadSubmitBtn.disabled) KeypadLogic.processLogin(); });
            KeypadLogic.updateLoginPreviewAndActions();
        },
        updateDashboard: () => {
            if (!state.allCardData) return;
            const total = state.allCardData.length;
            const inUse = state.allCardData.filter(c => c.status === "사용중").length;
            const available = total - inUse;
            const elAvail = document.getElementById('dash-available');
            const elInuse = document.getElementById('dash-inuse');
            if(elAvail) elAvail.textContent = available;
            if(elInuse) elInuse.textContent = inUse;
        },
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_DIGIT_INPUT
        숫자 표시, 마스킹, 입력/삭제 처리
        ========================================================= */
        updateLoginPreviewAndActions: () => {
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            const hasFullPin = ext.length === 4;
            const hasUsers = Array.isArray(state.enteredUsers) && state.enteredUsers.length > 0;
            const addBtn = document.getElementById('keypad-add-btn');
            const submitBtn = document.getElementById('keypad-submit-btn');
            const preview = document.getElementById('login-user-preview');
            const instruction = document.getElementById('login-instruction');
            const badgeText = document.getElementById('dash-badge-text');
            const badgeIcon = document.getElementById('dash-badge-icon');
            const centerScreen = document.getElementById('dash-center-screen');

            if (addBtn) addBtn.disabled = !hasFullPin;
            if (submitBtn) submitBtn.disabled = !(hasFullPin || hasUsers);

            if (preview) {
                preview.classList.add('hidden');
                preview.textContent = '';
                preview.classList.remove('invalid');
            }

            if (centerScreen) centerScreen.classList.remove('success', 'invalid');
            if (!instruction) return;

            instruction.classList.remove('login-ready', 'login-invalid', 'hidden');

            // 동행자 추가 직후에는 방금 입력한 내선번호만 잠깐 보여주고,
            // 이후에는 중앙 상태창을 다시 현재 입력 대기 상태로 되돌립니다.
            if (state._showAddedFeedback && state._lastAddedExt) {
                instruction.classList.add('login-ready');
                instruction.innerHTML = `<span class="login-added-ext">[${Utils.esc(state._lastAddedExt)}]</span> 추가완료`;
                if (centerScreen) centerScreen.classList.add('success');
                if (badgeText) badgeText.textContent = '추가 성공';
                if (badgeIcon) badgeIcon.className = 'fa-solid fa-user-plus';
                return;
            }

            if (hasFullPin && Array.isArray(state.allUsersData)) {
                const user = state.allUsersData.find(u => String(u.extension) === ext);
                if (user) {
                    instruction.classList.add('login-ready');
                    instruction.innerHTML = '<span class="login-ready-keyword">로그인</span> 준비완료';
                    if (centerScreen) centerScreen.classList.add('success');
                    if (badgeText) badgeText.textContent = '확인 완료';
                    if (badgeIcon) badgeIcon.className = 'fa-solid fa-circle-check';
                } else {
                    instruction.classList.add('login-invalid');
                    instruction.innerHTML = '번호 확인 필요';
                    if (centerScreen) centerScreen.classList.add('invalid');
                    if (badgeText) badgeText.textContent = '조회 실패';
                    if (badgeIcon) badgeIcon.className = 'fa-solid fa-circle-exclamation';
                }
            } else if (ext.length > 0) {
                instruction.textContent = `${ext.length}자리 입력됨`;
                if (badgeText) badgeText.textContent = '입력 중';
                if (badgeIcon) badgeIcon.className = 'fa-solid fa-keyboard';
            } else {
                instruction.textContent = '내선번호 입력';
                if (badgeText) badgeText.textContent = '대기 중';
                if (badgeIcon) badgeIcon.className = 'fa-solid fa-keyboard';
            }
        },
        renderDisplay: () => {
            document.querySelectorAll('#keypadDisplay .digit-wrapper').forEach((wrap, i) => {
                const box = wrap.querySelector('.digit-box');
                if (!box) return;
                const data = state.keypadValues[i];

                // filled / masked 상태만 안전하게 초기화합니다.
                // 다른 레이아웃/애니메이션 클래스가 추가되어도 같이 지워지지 않도록 보호합니다.
                box.classList.remove('filled', 'masked', 'current-active');
                wrap.classList.remove('active-cursor');
                box.textContent = '';

                if (data) {
                    if (data.masked) {
                        box.classList.add('masked');
                    } else {
                        box.classList.add('filled');
                        box.textContent = data.value;
                    }
                }

                if (i === state.activeDigitIndex && state.activeDigitIndex < 4 && !state.keypadValues[i]) {
                    wrap.classList.add('active-cursor');
                    box.classList.add('current-active');
                }
            });
            KeypadLogic.updateLoginPreviewAndActions();
        },
        processKeyInput: (k) => {
            triggerKeypadVisualPress(k);
            Utils.haptic(8);
            if (state.activeDigitIndex > 3) return;
            KeypadLogic.markTyping();
            const idx = state.activeDigitIndex;
            state.keypadValues[idx] = { value: k, masked: false };
            KeypadLogic.renderDisplay();
            if (state.inputTimers[idx]) clearTimeout(state.inputTimers[idx]);
            state.inputTimers[idx] = setTimeout(() => {
                if (state.keypadValues[idx]) {
                    state.keypadValues[idx].masked = true;
                    KeypadLogic.renderDisplay();
                }
            }, 700);
            if (state.activeDigitIndex < 3) state.activeDigitIndex++;
        },
        processBackspace: () => {
            triggerKeypadVisualPress('Backspace');
            Utils.haptic(8);
            KeypadLogic.markTyping();
            const idx = state.activeDigitIndex > 3 ? 3 : (state.keypadValues[state.activeDigitIndex] ? state.activeDigitIndex : state.activeDigitIndex - 1);
            if (idx >= 0) {
                if (state.inputTimers[idx]) clearTimeout(state.inputTimers[idx]);
                state.keypadValues[idx] = null;
                state.activeDigitIndex = idx;
                KeypadLogic.renderDisplay();
            }
            const hasTags = state.enteredUsers && state.enteredUsers.length > 0;
            state.loginTyping = state.keypadValues.some(v => v !== null) || hasTags;
        },
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_USER_CHIPS
        추가 사용자 등록/삭제 및 로그인 사용자 칩 표시
        ========================================================= */
        handleAddUser: () => {
            triggerKeypadVisualPress('+');
            if (document.getElementById('keypad-add-btn')?.disabled) return;
            Utils.haptic(18);
            if (state.enteredUsers.length >= 5) {
                return Swal.fire({
                    toast: true,
                    position: 'top',
                    icon: 'warning',
                    title: '인원 초과',
                    text: '최대 5명(메인1+추가4)까지 설정 가능합니다.',
                    showConfirmButton: false,
                    timer: 2000
                });
            }
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            if (ext.length !== 4) return Swal.fire('알림', '내선번호 4자리를 입력해주세요.', 'warning');
            const user = state.allUsersData.find(u => String(u.extension) === ext);
            if (!user) return Swal.fire('조회 실패', '해당 내선번호를 찾을 수 없습니다.', 'error');
            if (state.enteredUsers.some(u => String(u.extension) === ext)) return Swal.fire('알림', '이미 추가된 사용자입니다.', 'info');
            KeypadLogic.markTyping();
            state.enteredUsers.push({ extension: ext, name: user.name, role: user.role });
            state._lastAddedExt = ext;
            state._showAddedFeedback = true;
            if (state._addedFeedbackTimer) clearTimeout(state._addedFeedbackTimer);
            state.keypadValues = [null, null, null, null];
            state.activeDigitIndex = 0;
            KeypadLogic.renderDisplay();
            KeypadLogic.renderLoginUserTags();
            state._addedFeedbackTimer = setTimeout(() => {
                state._showAddedFeedback = false;
                if (state.currentScreen === 'login') KeypadLogic.updateLoginPreviewAndActions();
            }, 1500);
        },
        renderLoginUserTags: () => {
            const inline = document.getElementById('login-user-inline');
            const panel = document.getElementById('login-user-panel');
            const instruction = document.getElementById('login-instruction');
            const instructionArea = document.getElementById('login-instruction-area');
            const mainBox = document.getElementById('main-user-box');
            if (!inline || !panel || !mainBox) return;

            inline.innerHTML = '';
            mainBox.innerHTML = '';
            inline.classList.remove('hidden');

            if (!state.enteredUsers || state.enteredUsers.length === 0) {
                panel.classList.add('hidden');
                if (instructionArea) instructionArea.classList.remove('has-users');
                if (instruction) {
                    instruction.classList.remove('hidden', 'login-ready', 'login-invalid');
                    instruction.textContent = '내선번호 입력';
                }
                inline.classList.add('hidden');
                KeypadLogic.updateLoginPreviewAndActions();
                return;
            }

            panel.classList.remove('hidden');
            if (instructionArea) instructionArea.classList.add('has-users');
            if (instruction) instruction.classList.remove('hidden');

            const mainUser = state.enteredUsers[0];
            const mainExt = Utils.esc(String(mainUser.extension || ''));
            mainBox.innerHTML = `
                <div class="main-user-info">
                    <span class="main-user-icon"><i class="fa-solid fa-user-shield"></i></span>

        /* =========================================================
        @SUBSECTION: JS_LOGIN_PROCESS
        내선번호 검증, 사용자 확정, 카드 반납 여부 판단
        ========================================================= */
        async processLogin() {
            if (document.getElementById('keypad-submit-btn')?.disabled) return;
            triggerKeypadVisualPress('Enter');
            Utils.haptic(18);
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            UIManager.stopInactivityDetection();
            if (!state.allUsersData) {
                UIManager.setLoading(true, '데이터 로딩 중...');
                await Api.call('getInitialAppData')
                    .then(d => { state.allCardData = d.allCards; state.allUsersData = d.allUsers; })
                    .catch(UIManager.handleServerError);
                UIManager.setLoading(false);
            }
            if (state.enteredUsers.length === 0) {
                if (ext.length !== 4) {
                    elements.keypadDisplay.classList.add('shake');
                    setTimeout(()=>elements.keypadDisplay.classList.remove('shake'), 500);
                    return UIManager.startInactivityDetection();
                }
                const user = state.allUsersData.find(u => String(u.extension) === ext);
                if (!user) {
                    elements.keypadDisplay.classList.add('shake');
                    setTimeout(()=>elements.keypadDisplay.classList.remove('shake'), 500);
                    state.keypadValues = [null,null,null,null];
                    state.activeDigitIndex=0;
                    KeypadLogic.renderDisplay();
                    return UIManager.startInactivityDetection();
                }
                state.enteredUsers.push({ extension: ext, name: user.name, role: user.role });
            }
            Utils.haptic([20, 40, 20]);
            KeypadLogic.clearTyping();
            document.getElementById('main-welcome-message').innerHTML =
                `<i class="fa-solid fa-hand-sparkles"></i> <strong>${state.enteredUsers.map(u=>u.name).join(', ')}</strong> 님 환영합니다`;
            await KeypadLogic.runSecurityScan();
            if (state.syncPromise) {
                UIManager.setLoading(true, '최신 카드 상태 확인 중...', 'receipt');
                try { await state.syncPromise; } catch(e) {}
                UIManager.setLoading(false);
                state.syncPromise = null;
            }
            const mainUser = state.enteredUsers[0].name;
            const cardToReturn = state.allCardData.find(c => c.status === "사용중" && c.userInfo && c.userInfo.userName.includes(mainUser));
            if (cardToReturn) {
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                await new Promise(r => setTimeout(r, 250));
                CardLogic.setupAndShowReturnScreen(cardToReturn);
                UIManager.showScreen('returnDetails');
            }
            state.keypadValues = [null,null,null,null];
            state.activeDigitIndex = 0;
            KeypadLogic.renderDisplay();
            UIManager.startInactivityDetection();
        },
        /* =========================================================
        @SUBSECTION: JS_LOGIN_SECURITY_SCAN
        로그인 성공 후 신원 확인 애니메이션
        ========================================================= */
        runSecurityScan: () => new Promise(resolve => {
            const overlay = document.getElementById('security-scan-overlay');
            const box = document.getElementById('scan-box');
            const icon = document.getElementById('scan-icon');
            const text = document.getElementById('scan-text');
            box.classList.remove('success', 'scanning');
            overlay.classList.remove('exit');
            icon.className = 'fa-solid fa-user scan-icon';
            text.textContent = '신원 확인 중...';
            text.style.color = 'var(--text-primary)';
            text.classList.remove('fade-out');
            text.classList.add('fade-in');
            overlay.classList.add('active');
            void box.offsetWidth;
            box.classList.add('scanning');
            setTimeout(() => {
                box.classList.remove('scanning');
                box.classList.add('success');
                icon.className = 'fa-solid fa-check scan-icon';
                text.classList.remove('fade-in');
                text.classList.add('fade-out');
                setTimeout(() => {
                    text.textContent = '신원 확인 완료!';
                    text.style.color = 'var(--primary-color)';
                    text.classList.remove('fade-out');
                    text.classList.add('fade-in');
                }, 180);
                setTimeout(() => {
                    overlay.classList.add('exit');
                    document.querySelector('.content-wrapper').style.display = 'flex';
                    CardLogic.displayCardList();
                    UIManager.showScreen('main');
                    setTimeout(() => {
                        overlay.classList.remove('active', 'exit');
                        resolve();
                    }, 450);
                }, 800);
            }, 1150);
        })
    };

        /* =========================================================

        // 변경 부분: 오버레이 로직 전면 개편 (분석중, 저장중, 저장완료를 부드럽게 연결)

        requestRenderReceiptCart: () => {

        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_AUTOSAVE
        영수증 장바구니 저장을 debounce 처리하고 저장 완료 표시
        ========================================================= */
        queueSaveCart: (backupCart = null) => new Promise((resolve, reject) => {
            /* @PHASE: JS_RECEIPT_AUTOSAVE_COLLECT_PENDING - 빠르게 들어오는 저장 요청을 debounce 큐로 묶음 */
            const token = ++state.cartSaveToken;
            state.cartSavePending = state.cartSavePending || [];
            state.cartSavePending.push({ resolve, reject, backupCart, token });

            if (state.cartSaveTimer) clearTimeout(state.cartSaveTimer);
            state.cartSaveTimer = setTimeout(async () => {
                const pending = state.cartSavePending || [];
                state.cartSavePending = [];
                state.cartSaveTimer = null;

                try {
                    /* @PHASE: JS_RECEIPT_AUTOSAVE_SERVER_CALL - 현재 장바구니를 master 파일에 저장 */
                    await Api.call('saveCartToMasterFile', {
                        cardId: state.currentReturnCard.id,
                        cartData: state.receiptCart.map(({processing, analysisMeta, receiptImage, ...r}) => ({
                            ...r,
                            ...(String(receiptImage || '').startsWith('id:') ? { receiptImage } : {})
                        }))
                    });

                    state.receiptCart.forEach((it, idx) => {
                        if (it && it.processing === 'saving') {
                            it.processing = 'saved';
                            setTimeout(() => {
                                const cur = state.receiptCart[idx];
                                if (cur && cur.processing === 'saved') {
                                    delete cur.processing;
                                    CardLogic.requestRenderReceiptCart();
                                }
                            }, 850);
                        }
                    });
                    CardLogic.requestRenderReceiptCart();
                    pending.forEach(p => p.resolve(true));
                } catch (e) {
                    /* @PHASE: JS_RECEIPT_AUTOSAVE_ROLLBACK - 실패 시 전달받은 backupCart로 복구 */
                    const rollback = [...pending].reverse().find(p => p.backupCart);

                        state.receiptCart = rollback.backupCart;
                        CardLogic.requestRenderReceiptCart();
                    }
                    pending.forEach(p => p.reject(e));
                }
            }, 220);
        }),
        startReviewMode: (startIdx, count) => {
            try {
                const isMeal = !!(state.currentReturnCard && state.currentReturnCard.userInfo && String(state.currentReturnCard.userInfo.purpose||'').includes('특근'));
                const q = [];
                for (let i = 0; i < count; i++) {
                    const idx = startIdx + i;
                    const it = state.receiptCart[idx];
                    if (!it || it.processing === 'error') continue;
                    if (!isMeal && !String(it.usageDetails||'').trim()) q.push(idx);
                }
                state.reviewQueue = q;
            } catch(e) {}
        },
        continueReviewIfNeeded: (savedIdx) => {
            try {
                if (!state.reviewQueue || !state.reviewQueue.length) return;
                if (state.reviewQueue[0] !== savedIdx) return;
                state.reviewQueue.shift();
                if (state.reviewQueue.length) {
                    const nextIdx = state.reviewQueue[0];
                    try{
                        if (window.Swal) {
                            Swal.fire({
                                title: '다음 영수증 불러오는 중...',
                                text: '잠시만 기다려 주세요',
                                showConfirmButton: false,
                                allowOutsideClick: false,
                                allowEscapeKey: false,
                                backdrop: true,
                                didOpen: () => { try { Swal.showLoading(); } catch(e){} }
                            });
                        }
                    } catch(e) {}
                    setTimeout(() => { try{ if(window.Swal) Swal.close(); }catch(e){}; CardLogic.openOcrPopup(state.receiptCart[nextIdx], nextIdx); }, 650);
                }
            } catch(e) {}
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_OCR_HELPERS
        OCR 결과 검증, 처리 상태 라벨, 사용자 안내 toast
        ========================================================= */
        isReceiptAnalysisFailed: (ocr) => {
            if (!ocr || ocr.ok === false) return true;
            const place = String(ocr.storeName || '').trim();
            const amount = String(ocr.amount || '').replace(/[^\d]/g, '').trim();

            // 금액은 필수입니다. 상호명이 비면 제출 데이터 품질이 떨어져서 직접 확인 대상으로 둡니다.
            return !place || !amount;
        },
        // 변경 부분: getReceiptProcessingLabel 처리 상태 추가 매핑
        getReceiptProcessingLabel: (processing) => {
            switch (processing) {
                case 'queued':
                case 'optimizing':
                case 'ocr':
                case 'postprocessing':
                    return '영수증 분석 중...';
                case 'saving': return '저장 중...';
                case 'saved': return '저장 완료';
                case 'deleting': return '삭제 중...';
                case 'save_error': return '저장 실패';
                case 'error': return '분석 실패';
                default: return '분석 중...';
            }
        },
        showMealAutoAdjustToast: (originalAmount, adjustedAmount) => {
            const from = String(originalAmount || '').replace(/[^\d]/g, '');
            const to = String(adjustedAmount || '').replace(/[^\d]/g, '');
            if (!from || !to || from === to) return;
            try {
                Swal.fire({
                    toast: true,
                    position: 'top',
                    icon: 'info',
                    title: `특근매식 금액을 ${Utils.nfKR.format(Number(to))}원으로 자동 조정했어요`,
                    text: `OCR 인식값 ${Utils.nfKR.format(Number(from))}원`,
                    showConfirmButton: false,
                    timer: 2400,
                    timerProgressBar: true
                });
            } catch (e) {}
        },
        showReceiptAnalysisFallback: (isReplacement = false) => {
            try {
                if (!isReplacement) {
                    Swal.fire({
                        toast: true,
                        position: 'top',
                        icon: 'warning',
                        title: '일부 영수증은 직접 확인이 필요해요',
                        text: '카드를 눌러 누락된 내용을 입력해 주세요.',
                        showConfirmButton: false,
                        timer: 2200,
                        timerProgressBar: true
                    });
                    return;
                }
                Swal.fire({
                    icon: 'warning',
                    title: '영수증 인식 실패',
                    text: isReplacement
                        ? '영수증 자동 분석에 실패했어요. 직접 입력창에 내용을 적어 주세요.'
                        : '영수증 자동 분석에 실패했어요. 직접 입력으로 계속 진행해 주세요.',
                    confirmButtonColor: '#007aff'
                });
            } catch (e) {}
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_UPLOAD_ENTRY
        영수증 파일 선택창 열기와 upload picker 상태 전달
        ========================================================= */
        triggerImageSelection: async (editIndex = -1) => {

            const hasActiveUpload = Array.isArray(state.receiptCart) && state.receiptCart.some(it =>

                    });

        /* =========================================================
        @SUBSECTION: JS_CARD_LIST_RENDERING        },
        /* =========================================================
        @SUBSECTION: JS_CARD_LIST_RENDERING
        카드 목록 정렬/필터링/버튼 생성
        ========================================================= */
        displayCardList: () => {
            elements.cardGrid.innerHTML = '';
            elements.cardGrid.classList.remove('is-loaded');
            if (!state.allCardData) return;
            const visibleCards = state.allCardData.filter(CardLogic.isCardVisibleToCurrentUsers);
            const sorted = [...visibleCards].sort((a,b) => {

                return parseInt(a.id.replace(/\D/g,'')) - parseInt(b.id.replace(/\D/g,''));
            });
            const icon = state.enteredUsers.length > 1 ? 'fa-utensils' : 'fa-credit-card';
            elements.cardSelectionHeader.innerHTML =
                `<i class="fa-solid ${icon}"></i>${state.enteredUsers.length>1?' 사용할 카드를 선택해주세요.':' 사용할 카드를 선택해주세요.'}`;
            const frag = document.createDocumentFragment();
            sorted.forEach((c, i) => frag.appendChild(CardLogic.createCardButton(c, i)));
            elements.cardGrid.appendChild(frag);

        createCardButton: (card, idx) => {
            const wrap = document.createElement('div');
            wrap.className = 'card-item-wrapper';
            wrap.dataset.cardId = card.id;
            wrap.style.transitionDelay = `${idx * CARD_APPEAR_DELAY_MS}ms`;
            if (card.status !== '사용가능') wrap.classList.add('disabled');

        /* =========================================================
        @SUBSECTION: JS_PURPOSE_RENT_FLOW
        카드 사용 목적 선택 오버레이와 대여 요청
        ========================================================= */
        openMorphOverlay(card) {
            const cardEl = document.querySelector(`.card-item-wrapper[data-card-id="${card.id}"]`);
            const overlay = document.getElementById('morph-overlay');
            if (cardEl && overlay) {
                const rect = cardEl.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                overlay.style.setProperty('--morph-origin-x', `${centerX}px`);
                overlay.style.setProperty('--morph-origin-y', `${centerY}px`);
            }
            const title = document.getElementById('morph-title');
            const actions = document.getElementById('morph-actions');
            const closeBtn = document.getElementById('close-morph-btn');
            overlay.dataset.cardId = card.id;
            title.textContent = card.displayName;
            const buttons = [
                { id: '물품구매', icon: 'fa-box', label: '물품구매' },
                { id: '식사다과', icon: 'fa-utensils', label: '식사다과' },
                { id: '기타운영', icon: 'fa-ellipsis', label: '기타운영' },
                { id: '특근매식', icon: 'fa-moon', label: '특근매식' }
            ];
            actions.innerHTML = buttons.map(CardLogic.renderPurposeButtonHTML).join('');
            closeBtn.onclick = CardLogic.closeMorphOverlay;
            overlay.classList.add('active');
        },
        closeMorphOverlay() {
            const overlay = document.getElementById('morph-overlay');
            overlay.classList.remove('active');
            delete overlay.dataset.cardId;
        },
        async submitRentRequest(id, purpose) {
            if (CardLogic._rentInFlight) return;
            CardLogic._rentInFlight = true;

            CardLogic.closeMorphOverlay();
            const names = state.enteredUsers.map(u => u.name).join(', ');
            const params = { cardNumber: id, userName: names, purpose, userExtensions: state.enteredUsers.map(u => u.extension) };
            try {
                await safeUpdate(
                    (state, cardId) => {
                        const t = state.allCardData.find(c => c.id === cardId);
                        if (t) {
                            t.status = '사용중';
                            t.userInfo = t.userInfo || {};
                            t.userInfo.userName = names;
                            t.userInfo.purpose = purpose;
                            t.userInfo.receiveDate = Utils.formatDateKR();
                            t.savedCart = [];
                        }
                        UIManager.showConfirmationScreen('신청 완료',
                            Utils.createDetailRow('카드번호', id)+
                            Utils.createDetailRow('사용자', names)+
                            Utils.createDetailRow('사용 목적', purpose)
                        );
                        state.pendingPostReturnSync = true;
                        CardLogic._rentInFlight = false;
                    },
                    async () => {
                        const r = await Api.call('rentNow', params);
                        if(r?.status==="conflict") throw new Error('ALREADY_IN_USE');
                        if(r?.status==="defer") await Api.call('queueRentRequest', params);
                        state.pendingPostReturnSync = true;
                        CardLogic.scheduleQuickSync(2, 900);
                    },
                    (e) => {
                        CardLogic._rentInFlight = false;
                        clearInterval(state.countdownInterval);
                        UIManager.showScreen('main');
                        Swal.fire(e.message==='ALREADY_IN_USE'?'신청 실패':'서버 오류', e.message==='ALREADY_IN_USE'?'이미 사용중입니다.':'오류가 발생했습니다.', e.message==='ALREADY_IN_USE'?'warning':'error');
                        CardLogic.displayCardList();
                    },
                    id
                );
            } catch (e) {
                CardLogic._rentInFlight = false;
                throw e;
            }
        },
        /* =========================================================
        @SUBSECTION: JS_RETURN_SCREEN_LAYOUT        },
        /* =========================================================
        @SUBSECTION: JS_RETURN_SCREEN_LAYOUT

            form.appendChild(batchProgress);

            else if(card.userInfo.purpose === '식사다과') purposeIcon = 'fa-mug-hot';
            else if(card.userInfo.purpose === '기타운영') purposeIcon = 'fa-ellipsis';

            document.getElementById('return-screen-title').innerHTML =
                `<div class="return-title-stack">

            /* @PHASE: JS_RETURN_SCREEN_RECEIPT_CONTROLS - 저장된 장바구니와 버튼/안내 영역 구성 */
            state.receiptCart = card.savedCart || [];

            let subEl = null;

            const prim = card.userInfo.userName.split(',')[0].trim();

        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_RENDER_STATE
        현재 receiptCart 상태를 실제 DOM에 반영
        ========================================================= */
        renderReceiptCart: () => {
            const c = document.getElementById('receipt-cart-container');
            if (!c || !state.currentReturnCard) return;
            const isPrim = state.enteredUsers[0].name === state.currentReturnCard.userInfo.userName.split(',')[0].trim();
            const isMeal = state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근');
            /* @PHASE: JS_RECEIPT_CART_TOTAL_AND_ITEMS - 총액 계산과 장바구니 아이템 HTML 생성 */
            let tot = 0;
            c.innerHTML = state.receiptCart.length ? state.receiptCart.map((it, i) => {
                tot += Number(it.amount||0);
                return CardLogic.renderReceiptCartItemHTML(it, i, isMeal);
            }).join('') : `<div class="cart-placeholder"><i class="fa-regular fa-file-lines"></i><span>추가된 영수증이 없습니다.</span></div>`;
            document.getElementById('receipt-total-display').textContent = `${Utils.nfKR.format(tot)}원`;
            c.classList.toggle('empty-cart', state.receiptCart.length===0);
            /* @PHASE: JS_RECEIPT_CART_GUIDE_AND_SUBMIT_STATE - 누락 안내와 제출 버튼 활성화 상태 갱신 */
            const guideEl = document.getElementById('submit-guide');
            if (guideEl) {
                const hasEmpty = state.receiptCart.some(r => ((!isMeal) && !(String(r.usageDetails || '').trim()) && (!r.processing || r.processing==='save_error')) || (r.processing==='save_error'));
                if (hasEmpty && state.receiptCart.length > 0) {
                    guideEl.classList.add('visible');
                } else {
                    guideEl.classList.remove('visible');
                }
            }
            CardLogic.updateReceiptBatchProgressUI();
            const submitBtn = document.getElementById('submit-cart-btn');
            if (submitBtn) submitBtn.disabled = !(state.receiptCart.length > 0 && isPrim);
        },
        updateReceiptBatchProgressUI: () => {
            const box = document.getElementById('receipt-batch-progress');
            const count = document.getElementById('receipt-batch-count');
            const fill = document.getElementById('receipt-batch-fill');
            const p = state.receiptBatchProgress;
            if (!box || !count || !fill) return;
            if (!p || !p.active || !p.total) {
                box.classList.add('hidden');
                fill.style.width = '0%';
                return;
            }
            const done = Math.max(0, Math.min(Number(p.done || 0), Number(p.total || 0)));
            const total = Math.max(1, Number(p.total || 1));
            count.textContent = `${done} / ${total}`;
            fill.style.width = `${Math.round((done / total) * 100)}%`;
            box.classList.remove('hidden');
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_MUTATIONS
        영수증 항목 저장/삭제/실패 복구
        ========================================================= */
        saveCartItemOptimistic: async (item, idx) => {
            /* @PHASE: JS_RECEIPT_SAVE_OPTIMISTIC_INSERT - 팝업 값을 먼저 화면 state에 반영 */
            Swal.close();
            const ghost = { ...item, processing: 'saving' };
            let targetIdx = idx;
            if (idx > -1) {
                state.receiptCart[idx] = ghost;
            } else {
                state.receiptCart.push(ghost);
                targetIdx = state.receiptCart.length - 1;
            }
            CardLogic.requestRenderReceiptCart();
            CardLogic.continueReviewIfNeeded(idx);
            /* @PHASE: JS_RECEIPT_SAVE_AUTOSAVE_AND_FEEDBACK - 서버 저장 후 saved/save_error 상태 표시 */
            CardLogic.queueSaveCart(null).then(() => {
                const it = state.receiptCart[targetIdx];
                if (it && it.processing === 'saving') {
                    it.processing = 'saved';
                    CardLogic.requestRenderReceiptCart();
                    setTimeout(() => {
                        const cur = state.receiptCart[targetIdx];
                        if (cur && cur.processing === 'saved') {
                            delete cur.processing;
                            CardLogic.requestRenderReceiptCart();
                        }
                    }, 850);
                }
            }).catch((e) => {
                const it = state.receiptCart[targetIdx];
                if (it) it.processing = 'save_error';
                CardLogic.requestRenderReceiptCart();
                try {
                    Swal.fire({toast:true, position:'top', icon:'error', title:'저장 실패 · 네트워크 확인 후 다시 시도해주세요', showConfirmButton:false, timer:2500});
                } catch(_) {}
                console.error(e);
            });
        },
        deleteCartItem: (idx) => {
            Swal.fire({title:'삭제 확인',text:"삭제하시겠습니까?",icon:'warning',showCancelButton:true,confirmButtonText:'삭제',cancelButtonText:'취소',confirmButtonColor:'#d33'})
                .then(r => {
                    if (r.isConfirmed) {
                        const org = [...state.receiptCart];
                        state.receiptCart[idx] = { ...state.receiptCart[idx], processing: 'deleting' };
                        CardLogic.requestRenderReceiptCart();
                        const next = [...state.receiptCart];
                        next.splice(idx, 1);
                        state.receiptCart = next;
                        CardLogic.requestRenderReceiptCart();
                        CardLogic.queueSaveCart(org).catch(e => {
                            state.receiptCart = org;
                            CardLogic.requestRenderReceiptCart();
                            UIManager.handleServerError(e);
                        });
                    }
                });
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_OCR_PIPELINE_BATCH
        여러 영수증을 큐에 넣고 압축/OCR/저장까지 처리
        ========================================================= */
        handleReceiptFilesQueued: async (files) => {
            /* @PHASE: JS_RECEIPT_BATCH_CREATE_GHOST_ITEMS - 파일 수만큼 대기 항목을 먼저 만들어 즉시 표시 */
            const startIdx = state.receiptCart.length;
            const isMeal = !!(state.currentReturnCard && state.currentReturnCard.userInfo && String(state.currentReturnCard.userInfo.purpose || '').includes('특근'));
            const newItems = files.map(() => ({
                receiptImage: '',
                usagePlace: '영수증 분석 대기 중...',
                usageDetails: '',
                amount: '',
                date: '',
                processing: 'queued'
            }));
            state.receiptCart.push(...newItems);
            state.receiptBatchProgress = { active: true, startIdx, total: files.length, done: 0 };
            CardLogic.requestRenderReceiptCart();

            /* @PHASE: JS_RECEIPT_BATCH_PROCESS_ONE_START - 개별 영수증 1장을 압축/OCR/저장까지 처리 */
            const processOne = async (file, i) => {
                const actualIdx = startIdx + i;
                let b64 = '';

                try {
                    /* @PHASE: JS_RECEIPT_BATCH_OPTIMIZE_IMAGE - 브라우저에서 이미지 압축 후 base64 저장 */
                    state.receiptCart[actualIdx].processing = 'optimizing';
                    state.receiptCart[actualIdx].usagePlace = '영수증 압축 중...';
                    CardLogic.requestRenderReceiptCart();

                    b64 = await CardLogic.resizeAndOptimizeImage(file);
                    state.receiptCart[actualIdx].receiptImage = b64;
                    state.receiptCart[actualIdx].processing = 'ocr';
                    state.receiptCart[actualIdx].usagePlace = '영수증 분석 중...';
                    CardLogic.requestRenderReceiptCart();

                    /* @PHASE: JS_RECEIPT_BATCH_CALL_OCR - 서버 OCR/processReceiptImage 호출 */
                    const ocr = await Api.call('processReceiptImage', b64);
                    const analysisFailed = CardLogic.isReceiptAnalysisFailed(ocr);
                    const recognizedAmount = String(ocr && ocr.amount ? ocr.amount : '');
                    let amt = recognizedAmount;

                    /* @PHASE: JS_RECEIPT_BATCH_POSTPROCESS_RESULT - OCR 결과 검증, 특근매식 상한 적용 준비 */
                    state.receiptCart[actualIdx].processing = 'postprocessing';
                    state.receiptCart[actualIdx].usagePlace = analysisFailed ? '직접 입력 필요' : '분석 완료';
                    CardLogic.requestRenderReceiptCart();

                    if (!analysisFailed && isMeal) {
                        amt = String(Utils.clampMealAmount(amt, state.currentReturnCard.userInfo.userName.split(',').length));
                        CardLogic.showMealAutoAdjustToast(recognizedAmount, amt);
                    }

                    state.receiptCart[actualIdx] = {
                        receiptImage: (ocr && ocr.tempFileId) ? ocr.tempFileId : b64,
                        usagePlace: analysisFailed ? '직접 입력 필요' : (ocr.storeName || '상호명 없음'),
                        usageDetails: isMeal ? '특근매식비' : '',
                        amount: analysisFailed ? '' : amt.replace(/[^\d]/g, ''),
                        date: analysisFailed ? '' : (ocr.date || ''),
                        processing: 'saving',
                        needsManualReview: analysisFailed,
                        analysisMeta: {
                            mediaResolution: ocr && ocr.mediaResolution ? ocr.mediaResolution : '',
                            usedFallback: !!(ocr && ocr.usedFallback),
                            elapsedMs: ocr && ocr.elapsedMs ? ocr.elapsedMs : ''
                        }
                    };
                    Utils.haptic(analysisFailed ? [20, 40, 20] : 18);
                    CardLogic.requestRenderReceiptCart();

                    /* @PHASE: JS_RECEIPT_BATCH_SAVE_CART_DEFERRED
                     * 다중 업로드 중에는 개별 파일마다 저장하지 않고 전체 처리 후 한 번만 저장한다.
                     */
                } catch (err) {
                    console.error('Receipt analysis failed:', err);
                    Utils.haptic([20, 40, 20]);
                    state.receiptCart[actualIdx] = {
                        receiptImage: b64,
                        usagePlace: '분석 실패',
                        usageDetails: '',
                        amount: '',
                        date: '',
                        processing: 'error',
                        needsManualReview: true
                    };
                }

                if (state.receiptBatchProgress && state.receiptBatchProgress.active) {
                    state.receiptBatchProgress.done = Math.min(state.receiptBatchProgress.total, Number(state.receiptBatchProgress.done || 0) + 1);
                }
                CardLogic.requestRenderReceiptCart();
            };

            /* @PHASE: JS_RECEIPT_BATCH_WORKER_POOL - Apps Script/Gemini 과부하 방지를 위해 동시 처리 수 제한 */
            // Apps Script와 Gemini를 동시에 너무 많이 두드리면 오히려 느려질 수 있어 2개씩만 처리합니다.
            const concurrency = Math.min(2, files.length);
            let nextIndex = 0;
            const workers = Array.from({ length: concurrency }, async () => {
                while (nextIndex < files.length) {
                    const i = nextIndex++;
                    await processOne(files[i], i);
                }
            });

            await Promise.allSettled(workers);

            /* @PHASE: JS_RECEIPT_BATCH_SAVE_CART_ONCE - 전체 배치 처리 완료 후 서버 자동저장을 한 번만 실행 */
            try {
                await CardLogic.queueSaveCart(null);
            } catch (e) {
                console.error('Batch cart save failed:', e);
                try {
                    Swal.fire({toast:true, position:'top', icon:'error', title:'장바구니 저장 실패 · 네트워크를 확인해주세요', showConfirmButton:false, timer:2500});
                } catch (_) {}
            }

            /* @PHASE: JS_RECEIPT_BATCH_MANUAL_REVIEW - 직접 확인이 필요한 항목 안내 및 검토 큐 시작 */
            const manualReviewCount = state.receiptCart
                .slice(startIdx, startIdx + files.length)
                .filter(item => item && item.needsManualReview).length;

            if (manualReviewCount > 0) {
                CardLogic.showReceiptAnalysisFallback(false);
            }

            if (state.receiptBatchProgress) {
                state.receiptBatchProgress.done = state.receiptBatchProgress.total;
                CardLogic.requestRenderReceiptCart();
                setTimeout(() => {
                    if (state.receiptBatchProgress) {
                        state.receiptBatchProgress.active = false;
                        CardLogic.requestRenderReceiptCart();
                    }
                }, 1200);
            }

            CardLogic.requestRenderReceiptCart();
            CardLogic.startReviewMode(startIdx, files.length);
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_FILE_HANDLER
        파일 input change 이후 신규 추가와 기존 이미지 교체 분기
        ========================================================= */
        async handleReceiptFiles(fileList) {
            if (!fileList || !fileList.length || !state.currentReturnCard) return;
            EmbedBridge.notify('UPLOAD_START');
            /* @PHASE: JS_RECEIPT_UPLOAD_ROUTE_NEW_OR_REPLACE - 새 영수증 추가인지 기존 항목 이미지 교체인지 판단 */
            const editIndex = state.pendingEditIndex;
            state.pendingEditIndex = -1;
            const files = Array.from(fileList);
            /* @PHASE: JS_RECEIPT_UPLOAD_NEW_FILES - 새 영수증 여러 장 추가 처리 */
            if (editIndex < 0) {
                const addBtn = document.getElementById('add-receipt-btn');
                const subBtn = document.getElementById('submit-cart-btn');
                if (addBtn) addBtn.disabled = true;
                if (subBtn) subBtn.disabled = true;
                try {
                    await CardLogic.handleReceiptFilesQueued(files);
                } catch (e) {
                    UIManager.handleServerError(e);
                } finally {
                    try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}
                    if (addBtn) addBtn.disabled = false;
                    if (subBtn) subBtn.disabled = false;
                    CardLogic.requestRenderReceiptCart();
                    EmbedBridge.notify('UPLOAD_END');
                }
                return;
            }
            try { if (state._uploadPickerTimer) clearTimeout(state._uploadPickerTimer); } catch(e) {}
            const addBtn = document.getElementById('add-receipt-btn');
            const subBtn = document.getElementById('submit-cart-btn');
            if (addBtn) addBtn.disabled = true;
            if (subBtn) subBtn.disabled = true;
            /* @PHASE: JS_RECEIPT_REPLACE_IMAGE_ANALYSIS - 기존 영수증 이미지를 교체하고 OCR 재분석 */
            try {
                UIManager.setLoading(true, '영수증 교체 분석 중...', 'receipt');
                const file = files[0];
                const b64 = await CardLogic.resizeAndOptimizeImage(file);
                const ocr = await Api.call('processReceiptImage', b64);
                const analysisFailed = CardLogic.isReceiptAnalysisFailed(ocr);
                const recognizedAmount = (ocr.amount || '').toString();
                let amt = recognizedAmount;
                if (state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근')) {
                    amt = String(Utils.clampMealAmount(amt, state.currentReturnCard.userInfo.userName.split(',').length));
                    CardLogic.showMealAutoAdjustToast(recognizedAmount, amt);
                }
                UIManager.setLoading(false);
                if (analysisFailed) {
                    CardLogic.showReceiptAnalysisFallback(true);
                }
                /* @PHASE: JS_RECEIPT_REPLACE_OPEN_REVIEW_POPUP - 교체 OCR 결과를 확인 팝업으로 전달 */
                await CardLogic.openOcrPopup({
                    receiptImage: (ocr && ocr.tempFileId) ? ocr.tempFileId : b64,
                    previewImage: b64,
                    usagePlace: analysisFailed ? '' : (ocr.storeName || ''),
                    usageDetails: (state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근') ? '특근매식비' : ''),
                    amount: analysisFailed ? '' : amt.replace(/[^\d]/g, ""),
                    date: analysisFailed ? '' : (ocr.date || '')
                }, editIndex);
            } catch (e) {
                UIManager.handleServerError(e);
            } finally {
                try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}
                if (addBtn) addBtn.disabled = false;
                if (subBtn) subBtn.disabled = false;
                CardLogic.requestRenderReceiptCart();
            }
            EmbedBridge.notify('UPLOAD_END');
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_IMAGE_OPTIMIZATION
        브라우저 canvas로 영수증 이미지를 압축/리사이즈
        ========================================================= */
        resizeAndOptimizeImage: async (file) => {
            if (!file || !String(file.type || '').startsWith('image/')) {
                throw new Error('이미지 파일만 업로드할 수 있습니다.');
            }

            const cfg = RECEIPT_IMAGE_OPTIMIZE_CONFIG;
            const MAX_SIDE = cfg.maxSide;
            const TARGET_BYTES = cfg.targetBytes;
            const QUALITY_STEPS = cfg.qualities;

            const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || ''));
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });

            const canvasToBlob = (canvas, quality) => new Promise((resolve) => {
                canvas.toBlob(resolve, 'image/jpeg', quality);
            });

            // EXIF 회전을 반영하여 ImageBitmap을 생성한다. 실패하면 기존 Image 객체 방식으로 폴백한다.
            const loadImageBitmap = async (imgFile) => {
                if ('createImageBitmap' in window) {
                    try {
                        return await createImageBitmap(imgFile, { imageOrientation: 'from-image' });
                    } catch (e) {
                        console.warn('createImageBitmap failed, fallback to Image object:', e);
                    }
                }
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(imgFile);
                    const img = new Image();
                    img.onload = () => {
                        URL.revokeObjectURL(url);
                        resolve(img);
                    };
                    img.onerror = (e) => {
                        URL.revokeObjectURL(url);
                        reject(e);
                    };
                    img.src = url;
                });
            };

            const img = await loadImageBitmap(file);
            const originalW = img.naturalWidth || img.width;
            const originalH = img.naturalHeight || img.height;

            if (!originalW || !originalH) {
                throw new Error('이미지 크기를 읽을 수 없습니다.');
            }

            const scale = Math.min(1, MAX_SIDE / Math.max(originalW, originalH));
            const width = Math.max(1, Math.round(originalW * scale));
            const height = Math.max(1, Math.round(originalH * scale));

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) throw new Error('이미지 캔버스를 만들 수 없습니다.');

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);

            try {
                if (img && typeof img.close === 'function') img.close();
            } catch (e) {}

            let bestBlob = null;
            for (const quality of QUALITY_STEPS) {
                const blob = await canvasToBlob(canvas, quality);
                if (!blob) continue;
                bestBlob = blob;
                if (blob.size <= TARGET_BYTES) break;
            }

            if (!bestBlob) {
                throw new Error('이미지 변환 실패');
            }

            const dataUrl = await blobToDataUrl(bestBlob);

            try {
                console.log('receipt image optimized', {
                    originalKB: Math.round(file.size / 1024),
                    optimizedKB: Math.round(bestBlob.size / 1024),
                    width,
                    height
                });
            } catch (e) {}

            return dataUrl;
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_EDIT_POPUP        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_EDIT_POPUP
        OCR 결과 확인/직접입력 SweetAlert 팝업
        ========================================================= */
        async openOcrPopup(data = {}, editIndex = -1) {
            /* @PHASE: JS_RECEIPT_POPUP_BUILD_HTML - OCR 결과 확인/직접 입력용 SweetAlert HTML 구성 */
            const isMeal = state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근');
            const html = `
                <div class="swal-custom-container">
                    <div id="swal-image-container">
                        <img id="swal-image" src="${data.previewImage || (String(data.receiptImage || '').startsWith('id:') ? '' : (data.receiptImage || ''))}" style="${!(data.previewImage || (data.receiptImage && !String(data.receiptImage).startsWith('id:')))?'display:none;':''}" alt="영수증">
                        <div id="swal-image-instruction">${!data.receiptImage?'이미지 추가 필요':(String(data.receiptImage || '').startsWith('id:') ? '이미지는 임시 서버 파일로 보관 중' : '(이미지 교체)')}</div>
