                <span class="receipt-add-icon" aria-hidden="true"><i class="fa-solid fa-camera"></i><b>+</b></span>
                <span class="receipt-add-copy">
                    <span class="receipt-dropzone-main">영수증 추가 첨부</span>
                    <span class="receipt-dropzone-sub">사진 촬영 · 갤러리 선택 · 드래그</span>
                </span>
                <span class="receipt-add-arrow" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>`;
            add.disabled = false;
            add.onclick=()=>CardLogic.triggerImageSelection(-1);
            ['dragenter','dragover'].forEach(evtName => {
                add.addEventListener(evtName, (ev) => {
                    ev.preventDefault();
                    ev.stopPropagation();
                    if (!add.disabled) {
                        add.classList.add('drag-over');
                        const sub = add.querySelector('.receipt-dropzone-sub');
                        if (sub) sub.textContent = '여기에 놓으면 영수증이 추가됩니다';
                    }
                });
            });
            ['dragleave','dragend'].forEach(evtName => {
                add.addEventListener(evtName, (ev) => {
                    ev.preventDefault();
                    ev.stopPropagation();
                    add.classList.remove('drag-over');
                    const sub = add.querySelector('.receipt-dropzone-sub');
                    if (sub) sub.textContent = '사진 촬영 · 갤러리 선택 · 드래그';
                });
            });
            add.addEventListener('drop', (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                add.classList.remove('drag-over');
                const sub = add.querySelector('.receipt-dropzone-sub');
                if (sub) sub.textContent = '사진 촬영 · 갤러리 선택 · 드래그';
                if (add.disabled) return;
                const droppedFiles = ev.dataTransfer && ev.dataTransfer.files ? ev.dataTransfer.files : null;
                if (droppedFiles && droppedFiles.length) CardLogic.handleReceiptFiles(droppedFiles);
            });
            const cw = document.createElement('div');
            cw.className='cart-wrapper';
            cw.appendChild(Object.assign(document.createElement('div'),{id:'receipt-cart-container'}));
            const receiptStatusSummary = document.createElement('div');
            receiptStatusSummary.id = 'receipt-status-summary';
            receiptStatusSummary.className = 'receipt-status-summary';
            receiptStatusSummary.setAttribute('aria-live', 'polite');
            const guide = document.createElement('div');
            guide.id = 'submit-guide';
            guide.className = 'submit-guide';
            guide.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> <b>내용(상세 내역)</b>이 비어있는 영수증이 있습니다.';
            let subEl = null;
            const isTabletReturnStation = document.body.classList.contains('office-tablet-portrait');
            if (state.isAdminMode || isTabletReturnStation) {
                const sub = document.createElement('button');
                sub.id='submit-cart-btn';
                sub.className='simple-btn primary';
                sub.innerHTML='<i class="fa-solid fa-check"></i> 반납 및 제출';
                sub.onclick=CardLogic.submitCart;
                subEl = sub;
            } else {
                const msg = document.createElement('div');
                msg.className = 'return-admin-submit-note';
                msg.innerHTML = `※ 행정실 카드 반납 시 태블릿의 <b class="return-submit-emphasis">[반납 및 제출]</b> 버튼을 꼭 눌러주세요.`;
                subEl = msg;
            }
            returnTray.append(add, receiptStatusSummary, cw);
            form.append(compactSummary, returnTray, guide, subEl);
            
            
            const prim = card.userInfo.userName.split(',')[0].trim();
            const isOwner = state.enteredUsers[0].name === prim;
            if (!isOwner) {
                add.disabled=true; if(subEl && subEl.tagName==='BUTTON') subEl.disabled=true;
                const m=document.createElement('p');
                m.className='return-owner-only-message';
                m.innerHTML=`<strong>${prim}</strong> 님만 반납 가능합니다.`;
                form.appendChild(m);
            }
            CardLogic.requestRenderReceiptCart();
            UIManager.showScreen('returnDetails');
            // v12: 아직 프리로드가 끝나지 않은 예외 상황에서도 화면은 먼저 열고, 도착하면 빈 장바구니일 때만 조용히 갱신합니다.
            SavedCartPrefetch.refreshReturnScreenAfterBackgroundLoad(card.id, receiptReloadToken);
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_RENDER_STATE
        현재 receiptCart 상태를 실제 DOM에 반영
        ========================================================= */
        renderReceiptCart: () => {
            const c = document.getElementById('receipt-cart-container');
            if (!c || !state.currentReturnCard) return;
            // 예전 저장본 또는 새로고침 직전 저장본에 남은 processing/saving 상태가
            // 화면에 '영수증 분석 중'으로 되살아나는 것을 방지합니다.
            if (Array.isArray(state.receiptCart)) {
                state.receiptCart.forEach(it => {
                    if (!it) return;
                    const img = String(it.receiptImage || '');
                    const staleProcessing = ['queued','optimizing','ocr','postprocessing','saving','saved','deleting'].includes(it.processing);
                    const batchActive = !!(state.receiptBatchProgress && state.receiptBatchProgress.active);
                    if (staleProcessing && img.startsWith('id:') && !batchActive && !it._uiTransient) delete it.processing;
                });
            }
            const isPrim = state.enteredUsers[0].name === state.currentReturnCard.userInfo.userName.split(',')[0].trim();
            const isMeal = state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근');
            
            let tot = 0;
            if (state.receiptCartLoading) {
                // v12: 반납 화면을 저장 영수증 조회 로딩으로 막지 않습니다.
                state.receiptCartLoading = false;
            }
            c.innerHTML = state.receiptCart.length ? state.receiptCart.map((it, i) => {
                tot += Number(it.amount||0);
                return CardLogic.renderReceiptCartItemHTML(it, i, isMeal);
            }).join('') : `<div class="cart-placeholder"><i class="fa-regular fa-file-lines"></i><span>추가된 영수증이 없습니다.</span></div>`;
            document.getElementById('receipt-total-display').textContent = `${Utils.nfKR.format(tot)}원`;
            const compactTotal = document.getElementById('return-summary-total');
            if (compactTotal) compactTotal.textContent = `${Utils.nfKR.format(tot)}원`;
            c.classList.toggle('empty-cart', state.receiptCart.length===0);
            c.dataset.receiptCount = String(state.receiptCart.length || 0);
            const incompleteCount = state.receiptCart.filter(r => {
                const processingState = String(r.processing || '');
                const missingDetails = !Utils.isMealExpenseItem(r) && !String(r.usageDetails || '').trim();
                return missingDetails || !!r.needsManualReview || ['review', 'save_error', 'error'].includes(processingState);
            }).length;
            const completeCount = Math.max(0, state.receiptCart.length - incompleteCount);
            const statusSummary = document.getElementById('receipt-status-summary');
            if (statusSummary) {
                statusSummary.classList.toggle('has-issues', incompleteCount > 0);
                statusSummary.classList.toggle('all-complete', state.receiptCart.length > 0 && incompleteCount === 0);
                const receiptCount = state.receiptCart.length;
                statusSummary.innerHTML = `
                    <strong class="receipt-list-heading">첨부된 영수증</strong>
                    <span class="receipt-list-count">${receiptCount}건</span>`;
            }
            const receiptAddMain = document.querySelector('#add-receipt-btn .receipt-dropzone-main');
            if (receiptAddMain) receiptAddMain.textContent = '새 영수증 첨부';
            
            const guideEl = document.getElementById('submit-guide');
            const blockingIssues = CardLogic.getBlockingReceiptIssues();
            const hasBlockingIssue = blockingIssues.length > 0;
            if (guideEl) {
                const failedIssues = blockingIssues.filter(x => ['save_error','error'].includes(x.processing));
                guideEl.classList.remove('has-incomplete-receipts');
                guideEl.removeAttribute('role');
                guideEl.removeAttribute('tabindex');
                guideEl.removeAttribute('aria-label');
                guideEl.onclick = null;
                guideEl.onkeydown = null;
                if (failedIssues.length > 0) {
                    guideEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> 저장 실패/분석 실패 영수증이 있습니다. 해당 영수증을 눌러 직접 입력하거나 삭제 후 다시 첨부해 주세요.';
                    guideEl.classList.add('visible');
                } else if (incompleteCount > 0 && state.receiptCart.length > 0) {
                    guideEl.innerHTML = `<span class="submit-guide-icon" aria-hidden="true"><i class="fa-solid fa-exclamation"></i></span><strong class="submit-guide-label">내용 입력</strong><span class="submit-guide-count"><strong class="submit-guide-count-number">${incompleteCount}</strong><span class="submit-guide-count-unit">건</span></span>`;
                    guideEl.classList.add('visible', 'has-incomplete-receipts');
                    guideEl.setAttribute('role', 'button');
                    guideEl.setAttribute('tabindex', '0');
                    guideEl.setAttribute('aria-label', `미입력 영수증 ${incompleteCount}건 내용 입력`);
                    const focusFirstIncomplete = () => {
                        const target = document.querySelector('#receipt-cart-container .receipt-state-incomplete');
                        if (!target) return;
                        const index = Number(target.dataset.index);
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        target.classList.add('highlight');
                        setTimeout(() => {
                            target.classList.remove('highlight');
                            if (Number.isInteger(index) && state.receiptCart[index] && !target.classList.contains('processing')) {
                                CardLogic.openOcrPopup(state.receiptCart[index], index);
                            }
                        }, 260);
                    };
                    guideEl.onclick = focusFirstIncomplete;
                    guideEl.onkeydown = (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            focusFirstIncomplete();
                        }
                    };
                } else {
                    guideEl.classList.remove('visible');
                }
            }
            CardLogic.updateReceiptBatchProgressUI();
            const submitBtn = document.getElementById('submit-cart-btn');
            if (submitBtn) {
                const isTabletReturnStation = document.body.classList.contains('office-tablet-portrait');
                // The office tablet keeps submission available so a tap can show
                // the existing missing-receipt / missing-detail confirmation flow.
                submitBtn.disabled = isTabletReturnStation
                    ? (!isPrim || !!CardLogic._submitInFlight)
                    : (!(state.receiptCart.length > 0 && isPrim) || hasBlockingIssue || incompleteCount > 0);
            }
        },
        updateReceiptBatchProgressUI: () => {
            
            const box = document.getElementById('receipt-batch-progress');
            if (box) box.classList.add('hidden');
        },
        /* =========================================================
        @SUBSECTION: JS_OPERATIONAL_BLOCKING_GUARDS
        장애/진행중 영수증이 있을 때 반납 제출을 막고 복구 행동을 안내합니다.
        ========================================================= */
        getBlockingReceiptIssues: () => {
            if (!Array.isArray(state.receiptCart)) return [];
            return state.receiptCart
                .map((it, idx) => ({ it, idx }))
                .filter(({ it }) => it && ['queued','optimizing','ocr','postprocessing','saving','deleting','review','save_error','error'].includes(it.processing))
                .map(({ it, idx }) => {
                    const label = CardLogic.getReceiptProcessingLabel(it.processing);
                    const place = String(it.usagePlace || `영수증 ${idx + 1}`);
                    return { idx, processing: it.processing, label, place };
                });
        },
        showBlockingReceiptIssues: async (issues = CardLogic.getBlockingReceiptIssues()) => {
            const failedCount = issues.filter(x => ['save_error','error'].includes(x.processing)).length;
            const activeCount = issues.length - failedCount;
            const msg = failedCount
                ? `확인이 필요한 영수증 ${failedCount}건이 있습니다.`
                : `처리 중인 영수증 ${activeCount}건이 있습니다.`;
            await UIManager.showOperationalError({
                title: '반납 전 확인 필요',
                message: msg,
                icon: failedCount ? 'error' : 'warning',
                steps: failedCount
                    ? ['해당 영수증을 눌러 확인해 주세요.', '필요하면 삭제 후 다시 첨부해 주세요.']
                    : ['영수증 처리가 끝난 뒤 다시 제출해 주세요.']
            });
            const first = issues[0];
            if (first) {
                setTimeout(() => {
                    const el = document.querySelector(`.cart-item[data-index="${first.idx}"]`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.classList.add('highlight');
                        setTimeout(() => el.classList.remove('highlight'), 1600);
                    }
                }, 80);
            }
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_MUTATIONS
        영수증 항목 저장/삭제/실패 복구
        ========================================================= */
        saveCartItemOptimistic: async (item, idx, options = {}) => {
            
            if (options.closeSwal !== false) {
                try { Swal.close(); } catch(e) {}
            }
            
            const previous = idx > -1 ? (state.receiptCart[idx] || {}) : {};
            const cachedPreview = item.previewImage || item.receiptImagePreview || previous.previewImage || previous.receiptImagePreview || (!String(item.receiptImage || '').startsWith('id:') ? item.receiptImage : '');
            const ghost = { ...previous, ...item, processing: 'saving', _uiTransient: true, needsManualReview: false };
            if (cachedPreview) {
                ghost.previewImage = cachedPreview;
                ghost.receiptImagePreview = cachedPreview;
            }
            let targetIdx = idx;
            if (idx > -1) {
                state.receiptCart[idx] = ghost;
            } else {
                state.receiptCart.push(ghost);
                targetIdx = state.receiptCart.length - 1;
            }
            CardLogic.requestRenderReceiptCart();

            
            try {
                await CardLogic.queueSaveCart(null);
                const it = state.receiptCart[targetIdx];
                if (it && it.processing === 'saving') {
                    it.processing = 'saved';
                    CardLogic.requestRenderReceiptCart();
                    setTimeout(() => {
                        const cur = state.receiptCart[targetIdx];
                        if (cur && cur.processing === 'saved') {
                            delete cur.processing;
                            delete cur._uiTransient;
                            CardLogic.requestRenderReceiptCart();
                        }
                    }, 850);
                }
                CardLogic.continueReviewIfNeeded(idx);
                return true;
            } catch (e) {
                const it = state.receiptCart[targetIdx];
                if (it) it.processing = 'save_error';
                CardLogic.requestRenderReceiptCart();
                try {
                    Swal.fire({toast:true, position:'top', icon:'error', title:'저장 실패 · 네트워크 확인 후 다시 시도해주세요', showConfirmButton:false, timer:2500});
                } catch(_) {}
                console.error(e);
                throw e;
            }
        },
        deleteCartItem: (idx) => {
            Swal.fire({title:'삭제 확인',text:"삭제하시겠습니까?",icon:'warning',showCancelButton:true,confirmButtonText:'삭제',cancelButtonText:'취소',confirmButtonColor:UI_COLORS.danger()})
                .then(r => {
                    if (r.isConfirmed) {
                        const org = [...state.receiptCart];
                        const deletedItem = state.receiptCart[idx] ? { ...state.receiptCart[idx] } : null;
                        const deletedReceiptImage = String(deletedItem && deletedItem.receiptImage ? deletedItem.receiptImage : '').trim();

                        state.receiptCart[idx] = { ...state.receiptCart[idx], processing: 'deleting' };
                        CardLogic.requestRenderReceiptCart();

                        const next = [...state.receiptCart];
                        next.splice(idx, 1);
                        state.receiptCart = next;
                        CardLogic.requestRenderReceiptCart();

                        CardLogic.queueSaveCart(org)
                            .then(() => {
                                if (deletedReceiptImage && deletedReceiptImage.startsWith('id:')) {
                                    Api.call('deleteTempReceiptImageOnly', deletedReceiptImage)
                                        .catch(err => console.warn('임시 영수증 파일 삭제 실패:', err));
                                }
                            })
                            .catch(e => {
                                state.receiptCart = org;
                                CardLogic.requestRenderReceiptCart();
                                UIManager.handleServerError(e);
                            });
                    }
                });
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_OCR_PIPELINE_BATCH
        여러 영수증을 큐에 넣고 압축/OCR/저장까지 처리
        ========================================================= */

        processReceiptQueueItem: async (file, actualIdx, forceMealOnly) => {
            let b64 = '';

            try {
                state.receiptCart[actualIdx].processing = 'optimizing';
                state.receiptCart[actualIdx].usagePlace = CardLogic.isReceiptPdfFile(file) ? 'PDF 첫 페이지 변환 중...' : '영수증 압축 중...';
                CardLogic.requestRenderReceiptCart();

                b64 = await CardLogic.prepareReceiptUploadImage(file);
                state.receiptCart[actualIdx].receiptImage = b64;
                state.receiptCart[actualIdx].processing = 'ocr';
                state.receiptCart[actualIdx].usagePlace = '영수증 분석 중...';
                CardLogic.requestRenderReceiptCart();

                /* @SERVER_API_GROUP_RECEIPT: 영수증 이미지 OCR/분석 + 이미지 저장 병렬 처리 */
                const [ocrRaw, imageSave] = await Promise.all([
                    Api.call('processReceiptImageFast', b64),
                    Api.call('saveReceiptImageOnly', b64)
                ]);
                const ocr = ocrRaw || {};
                if (imageSave && imageSave.tempFileId) {
                    ocr.tempFileId = imageSave.tempFileId;
                    ocr.tempFileUrl = imageSave.tempFileUrl || '';
                }
                const analysisFailed = CardLogic.isReceiptAnalysisFailed(ocr);
                const recognizedAmount = String(ocr && ocr.amount ? ocr.amount : '');
                let amt = recognizedAmount;

                state.receiptCart[actualIdx].processing = 'postprocessing';
                state.receiptCart[actualIdx].usagePlace = analysisFailed ? '직접 입력 필요' : '분석 완료';
                CardLogic.requestRenderReceiptCart();

                if (!ocr || !ocr.tempFileId) {
                    throw new Error('영수증 이미지를 저장하지 못했습니다. 다시 첨부해 주세요.');
                }

                const rawRecognizedAmount = analysisFailed ? '' : amt.replace(/[^\d]/g, '');
                const mealCountForReceipt = CardLogic.getCurrentReturnMealHeadcount();
                const mealAmountInfo = forceMealOnly && rawRecognizedAmount ? Utils.getMealAdjustedAmount(rawRecognizedAmount, mealCountForReceipt) : null;
                state.receiptCart[actualIdx] = {
                    receiptImage: ocr.tempFileId,
                    previewImage: b64,
                    receiptImagePreview: b64,
                    usagePlace: analysisFailed ? '직접 입력 필요' : (ocr.storeName || '상호명 없음'),
                    usageDetails: forceMealOnly ? '특근매식비' : '',
                    amount: mealAmountInfo ? String(mealAmountInfo.amount) : rawRecognizedAmount,
                    originalAmount: rawRecognizedAmount,
                    isMealExpense: !!forceMealOnly,
                    purpose: forceMealOnly ? '특근매식비' : CardLogic.getReceiptPurposeFromTone(CardLogic.getDefaultGeneralReceiptToneFromPurposes()),
                    mealHeadcount: mealCountForReceipt,
                    mealLimitAmount: mealAmountInfo ? String(mealAmountInfo.mealLimitAmount) : '',
                    mealOverAmount: mealAmountInfo ? String(Math.max(0, mealAmountInfo.originalAmount - mealAmountInfo.amount)) : '',
                    date: analysisFailed ? '' : (ocr.date || ''),
                    processing: 'saving',
                    _uiTransient: true,
                    needsManualReview: analysisFailed,
                    analysisMeta: {
                        mediaResolution: ocr && ocr.mediaResolution ? ocr.mediaResolution : '',
                        usedFallback: !!(ocr && ocr.usedFallback),
                        elapsedMs: ocr && ocr.elapsedMs ? ocr.elapsedMs : '',
                        imageSaveError: ocr && ocr.imageSaveError ? ocr.imageSaveError : ''
                    }
                };
                Utils.haptic(analysisFailed ? [20, 40, 20] : 18);
                CardLogic.requestRenderReceiptCart();
            } catch (err) {
                console.error('Receipt analysis failed:', err);
                Utils.haptic([20, 40, 20]);
                state.receiptCart[actualIdx] = {
                    receiptImage: '',
                    previewImage: b64,
                    receiptImagePreview: b64,
                    usagePlace: '이미지 저장 실패',
                    usageDetails: '',
                    amount: '',
                    date: '',
                    processing: 'error',
                    _uiTransient: true,
                    needsManualReview: true,
                    imageSaveError: String(err && err.message ? err.message : err)
                };
            }

            if (state.receiptBatchProgress && state.receiptBatchProgress.active) {
                state.receiptBatchProgress.done = Math.min(state.receiptBatchProgress.total, Number(state.receiptBatchProgress.done || 0) + 1);
            }
            CardLogic.requestRenderReceiptCart();
        },
        markReceiptBatchSaveSuccess: (startIdx, count) => {
            state.receiptCart.slice(startIdx, startIdx + count).forEach((item, offset) => {
                const idx = startIdx + offset;
                const cur = state.receiptCart[idx];
                if (!cur) return;
                if (cur.needsManualReview) {
                    cur.processing = 'review';
                    cur._uiTransient = true;
                } else if (cur.processing === 'saved') {
                    cur._uiTransient = true;
                }
            });
            CardLogic.requestRenderReceiptCart();
        },
        markReceiptBatchSaveFailure: (startIdx, count) => {
            state.receiptCart.slice(startIdx, startIdx + count).forEach((item, offset) => {
                const idx = startIdx + offset;
                const cur = state.receiptCart[idx];
                if (cur && cur.processing !== 'error') {
                    cur.processing = 'save_error';
                    cur._uiTransient = true;
                }
            });
            CardLogic.requestRenderReceiptCart();
            try {
                Swal.fire({toast:true, position:'top', icon:'error', title:'저장 실패 · 네트워크를 확인해주세요', showConfirmButton:false, timer:2500});
            } catch (_) {}
        },
        finalizeReceiptBatchSave: async (startIdx, count) => {
            try {
                await CardLogic.queueSaveCart(null);
                CardLogic.markReceiptBatchSaveSuccess(startIdx, count);
            } catch (e) {
                console.error('Batch cart save failed:', e);
                CardLogic.markReceiptBatchSaveFailure(startIdx, count);
            }
        },
        notifyReceiptBatchPostProcessing: async (startIdx, count) => {
            const batchItems = state.receiptCart.slice(startIdx, startIdx + count);
            const manualReviewCount = batchItems.filter(item => item && item.needsManualReview).length;

            if (manualReviewCount > 0) {
                CardLogic.showReceiptAnalysisFallback(false);
            }

            const hardFailCount = batchItems.filter(item => item && item.processing === 'error').length;
            if (hardFailCount > 0) {
                await UIManager.showOperationalError({
                    title: '처리 실패',
                    message: `${hardFailCount}건의 영수증을 자동 처리하지 못했습니다.`,
                    icon: 'warning',
                    steps: ['실패한 영수증을 눌러 직접 입력합니다.', '이미지 저장 실패라면 삭제 후 다시 첨부합니다.', '반납 제출은 실패 항목을 정리한 뒤 가능합니다.']
                });
            }
        },
        finishReceiptBatchProgress: () => {
            if (state.receiptBatchProgress) {
                state.receiptBatchProgress.done = state.receiptBatchProgress.total;
                CardLogic.requestRenderReceiptCart();
                setTimeout(() => {
                    if (state.receiptBatchProgress) {
                        state.receiptBatchProgress.active = false;
                        CardLogic.requestRenderReceiptCart();
                    }
                }, 1200);
            }
        },
        handleReceiptFilesQueued: async (files) => {
            
            const startIdx = state.receiptCart.length;
            const receiptPurposeConfig = CardLogic.getReceiptPurposeConfig();
            const forceMealOnly = receiptPurposeConfig.mealOnly;
            const newItems = files.map((file) => ({
                receiptImage: '',
                usagePlace: CardLogic.isReceiptPdfFile(file) ? 'PDF 분석 대기 중...' : '영수증 분석 대기 중...',
                usageDetails: '',
                amount: '',
                date: '',
                processing: 'queued',
                _uiTransient: true
            }));
            state.receiptCart.push(...newItems);
            state.receiptBatchProgress = { active: true, startIdx, total: files.length, done: 0 };
            CardLogic.requestRenderReceiptCart();


            
            // Apps Script와 Gemini를 동시에 너무 많이 두드리면 오히려 느려질 수 있어 2개씩만 처리합니다.
            const concurrency = Math.min(2, files.length);
            let nextIndex = 0;
            const workers = Array.from({ length: concurrency }, async () => {
                while (nextIndex < files.length) {
                    const i = nextIndex++;
                    await CardLogic.processReceiptQueueItem(files[i], startIdx + i, forceMealOnly);
                }
            });

            await Promise.allSettled(workers);

            
            await CardLogic.finalizeReceiptBatchSave(startIdx, files.length);
            await CardLogic.notifyReceiptBatchPostProcessing(startIdx, files.length);
            CardLogic.finishReceiptBatchProgress();

            CardLogic.requestRenderReceiptCart();
            CardLogic.startReviewMode(startIdx, files.length);
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_FILE_HANDLER

        ========================================================= */
        async handleReceiptFiles(fileList) {
            if (!fileList || !fileList.length || !state.currentReturnCard) return;
            EmbedBridge.notify('UPLOAD_START');
            const editIndex = state.pendingEditIndex;
            state.pendingEditIndex = -1;
            const rawFiles = Array.from(fileList);

                try {
                    Swal.fire({toast:true, position:'top', icon:'warning', title:'이미지 또는 PDF 파일만 첨부할 수 있습니다', showConfirmButton:false, timer:2200});
                } catch (_) {}
            }
            if (!files.length) {
                try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}
                EmbedBridge.notify('UPLOAD_END');
                return;
            }
            
            if (editIndex < 0) {

                    UIManager.handleServerError(e);
                } finally {
                    try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}
                    if (addBtn) addBtn.disabled = false;
                    if (subBtn) subBtn.disabled = false;
                    CardLogic.requestRenderReceiptCart();
                    EmbedBridge.notify('UPLOAD_END');
                }
                return;
            }
            try { if (state._uploadPickerTimer) clearTimeout(state._uploadPickerTimer); } catch(e) {}
            const addBtn = document.getElementById('add-receipt-btn');
            const subBtn = document.getElementById('submit-cart-btn');
            if (addBtn) addBtn.disabled = true;
            if (subBtn) subBtn.disabled = true;
            
            try {
                UIManager.setLoading(true, '영수증 교체 분석 중...', 'receipt');
                const file = files[0];
                const b64 = await CardLogic.prepareReceiptUploadImage(file);
                const [ocrRaw, imageSave] = await Promise.all([
                    Api.call('processReceiptImageFast', b64),
                    Api.call('saveReceiptImageOnly', b64)
                ]);
                const ocr = ocrRaw || {};
                if (imageSave && imageSave.tempFileId) {
                    ocr.tempFileId = imageSave.tempFileId;
                    ocr.tempFileUrl = imageSave.tempFileUrl || '';
                }
                if (!ocr || !ocr.tempFileId) {
                    throw new Error('영수증 이미지를 저장하지 못했습니다. 다시 첨부해 주세요.');
                }
                const analysisFailed = CardLogic.isReceiptAnalysisFailed(ocr);
                const recognizedAmount = (ocr.amount || '').toString();
                let amt = recognizedAmount;
                UIManager.setLoading(false);
                if (analysisFailed) {
                    CardLogic.showReceiptAnalysisFallback(true);
                }
                
                await CardLogic.openOcrPopup({
                    receiptImage: ocr.tempFileId,
                    previewImage: b64,
                    receiptImagePreview: b64,
                    usagePlace: analysisFailed ? '' : (ocr.storeName || ''),
                    usageDetails: '',
                    amount: analysisFailed ? '' : amt.replace(/[^\d]/g, ""),
                    originalAmount: analysisFailed ? '' : amt.replace(/[^\d]/g, ""),
                    isMealExpense: false,
                    mealHeadcount: CardLogic.getCurrentReturnMealHeadcount(),
                    date: analysisFailed ? '' : (ocr.date || '')
                }, editIndex);
            } catch (e) {
                UIManager.handleServerError(e);
            } finally {
                try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}
                if (addBtn) addBtn.disabled = false;
                if (subBtn) subBtn.disabled = false;
                CardLogic.requestRenderReceiptCart();

            EmbedBridge.notify('UPLOAD_END');
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_PDF_AND_IMAGE_PREP
        이미지/PDF 첨부를 OCR용 이미지 dataURL로 변환
        ========================================================= */
        isReceiptPdfFile: (file) => !!(file && (String(file.type || '').toLowerCase() === 'application/pdf' || /\.pdf$/i.test(String(file.name || '')))),
        isReceiptSupportedFile: (file) => !!(file && (String(file.type || '').startsWith('image/') || CardLogic.isReceiptPdfFile(file))),
        ensurePdfRendererLoaded: async () => {
            if (window.pdfjsLib && window.pdfjsLib.getDocument) {
                try {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                } catch (e) {}
                return window.pdfjsLib;
            }
            await new Promise((resolve, reject) => {
                const existing = document.querySelector('script[data-receipt-pdfjs]');
                if (existing) {
                    existing.addEventListener('load', resolve, { once:true });
                    existing.addEventListener('error', reject, { once:true });
                    return;
                }
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                s.async = true;
                s.dataset.receiptPdfjs = '1';
                s.onload = resolve;
                s.onerror = () => reject(new Error('PDF 변환 모듈을 불러오지 못했습니다. 네트워크를 확인해 주세요.'));
                document.head.appendChild(s);
            });
            if (!window.pdfjsLib || !window.pdfjsLib.getDocument) throw new Error('PDF 변환 모듈을 사용할 수 없습니다.');
            try {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            } catch (e) {}
            return window.pdfjsLib;
        },
        renderPdfFirstPageToImage: async (file) => {
            const pdfjs = await CardLogic.ensurePdfRendererLoaded();
            const arrayBuffer = await file.arrayBuffer();
            let pdfDoc = null;
            try {
                pdfDoc = await pdfjs.getDocument({ data: arrayBuffer }).promise;
                if (!pdfDoc || !pdfDoc.numPages) throw new Error('PDF 페이지를 찾을 수 없습니다.');
                const page = await pdfDoc.getPage(1);
                const baseViewport = page.getViewport({ scale: 1 });
                const maxSide = Math.max(1200, Number(RECEIPT_IMAGE_OPTIMIZE_CONFIG && RECEIPT_IMAGE_OPTIMIZE_CONFIG.maxSide || 1800));
                const scale = Math.min(2.4, Math.max(1.2, maxSide / Math.max(baseViewport.width, baseViewport.height)));
                const viewport = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(viewport.width));
                canvas.height = Math.max(1, Math.round(viewport.height));
                const ctx = canvas.getContext('2d', { alpha:false });
                if (!ctx) throw new Error('PDF 변환 캔버스를 만들 수 없습니다.');
                ctx.fillStyle = UI_COLORS.pdfCanvasFill();
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                await page.render({ canvasContext: ctx, viewport }).promise;
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.88));
                if (!blob) throw new Error('PDF 첫 페이지 이미지 변환 실패');
                return await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(String(reader.result || ''));
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                throw new Error('PDF 첫 페이지를 이미지로 변환하지 못했습니다. PDF를 이미지로 저장한 뒤 다시 첨부해 주세요.');
            } finally {
                try { if (pdfDoc && typeof pdfDoc.destroy === 'function') pdfDoc.destroy(); } catch (e) {}
            }
        },
        prepareReceiptUploadImage: async (file) => {
            if (CardLogic.isReceiptPdfFile(file)) {
                return await CardLogic.renderPdfFirstPageToImage(file);
            }
            return await CardLogic.resizeAndOptimizeImage(file);
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_IMAGE_OPTIMIZATION
        브라우저 canvas로 영수증 이미지를 압축/리사이즈
        ========================================================= */
        resizeAndOptimizeImage: async (file) => {
            if (!file || !String(file.type || '').startsWith('image/')) {
                throw new Error('이미지 또는 PDF 파일만 업로드할 수 있습니다.');
            }

            const cfg = RECEIPT_IMAGE_OPTIMIZE_CONFIG;
            const MAX_SIDE = cfg.maxSide;
            const TARGET_BYTES = cfg.targetBytes;
            const QUALITY_STEPS = cfg.qualities;

            const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || ''));
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });

            const canvasToBlob = (canvas, quality) => new Promise((resolve) => {
                canvas.toBlob(resolve, 'image/jpeg', quality);
            });

            // EXIF 회전을 반영하여 ImageBitmap을 생성한다. 실패하면 기존 Image 객체 방식으로 폴백한다.
            const loadImageBitmap = async (imgFile) => {
                if ('createImageBitmap' in window) {
                    try {
                        return await createImageBitmap(imgFile, { imageOrientation: 'from-image' });
                    } catch (e) {
                        // Image 객체 방식으로 폴백합니다.
                    }
                }
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(imgFile);
                    const img = new Image();
                    img.onload = () => {
                        URL.revokeObjectURL(url);
                        resolve(img);
                    };
                    img.onerror = (e) => {
                        URL.revokeObjectURL(url);
                        reject(e);
                    };
                    img.src = url;
                });
            };

            const img = await loadImageBitmap(file);
            const originalW = img.naturalWidth || img.width;
            const originalH = img.naturalHeight || img.height;

            if (!originalW || !originalH) {
                throw new Error('이미지 크기를 읽을 수 없습니다.');
            }

            const scale = Math.min(1, MAX_SIDE / Math.max(originalW, originalH));
            const width = Math.max(1, Math.round(originalW * scale));
            const height = Math.max(1, Math.round(originalH * scale));

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) throw new Error('이미지 캔버스를 만들 수 없습니다.');

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);

            try {
                if (img && typeof img.close === 'function') img.close();
            } catch (e) {}

            let bestBlob = null;
            for (const quality of QUALITY_STEPS) {
                const blob = await canvasToBlob(canvas, quality);
                if (!blob) continue;
                bestBlob = blob;
                if (blob.size <= TARGET_BYTES) break;
            }

            if (!bestBlob) {
                throw new Error('이미지 변환 실패');
            }

            const dataUrl = await blobToDataUrl(bestBlob);

            return dataUrl;
        },

                                    if (imageInstructionEl) imageInstructionEl.textContent = '클릭하여 이미지 교체';
                                    data.previewImage = preview.dataUrl;
                                    data.receiptImagePreview = preview.dataUrl;
                                    if (editIndex > -1 && state.receiptCart && state.receiptCart[editIndex]) {
                                        state.receiptCart[editIndex].previewImage = preview.dataUrl;
                                        state.receiptCart[editIndex].receiptImagePreview = preview.dataUrl;
                                    }
                                } else {
                                    if (imageInstructionEl) imageInstructionEl.textContent = '이미지 불러오기 실패 · 정보 수정은 가능합니다';
                                }
                            } catch (e) {
                                if (!Swal.isVisible() || Swal.getPopup() !== popup) return;
                                if (imageInstructionEl) imageInstructionEl.textContent = '이미지 불러오기 실패 · 정보 수정은 가능합니다';
                            }
                        })();
                    }
                    const updateReceiptFieldVisual = (inputEl) => {
                        if (!inputEl) return;
                        const group = inputEl.closest('.swal-input-group-new');
                        if (!group) return;
                        const badge = group.querySelector('.receipt-field-badge');
                        const hasValue = !!String(inputEl.value || '').trim();
                        const status = String(group.dataset.ocrStatus || '').trim();
                        group.classList.remove('ocr-auto', 'ocr-review', 'ocr-manual', 'ocr-required');
                        if (badge) badge.classList.remove('badge-auto', 'badge-review', 'badge-required', 'is-visible', 'is-hidden');

                        if (!hasValue) {
                            group.classList.add('ocr-required');
                            if (badge) {
                                badge.classList.add('badge-required');
                                badge.textContent = '입력필요';
                                badge.classList.add('is-visible');
                            }
                            return;
                        }

                        if (status === 'auto') {
                            group.classList.add('ocr-auto');
                            if (badge) {
                                badge.classList.add('badge-auto');
                                badge.textContent = '자동입력';
                                badge.classList.add('is-visible');
                            }
                            return;
                        }

                        if (status === 'review') {
                            group.classList.add('ocr-review');
                            if (badge) {
                                badge.classList.add('badge-review');
                                badge.textContent = '확인필요';
                                badge.classList.add('is-visible');
                            }
                            return;
                        }

                        group.classList.add('ocr-manual');
                        if (badge) badge.classList.add('is-hidden');
                    };
                    const markFieldManual = (inputEl) => {
                        if (!inputEl) return;
                        const group = inputEl.closest('.swal-input-group-new');
                        if (!group) return;
                        group.dataset.ocrStatus = 'manual';
                        updateReceiptFieldVisual(inputEl);
                    };
                    const useGeneralButtons = Array.from(document.querySelectorAll('.use-type-btn[data-use-type="general"]'));
                    const useMeal = document.getElementById('swal-use-meal');
                    const mealPanel = document.getElementById('swal-meal-panel');
                    const mealCountValue = CardLogic.getCurrentReturnMealHeadcount();
                    let selectedGeneralTone = (() => {
                        const activeGeneral = useGeneralButtons.find(btn => btn.getAttribute('aria-pressed') === 'true');
                        return activeGeneral?.dataset?.purposeTone || initialGeneralTone || getReceiptPopupToneFromText(storeValue, detailsValue);
                    })();
                    let mealBaseAmount = String(originalAmountValue || (amount ? amount.value : '') || '').replace(/[^\d]/g, '');
                    const getMealBaseAmount = () => String(mealBaseAmount || originalAmountValue || (amount ? amount.value : '') || '').replace(/[^\d]/g, '');
                    const isMealMode = () => !!(useMeal && useMeal.getAttribute('aria-pressed') === 'true');
                    const getCurrentGeneralTone = () => selectedGeneralTone || getReceiptPopupToneFromText(
                        store ? store.value : storeValue,
                        details ? details.value : detailsValue
                    );
                    const applyReceiptPopupTone = (tone) => {
                        const pop = Swal.getPopup();
                        if (!pop) return;
                        pop.classList.remove('receipt-tone-purchase', 'receipt-tone-dining', 'receipt-tone-meal');
                        pop.classList.add(`receipt-tone-${tone || 'purchase'}`);
                    };
                    const syncReceiptPopupTone = () => applyReceiptPopupTone(isMealMode() ? 'meal' : getCurrentGeneralTone());
                    const recalcMealAmount = () => {
                        if (!isMealMode()) return;
                        const raw = getMealBaseAmount();
                        const info = Utils.getMealAdjustedAmount(raw, mealCountValue);
                        if (amount) amount.value = info.amount ? Utils.nfKR.format(info.amount) : '';
                    };
                    const restoreGeneralAmount = () => {
                        const raw = getMealBaseAmount();
                        if (amount) amount.value = raw ? Utils.nfKR.format(Number(raw)) : '';
                    };
                    const setGeneralMode = (tone) => {
                        selectedGeneralTone = tone || selectedGeneralTone || getReceiptPopupToneFromText(store ? store.value : storeValue, details ? details.value : detailsValue);
                        useGeneralButtons.forEach(btn => {
                            const active = btn.dataset.purposeTone === selectedGeneralTone;
                            btn.classList.toggle('active', active);
                            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
                        });
                        if (useMeal) {
                            useMeal.classList.remove('active');
                            useMeal.setAttribute('aria-pressed', 'false');
                        }
                        if (mealPanel) mealPanel.style.display = 'none';
                        if (details) {
                            details.readOnly = false;
                            if (details.value === '특근매식비') details.value = '';
                        }
                        restoreGeneralAmount();
                        syncReceiptPopupTone();
                        [store, amount, details].forEach(updateReceiptFieldVisual);
                    };
                    const setMealMode = (on) => {
                        const nextOn = receiptPurposeConfig.mealOnly ? true : (receiptPurposeConfig.allowMealToggle ? !!on : false);
                        if (!nextOn) {
                            setGeneralMode(selectedGeneralTone);
                            return;
                        }
                        useGeneralButtons.forEach(btn => {
                            btn.classList.remove('active');
                            btn.setAttribute('aria-pressed', 'false');
                        });
                        if (useMeal) {
                            useMeal.classList.toggle('active', true);
                            useMeal.setAttribute('aria-pressed', 'true');
                        }
                        if (mealPanel) mealPanel.style.display = 'none';
                        if (details) {
                            mealBaseAmount = getMealBaseAmount();
                            details.value = '특근매식비';
                            details.readOnly = true;
                            recalcMealAmount();
                        } else {
                            mealBaseAmount = getMealBaseAmount();
                            recalcMealAmount();
                        }
                        syncReceiptPopupTone();
                        [store, amount, details].forEach(updateReceiptFieldVisual);
                    };
                    [store, amount, details].forEach(updateReceiptFieldVisual);
                    store.addEventListener('input', () => { markFieldManual(store); if (!isMealMode()) syncReceiptPopupTone(); });
                    details.addEventListener('input', () => { markFieldManual(details); if (!isMealMode()) syncReceiptPopupTone(); });
                    amount.oninput = (e) => {
                        markFieldManual(e.target);
                        const v = e.target.value.replace(/[^\d]/g, '');
                        mealBaseAmount = v;
                        e.target.value = v ? Utils.nfKR.format(parseInt(v)) : '';
                        recalcMealAmount();
                        updateReceiptFieldVisual(e.target);
                    };
                    useGeneralButtons.forEach(btn => {
                        btn.onclick = () => setGeneralMode(btn.dataset.purposeTone || selectedGeneralTone);
                    });
                    if (useMeal && receiptPurposeConfig.hasMeal) useMeal.onclick = () => setMealMode(true);
                    if (isMeal || receiptPurposeConfig.mealOnly) setMealMode(true);
                    else setGeneralMode(selectedGeneralTone);
                    const handleEnter = (e, nextElem) => {
                        if (e.key === 'Enter') {
                            e.preventDefault(); e.stopPropagation();
                            if (nextElem) nextElem.focus();
                            else Swal.getConfirmButton().click();
                        }
                    };
                    store.onkeydown = e => handleEnter(e, amount);
                    amount.onkeydown = e => handleEnter(e, details);
                    details.onkeydown = e => handleEnter(e, null);
                    
                    if (isMobile || isReceiptTouchDevice) {
                        const receiptInputs = [store, amount, details].filter(Boolean);
                        const blurReceiptInput = () => {
                            const active = document.activeElement;
                            if (active && receiptInputs.includes(active)) active.blur();
                        };
                        requestAnimationFrame(blurReceiptInput);
                        setTimeout(blurReceiptInput, 80);
                        setTimeout(blurReceiptInput, 260);

                        const focusHandler = (e) => {
                            setTimeout(() => {
                                try { e.target.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (_) {}
                            }, 300);
                        };

                        const unlockForUserEdit = (e) => {
                            const input = e.currentTarget;
                            if (!input) return;
                            if (input.id === 'swal-details' && isMealMode()) return;
                            input.readOnly = false;
                            setTimeout(() => {
                                try { input.focus({ preventScroll: true }); } catch (_) { input.focus(); }
                                focusHandler({ target: input });
                            }, 0);
                        };

                        receiptInputs.forEach((input) => {
                            input.dataset.wsOriginalReadonly = input.readOnly ? '1' : '0';
                            if (input.dataset.wsOriginalReadonly !== '1') input.readOnly = true;
                            input.addEventListener('focus', focusHandler);
                            input.addEventListener('touchstart', unlockForUserEdit, { passive: true });
                            input.addEventListener('pointerdown', unlockForUserEdit, { passive: true });
                        });
                    } else {
                        setTimeout(() => store.focus(), 100);
                    }
                    if (!isMeal && !(isMobile || isReceiptTouchDevice)) {
                        setTimeout(() => {
                            const detailsInput = document.getElementById('swal-details');
                            if (detailsInput) {
                                detailsInput.focus();
                                const len = detailsInput.value.length;
                                detailsInput.setSelectionRange(len, len);
                            }
                        }, 400);
                    }
                },
                
                didClose: () => {
                    try {
                        const prev = document.body.dataset.prevOverflow ?? '';
                        document.body.style.overflow = prev;
                        delete document.body.dataset.prevOverflow;
                    } catch(e) {}
                    try {
                        const vv = window.visualViewport;
                        if (vv && window.__vvHandlerForSwal) {
                            vv.removeEventListener('resize', window.__vvHandlerForSwal);
                            vv.removeEventListener('scroll', window.__vvHandlerForSwal);
                            delete window.__vvHandlerForSwal;
                        }
                    } catch(e) {}
                },
                
                preConfirm: () => {
                    const [store, amtStr, detailsInput] = ['swal-store', 'swal-amount', 'swal-details'].map(id => document.getElementById(id).value);
                    const useMeal = document.getElementById('swal-use-meal');
                    const isMealExpense = !!(useMeal && useMeal.getAttribute('aria-pressed') === 'true');
                    const mealHeadcount = CardLogic.getCurrentReturnMealHeadcount();
                    let details = isMealExpense ? '특근매식비' : detailsInput;
                    if (!store || !amtStr || !details) return Swal.showValidationMessage('모든 항목을 입력하세요');
                    if (!String(data.receiptImage || '').startsWith('id:')) {
                        return Swal.showValidationMessage('영수증 이미지가 저장되지 않았습니다. 이미지를 다시 첨부해 주세요.');
                    }
                    const rawAmount = amtStr.replace(/[^\d]/g, "");
                    const originalAmount = String(data.originalAmount || rawAmount).replace(/[^\d]/g, "") || rawAmount;
                    const calcBaseAmount = isMealExpense ? originalAmount : rawAmount;
                    let amount = rawAmount;
                    let mealLimitAmount = '';
                    let mealOverAmount = '';
                    if (isMealExpense) {
                        const info = Utils.getMealAdjustedAmount(calcBaseAmount, mealHeadcount);
                        amount = String(info.amount);
                        mealLimitAmount = String(info.mealLimitAmount);
                        mealOverAmount = String(Math.max(0, info.originalAmount - info.amount));
                    }
                    const cachedPreview = data.previewImage || data.receiptImagePreview || '';
                    const activeGeneralBtn = document.querySelector('.use-type-btn[data-use-type="general"][aria-pressed="true"]');
                    const generalTone = activeGeneralBtn?.dataset?.purposeTone || CardLogic.getReceiptPopupToneFromPurposeText(store, details, CardLogic.getCurrentReturnPurposeList());
                    const receiptPurpose = isMealExpense ? '특근매식비' : CardLogic.getReceiptPurposeFromTone(generalTone);
                    return {
                        usagePlace: store,
                        usageDetails: details,
                        amount,
                        originalAmount,
                        isMealExpense,
                        purpose: receiptPurpose,
                        mealHeadcount: isMealExpense ? mealHeadcount : '',
                        mealLimitAmount,
                        mealOverAmount,
                        receiptImage: data.receiptImage,
                        receiptImagePreview: cachedPreview,
                        previewImage: cachedPreview,
                        date: data.date||''
                    };
                }
            }).then(async (res) => {
                if (!(res.isConfirmed && res.value)) return;
                
                try {
                    const suppressSaveToast =
                        Array.isArray(state.reviewQueue) &&
                        state.reviewQueue[0] === editIndex &&
                        state.reviewQueue.length > 1;

                    await CardLogic.saveCartItemOptimistic(res.value, editIndex, { closeSwal: false });

                    // 1장 입력 또는 여러 장 중 마지막 입력 때만 저장완료 토스트를 표시합니다.
                    // 여러 장 중간 단계에서는 각 영수증 박스의 저장완료 표시만 사용합니다.
                    if (!suppressSaveToast) {
                        try {
                            Swal.fire({
                                toast: true,
                                position: 'top',
                                icon: 'success',
                                title: '저장 완료',
                                showConfirmButton: false,
                                timer: 1200,
                                timerProgressBar: false,
                                backdrop: false,
                                heightAuto: false
                            });
                        } catch(e) {}
                    }
                } catch (e) {
                    await UIManager.showOperationalError({
                        title: '저장 실패',
                        message: '영수증 정보가 저장되지 않았습니다.',
                        error: e,
                        steps: [
                            '실패 표시가 있는 영수증을 다시 눌러 저장해 주세요.',
                            '계속 실패하면 삭제 후 다시 첨부해 주세요.'
                        ],
                        confirmButtonText: '확인'
                    });
                }
            });
        },
        /* =========================================================
        @SUBSECTION: JS_SYNC_HELPERS
        대여/반납 직후 서버 상태 재동기화
        ========================================================= */
        scheduleQuickSync: (attempts = 3, intervalMs = 1200) => {
            if (!attempts || attempts <= 0) return;
            let n = 0;
            const tick = async () => {
                n++;
                try {
                    state.pendingPostReturnSync = true;
                    await CardLogic.handlePendingPostReturnSync();
                } catch(e) {}
                if (n >= attempts) return;
                setTimeout(tick, intervalMs);
            };
            setTimeout(tick, intervalMs);
        },
        handlePendingPostReturnSync: async () => {
            const reqId = ++state.syncReqId;
            if (!state.pendingPostReturnSync) return;
            state.pendingPostReturnSync = false;
            try {
                /* @SERVER_API_GROUP_INIT: 카드 상태 재동기화 */
                const data = await Api.call('getInitialAppData');
                if (data && !data.error) {
                    SavedCartPrefetch.normalizeInitialPayload(data);
                    state.allCardData = data.allCards;
                    state.allUsersData = data.allUsers;
                    SavedCartPrefetch.reset();
                    SavedCartPrefetch.start('quick-sync');
                    state.lastSyncTs = Date.now();
                }
            } catch(e) {}
        },
        /* =========================================================
        @SUBSECTION: JS_RETURN_SUBMIT_FLOW
        관리자 모드 반납 제출 및 optimistic 상태 변경
        ========================================================= */
        async submitCart() {
            
            if (!state.isAdminMode) {
                await Swal.fire('제출 불가', '관리자 모드에서만 반납 제출할 수 있습니다.', 'warning');
                return;
            }
            if (CardLogic._submitInFlight) return;
            const blockingIssues = CardLogic.getBlockingReceiptIssues();
            if (blockingIssues.length) {
                await CardLogic.showBlockingReceiptIssues(blockingIssues);
                return;
            }

            
            const isMeal = false;
            if (state.receiptCart && state.receiptCart.length) {
                const missing = state.receiptCart
                    .map((it, idx) => ({ it, idx }))
                    .filter(x => !Utils.isMealExpenseItem(x.it) && !(String(x.it.usageDetails || '').trim()));
                if (missing.length) {
                    const ok = await Swal.fire({
                        title: '입력 확인',
                        html: `<b>${missing.length}건</b>의 사용내역이 비어 있습니다.<br>그래도 제출할까요?`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: '그대로 제출',
                        cancelButtonText: '입력하러 가기'
                    });
                    if (!ok.isConfirmed) {
                        const first = missing[0]?.idx;
                        setTimeout(() => {
                            const el = document.querySelector(`.cart-item[data-index="${first}"]`);
                            if (el) {
                                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                el.classList.add('highlight');
                                setTimeout(() => el.classList.remove('highlight'), 1500);
                            }
                        }, 50);
                        return;
                    }
                }
            }
            
            if (!state.receiptCart.length) {
                const ok = await Swal.fire({title:'영수증 없음',text:'영수증 없이 반납하시겠습니까?',icon:'warning',showCancelButton:true,confirmButtonText:'영수증 없이 반납',cancelButtonText:'취소'});
                if (!ok.isConfirmed) return;
            }

            CardLogic._submitInFlight = true;
            const btn = document.getElementById('submit-cart-btn');
            if(btn) { btn.disabled = true; btn.classList.add('is-loading'); }
            const params = {
                adminToken: state.isAdminMode ? (state.adminTokenCache || '') : '',
                cardNumber: state.currentReturnCard.id,
                receiveDate: state.currentReturnCard.userInfo.receiveDate,
                userName: state.enteredUsers.map(u=>u.name).join(', '),
                purpose: state.currentReturnCard?.userInfo?.purpose || '',
                usageSessionId: state.currentReturnCard?.userInfo?.usageSessionId || '',
                requestId: Utils.createClientRequestId('return'),
                multiEntries: JSON.stringify(Utils.sanitizeReceiptCart(state.receiptCart))
            };
            let delayedReturnLoadingTimer = null;
            let delayedReturnLoadingShown = false;
            const originalSubmitText = btn ? btn.textContent : '';
            if (btn) btn.textContent = '반납 처리중...';
            try {
                
                delayedReturnLoadingTimer = setTimeout(() => {
                    delayedReturnLoadingShown = true;
                    try {
                        Swal.fire({
                            title: '반납 처리중',
                            allowOutsideClick: false,
                            allowEscapeKey: false,
                            showConfirmButton: false,
                            didOpen: () => { try { Swal.showLoading(); } catch(e) {} }
                        });
                    } catch(e) {}
                }, 800);

                /* @SERVER_API_GROUP_RETURN: 반납 요청 큐 등록 */
                await Api.call('queueReturnRequest', params);
                if (delayedReturnLoadingTimer) clearTimeout(delayedReturnLoadingTimer);
                if (delayedReturnLoadingShown) { try { if (window.Swal && Swal.isVisible()) Swal.close(); } catch(e) {} }

                const t = state.allCardData.find(c => c.id === params.cardNumber);
                if (t) t.status = '반납처리중';
                const returnTotalAmount = (state.receiptCart || []).reduce((sum, it) => sum + (Number(it?.amount || 0) || 0), 0);
                UIManager.showConfirmationScreen('반납 처리 완료',
                    Utils.createDetailRow('카드번호', params.cardNumber) +
                    Utils.createDetailRow('영수증', `${state.receiptCart.length}건 접수`) +
                    Utils.createDetailRow('금액', `${Utils.nfKR.format(returnTotalAmount)}원`)
                );
                state.forceSyncOnNextUnlock = true;
                state.pendingPostReturnSync = true;
                CardLogic.scheduleQuickSync(3, 1200);
            } catch (e) {
                if (delayedReturnLoadingTimer) clearTimeout(delayedReturnLoadingTimer);
                if (delayedReturnLoadingShown) { try { if (window.Swal && Swal.isVisible()) Swal.close(); } catch(_) {} }
                const returnErrorMessage = Utils.getErrorMessage(e);
                state.lastReturnSubmitError = { cardNumber: params.cardNumber, message: returnErrorMessage, at: new Date().toISOString() };
                clearInterval(state.countdownInterval);
                if(btn) { btn.disabled = false; btn.classList.remove('is-loading'); btn.textContent = originalSubmitText || '반납 제출'; }
                if (String(returnErrorMessage).includes('ADMIN_SESSION_INVALID')) {
                    setAdminMode(false, null, { silent: true });
                    await Swal.fire('관리자 인증 필요', '저장된 반납 허가증이 유효하지 않습니다. 관리자 PIN을 다시 입력해 주세요.', 'warning');
                    return;
                }
                await UIManager.showOperationalError({
                    title: '반납 처리 실패',
                    error: e,
                    steps: [
                        '다시 반납 제출을 눌러 주세요.',
                        '반복 실패하면 카드 상태를 확인해 주세요.'
                    ]
                });
            } finally {
                CardLogic._submitInFlight = false;
            }
        }

    };

    
    /* =========================================================
    @SECTION: JS_APP_SEQUENCE
    앱 시작/잠금 해제 뒤 데이터 동기화와 로딩 진행률 처리
    ========================================================= */
    /* =========================================================
    @SECTION: JS_TO_CODEGS_CONTRACT_STEP15
    index.html ↔ Code.gs 서버 함수 계약
    - 클라이언트 method 문자열과 Code.gs 함수명은 1:1 계약입니다.
    - 디자인/CSS 작업 중에는 이 목록의 문자열을 변경하지 않습니다.
    - 서버 함수 추가/변경이 필요한 경우 Code.gs와 index.html을 동시에 검증합니다.

    getInitialAppData      : 초기 데이터 / 카드 상태
    rentNow                : 대여 저장
    processReceiptImage    : 영수증 OCR
    getReceiptImagePreview : 영수증 이미지 미리보기
    saveCartToMasterFile   : 영수증/장바구니 저장
    getSavedCarts          : 저장 장바구니 조회
    queueReturnRequest     : 반납 요청
    validateAdminPin       : 관리자 인증
========================================================= */

/* =========================================================
    @SECTION: JS_APP_BOOT_SEQUENCE_STEP14
    앱 시작 / 초기 데이터 로딩 / 화면 진입 순서
    - getInitialAppData 호출과 로딩 진행률 흐름 유지
    ========================================================= */
    async function initializeAppSequence() {
        const reqId = ++state.syncReqId;
        const unlockStartedAt = Date.now();
        console.log('[WS MEASURE] unlock sequence start', { at: new Date().toLocaleTimeString() });
        elements.welcomeScreen.classList.remove('hidden');
        elements.welcomeScreen.classList.add('is-visible');
        UIManager.currentScreenElement = elements.welcomeScreen;
        state.currentScreen = 'welcome';
        elements.contentWrapper.style.display = 'flex';
        await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
        requestAnimationFrame(() => elements.lockScreen.classList.add('fade-out'));
        const hideLockAfterFade = () => {
            const onEnd = (ev) => {
                if (ev.propertyName !== 'opacity') return;
                elements.lockScreen.removeEventListener('transitionend', onEnd);
                try { elements.lockScreen.style.display = 'none'; } catch(e) {}
            };
            elements.lockScreen.addEventListener('transitionend', onEnd);
        };
        hideLockAfterFade();
        let isDataLoaded = false;
        /* @SERVER_API_GROUP_INIT: 빠른 초기화 데이터 */
        const reusablePreloadPromise = InitialDataPreload.getUsablePromise();
        const usingPreload = !!reusablePreloadPromise;
        if (!usingPreload) SavedCartPrefetch.reset();
        const initialDataStartedAt = Date.now();
        console.log('[WS MEASURE] getInitialAppData start', {
            source: usingPreload ? 'lock-preload' : 'fresh-call',
            at: new Date().toLocaleTimeString()
        });
        const dataPromise = (reusablePreloadPromise || Api.call('getInitialAppData'))
            .then(r => {
                console.log('[WS MEASURE] getInitialAppData done', `${Date.now() - initialDataStartedAt}ms`, { source: usingPreload ? 'lock-preload' : 'fresh-call' });
                SavedCartPrefetch.normalizeInitialPayload(r);
                if (!r || r.error) throw new Error(r?.error || 'No Data');
                isDataLoaded = true;
                if (reqId !== state.syncReqId) return r;

                // v12.8: 카드/사용자 기본 데이터가 도착하는 즉시 state에 반영하고,
                // 로딩 화면이 아직 떠 있는 동안 savedCart 프리로드를 바로 출발시킵니다.
                // savedCart 완료를 로딩화면 종료 조건으로 묶지 않아 첫 진입은 가볍게 유지합니다.
                state.allCardData = r.allCards || [];
                state.allUsersData = r.allUsers || [];
                state.lastSyncTs = Date.now();
                if (!state.savedCartPrefetchPromise) {
                    SavedCartPrefetch.start(usingPreload ? 'unlock-preloaded' : 'unlock-loader');
                }

                return r;
            })
            .catch(e => {
                console.log('[WS MEASURE] getInitialAppData failed', `${Date.now() - initialDataStartedAt}ms`, e);
                isDataLoaded = true;
                throw e;
            });
        await UIManager.runRandomLoader(() => isDataLoaded);
        elements.welcomeScreen.classList.remove('is-visible');
        elements.welcomeScreen.classList.add('is-hiding');
        setTimeout(() => {
            elements.welcomeScreen.classList.add('hidden');
            elements.welcomeScreen.classList.remove('is-hiding');
            elements.lockScreen.classList.add('hidden');
        }, 220);
        try {
            const data = await dataPromise;
            if (!data || data.error) throw new Error(data?.error || 'No Data');
            if (reqId !== state.syncReqId) return;
            if (!Array.isArray(state.allCardData) || !state.allCardData.length) state.allCardData = data.allCards || [];
            if (!Array.isArray(state.allUsersData) || !state.allUsersData.length) state.allUsersData = data.allUsers || [];
            state.lastSyncTs = Date.now();
            setTimeout(() => CardLogic.drainPendingRentRequests(), 800);
            // v12.8: savedCart는 이미 unlock-loader 단계에서 출발했습니다. 여기서는 로그인 화면만 즉시 표시합니다.
            UIManager.showScreen('login');
            console.log('[WS MEASURE] unlock sequence to login screen', `${Date.now() - unlockStartedAt}ms`);
        } catch (e) {
            state.allCardData = [];
            state.allUsersData = [];
            UIManager.showScreen('login');
            console.log('[WS MEASURE] unlock sequence fallback to login screen', `${Date.now() - unlockStartedAt}ms`);
        }
        UIManager.startInactivityDetection();
    }

    @SECTION: JS_LOCK_SCREEN
    카드 잠금 화면 클릭 → 로더 → 로그인 화면 진입 흐름

    function playLakeRippleFromCardCenter() {
        try {
            document.querySelectorAll('.ws-lake-ripple-layer').forEach(el => el.remove());
            const rect = elements.glassCardContainer.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            const farX = Math.max(x, window.innerWidth - x);
            const farY = Math.max(y, window.innerHeight - y);
            const rippleSize = Math.max(960, Math.ceil(Math.sqrt(farX * farX + farY * farY) * 2.12));
            /* [2026-08 성능 개선] 실제 DOM 요소는 최대 1200px로만 만들고,
               모자란 크기는 GPU가 처리하는 scale로 확대합니다.
               큰 모니터에서 2000px가 넘는 텍스처를 만들지 않아 저사양 기기 렉이 크게 줄어듭니다. */
            const rippleBase = Math.min(1200, rippleSize);
            const rippleScaleEnd = rippleSize / rippleBase;
            const layer = document.createElement('div');
            layer.className = 'ws-lake-ripple-layer';
            layer.style.setProperty('--ws-ripple-x', `${x}px`);
            layer.style.setProperty('--ws-ripple-y', `${y}px`);
            layer.style.setProperty('--ws-ripple-base', `${rippleBase}px`);
            layer.style.setProperty('--ws-ripple-scale-end', rippleScaleEnd.toFixed(4));
            layer.style.setProperty('--ws-ripple-scale-start', (0.014 * rippleScaleEnd).toFixed(5));
            layer.innerHTML = '<div class="ws-lake-ripple-wave"></div>';
            document.body.appendChild(layer);
            setTimeout(() => { try { layer.remove(); } catch(e) {} }, 1550);
        } catch (e) {
            console.warn('[WS] lake ripple failed', e);
        }
    }

    async function handleLockScreenClick() {
        if (state.isAppActive && state.currentScreen !== 'lock') return;
        state.isAppActive = true;
        state.cardTiltActive = false;
        state.forceSyncOnNextUnlock = false;
        state.pendingPostReturnSync = false;
        state.syncPromise = null;
        try { InitialDataPreload.start('lock-click'); } catch(e) { console.warn(e); }
        elements.lockScreen.classList.add('active-pop', 'ripple-card-exit');
        playLakeRippleFromCardCenter();
        document.getElementById('lock-text-instruction').classList.add('hide');

        /*
          행정실 키오스크 갱신 규칙:
          - 화면이 다시 켜질 때는 잠금화면으로만 복귀합니다.
          - 잠금화면이 보이는 동안 3초 TTL 선로딩을 시도합니다.
          - 카드 클릭 시 선로딩 데이터가 신선하면 재사용하고,
            오래됐거나 없으면 로딩 화면을 거치며 getInitialAppData로 새로 가져옵니다.
          - 카드와 파동을 같은 타임라인에서 같이 사라지게 하여,
            카드 중심에서 퍼지는 물결이 끝날 때 로딩 화면으로 부드럽게 넘어갑니다.
        */
        const SCREEN_FADE_START_MS = 560;
        const RIPPLE_TO_LOADER_MS = 1160;
        requestAnimationFrame(() => {
            setTimeout(() => {
                try { elements.lockScreen.classList.add('ripple-screen-exit'); } catch(e) {}
            }, SCREEN_FADE_START_MS);
            setTimeout(() => initializeAppSequence(), RIPPLE_TO_LOADER_MS);
        });
    }

    function isKioskTabletDevice() {
        const ua = navigator.userAgent || '';
        const platform = navigator.platform || '';
        const hasTouch = (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        const isiPad = /iPad/i.test(ua) || (platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
        const isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
        // PC/노트북 터치스크린 또는 브라우저 크기만으로 태블릿으로 오판하지 않도록
        // visibilitychange 복귀 잠금은 명확한 iPad/Android 태블릿에서만 실행합니다.
        return hasTouch && (isiPad || isAndroidTablet);
    }

    function hasActiveReceiptWork(){
        try {
            const cart = Array.isArray(state.receiptCart) ? state.receiptCart : [];
            return cart.some(it => {
                const status = String((it && (it.status || it.phase)) || '').toLowerCase();
                return !!(it && (it.processing || it.isProcessing || it.isSaving || ['queued','ocr','saving','save_error','processing'].includes(status)));
            }) || !!CardLogic._submitInFlight;
        } catch(e) { return false; }
    }

    function bindKioskVisibilityReturn() {
        const refreshLockPreloadOnTabletWake = (reason) => {
            if (!isKioskTabletDevice()) return;
            if (state.currentScreen === 'lock') {
                try { InitialDataPreload.refresh(reason); } catch(e) { console.warn(e); }
                return;
            }
            try {
                if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                    // 영수증 입력/저장/관리자 확인 등 사용자가 조작 중인 모달은 강제로 닫지 않습니다.
                    return;
                }
            } catch(e) {}
            if (hasActiveReceiptWork()) return;
            UIManager.showLockScreen();
        };

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            refreshLockPreloadOnTabletWake('tablet-visible-lock-refresh');
        });

        window.addEventListener('focus', () => {
            if (document.visibilityState && document.visibilityState !== 'visible') return;
            refreshLockPreloadOnTabletWake('tablet-focus-lock-refresh');
        });

        window.addEventListener('pageshow', () => {
            refreshLockPreloadOnTabletWake('tablet-pageshow-lock-refresh');
        });
    }
