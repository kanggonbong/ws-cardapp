.scanner-container{position:relative;width:140px;height:180px;background:var(--bg-color);border-radius:24px;box-shadow:inset 6px 6px 12px var(--shadow-dark),inset -6px -6px 12px var(--shadow-light);display:flex;justify-content:center;align-items:center;overflow:hidden;margin-bottom:20px;}.receipt-paper{width:90px;height:130px;background:#fff;border-radius:12px;box-shadow:4px 4px 10px rgba(0,0,0,0.1);display:flex;flex-direction:column;padding:18px 12px;gap:10px;}.paper-line{height:6px;background:#e2e8f0;border-radius:3px;}.paper-line.title{width:50%;height:8px;background:#cbd5e0;margin-bottom:5px;}.paper-line.full{width:100%;}.paper-line.half{width:60%;}.scan-beam{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to bottom,transparent 40%,rgba(0,122,255,0.2) 50%,rgba(0,122,255,0.6) 51%,transparent 55%);background-size:100% 200%;animation:beam-scan 2s linear infinite;pointer-events:none;}@keyframes beam-scan{0%{transform:translateY(-100%);}100%{transform:translateY(100%);}}
/* @SECTION: CSS_LOADING_OVERLAY - 영수증/저장 로딩 오버레이 */

}
/* 변경 부분: 불필요한 옛날 savedPop 애니메이션과 ::after 요소들 제거 (오버레이로 대체) */

    content: none !important;
    display: none !important;
}

}

}
@keyframes item-pulse-saving{

}

background-color:rgba(139,92,246,0.10);

}
}.cart-item.processing .cart-item-icon{color:#38bdf8;filter:drop-shadow(0 0 10px rgba(56,189,248,0.45));animation:pulse 1.6s infinite ease-in-out;}.cart-item.saving .cart-item-icon{color:#8b5cf6;filter:drop-shadow(0 0 10px rgba(139,92,246,0.45));animation:pulse 1.6s infinite ease-in-out;}.cart-item.saved .cart-item-icon{color:#16a34a;filter:drop-shadow(0 0 10px rgba(22,163,74,0.35));}.cart-item-icon{width:45px;height:45px;margin-right:15px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--primary-color);flex-shrink:0;filter:drop-shadow(1px 1px 2px rgba(255,255,255,0.5));}@media (max-width:767px){.content-wrapper{min-height:100dvh;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0) + 8px) 16px calc(env(safe-area-inset-bottom,0) + 8px);}.container{justify-content:flex-start;}.screen{padding:18px 16px;border-radius:28px;}#screen-login{width:min(92vw,440px);padding-top:14px;padding-bottom:10px;max-height:none;overflow-y:visible;}#login-user-tags{margin-bottom:10px;min-height:50px;padding:8px 10px;}.display-area{gap:12px;height:52px;margin-bottom:-6px;}.digit-wrapper{width:56px;height:56px;}.digit-box{width:65px;height:65px;line-height:65px;font-size:2rem;margin:0;border-radius:16px;aspect-ratio:1 / 1;}.keypad-btn{font-size:1.6rem;padding:0;}.keypad-grid{gap:12px;margin-bottom:4px;}#keypad-submit-btn{padding:14px 0;font-size:1.12rem;margin-top:10px;}.login-instruction-area{height:62px;padding:0;}.login-instruction-area.has-users{height:108px;}#login-instruction{font-size:0.98rem;padding:0;}#security-scan-overlay,#loadingOverlay,.status-badge{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;background-color:rgba(224,229,236,0.95) !important;}.screen,

.swal2-popup{padding:1.2em 1em !important;width:92% !important;max-width:95% !important;}.swal2-input-new{height:50px !important;padding-top:15px !important;font-size:1rem !important;}.swal2-input-new:focus + .swal-input-label-new,.swal2-input-new:not(:placeholder-shown) + .swal-input-label-new{top:8px !important;left:12px !important;font-size:0.75rem !important;}.swal-input-label-new{font-size:0.9rem !important;}#swal-image{max-height:150px !important;margin-bottom:5px !important;}.swal-custom-container{gap:10px !important;padding-top:0 !important;}.swal2-actions{margin-top:15px !important;}.swal2-styled{padding:0.6em 1.5em !important;font-size:1rem !important;}.inset-box{padding:14px 24px;border-radius:20px;margin-bottom:10px;}.inset-box h2{font-size:1.38rem !important;}}.cart-item-info{display:flex;flex-direction:column;gap:4px;flex-grow:1;overflow:hidden;margin-left:0;}.cart-item-place{font-size:0.95rem;color:var(--text-primary);font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}.cart-item-details{font-size:0.9rem;color:var(--text-secondary);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}.cart-item-amount-box{text-align:right;margin-left:10px;flex-shrink:0;margin-right:45px;}.cart-item-amount{font-size:1.2rem;font-weight:800;color:var(--primary-color);}.cart-item-delete{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:36px;height:36px;background:var(--bg-color);border:none;border-radius:50%;color:var(--danger-color);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s ease;box-shadow:3px 3px 6px var(--shadow-dark),-3px -3px 6px var(--shadow-light);z-index:10;}.cart-item-delete:active{box-shadow:inset 2px 2px 4px var(--shadow-dark),inset -2px -2px 4px var(--shadow-light);transform:translateY(-50%) scale(0.95);}.warning-text{color:var(--danger-color);font-weight:700;font-size:0.8rem;margin-left:6px;}#receipt-cart-container.empty-cart{justify-content:center;align-items:cen /* @SECTION: CSS_CONFIRMATION_SCREEN - 완료 화면 */
.confirmation-container{text-align:center;width:100%;max-width:400px;margin:0 auto;}.confirmation-icon-wrapper{width:80px;height:80px;margin:0 auto 30px;}.animated-check{width:80px;height:80px;border-radius:50%;display:block;stroke-width:3;stroke:var(--success-color);stroke-miterlimit:10;box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);animation:scale .3s ease-in-out .9s both;background-color:var(--bg-color);}.animated-check path{stroke-dasharray:120;stroke-dashoffset:120;animation:stroke .3s cubic-bezier(0.65,0,0.45,1) .8s forwards;}.confirmation-title{font-size:1.8rem;font-weight:700;color:var(--text-primary);text-shadow:1px 1px 2px var(--shadow-light);margin-bottom:24px;}#confirmation-details{display:flex;flex-direction:column;gap:16px;margin-bottom:32px;width:100%;}.detail-row{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:2px solid rgba(163,177,198,0.2);}.detail-row-label{font-size:1.2rem;font-weight:700;color:var(--text-primary);}.detail-row-content{font-size:1.2rem;font-weight:700;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}#confirmation-countdown{margin-top:24px;font-size:1.1rem;font-weight:600;color:var(--text-primary);}.swal2-popup{font-family:var(--font-main) !important;border-radius:30px !important;background:var(--bg-color) !important;box-shadow:20px 20px 40px var(--shadow-dark),-20px -20px 40px var(--shadow-light) !important;padding:2em !important;}.swal2-title{color:var(--text-primary) !important;font-weight:700 !important;}.swal2-html-container{color:var(--text-secondary) !important;font-weight:500 !important;}.swal-custom-container{display:flex;flex-direction:column;align-items:center;gap:1.5rem;width:100%;max-width:350px;margin:0 auto;padding-top:1rem;}#swal-image-container{position:relative;cursor:pointer;text-align:center;width:100%;}#swal-image{max-width:100%;max-height:25vh;border-radius:20px;margin-bottom:10px;display:inline-block;box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);}#swal-image-instruction{font-size:0.9rem;color:var(--text-secondary);}#return-form-container{display:flex;flex-direction:column;align-items:center;gap:24px;margin-top:20px;width:100%;}#return-screen-title{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:8px;}.simple-btn{width:100%;padding:18px 0;font-size:1.1rem;font-weight:700;border-radius:24px;background:var(--bg-color);cursor:pointer;user-select:none;border:none;box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);transition:all 0.2s ease;position:relative;overflow:hidden;}#keypad-submit-btn{padding:20px 0;font-size:1.2rem;}.simple-btn.primary{color:var(--primary-color);}.simple-btn.accent{color:var(--accent-color);}.simple-btn:disabled{opacity:0.5;cursor:not-allowed;box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);}.simple-btn:not(:disabled):active{box-shadow:inset 5px 5px 10px var(--shadow-dark),inset -5px -5px 10px var(--shadow-light);transform:scale(0.98);}.simple-btn.is-loading{color:transparent !important;pointer-events:none;position:relative;}.simple-btn.is-loading::after{content:"";position:absolute;top:50%;left:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border:3px solid var(--text-secondary);border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;}.submit-guide{background:rgba(255,59,48,0.1);color:var(--danger-color);padding:12px;border-radius:16px;font-size:0.9rem;font-weight:700;text-align:center;margin-bottom:15px;display:none;animation:fadeIn 0.3s ease;width:100%;}.submit-guide.visible{display:block;}@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
/* @SECTION: CSS_SKELETON_LOADING - 스켈레톤/보조 로딩 */

/* ===== UX ENHANCEMENT PACK ===== */

/* Title chiseled effect */
#main-title-container .inset-box h2{
  color:#1f4175 !important;
  text-shadow:
    -1px -1px 1px rgba(110,138,176,0.35),
    1px 1px 1px rgba(255,255,255,0.92) !important;
}

/* Logo shimmer */
.school-mark--title{
  position:relative;
  overflow:hidden;
}
.school-mark--title::after{
  content:"";
  position:absolute;
  top:-120%;
  left:-180%;
  width:70%;
  height:300%;
  transform:rotate(24deg);
  background:linear-gradient(
    90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.0) 35%,
    rgba(255,255,255,0.55) 50%,
    rgba(255,255,255,0.0) 65%,
    rgba(255,255,255,0) 100%
  );
  animation:logoShimmer 7s ease-in-out infinite;
  pointer-events:none;
}
@keyframes logoShimmer{
  0%,82%{left:-180%;}
  100%{left:220%;}
}

/* Current digit breathing cursor */
#keypadDisplay .digit-box.current-active{
  position:relative;
}
#keypadDisplay .digit-box.current-active::after{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#2563eb;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px rgba(37,99,235,0.55);
  animation:cursorPulse 1.1s ease-in-out infinite;
}
@keyframes cursorPulse{
  0%,100%{
    opacity:.25;
    transform:translate(-50%,-50%) scale(.8);
  }
  50%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.18);
  }
}

/* Filled digit */
#keypadDisplay .digit-box.filled{
  width:48px !important;
  height:48px !important;
  border-radius:14px !important;
  color:#2563eb !important;
  font-size:1.35rem !important;
  font-weight:700 !important;
  background:linear-gradient(180deg,#fbfdff 0%,#e8eff8 100%) !important;
  border:1px solid rgba(37,99,235,0.22) !important;
  box-shadow:
    5px 5px 11px rgba(110,138,176,0.20),
    -5px -5px 11px rgba(255,255,255,0.95),
    inset 1px 1px 0 rgba(255,255,255,0.74) !important;
  animation:digitDotPop .18s ease-out both;
  transition:transform .2s ease, box-shadow .2s ease;
}

/* Masked digit inset morph */
#keypadDisplay .digit-box.masked{
  width:18px !important;
  height:18px !important;
  border-radius:50% !important;
  font-size:0 !important;
  color:transparent !important;
  background:linear-gradient(180deg,#5d9ff3 0%,#2d66d3 100%) !important;
  border:none !important;
  box-shadow:
    inset 3px 3px 6px rgba(15,32,65,0.36),
    inset -1px -1px 2px rgba(255,255,255,0.22),
    0 1px 0 rgba(255,255,255,0.6) !important;
  animation:
    digitFlipMask .22s cubic-bezier(.4,0,.2,1) forwards,
    pulse-breathing 2s infinite ease-in-out .25s;
}

@keyframes digitFlipMask{
  0%{
    transform:scale(1.08) rotateX(0deg);
    opacity:.72;
  }
  50%{
    transform:scale(.78) rotateX(90deg);
    opacity:.45;
  }
  100%{
    transform:scale(1) rotateX(0deg);
    opacity:1;
  }
}

/* Main user premium indicator */
#main-user-box{
  position:relative;
  border:1px solid transparent !important;
  background-image:
    linear-gradient(#f1f5fb,#dfe9f7),
    linear-gradient(135deg,#7cb8ff,#2563eb) !important;
  background-origin:border-box !important;

.main-user-icon{

@keyframes liveDotPulse{

.dash-mini-fill{

/* =========================================================
  @SECTION: CSS_SMART_RACK_SKEUOMORPHISM_THEME
  라이트 스키오모피즘: 뉴모피즘 보관함 트레이 + 고대비 실물 카드 슬롯
  - 디자인 컨셉만 적용
  - 기존 카드 클릭 로직 / GAS / 타이머 / 로그인 흐름은 유지
========================================================= */
#card-list-container{
  width:100%;
}
#cardGrid{
  position:relative;
  display:grid !important;
  grid-template-columns:repeat(3,1fr) !important;
  gap:18px !important;
  width:100%;
  padding:20px !important;
  border-radius:30px !important;
  background:
    radial-gradient(circle at 18% 10%, rgba(255,255,255,.38) 0%, transparent 28%),
    linear-gradient(180deg,#cbd5e1 0%,#d8e3f0 52%,#c3cfdd 100%) !important;
  border:1px solid rgba(255,255,255,.72) !important;
  box-shadow:
    inset 7px 7px 16px rgba(30,41,59,.22),
    inset -7px -7px 16px rgba(255,255,255,.78),
    0 12px 28px rgba(31,65,117,.08) !important;
  overflow:visible;
}
#cardGrid::before{
  content:"";
  position:absolute;
  top:-11px;
  left:22px;
  z-index:3;
  padding:4px 11px;
  border-radius:999px;
  font-size:.62rem;
  font-weight:950;
  letter-spacing:.08em;
  color:#475569;
  background:linear-gradient(180deg,#f8fbff 0%,#e8eff8 100%);
  border:1px solid rgba(255,255,255,.82);
  box-shadow:4px 4px 10px rgba(51,65,85,.14),-4px -4px 10px rgba(255,255,255,.86);
}
.card-item-wrapper.hybrid-card-slot{
  aspect-ratio:1.45 / 1 !important;
  border-radius:22px !important;
  display:flex !important;
  position:relative !important;
  overflow:visible !important;
  opacity:0;
  transform:translateY(16px) scale(.985);
  transition:
    opacity .32s ease,
    transform .42s cubic-bezier(.34,1.56,.64,1),
    box-shadow .18s ease,
    filter .18s ease !important;
  box-shadow:none !important;
  background:transparent !important;
  filter:none !important;
}
#cardGrid.is-loaded .card-item-wrapper.hybrid-card-slot{
  opacity:1;
  transform:translateY(0) scale(1);
}
.card-item-wrapper.hybrid-card-slot .hybrid-card-btn{
  width:100%;
  height:100%;
  padding:14px 12px 12px !important;
  border-radius:22px !important;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  position:relative;
  overflow:hidden;
  border:none;
  background:transparent;
}
/* [상태 1] 보관함에 실제로 꽂혀 있는 카드: 대여 가능 */
.card-item-wrapper.hybrid-card-slot.card-status-available{
  cursor:pointer !important;
  background:
    linear-gradient(120deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(135deg,#1e293b 0%,#0f172a 58%,#203a43 100%) !important;
  border:1px solid rgba(255,255,255,.18) !important;
  box-shadow:
    2px 10px 20px rgba(15,23,42,.28),
    inset 1px 1px 0 rgba(255,255,255,.22),
    inset -1px -1px 0 rgba(0,0,0,.22) !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-available::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 5px);
  mix-blend-mode:screen;
  pointer-events:none;
  opacity:.65;
}
.card-item-wrapper.hybrid-card-slot.card-status-available::after{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:26px;
  border:2.5px solid rgba(37,99,235,.86);
  filter:drop-shadow(0 0 7px rgba(37,99,235,.42));
  pointer-events:none;
  animation:smartRackBluePulse 2.15s ease-in-out infinite;
}
/* 특수/식대 성격 카드는 초록빛 메탈 카드로 구분 */
.card-item-wrapper.hybrid-card-slot.special-overseas-card.card-status-available{
  background:
    linear-gradient(120deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(135deg,#064e3b 0%,#022c22 68%,#064e3b 100%) !important;
}
/* [상태 2] 카드가 밖으로 나간 자리: 깊게 파인 빈 트레이 */
.card-item-wrapper.hybrid-card-slot.card-status-inuse,
.card-item-wrapper.hybrid-card-slot.card-status-returning,
.card-item-wrapper.hybrid-card-slot.card-status-unknown{
  cursor:not-allowed !important;
  opacity:1 !important;
  filter:none !important;
  background:
    radial-gradient(circle at 45% 34%, rgba(255,255,255,.055) 0%, transparent 42%),
    linear-gradient(180deg,#475569 0%,#334155 50%,#1e293b 100%) !important;
  border:1px solid rgba(255,255,255,.10) !important;
  box-shadow:
    inset 7px 7px 15px rgba(0,0,0,.46),
    inset -4px -4px 10px rgba(255,255,255,.075),
    1px 1px 0 rgba(255,255,255,.18) !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-inuse::before,
.card-item-wrapper.hybrid-card-slot.card-status-returning::before,
.card-item-wrapper.hybrid-card-slot.card-status-unknown::before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:16px;
  border:1.5px dashed rgba(203,213,225,.16);
  pointer-events:none;
}
/* 기존 로직상 반납처리중은 비활성 슬롯으로 유지하되 초록 계열 힌트만 살짝 표시 */
.card-item-wrapper.hybrid-card-slot.card-status-returning{
  box-shadow:
    inset 7px 7px 15px rgba(0,0,0,.42),
    inset -4px -4px 10px rgba(255,255,255,.07),
    0 0 0 1px rgba(16,185,129,.18) !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-available:hover{
  transform:translateY(-2px) scale(1.014) !important;
  filter:brightness(1.035);
  box-shadow:
    3px 14px 24px rgba(15,23,42,.30),
    inset 1px 1px 0 rgba(255,255,255,.26),
    inset -1px -1px 0 rgba(0,0,0,.22) !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-available:active{
  transform:scale(.955) translateY(1px) !important;
  filter:none;
  box-shadow:
    1px 5px 10px rgba(15,23,42,.24),
    inset 5px 5px 10px rgba(0,0,0,.28),
    inset -3px -3px 8px rgba(255,255,255,.10) !important;
}


@keyframes cardSelectPop{
  0%{transform:translateY(0) scale(1);}
  45%{transform:translateY(-6px) scale(1.045);}
  100%{transform:translateY(-3px) scale(1.02);}
}
.card-item-wrapper.hybrid-card-slot.card-status-inuse:hover,
.card-item-wrapper.hybrid-card-slot.card-status-returning:hover,
.card-item-wrapper.hybrid-card-slot.card-status-unknown:hover{
  transform:none !important;
  filter:none !important;
}
.card-item-wrapper.hybrid-card-slot .hybrid-card-topline{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:14px;
  position:relative;
  z-index:3;
}
.hybrid-card-chip{
  width:24px;
  height:16px;
  border-radius:4px;
  background:linear-gradient(135deg,#fde68a 0%,#f59e0b 52%,#92400e 100%) !important;
  box-shadow:
    inset 1px 1px 2px rgba(255,255,255,.55),
    inset -1px -1px 1px rgba(0,0,0,.22),
    0 2px 5px rgba(0,0,0,.22);
  opacity:.96;
}
.hybrid-card-state-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#60a5fa;
  box-shadow:0 0 11px rgba(96,165,250,.82);
}
.card-status-inuse .hybrid-card-chip,
.card-status-returning .hybrid-card-chip,
.card-status-unknown .hybrid-card-chip{
  opacity:0 !important;
}
.card-status-inuse .hybrid-card-state-dot,
.card-status-unknown .hybrid-card-state-dot{
  background:rgba(148,163,184,.22);
  box-shadow:none;
}
.card-status-returning .hybrid-card-state-dot{
  background:#10b981;
  box-shadow:0 0 10px rgba(16,185,129,.42);
}


.hybrid-card-texts{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
  position:relative;
  z-index:3;
}
.card-item-wrapper.hybrid-card-slot .card-name{
  margin:0 !important;
  font-size:1.08rem !important;
  font-weight:950 !important;
  letter-spacing:-.04em;
  line-height:1.05;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-status-available .card-name{
  color:#ffffff !important;
  text-shadow:0 2px 6px rgba(0,0,0,.32);
}
.card-status-inuse .card-name,
.card-status-returning .card-name,
.card-status-unknown .card-name{
  color:rgba(226,232,240,.34) !important;
  text-shadow:none !important;
}


.hybrid-status-badge.status-badge{
  top:10px !important;
  right:10px !important;
  z-index:4;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px !important;
  border-radius:999px !important;
  font-size:.68rem !important;
  font-weight:950 !important;
  letter-spacing:-.02em;
  backdrop-filter:none !important;
}
.card-status-available .hybrid-status-badge{
  color:#1d4ed8 !important;
  background:rgba(255,255,255,.94) !important;
  border:1px solid rgba(255,255,255,.76) !important;
  box-shadow:0 6px 14px rgba(15,23,42,.18) !important;
}
.card-status-inuse .hybrid-status-badge{
  color:rgba(226,232,240,.58) !important;
  background:rgba(15,23,42,.32) !important;

}
.card-status-returning .hybrid-status-badge{
  color:#34d399 !important;

}
.card-status-unknown .hybrid-status-badge{
  color:rgba(226,232,240,.50) !important;
  background:rgba(15,23,42,.30) !important;
  border:1px solid rgba(226,232,240,.08) !important;
  box-shadow:none !important;
}
@keyframes smartRackBluePulse{
  0%,100%{opacity:.34;transform:scale(.985);}
  50%{opacity:1;transform:scale(1.016);}
}
@media (max-width:1023px){
  #cardGrid{grid-template-columns:repeat(2,1fr) !important;gap:14px !important;padding:14px !important;}

  - 대여 가능: 카드명만 중앙 표시, 상태 문구 없음

/* 사용 중: 카드가 빠져나간 밝은 빈 슬롯으로 표현 */

.card-item-wrapper.hybrid-card-slot.card-status-inuse .card-name,

:root{

  --ws-final-card-red-start:#9c3442;
  --ws-final-card-red-end:#cf5d68;
  --ws-final-card-blue-shadow:rgba(31,79,154,0.26);
  --ws-final-card-red-shadow:rgba(156,52,66,0.26);
  --ws-final-card-ring-blue:rgba(145,188,245,0.52);

}

/* [1단계 잠금화면] 최종 운영 카드 색상 */
#glass-card{
  background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.09) 22%, transparent 45%),
    linear-gradient(135deg, var(--ws-final-lock-blue-start) 0%, var(--ws-final-lock-blue-end) 100%) !important;
  border:1px solid rgba(255,255,255,0.24) !important;
  box-shadow:
    18px 18px 40px rgba(23,58,122,0.30),
    -6px -6px 24px rgba(255,255,255,0.13),
    inset 1px 1px 0 rgba(255,255,255,0.28),
    inset -1px -1px 0 rgba(0,0,0,0.16) !important;
}
#glass-card .card-number,
#glass-card .card-holder{
  color:rgba(255,255,255,0.96) !important;
  text-shadow:0 2px 6px rgba(15,23,42,0.32) !important;
}
#glass-card .card-nfc{
  color:rgba(255,255,255,0.94) !important;
  filter:drop-shadow(0 2px 6px rgba(15,23,42,0.24)) !important;
}

/* [4단계 카드신청] 일반 카드 / 해외결제카드 최종 색상 */
.card-item-wrapper.hybrid-card-slot.card-status-available{
  background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,0.21) 0%, rgba(255,255,255,0.08) 20%, transparent 42%),
    linear-gradient(135deg, var(--ws-final-card-blue-start) 0%, var(--ws-final-card-blue-end) 100%) !important;
  border:1px solid rgba(255,255,255,0.22) !important;
  box-shadow:
    0 10px 21px var(--ws-final-card-blue-shadow),
    inset 1px 1px 0 rgba(255,255,255,0.25),
    inset -1px -1px 0 rgba(0,0,0,0.15) !important;
}
.card-item-wrapper.hybrid-card-slot.special-overseas-card.card-status-available{
  background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.08) 20%, transparent 42%),
    linear-gradient(135deg, var(--ws-final-card-red-start) 0%, var(--ws-final-card-red-end) 100%) !important;
  border:1px solid rgba(255,255,255,0.23) !important;
  box-shadow:
    0 10px 21px var(--ws-final-card-red-shadow),
    inset 1px 1px 0 rgba(255,255,255,0.25),
    inset -1px -1px 0 rgba(0,0,0,0.15) !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-available::after{
  border-color:var(--ws-final-card-ring-blue) !important;
  filter:drop-shadow(0 0 6px rgba(59,127,216,0.31)) !important;
  opacity:0.82 !important;
}
.card-item-wrapper.hybrid-card-slot.special-overseas-card.card-status-available::after{
  border-color:var(--ws-final-card-ring-red) !important;
  filter:drop-shadow(0 0 6px rgba(207,93,104,0.30)) !important;
  opacity:0.82 !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-available .card-name{
  color:#fff !important;
  text-shadow:0 2px 5px rgba(15,23,42,0.27) !important;
  font-weight:850 !important;
}

/* PC에서만 hover를 살리고, 터치 기기 잔상은 방지 */
@media (hover:hover) and (pointer:fine){
  .card-item-wrapper.hybrid-card-slot.card-status-available:hover{
    filter:brightness(1.045) !important;
    box-shadow:
      0 14px 27px rgba(31,79,154,0.32),

  }
  .card-item-wrapper.hybrid-card-slot.special-overseas-card.card-status-available:hover{
    filter:brightness(1.045) !important;
    box-shadow:
      0 14px 27px rgba(156,52,66,0.32),
      inset 1px 1px 0 rgba(255,255,255,0.28) !important;
  }
}
.card-item-wrapper.hybrid-card-slot.card-status-available:active{
  filter:none !important;
  transform:scale(0.965) !important;
  box-shadow:
    0 5px 12px rgba(31,79,154,0.24),
    inset 5px 5px 10px rgba(0,0,0,0.18),
    inset -3px -3px 8px rgba(255,255,255,0.12) !important;
}
.card-item-wrapper.hybrid-card-slot.special-overseas-card.card-status-available:active{

}

/* =========================================================
  @SECTION: CSS_TRANSITION_TUNING_FINAL
  화면 전환감 통일용 최종 미세 조정
  - 기능 로직 / 반납 / OCR / GAS 연결부 변경 없음
  - 카드 선택, 목적 선택 모달, 화면 fade 계열만 대상으로 함
========================================================= */
:root{
  --ws-transition-fast: .22s;
  --ws-transition-mid: .34s;
  --ws-transition-slow: .42s;
  --ws-ease-soft: cubic-bezier(.22,1,.36,1);
  --ws-ease-pop: cubic-bezier(.34,1.56,.64,1);
}
.content-wrapper{
  transition:
    opacity var(--ws-transition-slow) var(--ws-ease-soft),
    transform var(--ws-transition-slow) var(--ws-ease-soft) !important;
}
.screen{
  transition:
    opacity var(--ws-transition-mid) var(--ws-ease-soft),
    transform var(--ws-transition-mid) var(--ws-ease-soft) !important;
}
.screen.is-hiding{
  opacity:0 !important;
  transform:translateY(8px) scale(.992) !important;
}
#cardGrid.is-loaded .card-item-wrapper.hybrid-card-slot{
  transition-timing-function:var(--ws-ease-soft), var(--ws-ease-pop), ease, ease !important;
}
.card-item-wrapper.hybrid-card-slot{
  transition:
    opacity var(--ws-transition-mid) var(--ws-ease-soft),
    transform var(--ws-transition-slow) var(--ws-ease-pop),
    box-shadow var(--ws-transition-fast) ease,
    filter var(--ws-transition-fast) ease !important;
}
.morph-overlay{
  transition:
    opacity var(--ws-transition-mid) var(--ws-ease-soft),
    visibility var(--ws-transition-mid) var(--ws-ease-soft) !important;
}
.purpose-sheet{
  transition:
    transform var(--ws-transition-slow) var(--ws-ease-pop),
    opacity var(--ws-transition-mid) var(--ws-ease-soft) !important;
  opacity:0;
}
.morph-overlay.active .purpose-sheet{
  opacity:1 !important;
}
.morph-header,
.morph-subheader{
  transition:
    opacity var(--ws-transition-mid) var(--ws-ease-soft),
    transform var(--ws-transition-mid) var(--ws-ease-soft) !important;
}
.morph-overlay.active .purpose-btn:nth-child(1){animation:purposeListIn .34s .05s var(--ws-ease-soft) forwards !important;}
.morph-overlay.active .purpose-btn:nth-child(2){animation:purposeListIn .34s .10s var(--ws-ease-soft) forwards !important;}
.morph-overlay.active .purpose-btn:nth-child(3){animation:purposeListIn .34s .15s var(--ws-ease-soft) forwards !important;}
.purpose-btn{
  transition:
    background var(--ws-transition-fast) ease,
    box-shadow var(--ws-transition-fast) ease,
    border-color var(--ws-transition-fast) ease,
    color var(--ws-transition-fast) ease,
    transform var(--ws-transition-fast) ease !important;
}

<script>

/* =========================================================
  @SECTION: JS_CONFIG
  실행 환경, API endpoint, 이미지 최적화 설정
========================================================= */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const WORKER_API_URL = 'https://wscard.kang7762ek.workers.dev';
const API_SHARED_SECRET = ''; // 선택 보안값: GAS Script Properties의 API_SHARED_SECRET을 설정한 경우 Worker가 이 값을 함께 전달해야 합니다.
const isMobile = window.matchMedia('(max-width: 767px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const RECEIPT_IMAGE_OPTIMIZE_CONFIG = {
    maxSide: 1280,
    targetBytes: 450 * 1024,
    minSide: 900,
    qualities: [0.68, 0.60, 0.52, 0.46]
};

const RENT_SYNC_STORAGE_KEY = 'woosung_card_pending_rent_requests_v1';
const RENT_RETRY_DELAYS_MS = [0, 1200, 3000, 8000, 20000];
/* =========================================================
  @SECTION: JS_API_BRIDGE
  GAS 환경이면 google.script.run, 외부 환경이면 Worker API 호출
========================================================= */
const Api = {
    /* @SUBSECTION: JS_API_TIMEOUT_POLICY
       일반 서버 접수 API는 빠르게 실패를 알려주고, OCR/이미지 계열은 더 긴 시간을 허용합니다. */
    timeoutMs(func){
        const f = String(func || '');
        if (f === 'processReceiptImage') return 90000;
        if (f === 'saveReceiptImageOnly') return 60000;
        if (f === 'saveCartToMasterFile') return 45000;
        if (f === 'queueReturnRequest') return 30000;
        if (f === 'rentNow') return 25000;
        if (f === 'getReceiptImagePreview') return 30000;
        return 30000;
    },
    timeoutError(func, ms){
        return new Error(`${func} 요청이 ${Math.round(ms/1000)}초 안에 완료되지 않았습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.`);
    },
    withTimeout(promise, func){
        const ms = Api.timeoutMs(func);
        let timer = null;
        const timeout = new Promise((_, reject) => {
            timer = setTimeout(() => reject(Api.timeoutError(func, ms)), ms);
        });
        return Promise.race([promise, timeout]).finally(() => { if (timer) clearTimeout(timer); });
    },
    call: async (func, ...args) => {
        if (IS_GAS) {
            return Api.withTimeout(new Promise((resolve, reject) => {
                try {
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[func](...args);
                } catch (e) {
                    reject(e);
                }
            }), func);
        }

        const timeoutMs = Api.timeoutMs(func);
        const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
        let response;
        try {
            response = await fetch(WORKER_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ func, args, apiSecret: API_SHARED_SECRET }),
                signal: controller ? controller.signal : undefined
            });
        } catch (e) {
            if (e && e.name === 'AbortError') throw Api.timeoutError(func, timeoutMs);
            throw e;
        } finally {
            if (timer) clearTimeout(timer);
        }

        const rawText = await response.text();
        let data;
        try {
            data = rawText ? JSON.parse(rawText) : {};
        } catch (e) {
            const snippet = String(rawText || '').replace(/\s+/g, ' ').slice(0, 160);
            throw new Error(`응답을 해석하지 못했습니다. ${snippet ? '응답 일부: ' + snippet : ''}`);
        }
        if (!response.ok || !data.ok) {
            throw new Error(data && data.error ? data.error : `HTTP_${response.status}`);
        }
        return data.result;
    }
};
/* =========================================================
  @SECTION: JS_VISUAL_HELPERS
  작은 시각 효과/공통 보조 함수
========================================================= */
function triggerKeypadVisualPress(key){
    try{
        let selector = null;
        if (/^[0-9]$/.test(String(key))) selector = `.keypad-btn[data-key="${key}"]`;
        else if (key === 'Backspace') selector = '#keypad-back-btn';
        else if (key === 'Enter') selector = '#keypad-submit-btn';
        else if (key === '+') selector = '#keypad-add-btn';
        if (!selector) return;
        const btn = document.querySelector(selector);
        if (!btn) return;
        // forced reflow(offsetWidth)를 제거해서 빠른 연속 입력 시 끊김을 줄입니다.
        btn.classList.add('pressed');
        clearTimeout(btn._pressedTimer);
        btn._pressedTimer = setTimeout(() => {
            btn.classList.remove('pressed');
        }, 75);
    } catch(e) {}
}


/* =========================================================
  @SECTION: JS_APP_ROOT_IIFE
  CardApp 내부 스코프. state/elements/modules를 한 파일 안에서 보호
========================================================= */
/* Main app shell. Subsections below are intentionally grouped by responsibility. */
const CardApp = (function() {
    const MEAL_CAP_PER_PERSON = 9000;
    /* =========================================================
    @SECTION: JS_MODULE_2_STATE_UTILS
    앱 공통 상태, 요소 캐시, 포맷 helper, 낙관적 업데이트 helper
    ========================================================= */
    /* =========================================================
    @SUBSECTION: JS_KIOSK_IDLE_POLICY
    행정실 키오스크 운영 규칙.
    - 화면 깨움/방치 복귀: 세션 청소 후 잠금화면만 표시
    - 실제 카드/사용자 데이터 갱신: 잠금화면 카드를 누른 뒤 로딩 단계에서만 실행
    - 입력 없음 자동 잠금: 기기 구분 없이 5분으로 통일
    - 태블릿 탭/앱 복귀 잠금: visibilitychange + isKioskTabletDevice() 조건에서만 실행
    ========================================================= */
    const getInactivityLimitMs = () => 5 * 60 * 1000;
    const CARD_APPEAR_DELAY_MS = 50;
    /* =========================================================
    @SECTION: JS_STATE
    앱 전체 상태 저장소. 새 상태는 가장 가까운 @SUBSECTION에 추가합니다.
    3차 기준: state는 데이터와 플래그만 보관하고 DOM 조작은 UIManager/CardLogic에서 처리합니다.
    ========================================================= */
    let state = {
        /* =========================================================
        @SUBSECTION: JS_STATE_SYNC
        서버 데이터 동기화 / 잠금 해제 후 빠른 재조회 상태
        ========================================================= */
        syncReqId: 0,
        syncPromise: null,
        syncInFlight: false,
        lastSyncTs: null,
        pendingPostReturnSync: false,
        forceSyncOnNextUnlock: false,
        lastOperationalError: null,
        lastReturnSubmitError: null,

        /* =========================================================
        @SUBSECTION: JS_STATE_DATA_CACHE
        서버에서 받은 카드/사용자 원본 데이터 캐시
        ========================================================= */
        allCardData: null,
        allUsersData: null,

        /* =========================================================
        @SUBSECTION: JS_STATE_LOGIN
        로그인 키패드 / 추가 사용자 / 입력 상태
        ========================================================= */
        keypadValues: [null, null, null, null],
        inputTimers: [null, null, null, null],
        activeDigitIndex: 0,
        enteredUsers: [],
        loginTyping: false,
        _lastAddedExt: null,
        _showAddedFeedback: false,
        _addedFeedbackTimer: null,

        /* =========================================================
        @SUBSECTION: JS_STATE_RECEIPT
        반납 카드 / 영수증 장바구니 / OCR 검토 흐름
        ========================================================= */
        currentReturnCard: null,
        receiptCart: [],
        pendingEditIndex: -1,
        reviewQueue: [],
        _uploadPickerTimer: null,

        /* =========================================================
        @SUBSECTION: JS_STATE_RECEIPT_AUTOSAVE
        영수증 장바구니 자동 저장 debounce / 렌더 예약 상태
        ========================================================= */
        cartSaveTimer: null,
        cartSaveToken: 0,
        cartSavePending: [],
        _renderReceiptScheduled: false,
        receiptBatchProgress: null,

        /* =========================================================
        @SUBSECTION: JS_STATE_UI_SESSION
        현재 화면 / 잠금화면 / 전환 타이머 / 비활성 타이머
        ========================================================= */
        currentScreen: 'lock',
        isAppActive: false,
        __keypadInited: false,
        cardTiltActive: true,
        countdownInterval: null,
        inactivityTimer: null,
        confirmLeaveTimeout1: null,

        /* =========================================================
        @SUBSECTION: JS_STATE_ADMIN
        관리자 모드 상태
        ========================================================= */
        isAdminMode: false,
        adminSince: null,
        adminPinCache: null
    };

    /* =========================================================
    @SECTION: JS_ELEMENT_CACHE
    자주 쓰는 DOM 요소 캐시. init 단계에서 채워집니다.
    ========================================================= */
    let elements = {};
    /* =========================================================
    @SUBSECTION: JS_STATE_ADMIN_PERSISTENCE
    행정실 태블릿 운영용 관리자 모드 영구 유지.
    PIN으로 직접 OFF 하기 전까지 자동 잠금/처음화면/재로그인/새로고침 후에도 관리자 모드를 복원합니다.
    ========================================================= */
    const ADMIN_MODE_STORAGE_KEY = 'woosung_admin_mode_persistent_v1';
    function readPersistedAdminMode(){
        try {
            const raw = window.localStorage && localStorage.getItem(ADMIN_MODE_STORAGE_KEY);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (!data || !data.enabled || !data.pin) return null;
            return {
                enabled: true,
                pin: String(data.pin || ''),
                since: data.since || new Date().toISOString()
            };
        } catch(e) { return null; }
    }
    function persistAdminMode(){
        try {
            if (!window.localStorage || !state.isAdminMode || !state.adminPinCache) return;
            localStorage.setItem(ADMIN_MODE_STORAGE_KEY, JSON.stringify({
                enabled: true,
                pin: String(state.adminPinCache),
                since: state.adminSince || new Date().toISOString()
            }));
        } catch(e) {}
    }

    ========================================================= */
    async function safeUpdate(updateFn, serverCallFn, rollbackFn, cardId) {
        let originalCardData = null;
        if (cardId) {
            const target = state.allCardData.find(c => c.id === cardId);
            originalCardData = JSON.parse(JSON.stringify(target));
        }
        try {
            updateFn(state, cardId);
            await serverCallFn();
        } catch (e) {
            if (cardId && originalCardData) Object.assign(state.allCardData.find(c => c.id === cardId), originalCardData);
            if (rollbackFn) rollbackFn(e);
            throw e;
        }
    }

    /* =========================================================
    @SECTION: JS_UTILS
    표시용 포맷, escape, 금액 제한, 아이콘 추론 등 순수 helper
    3차 기준: Utils는 가능한 한 순수 함수만 두고, Api 호출/DOM 변경/state 변경을 넣지 않습니다.
    ========================================================= */
    /* Pure formatting / helper logic should stay here when possible. */
    const Utils = {
        nfKR: new Intl.NumberFormat('ko-KR'),
        formatDateKR(d=new Date()){
            try{
                const parts=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
                const get=k=>parts.find(p=>p.type===k)?.value;
                return `${get('year')}-${get('month')}-${get('day')}`;
            }catch(e){
                return new Date().toISOString().split('T')[0];
            }
        },
        esc(s=''){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); },
        getErrorMessage(err, fallback='알 수 없는 오류가 발생했습니다.'){
            const raw = err && err.message ? err.message : err;
            const msg = String(raw || fallback).trim();
            if (!msg) return fallback;
            return msg.length > 180 ? `${msg.slice(0, 180)}...` : msg;
        },
        buildRecoveryList(items=[]){
            return `<ol class="ops-recovery-list">${items.map(x => `<li>${Utils.esc(x)}</li>`).join('')}</ol>`;
        },
        createDetailRow(label, content){
            return `<div class="detail-row"><span class="detail-row-label">${this.esc(label)}</span><span class="detail-row-content">${this.esc(content)}</span></div>`;
        },
        celebrate(){ try{ confetti({particleCount:120,spread:80,origin:{y:.6}}); }catch(_){} },
        haptic(pattern=12){ try{ if(navigator && typeof navigator.vibrate === 'function') navigator.vibrate(pattern); }catch(_){} },
        clampMealAmount(amt, cnt){
            const entered=parseInt((amt||'').replace(/[^\d]/g,''),10)||0;
            const cap=(Math.max(1,cnt))*MEAL_CAP_PER_PERSON;
            const clamped=Math.min(entered,cap);
            // 특근매식 금액은 화면 알림 없이 조용히 보정합니다.
            return clamped;
        },
        isMealExpenseItem(item={}){
            return !!(item && (item.isMealExpense === true || String(item.purpose || '').includes('특근매식비') || String(item.usageDetails || '').includes('특근매식비')));
        },
        normalizeMealHeadcount(value, fallback=1){
            const n = parseInt(String(value || '').replace(/[^\d]/g, ''), 10);
            return Math.max(1, Number.isFinite(n) ? n : fallback);
        },
        getMealAdjustedAmount(rawAmount, headcount){
            const original = parseInt(String(rawAmount || '').replace(/[^\d]/g, ''), 10) || 0;
            const cnt = Utils.normalizeMealHeadcount(headcount, 1);
            return {
                originalAmount: original,
                mealHeadcount: cnt,
                mealLimitAmount: cnt * MEAL_CAP_PER_PERSON,
                amount: Utils.clampMealAmount(String(original), cnt)
            };
        },
        getSmartIcon(place, details){
            const t=(place+' '+details).toLowerCase();
            if(t.match(/식당|밥|국밥|설렁탕|해장국|곰탕|찌개|냉면|버거|피자|치킨|맥도날드|롯데리아|김밥|한식|중식|일식|양식|분식/))return 'fa-utensils';
            if(t.match(/카페|커피|스타벅스|이디야|투썸|음료|차|베이커리|빵/))return 'fa-mug-hot';
            if(t.match(/택시|주유|주차|버스|기차|교통|하이패스/))return 'fa-car-side';
            if(t.match(/마트|편의점|이마트|홈플러스|cu|gs25|세븐일레븐|쇼핑|구매/))return 'fa-cart-shopping';
            if(t.match(/문구|사무|복사|인쇄|용지/))return 'fa-stapler';
            return 'fa-receipt';
        },
        getReceiptIconToneClass(iconName='fa-receipt'){
            switch(String(iconName || '')){
                case 'fa-utensils':
                    return 'icon-tone-meal';
                case 'fa-mug-hot':
                    return 'icon-tone-cafe';
                case 'fa-car-side':
                    return 'icon-tone-mobility';
                case 'fa-cart-shopping':
                    return 'icon-tone-shopping';
                case 'fa-stapler':
                    return 'icon-tone-office';
                default:
                    return 'icon-tone-general';
            }
        },
        createClientRequestId(prefix='req'){
            const rand = Math.random().toString(36).slice(2, 10);
            return `${prefix}_${Date.now()}_${rand}`;
        },
        sanitizeReceiptCart(cart){
            // 서버/Drive에 저장된 장바구니를 다시 불러올 때 UI 임시 상태가 살아나지 않도록 정리합니다.
            // 저장 대상은 실제 업무 데이터와 id: 영수증 파일 참조만입니다.
            return (Array.isArray(cart) ? cart : [])
                .filter(Boolean)
                .map(item => {
                    const clean = { ...item };
                    delete clean.processing;
                    delete clean.previewImage;
                    delete clean.receiptImagePreview;
                    delete clean.analysisMeta;
                    delete clean.imageSaveError;
                    delete clean.needsManualReview;
                    delete clean._uiTransient;
                    delete clean.isProcessing;
                    delete clean.isSaving;
                    delete clean.status;
                    const img = String(clean.receiptImage || '');
                    if (img && !img.startsWith('id:')) delete clean.receiptImage;
                    // 운영 결정: 시스템에는 금액 기준 대표 영수증만 저장합니다.
                    // 품목내역서/간이영수증/추가 증빙은 종이로 별도 제출하므로 부속 첨부는 저장하지 않습니다.
                    clean.attachments = [];
                    return clean;
                });
        }
    };

            const step1El = document.getElementById('loader-step-1');
            const step2El = document.getElementById('loader-step-2');

            const wait = (ms) => new Promise(r => setTimeout(r, ms));

            let currentStep = 1;
            let currentPercent = 0;

            const stepVisuals = {
                1: {
                    bar: 'linear-gradient(90deg,#3b82f6 0%,#2563eb 100%)',

                    percent: 'linear-gradient(135deg,#10b981 0%,#2563eb 100%)'
                }
            };

            const setStep = (step) => {
                currentStep = step;
                if (step1El && step2El) {
                    step1El.classList.remove('active', 'done');
                    step2El.classList.remove('active', 'done');

                    if (step === 1) {
                        step1El.classList.add('active');

                        step1El.classList.add('done');
                        step2El.classList.add('active');
                    } else {
                        step1El.classList.add('done');
                        step2El.classList.add('done');
                    }
                }

                const visual = stepVisuals[step] || stepVisuals[1];
                if (elements.loaderBar) elements.loaderBar.style.background = visual.bar;
                if (percentEl) {
                    percentEl.style.background = visual.percent;
                    percentEl.style.webkitBackgroundClip = 'text';
                    percentEl.style.webkitTextFillColor = 'transparent';
                    percentEl.style.backgroundClip = 'text';
                }
            };

            const updateUI = (percent, text) => {
                const safePercent = Math.max(0, Math.min(100, percent));
                if (elements.loaderBar) elements.loaderBar.style.width = `${safePercent}%`;
                if (percentEl) percentEl.textContent = `${Math.round(safePercent)}%`;

                if (currentStep === 1) {
                    if (titleMain) titleMain.textContent = '시스템 연결 중...';
                    if (titleSub) titleSub.textContent = '안전하게 접속을 준비하고 있습니다';
                } else if (currentStep === 2) {
                    if (titleMain) titleMain.textContent = '보안 확인 중...';
                    if (titleSub) titleSub.textContent = '보안 토큰과 사용자 정보를 검증하고 있습니다';
                } else {
                    if (titleMain) titleMain.textContent = '시스템 접속 완료';
                    if (titleSub) titleSub.textContent = '로그인 화면으로 이동합니다';
                }

            };

            if (elements.loaderBar) {
                elements.loaderBar.style.transition = 'width 140ms linear, background 240ms ease';
            }
            if (percentEl) {
                percentEl.style.transition = 'background 240ms ease';
            }

            setStep(1);
            updateUI(0, step1Text);

            while (!(chk && chk())) {
                if (currentPercent < 48) {
                    setStep(1);
                    currentPercent = Math.min(48, currentPercent + 4.0);
                    updateUI(currentPercent, step1Text);
                    await wait(110);
                    continue;
                }

                setStep(2);
                if (currentPercent < 90) {
                    currentPercent = Math.min(90, currentPercent + 2.8);
                    updateUI(currentPercent, step2Text);
                    await wait(110);
                } else {
                    currentPercent = Math.min(97, currentPercent + 0.55);
                    updateUI(currentPercent, step2Text);
                    await wait(170);
                }
            }

            setStep(3);
            if (elements.loaderBar) {
                elements.loaderBar.style.transition = 'width 220ms ease-out, background 240ms ease';
            }
            updateUI(100, doneText);
            await wait(700);
        },
        /* =========================================================
        @SUBSECTION: JS_UI_MANAGER_CONFIRMATION_SCREEN
        완료 화면 표시, 카운트다운, 잠금 화면 자동 복귀
        ========================================================= */
        showConfirmationScreen: (title, detailsHtml) => {
            document.body.classList.add('confirmation-result-mode');
            Utils.haptic([30, 50, 30]);
            document.getElementById('confirmation-title').textContent = title;
            document.getElementById('confirmation-details').innerHTML = detailsHtml;
            UIManager.showScreen('confirmation');
            clearTransitionTimers();

            const totalSec = 5;
            let sec = totalSec;
            const cd = document.getElementById('confirmation-countdown');
            const ringDash = 201;

            const showAppToast = (message) => {
                try {
                    document.querySelectorAll('.app-toast').forEach(el => el.remove());
                    const toast = document.createElement('div');
                    toast.className = 'app-toast';
                    toast.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${Utils.esc(message)}</span>`;
                    document.body.appendChild(toast);
                    requestAnimationFrame(() => toast.classList.add('show'));
                    setTimeout(() => {
                        toast.classList.remove('show');
                        setTimeout(() => toast.remove(), 280);
                    }, 1800);
                } catch (_) {}
            };

            const returnNow = () => {
                clearTransitionTimers();
                document.body.classList.remove('confirmation-result-mode');
                if (cd) {
                    cd.innerHTML = '<div class="confirm-timer-caption">첫 화면으로 복귀 중...</div>';
                }
                showAppToast('첫 화면으로 복귀합니다');
                document.getElementById('screen-confirmation').classList.add('is-hiding');
                state.confirmLeaveTimeout2 = setTimeout(() => { state.forceSyncOnNextUnlock = true; UIManager.showLockScreen(); }, 250);
            };

            const renderCountdown = () => {
                const ratio = Math.max(0, Math.min(1, (totalSec - sec) / totalSec));
                const offset = Math.round(ringDash * ratio);
                cd.innerHTML = `
                    <div class="confirm-circular-timer" aria-label="${sec}초 뒤 복귀">
                        <svg viewBox="0 0 74 74" aria-hidden="true">
                            <circle class="confirm-timer-bg" cx="37" cy="37" r="32"></circle>
                            <circle class="confirm-timer-ring" cx="37" cy="37" r="32" style="stroke-dashoffset:${offset}"></circle>
                        </svg>
                        <div class="confirm-timer-text">${sec}</div>
                    </div>
                    <div class="confirm-timer-caption">${sec}초 뒤 첫 화면으로 복귀</div>
                `;
            };

            renderCountdown();
            state.countdownInterval = setInterval(() => {
                sec--;
                if (sec > 0) renderCountdown();
                else returnNow();
            }, 1000);
        }
    };
    /* ===== KEYPAD LOGIC ===== */
    /* Login keypad input, display masking, and security scan flow. */
    
    const KeypadLogic = {
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_STATE_FLAGS
        로그인 화면 입력 활성 여부/타이핑 상태 플래그
        ========================================================= */
        isUserActive: () => {
            if (state.currentScreen !== 'login') return false;
            return !!state.loginTyping;
        },
        markTyping: () => { if (state.currentScreen === 'login') state.loginTyping = true; },
        clearTyping: () => { state.loginTyping = false; },
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_INIT_DASHBOARD
        키패드 버튼 생성과 대시보드 숫자 갱신
        ========================================================= */
        initializeKeypad: () => {
            if (state.__keypadInited) return;
            state.__keypadInited = true;
            elements.keypadContainer.innerHTML = '';
            [{v:'1'},{v:'2'},{v:'3'},{v:'4'},{v:'5'},{v:'6'},{v:'7'},{v:'8'},{v:'9'},{v:'add',c:`<i class="fa-solid fa-user-plus"></i>`},{v:'0'},{v:'bs',c:`<i class="fa-solid fa-delete-left"></i>`}]
            .forEach(({v,c}) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'keypad-btn';
                if (v === 'add') {
                    btn.dataset.key = '+';
                    btn.id = 'keypad-add-btn';
                    btn.addEventListener('click', KeypadLogic.handleAddUser);
                } else if (v === 'bs') {
                    btn.dataset.key = 'Backspace';
                    btn.id = 'keypad-back-btn';
                    btn.addEventListener('click', KeypadLogic.processBackspace);
                } else {
                    btn.dataset.key = v;
                    btn.addEventListener('click', () => KeypadLogic.processKeyInput(v));
                }
                btn.innerHTML = `<span class="btn-icon">${c||v}</span>`;
                elements.keypadContainer.appendChild(btn);
            });
            elements.keypadSubmitBtn.addEventListener('click', () => { if (!elements.keypadSubmitBtn.disabled) KeypadLogic.processLogin(); });
            KeypadLogic.updateLoginPreviewAndActions();
        },
        updateDashboard: () => {
            if (!state.allCardData) return;
            
            const normalizeCardStatus = (value) => {
                const s = String(value || '').trim().replace(/\s+/g, '');
                if (s === '사용가능' || s === '대여가능' || s === '가능') return '사용가능';
                if (s === '신청중') return '신청중';
                if (s === '사용중' || s === '대여중') return '사용중';
                if (s === '반납처리중') return '반납처리중';
                if (s === '반납오류') return '반납오류';
                return String(value || '').trim();
            };
            const busyStatuses = ['사용중', '신청중', '반납처리중'];
            const available = state.allCardData.filter(c => normalizeCardStatus(c.status) === '사용가능').length;
            const inUse = state.allCardData.filter(c => busyStatuses.includes(normalizeCardStatus(c.status))).length;
            const elAvail = document.getElementById('dash-available');
            const elInuse = document.getElementById('dash-inuse');
            if(elAvail) elAvail.textContent = available;
            if(elInuse) elInuse.textContent = inUse;
        },
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_DIGIT_INPUT
        숫자 표시, 마스킹, 입력/삭제 처리
        ========================================================= */
        updateLoginPreviewAndActions: () => {
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            const hasFullPin = ext.length === 4;
            const hasUsers = Array.isArray(state.enteredUsers) && state.enteredUsers.length > 0;
            const addBtn = document.getElementById('keypad-add-btn');
            const submitBtn = document.getElementById('keypad-submit-btn');
            const preview = document.getElementById('login-user-preview');
            const instruction = document.getElementById('login-instruction');
            const badgeText = document.getElementById('dash-badge-text');
            const badgeIcon = document.getElementById('dash-badge-icon');
            const centerScreen = document.getElementById('dash-center-screen');

            if (addBtn) addBtn.disabled = !hasFullPin;
            if (submitBtn) submitBtn.disabled = !(hasFullPin || hasUsers);

            if (preview) {
                preview.classList.add('hidden');
                preview.textContent = '';
                preview.classList.remove('invalid');
            }

            if (centerScreen) centerScreen.classList.remove('success', 'invalid');
            if (!instruction) return;

            instruction.classList.remove('login-ready', 'login-invalid', 'hidden');

            // 동행자 추가 직후에는 방금 입력한 내선번호만 잠깐 보여주고,
            // 이후에는 중앙 상태창을 다시 현재 입력 대기 상태로 되돌립니다.
            if (state._showAddedFeedback && state._lastAddedExt) {
                instruction.classList.add('login-ready');
                instruction.innerHTML = `<span class="login-added-ext">[${Utils.esc(state._lastAddedExt)}]</span> 추가완료`;
                if (centerScreen) centerScreen.classList.add('success');
                if (badgeText) badgeText.textContent = '추가 성공';
                if (badgeIcon) badgeIcon.className = 'fa-solid fa-user-plus';
                return;
            }

            if (hasFullPin && Array.isArray(state.allUsersData)) {
                const user = state.allUsersData.find(u => String(u.extension) === ext);
                if (user) {
                    instruction.classList.add('login-ready');
                    instruction.innerHTML = '<span class="login-ready-keyword">로그인</span> 준비완료';
                    if (centerScreen) centerScreen.classList.add('success');
                    if (badgeText) badgeText.textContent = '확인 완료';
                    if (badgeIcon) badgeIcon.className = 'fa-solid fa-circle-check';
                } else {
                    instruction.classList.add('login-invalid');
                    instruction.innerHTML = '번호 확인 필요';
                    if (centerScreen) centerScreen.classList.add('invalid');
                    if (badgeText) badgeText.textContent = '조회 실패';
                    if (badgeIcon) badgeIcon.className = 'fa-solid fa-circle-exclamation';
                }
            } else if (ext.length > 0) {
                instruction.textContent = `${ext.length}자리 입력됨`;
                if (badgeText) badgeText.textContent = '입력 중';
                if (badgeIcon) badgeIcon.className = 'fa-solid fa-keyboard';
            } else {
                instruction.textContent = '내선번호 입력';
                if (badgeText) badgeText.textContent = '대기 중';
                if (badgeIcon) badgeIcon.className = 'fa-solid fa-keyboard';
            }
        },
        renderDisplay: () => {
            document.querySelectorAll('#keypadDisplay .digit-wrapper').forEach((wrap, i) => {
                const box = wrap.querySelector('.digit-box');
                if (!box) return;
                const data = state.keypadValues[i];

                // filled / masked 상태만 안전하게 초기화합니다.
                // 다른 레이아웃/애니메이션 클래스가 추가되어도 같이 지워지지 않도록 보호합니다.
                box.classList.remove('filled', 'masked', 'current-active');
                wrap.classList.remove('active-cursor');
                box.textContent = '';

                if (data) {
                    if (data.masked) {
                        box.classList.add('masked');
                    } else {
                        box.classList.add('filled');
                        box.textContent = data.value;
                    }
                }

                if (i === state.activeDigitIndex && state.activeDigitIndex < 4 && !state.keypadValues[i]) {
                    wrap.classList.add('active-cursor');
                    box.classList.add('current-active');
                }
            });
            KeypadLogic.updateLoginPreviewAndActions();
        },
        processKeyInput: (k) => {
            triggerKeypadVisualPress(k);
            Utils.haptic(8);
            if (state.activeDigitIndex > 3) return;
            KeypadLogic.markTyping();
            const idx = state.activeDigitIndex;
            state.keypadValues[idx] = { value: k, masked: false };
            KeypadLogic.renderDisplay();
            if (state.inputTimers[idx]) clearTimeout(state.inputTimers[idx]);
            state.inputTimers[idx] = setTimeout(() => {
                if (state.keypadValues[idx]) {
                    state.keypadValues[idx].masked = true;
                    KeypadLogic.renderDisplay();
                }
            }, 700);
            if (state.activeDigitIndex < 3) state.activeDigitIndex++;
        },
        processBackspace: () => {
            triggerKeypadVisualPress('Backspace');
            Utils.haptic(8);
            KeypadLogic.markTyping();
            const idx = state.activeDigitIndex > 3 ? 3 : (state.keypadValues[state.activeDigitIndex] ? state.activeDigitIndex : state.activeDigitIndex - 1);
            if (idx >= 0) {
                if (state.inputTimers[idx]) clearTimeout(state.inputTimers[idx]);
                state.keypadValues[idx] = null;
                state.activeDigitIndex = idx;
                KeypadLogic.renderDisplay();
            }
            const hasTags = state.enteredUsers && state.enteredUsers.length > 0;
            state.loginTyping = state.keypadValues.some(v => v !== null) || hasTags;
        },
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_USER_CHIPS
        추가 사용자 등록/삭제 및 로그인 사용자 칩 표시
        ========================================================= */
        handleAddUser: () => {
            triggerKeypadVisualPress('+');
            if (document.getElementById('keypad-add-btn')?.disabled) return;
            Utils.haptic(18);
            if (state.enteredUsers.length >= 5) {
                return Swal.fire({
                    toast: true,
                    position: 'top',
                    icon: 'warning',
                    title: '인원 초과',
                    text: '최대 5명(메인1+추가4)까지 설정 가능합니다.',
                    showConfirmButton: false,
                    timer: 2000
                });
            }
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            if (ext.length !== 4) return Swal.fire('알림', '내선번호 4자리를 입력해주세요.', 'warning');
            const user = state.allUsersData.find(u => String(u.extension) === ext);
            if (!user) return Swal.fire('조회 실패', '해당 내선번호를 찾을 수 없습니다.', 'error');
            if (state.enteredUsers.some(u => String(u.extension) === ext)) return Swal.fire('알림', '이미 추가된 사용자입니다.', 'info');
            KeypadLogic.markTyping();
            state.enteredUsers.push({ extension: ext, name: user.name, role: user.role });
            state._lastAddedExt = ext;
            state._showAddedFeedback = true;
            if (state._addedFeedbackTimer) clearTimeout(state._addedFeedbackTimer);
            state.keypadValues = [null, null, null, null];
            state.activeDigitIndex = 0;
            KeypadLogic.renderDisplay();
            KeypadLogic.renderLoginUserTags();
            state._addedFeedbackTimer = setTimeout(() => {
                state._showAddedFeedback = false;
                if (state.currentScreen === 'login') KeypadLogic.updateLoginPreviewAndActions();
            }, 1500);
        },
        renderLoginUserTags: () => {
            const inline = document.getElementById('login-user-inline');
            const panel = document.getElementById('login-user-panel');
            const instruction = document.getElementById('login-instruction');
            const instructionArea = document.getElementById('login-instruction-area');
            const mainBox = document.getElementById('main-user-box');
            if (!inline || !panel || !mainBox) return;

            inline.innerHTML = '';
            mainBox.innerHTML = '';
            inline.classList.remove('hidden');

            if (!state.enteredUsers || state.enteredUsers.length === 0) {
                panel.classList.add('hidden');
                if (instructionArea) instructionArea.classList.remove('has-users');
                if (instruction) {
                    instruction.classList.remove('hidden', 'login-ready', 'login-invalid');
                    instruction.textContent = '내선번호 입력';
                }
                inline.classList.add('hidden');
                KeypadLogic.updateLoginPreviewAndActions();
                return;
            }

            panel.classList.remove('hidden');
            if (instructionArea) instructionArea.classList.add('has-users');
            if (instruction) instruction.classList.remove('hidden');

            const mainUser = state.enteredUsers[0];
            const mainExt = Utils.esc(String(mainUser.extension || ''));
            mainBox.innerHTML = `
                <div class="main-user-info">
                    <span class="main-user-icon"><i class="fa-solid fa-user-shield"></i></span>
                    <span class="main-user-text">
                        <span class="main-user-role">대표 사용자</span>
                        <span class="name"><span class="main-name-highlight">${mainExt}</span><span class="main-name-suffix"> 등록됨</span></span>
                    </span>
                </div>
                <button class="main-reset-btn" id="btn-remove-main" type="button" title="전체 초기화" aria-label="전체 사용자 초기화">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            `;
            const btnRemoveMain = document.getElementById('btn-remove-main');
            if (btnRemoveMain) {
                btnRemoveMain.onclick = (e) => {
                    e.stopPropagation();
                    state.enteredUsers = [];
                    state.keypadValues = [null, null, null, null];
                    state.activeDigitIndex = 0;
                    state._lastAddedExt = null;
                    state._showAddedFeedback = false;
                    if (state._addedFeedbackTimer) clearTimeout(state._addedFeedbackTimer);
                    KeypadLogic.clearTyping();
                    KeypadLogic.renderDisplay();
                    KeypadLogic.renderLoginUserTags();
                };
            }

            const extraUsers = state.enteredUsers.slice(1);
            extraUsers.forEach((u, i) => {
                const chip = document.createElement('div');
                chip.className = 'companion-chip';
                const extLabel = Utils.esc(String(u.extension || ''));
                chip.innerHTML = `
                    <div class="name-wrapper">
                        <span class="name">${extLabel}</span>
                    </div>
                    <button class="companion-remove-btn" type="button" aria-label="내선번호 ${extLabel} 삭제">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                const removeBtn = chip.querySelector('.companion-remove-btn');
                if (removeBtn) {
                    removeBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        Utils.haptic(8);
                        const realIndex = state.enteredUsers.findIndex(x => x.name === u.name && x.extension === u.extension);
                        if (realIndex > -1) {
                            state.enteredUsers.splice(realIndex, 1);
                            KeypadLogic.renderLoginUserTags();
                            KeypadLogic.renderDisplay();
                        }
                    });
                }
                inline.appendChild(chip);
            });
            KeypadLogic.updateLoginPreviewAndActions();
        },
        /* =========================================================
        @SUBSECTION: JS_LOGIN_PROCESS
        내선번호 검증, 사용자 확정, 카드 반납 여부 판단
        ========================================================= */
        async processLogin() {
            if (document.getElementById('keypad-submit-btn')?.disabled) return;
            triggerKeypadVisualPress('Enter');
            Utils.haptic(18);
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            UIManager.stopInactivityDetection();
            if (!state.allUsersData) {
                UIManager.setLoading(true, '데이터 로딩 중...');
                await Api.call('getInitialAppData')
                    .then(d => { state.allCardData = d.allCards; state.allUsersData = d.allUsers; })
                    .catch(UIManager.handleServerError);
                UIManager.setLoading(false);
            }
            if (state.enteredUsers.length === 0) {
                if (ext.length !== 4) {
                    elements.keypadDisplay.classList.add('shake');
                    setTimeout(()=>elements.keypadDisplay.classList.remove('shake'), 500);
                    return UIManager.startInactivityDetection();
                }
                const user = state.allUsersData.find(u => String(u.extension) === ext);
                if (!user) {
                    elements.keypadDisplay.classList.add('shake');
                    setTimeout(()=>elements.keypadDisplay.classList.remove('shake'), 500);
                    state.keypadValues = [null,null,null,null];
                    state.activeDigitIndex=0;
                    KeypadLogic.renderDisplay();
                    return UIManager.startInactivityDetection();
                }
                state.enteredUsers.push({ extension: ext, name: user.name, role: user.role });
            }
            Utils.haptic([20, 40, 20]);
            KeypadLogic.clearTyping();
            document.getElementById('main-welcome-message').innerHTML =
                `<i class="fa-solid fa-hand-sparkles"></i> <strong>${state.enteredUsers.map(u=>u.name).join(', ')}</strong> 님 환영합니다`;
            await KeypadLogic.runSecurityScan();
            if (state.syncPromise) {
                UIManager.setLoading(true, '최신 카드 상태 확인 중...', 'receipt');
                try { await state.syncPromise; } catch(e) {}
                UIManager.setLoading(false);
                state.syncPromise = null;
            }
            const mainUser = state.enteredUsers[0].name;
            const cardToReturn = state.allCardData.find(c => c.status === "사용중" && c.userInfo && c.userInfo.userName.includes(mainUser));
            if (cardToReturn) {
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                await new Promise(r => setTimeout(r, 250));
                CardLogic.setupAndShowReturnScreen(cardToReturn);
                UIManager.showScreen('returnDetails');
            }
            state.keypadValues = [null,null,null,null];
            state.activeDigitIndex = 0;
            KeypadLogic.renderDisplay();
            UIManager.startInactivityDetection();
        },
        /* =========================================================
        @SUBSECTION: JS_LOGIN_SECURITY_SCAN
        로그인 성공 후 신원 확인 애니메이션
        ========================================================= */
        runSecurityScan: () => new Promise(resolve => {
            const overlay = document.getElementById('security-scan-overlay');
            const box = document.getElementById('scan-box');
            const icon = document.getElementById('scan-icon');
            const text = document.getElementById('scan-text');
            box.classList.remove('success', 'scanning');
            overlay.classList.remove('exit');
            icon.className = 'fa-solid fa-user scan-icon';
            text.textContent = '신원 확인 중...';
            text.style.color = 'var(--text-primary)';
            text.classList.remove('fade-out');
            text.classList.add('fade-in');
            overlay.classList.add('active');
            void box.offsetWidth;
            box.classList.add('scanning');
            setTimeout(() => {
                box.classList.remove('scanning');
                box.classList.add('success');
                icon.className = 'fa-solid fa-check scan-icon';
                text.classList.remove('fade-in');
                text.classList.add('fade-out');
                setTimeout(() => {
                    text.textContent = '신원 확인 완료!';
                    text.style.color = 'var(--primary-color)';
                    text.classList.remove('fade-out');
                    text.classList.add('fade-in');
                }, 180);
                setTimeout(() => {
                    overlay.classList.add('exit');
                    document.querySelector('.content-wrapper').style.display = 'flex';
                    CardLogic.displayCardList();
                    UIManager.showScreen('main');
                    setTimeout(() => {
                        overlay.classList.remove('active', 'exit');
                        resolve();
                    }, 450);
                }, 800);
            }, 1150);
        })
    };
    /* =========================================================
    @SECTION: JS_EMBED_BRIDGE
    외부 embed/iframe 환경과 통신할 때 사용하는 bridge
    ========================================================= */
    const EmbedBridge = {
        notify(type, payload = {}) {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'WS_CARD', type, ...payload }, '*');
                }
            } catch (e) {}
        }

    /* =========================================================
    @SECTION: JS_MODULE_4_CARD_LOGIC
