/* ==========================================
   2. Lock Screen Screen Layout
   ========================================== */
#lock-screen.fade-out {

  transform: scale(1.05);
}

#lock-screen.active-pop .lock-content {
  transform: scale(0.96);
  transition: transform 0.1s ease-in;
}


#lock-screen.ripple-card-exit .lock-content,
#lock-screen.active-pop.ripple-card-exit .lock-content {
  transform: scale(1);
  transition: opacity 1.08s cubic-bezier(0.22, 1, 0.36, 1), transform 1.08s cubic-bezier(0.22, 1, 0.36, 1);
}

#lock-screen.ripple-card-exit #glass-card-container {
  opacity: 0;
  transform: translate3d(0, -5px, 0) scale(0.985);
  pointer-events: none;
  transition: opacity 1.08s cubic-bezier(0.22, 1, 0.36, 1), transform 1.08s cubic-bezier(0.22, 1, 0.36, 1);
}

#lock-screen.ripple-card-exit #lock-text-instruction {
  opacity: 0;
  transition: opacity 0.48s ease-out;
}

#lock-screen.ripple-screen-exit {
  opacity: 0;
  transform: scale(1.012);
  pointer-events: none;
  transition: opacity 0.78s cubic-bezier(0.22, 1, 0.36, 1), transform 0.78s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ==========================================
   Lock card lake ripple transition
   - One slightly slower, more visible ripple starts from the card center.
   - Use a single wave only so the effect feels cleaner.
   ========================================== */
.ws-lake-ripple-layer {
  position: fixed;
  inset: 0;
  z-index: 9998;
  pointer-events: none;
  overflow: hidden;
  opacity: 1;
  background: radial-gradient(circle at var(--ws-ripple-x, 50%) var(--ws-ripple-y, 50%), rgba(255, 255, 255, 0.078) 0%, transparent 38%);
  animation: wsLakeRippleLayer 1.28s ease-out forwards;
  will-change: opacity;
  contain: layout paint style;
}

/* [2026-08 성능 개선]
   - filter: blur(0.1px) 제거: 눈에 보이지도 않으면서 매 프레임 필터 연산을 강제해
     저사양 기기에서 렉의 주원인이었습니다.
   - ::after 보조 그라데이션 레이어를 본체 그라데이션에 통합해 페인트 횟수를 줄였습니다.
   - 실제 요소 크기를 최대 1200px로 고정하고, 부족한 크기는 scale로 확대합니다.
     화면이 큰 PC에서 2000px가 넘는 초대형 텍스처를 만들지 않아 메모리/래스터 부담이 큽니다.
     확대되는 마지막 구간은 이미 투명도가 0에 가까워 화질 차이는 보이지 않습니다. */
.ws-lake-ripple-wave {
  position: fixed;
  left: var(--ws-ripple-x, 50%);
  top: var(--ws-ripple-y, 50%);
  width: var(--ws-ripple-base, 1200px);
  height: var(--ws-ripple-base, 1200px);
  border-radius: 50%;
  transform: translate3d(-50%, -50%, 0) scale(var(--ws-ripple-scale-start, 0.02));
  opacity: 0;
  will-change: transform, opacity;
  backface-visibility: hidden;
  background:
    radial-gradient(circle,
      rgba(255, 255, 255, 0.075) 0%,
      rgba(173, 208, 255, 0.030) 22%,
      transparent 38%,
      rgba(255, 255, 255, 0.34) 44%,
      rgba(160, 200, 255, 0.22) 47%,
      transparent 55%);
  animation: wsLakeRippleWave 1.24s cubic-bezier(0.16, 0.82, 0.24, 1) forwards;
}

@keyframes wsLakeRippleWave {
  0% { opacity: 0; transform: translate3d(-50%, -50%, 0) scale(var(--ws-ripple-scale-start, 0.02)); }
  10% { opacity: 0.84; }
  52% { opacity: 0.58; }
  84% { opacity: 0.26; }
  100% { opacity: 0; transform: translate3d(-50%, -50%, 0) scale(var(--ws-ripple-scale-end, 1)); }
}

@keyframes wsLakeRippleLayer {
  0% { opacity: 0; }
  14% { opacity: 1; }
  82% { opacity: 0.70; }
  100% { opacity: 0; }
}

@keyframes loginPanelMount {
  from{opacity:0;transform:translate(-50%,-45%) scale(.965);}
  to{opacity:1;transform:translate(-50%,-50%) scale(1);}
}

@keyframes loginLiveDot {
  0%,100%{opacity:.62;transform:scale(.86);box-shadow:0 0 0 0 rgba(16,185,129,.34);}
  50%{opacity:1;transform:scale(1.18);box-shadow:0 0 8px 2px rgba(16,185,129,.18);}
}

@keyframes companionChipBounce {
  0%{opacity:0;transform:translateY(8px) scale(.88);}
  70%{opacity:1;transform:translateY(-1px) scale(1.035);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

@keyframes digitJellyPopFinal {
  0%{transform:scale(.60);opacity:.42;}
  55%{transform:scale(1.12);opacity:1;}
  80%{transform:scale(.96);}
  100%{transform:scale(1);opacity:1;}
}



@keyframes cursorPulseFinal {
  0%,100%{
    opacity:.22;
    transform:translate(-50%,-50%) scale(.80);
  }
  50%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.32);
  }
}



@keyframes buttonGlowShimmer {
  0%,76%{left:-120%;}
  100%{left:220%;}
}



@keyframes purposeListIn {
  to{opacity:1;transform:translateY(0);}
}

@keyframes woosungCursorPulseFinal {
  0%, 100% {
    opacity: .22;
    transform: translate(-50%, -50%) scale(.8);
  }
  50% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.3);
  }
}

@keyframes confirm-result-card-rise {
  from{opacity:0;transform:translateY(18px) scale(0.985);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

body[data-current-screen="login"] .keypad-btn:active {

    contain: strict;
  }

  #security-scan-overlay.active {
    transition: opacity 0.14s linear, visibility 0s linear 0s;
  }

  #security-scan-overlay.exit {
    transform: none !important;
    transition: opacity 0.12s linear;
  }

  #security-scan-overlay .scan-box,
  #security-scan-overlay .scan-box.success {
    background: #ffffff !important;
    border: 1px solid #d5dde7 !important;
    box-shadow: none !important;

  }

  #security-scan-overlay .scan-icon,
  #security-scan-overlay .scan-box.success .scan-icon {
    transform: none !important;
    transition: color 0.12s linear;
    text-shadow: none;
    filter: none;
  }

  #security-scan-overlay .scan-text {
    transform: none !important;
    transition: opacity 0.12s linear;
    text-shadow: none;
    filter: none;
  }

  #security-scan-overlay .scan-text.fade-in,
  #security-scan-overlay .scan-text.fade-out {
    transform: none !important;
  }

  #security-scan-overlay .laser {
    height: 2px;
    background: #3182f6 !important;
    box-shadow: none !important;
    filter: none;
    transform: translate3d(0, -4px, 0);
    will-change: transform;
  }

  #security-scan-overlay.active .scan-box.scanning .laser {
    animation: ws-security-laser-tablet-lite 0.78s linear forwards !important;
  }

/* ============================================================
   LAPTOP LOGIN FIT PATCH
   - PC width/appearance is preserved as much as possible.

<script>
(function installPulseMiniStepMirror(){
  function syncPulseMiniSteps(){
    try {
      var s1 = document.getElementById('loader-step-1');
      var s2 = document.getElementById('loader-step-2');
      var m1 = document.getElementById('ws-mini-loader-step-1');
      var m2 = document.getElementById('ws-mini-loader-step-2');
      [[s1,m1],[s2,m2]].forEach(function(pair){
        var source = pair[0], target = pair[1];
        if (!source || !target) return;
        target.classList.toggle('active', source.classList.contains('active'));
        target.classList.toggle('done', source.classList.contains('done'));
      });
    } catch(e) {}
  }
  function initPulseMiniStepMirror(){
    syncPulseMiniSteps();
    ['loader-step-1','loader-step-2'].forEach(function(id){
      var el = document.getElementById(id);
      if (!el || el.__wsPulseMirrorInstalled) return;
      el.__wsPulseMirrorInstalled = true;
      new MutationObserver(syncPulseMiniSteps).observe(el, { attributes: true, attributeFilter: ['class'] });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPulseMiniStepMirror);
  } else {
    initPulseMiniStepMirror();
  }
})();
</script>

  - 개별 기능의 서버 함수명은 아래 SERVER_API_GROUP_* 주석을 기준으로 추적합니다.

========================================================= */
const Api = {
    /* @SUBSECTION: JS_API_TIMEOUT_POLICY
       일반 서버 접수 API는 빠르게 실패를 알려주고, OCR/이미지 계열은 더 긴 시간을 허용합니다. */
    timeoutMs(func){
        const f = String(func || '');
        if (f === 'processReceiptImage') return 90000;
        if (f === 'processReceiptImageFast') return 60000;
        if (f === 'saveReceiptImageOnly') return 60000;
        if (f === 'saveCartToMasterFile') return 45000;
        if (f === 'queueReturnRequest') return 30000;
        if (f === 'rentNow') return 25000;
        if (f === 'getReceiptImagePreview') return 30000;
        return 30000;
    },
    timeoutError(func, ms){
        return new Error(`${func} 요청이 ${Math.round(ms/1000)}초 안에 완료되지 않았습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.`);
    },
    withTimeout(promise, func){
        const ms = Api.timeoutMs(func);
        let timer = null;
        const timeout = new Promise((_, reject) => {
            timer = setTimeout(() => reject(Api.timeoutError(func, ms)), ms);
        });
        return Promise.race([promise, timeout]).finally(() => { if (timer) clearTimeout(timer); });
    },
    call: async (func, ...args) => {
        if (IS_GAS) {
            return Api.withTimeout(new Promise((resolve, reject) => {
                try {
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[func](...args);
                } catch (e) {
                    reject(e);
                }
            }), func);
        }

        const timeoutMs = Api.timeoutMs(func);
        const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
        let response;
        try {
            response = await fetch(WORKER_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ func, args, apiSecret: API_SHARED_SECRET }),
                signal: controller ? controller.signal : undefined
            });
        } catch (e) {
            if (e && e.name === 'AbortError') throw Api.timeoutError(func, timeoutMs);
            throw e;
        } finally {
            if (timer) clearTimeout(timer);
        }

        const rawText = await response.text();
        let data;
        try {
            data = rawText ? JSON.parse(rawText) : {};
        } catch (e) {
            const snippet = String(rawText || '').replace(/\s+/g, ' ').slice(0, 160);
            throw new Error(`응답을 해석하지 못했습니다. ${snippet ? '응답 일부: ' + snippet : ''}`);
        }
        if (!response.ok || !data.ok) {
            throw new Error(data && data.error ? data.error : `HTTP_${response.status}`);
        }
        return data.result;
    }
};

function triggerKeypadVisualPress(key){
    try{
        let selector = null;
        if (/^[0-9]$/.test(String(key))) selector = `.keypad-btn[data-key="${key}"]`;
        else if (key === 'Backspace') selector = '#keypad-back-btn';
        else if (key === 'Enter') selector = '#keypad-submit-btn';
        else if (key === '+') selector = '#keypad-add-btn';
        if (!selector) return;
        const btn = document.querySelector(selector);
        if (!btn) return;
        // forced reflow(offsetWidth)를 제거해서 빠른 연속 입력 시 끊김을 줄입니다.
        btn.classList.add('pressed');
        clearTimeout(btn._pressedTimer);
        btn._pressedTimer = setTimeout(() => {
            btn.classList.remove('pressed');
        }, 75);
    } catch(e) {}
}

    const getInactivityLimitMs = () => 5 * 60 * 1000;

    const UI_COLORS = Object.freeze({

    /* =========================================================

        allCardData: null,

        initialDataPreloadPromise: null,

        initialDataPreloadLoadedAt: 0,

        /* =========================================================
        @SUBSECTION: JS_STATE_SAVED_CART_PREFETCH_V12
        잠금화면 클릭 직후/초기 로딩 직후 저장 영수증 장바구니를 백그라운드로 미리 불러옵니다.
        - 2단계 로딩은 카드/사용자 중심으로 빠르게 유지
        - 반납 화면은 savedCart 단건 조회로 막지 않고, 미리 도착한 값을 즉시 표시
        ========================================================= */
        savedCartPrefetchPromise: null,
        savedCartPrefetchStarted: false,
        savedCartPrefetchDone: false,
        savedCartPrefetchCardIds: [],
        savedCartSingleFetches: {},

        /* =========================================================
        @SUBSECTION: JS_STATE_LOGIN
        로그인 키패드 / 추가 사용자 / 입력 상태
        ========================================================= */
        keypadValues: [null, null, null, null],
        inputTimers: [null, null, null, null],
        activeDigitIndex: 0,
        enteredUsers: [],
        loginTyping: false,
        _lastAddedExt: null,
        _showAddedFeedback: false,
        _addedFeedbackTimer: null,

        /* =========================================================
        @SUBSECTION: JS_STATE_RECEIPT
        반납 카드 / 영수증 장바구니 / OCR 검토 흐름
        ========================================================= */

        receiptCart: [],
        pendingEditIndex: -1,
        reviewQueue: [],
        _uploadPickerTimer: null,

        /* =========================================================
        @SUBSECTION: JS_STATE_RECEIPT_AUTOSAVE

        ========================================================= */

        cartSavePending: [],
        _renderReceiptScheduled: false,

        /* =========================================================
        @SUBSECTION: JS_STATE_UI_SESSION

        currentScreen: 'lock',
        isAppActive: false,
        __keypadInited: false,
        cardTiltActive: true,
        countdownInterval: null,

        confirmLeaveTimeout1: null,

        @SUBSECTION: JS_STATE_ADMIN

        ========================================================= */
        isAdminMode: false,

    /* =========================================================

    - 사용자가 내선번호를 입력하는 동안 저장 영수증을 미리 배달
    - 반납 화면에서는 "저장된 영수증을 확인하고 있어요"로 화면을 막지 않음
    ========================================================= */
    const SavedCartPrefetch = {
        normalizeInitialPayload(data) {
            try {
                const carts = data?.savedCarts || {};
                if (Array.isArray(data?.allCards)) {
                    data.allCards.forEach(c => {
                        if (!c) return;
                        c.savedCart = Utils.sanitizeReceiptCart(c.savedCart || carts[c.id] || []);
                        c.savedCartPrefetched = Array.isArray(c.savedCart) && c.savedCart.length > 0;
                    });
                }
            } catch (cartError) {
                console.warn('[V12 PREFETCH] initial savedCart normalize failed', cartError);
                if (Array.isArray(data?.allCards)) {
                    data.allCards.forEach(c => {
                        if (c && !Array.isArray(c.savedCart)) c.savedCart = [];
                    });
                }
            }
            return data;
        },

        normalizeStatus(value) {
            const v = String(value || '').replace(/\s+/g, '').trim();
            if (v === '대여가능' || v === '가능') return '사용가능';
            if (v === '대여중') return '사용중';
            return v;
        },

        getCandidateCardIds(cards) {
            if (!Array.isArray(cards)) return [];
            const busy = ['사용중', '반납처리중', '반납오류', '신청중'];
            return Array.from(new Set(cards
                .filter(c => c && c.id && busy.includes(this.normalizeStatus(c.status)))
                .map(c => String(c.id || '').trim())
                .filter(Boolean)));
        },

        applyCarts(carts, ids) {
            const idList = Array.from(new Set((ids || Object.keys(carts || {}))
                .map(id => String(id || '').trim())
                .filter(Boolean)));
            if (!Array.isArray(state.allCardData)) return;

            idList.forEach(id => {
                const loadedCart = Utils.sanitizeReceiptCart((carts && carts[id]) || []);
                const target = state.allCardData.find(c => c && c.id === id);
                if (target) {
                    target.savedCart = loadedCart;
                    target.savedCartPrefetched = true;
                }
                if (state.currentReturnCard && state.currentReturnCard.id === id) {
                    state.currentReturnCard.savedCart = loadedCart;
                    state.currentReturnCard.savedCartPrefetched = true;
                }
            });
        },

        start(reason = 'unlock') {
            if (state.savedCartPrefetchPromise) return state.savedCartPrefetchPromise;
            const ids = this.getCandidateCardIds(state.allCardData);
            state.savedCartPrefetchStarted = true;
            state.savedCartPrefetchDone = false;
            state.savedCartPrefetchCardIds = ids;

            if (!ids.length) {
                state.savedCartPrefetchDone = true;
                state.savedCartPrefetchPromise = Promise.resolve({});
                return state.savedCartPrefetchPromise;
            }

            const prefetchStartedAt = Date.now();
            console.log('[V12 PREFETCH] savedCart prefetch start', { reason, ids });
            console.log('[WS MEASURE] savedCart prefetch start', { reason, ids, at: new Date().toLocaleTimeString() });
            state.savedCartPrefetchPromise = Api.call('getSavedCarts', ids)
                .then(carts => {
                    this.applyCarts(carts || {}, ids);
                    state.savedCartPrefetchDone = true;
                    console.log('[V12 PREFETCH] savedCart prefetch done', { ids });
                    console.log('[WS MEASURE] savedCart prefetch done', `${Date.now() - prefetchStartedAt}ms`, { ids });
                    return carts || {};
                })
                .catch(e => {
                    state.savedCartPrefetchDone = true;
                    console.warn('[V12 PREFETCH] savedCart prefetch failed', e);
                    console.log('[WS MEASURE] savedCart prefetch failed', `${Date.now() - prefetchStartedAt}ms`, e);
                    return {};
                });
            return state.savedCartPrefetchPromise;
        },

        ensureForCard(cardId) {
            const id = String(cardId || '').trim();
            if (!id) return Promise.resolve({});

            const target = Array.isArray(state.allCardData) ? state.allCardData.find(c => c && c.id === id) : null;
            if (target && target.savedCartPrefetched) return Promise.resolve({ [id]: target.savedCart || [] });
            if (state.savedCartPrefetchPromise && state.savedCartPrefetchCardIds && state.savedCartPrefetchCardIds.includes(id)) {
                return state.savedCartPrefetchPromise;

            state.savedCartSingleFetches = state.savedCartSingleFetches || {};
            if (state.savedCartSingleFetches[id]) return state.savedCartSingleFetches[id];

    /* =========================================================
    @SECTION: JS_INITIAL_DATA_PRELOAD_V13
    잠금화면 선로딩.
    - 웹앱이 열려 잠금화면이 보이는 동안 getInitialAppData를 조용히 먼저 시작합니다.
    - 카드 클릭 시 3초 이내의 선로딩 데이터만 재사용합니다.
    - 3초가 지나거나 아직 준비되지 않았으면 기존처럼 로딩화면에서 새로 가져옵니다.
    - localStorage나 긴 캐시는 사용하지 않습니다.
    ========================================================= */
    const InitialDataPreload = {
        TTL_MS: 3000,

        isFreshLoaded() {
            return !!state.initialDataPreloadData &&
                !!state.initialDataPreloadLoadedAt &&
                (Date.now() - state.initialDataPreloadLoadedAt) <= this.TTL_MS;
        },

        isFreshPending() {
            return !!state.initialDataPreloadPromise &&
                !!state.initialDataPreloadStartedAt &&
                (Date.now() - state.initialDataPreloadStartedAt) <= this.TTL_MS;
        },

        invalidate(reason = 'manual') {
            state.initialDataPreloadPromise = null;
            state.initialDataPreloadData = null;
            state.initialDataPreloadStartedAt = 0;
            state.initialDataPreloadLoadedAt = 0;
            console.log('[WS MEASURE] initial preload invalidated', { reason });
        },

        refresh(reason = 'lock-visible-refresh') {
            // 잠금화면이 새로 보이거나 태블릿이 다시 깨어났을 때는 TTL 재사용보다 최신성 우선.
            // 즉시 기존 선로딩 데이터를 폐기하고 getInitialAppData를 새로 준비합니다.
            this.invalidate(reason);
            return this.start(reason);
        },

        start(reason = 'lock-visible') {
            if (state.currentScreen !== 'lock' || state.isAppActive) return null;
            if (this.isFreshLoaded()) return Promise.resolve(state.initialDataPreloadData);
            if (this.isFreshPending()) return state.initialDataPreloadPromise;

            state.initialDataPreloadStartedAt = Date.now();
            state.initialDataPreloadLoadedAt = 0;
            state.initialDataPreloadData = null;
            console.log('[WS MEASURE] initial preload start', { reason, ttlMs: this.TTL_MS, at: new Date().toLocaleTimeString() });

            state.initialDataPreloadPromise = Api.call('getInitialAppData')
                .then(data => {
                    const elapsed = Date.now() - state.initialDataPreloadStartedAt;
                    if (!data || data.error) throw new Error(data?.error || 'No Data');
                    SavedCartPrefetch.normalizeInitialPayload(data);
                    state.initialDataPreloadData = data;
                    state.initialDataPreloadLoadedAt = Date.now();
                    console.log('[WS MEASURE] initial preload done', `${elapsed}ms`, { ttlMs: this.TTL_MS });

                    // 잠금화면에 머무는 짧은 시간도 savedCart 프리로드에 활용합니다.
                    // 단, 카드 클릭 시 TTL이 지났으면 initializeAppSequence에서 reset 후 최신 데이터를 다시 받습니다.
                    if (state.currentScreen === 'lock' && !state.isAppActive && this.isFreshLoaded()) {
                        state.allCardData = data.allCards || [];
                        state.allUsersData = data.allUsers || [];
                        state.lastSyncTs = Date.now();
                        SavedCartPrefetch.reset();
                        SavedCartPrefetch.start('lock-preload');
                    }
                    return data;
                })
                .catch(e => {
                    console.log('[WS MEASURE] initial preload failed', `${Date.now() - state.initialDataPreloadStartedAt}ms`, e);
                    this.invalidate('preload-failed');
                    return null;
                });

            return state.initialDataPreloadPromise;
        },

        getUsablePromise() {
            if (this.isFreshLoaded()) {
                console.log('[WS MEASURE] initial preload reused', `${Date.now() - state.initialDataPreloadLoadedAt}ms old`);
                return Promise.resolve(state.initialDataPreloadData);
            }
            if (this.isFreshPending()) {
                console.log('[WS MEASURE] initial preload pending reused', `${Date.now() - state.initialDataPreloadStartedAt}ms since start`);
                return state.initialDataPreloadPromise;
            }
            if (state.initialDataPreloadData || state.initialDataPreloadPromise) this.invalidate('ttl-expired');
            return null;
        }
    };

    @SUBSECTION: JS_STATE_ADMIN_PERSISTENCE
    행정실 태블릿 운영용 관리자 모드 영구 유지.
    PIN으로 직접 OFF 하기 전까지 자동 잠금/처음화면/재로그인/새로고침 후에도 관리자 모드를 복원합니다.
    ========================================================= */
    const ADMIN_MODE_STORAGE_KEY = 'woosung_admin_mode_persistent_v1';
    function readPersistedAdminMode(){
        try {
            const raw = window.localStorage && localStorage.getItem(ADMIN_MODE_STORAGE_KEY);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (!data || !data.enabled || (!data.token && !data.pin)) return null;
            return {
                enabled: true,
                token: String(data.token || ''),
                legacyPin: String(data.pin || ''),
                since: data.since || new Date().toISOString()
            };
        } catch(e) { return null; }
    }
    function persistAdminMode(){
        try {
            if (!window.localStorage || !state.isAdminMode || !state.adminTokenCache) return;
            localStorage.setItem(ADMIN_MODE_STORAGE_KEY, JSON.stringify({
                enabled: true,
                token: String(state.adminTokenCache),
                since: state.adminSince || new Date().toISOString()
            }));
        } catch(e) {}
    }
    function clearPersistedAdminMode(){
        try {
            if (window.localStorage) localStorage.removeItem(ADMIN_MODE_STORAGE_KEY);
        } catch(e) {}
    }
    async function restoreAdminModeFromStorage(){
        const saved = readPersistedAdminMode();
        if (!saved) return;

        // 새 토큰 저장 형식은 먼저 화면 상태를 복원하고 서버에서 조용히 유효성을 확인합니다.
        if (saved.token) {
            state.isAdminMode = true;
            state.adminSince = saved.since;
            state.adminTokenCache = saved.token;
            try {
                const result = await Api.call('validateAdminToken', saved.token);
                if (!result || !result.ok) {
                    state.isAdminMode = false;
                    state.adminSince = null;
                    state.adminTokenCache = null;
                    clearPersistedAdminMode();
                }
            } catch(e) {
                // 일시적인 오프라인 상태에서는 저장값을 지우지 않습니다.
                // 실제 반납 제출 시 서버가 토큰을 다시 검증합니다.
            }
            return;
        }

        // 이전 버전에 평문으로 저장된 PIN은 최초 한 번만 서버 토큰으로 교환합니다.
        if (saved.legacyPin) {
            try {
                const result = await Api.call('validateAdminPin', saved.legacyPin);
                if (result && result.ok && result.adminToken) {
                    state.isAdminMode = true;
                    state.adminSince = saved.since;
                    state.adminTokenCache = String(result.adminToken);
                    persistAdminMode();
                } else if (!result || !result.configurationError) {
                    clearPersistedAdminMode();
                }
            } catch(e) {
                // 교환에 실패한 동안에는 기존 PIN 저장값을 유지해 다음 실행에서 다시 시도합니다.
            }
        }
    }/* =========================================================

    /* =========================================================

    3차 기준: Utils는 가능한 한 순수 함수만 두고, Api 호출/DOM 변경/state 변경을 넣지 않습니다.

    /* Pure formatting / helper logic should stay here when possible. */
    const Utils = {
        nfKR: new Intl.NumberFormat('ko-KR'),
        formatDateKR(d=new Date()){
            try{
                const parts=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
                const get=k=>parts.find(p=>p.type===k)?.value;
                return `${get('year')}-${get('month')}-${get('day')}`;
            }catch(e){
                return new Date().toISOString().split('T')[0];
            }
        },
        esc(s=''){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); },
        getErrorMessage(err, fallback='알 수 없는 오류가 발생했습니다.'){
            const raw = err && err.message ? err.message : err;
            const msg = String(raw || fallback).trim();
            if (!msg) return fallback;
            return msg.length > 180 ? `${msg.slice(0, 180)}...` : msg;
        },
        buildRecoveryList(items=[]){
            return `<ol class="ops-recovery-list">${items.map(x => `<li>${Utils.esc(x)}</li>`).join('')}</ol>`;

            return `<div class="detail-row"><span class="detail-row-label">${this.esc(label)}</span><span class="detail-row-content">${this.esc(content)}</span></div>`;
        },
        celebrate(){},
        haptic(pattern=12){ try{ if(navigator && typeof navigator.vibrate === 'function') navigator.vibrate(pattern); }catch(_){} },
        clampMealAmount(amt, cnt){
            const entered=parseInt((amt||'').replace(/[^\d]/g,''),10)||0;
            const cap=(Math.max(1,cnt))*MEAL_CAP_PER_PERSON;
            const clamped=Math.min(entered,cap);
            // 특근매식 금액은 화면 알림 없이 조용히 보정합니다.
            return clamped;
        },
        isMealExpenseItem(item={}){
            return !!(item && (item.isMealExpense === true || String(item.purpose || '').includes('특근매식비') || String(item.usageDetails || '').includes('특근매식비')));
        },
        normalizeMealHeadcount(value, fallback=1){
            const n = parseInt(String(value || '').replace(/[^\d]/g, ''), 10);
            return Math.max(1, Number.isFinite(n) ? n : fallback);
        },
        getMealAdjustedAmount(rawAmount, headcount){
            const original = parseInt(String(rawAmount || '').replace(/[^\d]/g, ''), 10) || 0;
            const cnt = Utils.normalizeMealHeadcount(headcount, 1);
            return {
                originalAmount: original,
                mealHeadcount: cnt,
                mealLimitAmount: cnt * MEAL_CAP_PER_PERSON,
                amount: Utils.clampMealAmount(String(original), cnt)
            };
        },
        getSmartIcon(place, details){
            const t=(place+' '+details).toLowerCase();
            if(t.match(/식당|밥|국밥|설렁탕|해장국|곰탕|찌개|냉면|버거|피자|치킨|맥도날드|롯데리아|김밥|한식|중식|일식|양식|분식/))return 'fa-utensils';
            if(t.match(/카페|커피|스타벅스|이디야|투썸|음료|차|베이커리|빵/))return 'fa-mug-hot';
            if(t.match(/택시|주유|주차|버스|기차|교통|하이패스/))return 'fa-car-side';
            if(t.match(/마트|편의점|이마트|홈플러스|cu|gs25|세븐일레븐|쇼핑|구매/))return 'fa-cart-shopping';
            if(t.match(/문구|사무|복사|인쇄|용지/))return 'fa-stapler';
            return 'fa-receipt';
        },
        getReceiptIconToneClass(iconName='fa-receipt'){
            switch(String(iconName || '')){
                case 'fa-utensils':
                    return 'icon-tone-meal';
                case 'fa-mug-hot':
                    return 'icon-tone-cafe';
                case 'fa-car-side':
                    return 'icon-tone-mobility';
                case 'fa-cart-shopping':
                    return 'icon-tone-shopping';

        createClientRequestId(prefix='req'){

        sanitizeReceiptCart(cart){
            // 서버/Drive에 저장된 장바구니를 다시 불러올 때 UI 임시 상태가 살아나지 않도록 정리합니다.
            // 저장 대상은 실제 업무 데이터와 id: 영수증 파일 참조만입니다.
            return (Array.isArray(cart) ? cart : [])
                .filter(Boolean)
                .map(item => {
                    const clean = { ...item };
                    delete clean.processing;
                    delete clean.previewImage;
                    delete clean.receiptImagePreview;
                    delete clean.analysisMeta;
                    delete clean.imageSaveError;
                    delete clean.needsManualReview;
                    delete clean._uiTransient;
                    delete clean.isProcessing;
                    delete clean.isSaving;
                    delete clean.status;
                    const img = String(clean.receiptImage || '');
                    if (img && !img.startsWith('id:')) delete clean.receiptImage;
                    // 운영 결정: 시스템에는 금액 기준 대표 영수증만 저장합니다.
                    // 품목내역서/간이영수증/추가 증빙은 종이로 별도 제출하므로 부속 첨부는 저장하지 않습니다.
                    clean.attachments = [];
                    return clean;
                });
        }

        /* =========================================================
        @SUBSECTION: JS_UI_MANAGER_LOADER_SEQUENCE
        초기 연결/보안 확인 로더 진행 애니메이션
        ========================================================= */
        async runRandomLoader(chk) {
            const loadingText = '데이터 불러오는 중';
            const loadingSubText = '';
            const doneText = '완료';
            const doneSubText = '';

            const titleMain = document.getElementById('loader-title-main');
            const titleSub = document.getElementById('loader-title-sub');
            const percentEl = document.getElementById('loader-percent');
            const step1El = document.getElementById('loader-step-1');
            const step2El = document.getElementById('loader-step-2');
            const miniSteps = document.querySelector('.ws-pulse-mini-steps');
            const ringFill = document.getElementById('loader-ring-fill');
            const ringCircumference = 351.858;

            const wait = (ms) => new Promise(r => setTimeout(r, ms));
            const startedAt = Date.now();
            console.log('[WS MEASURE] welcome loader animation start', { at: new Date().toLocaleTimeString() });

            // v12.10: 예상 로딩 시간 기반으로 0~98%를 꾸준히 채우는 방식입니다.
            // 데이터가 빠르게 도착해도 100%로 튀지 않고, 일정한 속도로 자연스럽게 마무리합니다.
            // 데이터가 늦어지는 경우에는 98% 근처에서 아주 은은하게 대기한 뒤 실제 완료 시 100%가 됩니다.
            const EXPECTED_MS = 900;
            const MIN_VISIBLE_MS = 300;
            const HOLD_LIMIT = 98;
            let currentPercent = 0;

            if (miniSteps) miniSteps.style.display = 'none';
            if (step1El && step2El) {
                step1El.classList.remove('active', 'done');
                step2El.classList.remove('active', 'done');
            }

            const setTone = (done) => {
                const toneClass = done ? 'loader-tone-done' : 'loader-tone-step-1';
                if (elements.loaderBar) {
                    elements.loaderBar.classList.remove('loader-tone-step-1', 'loader-tone-step-2', 'loader-tone-done');
                    elements.loaderBar.classList.add(toneClass);
                }
                if (ringFill) {
                    ringFill.classList.toggle('is-done', !!done);
                }
                if (percentEl) {
                    percentEl.classList.remove('loader-tone-step-1', 'loader-tone-step-2', 'loader-tone-done');
                    percentEl.classList.add('loader-gradient-text', toneClass);
                }
            };

            const updateUI = (percent, done) => {
                const safePercent = Math.max(0, Math.min(100, percent));
                if (elements.loaderBar) elements.loaderBar.style.width = `${safePercent}%`;
                if (ringFill) {
                    const offset = ringCircumference - (ringCircumference * safePercent / 100);
                    ringFill.style.strokeDasharray = String(ringCircumference);
                    ringFill.style.strokeDashoffset = String(offset);
                    ringFill.classList.toggle('is-done', !!done);
                }
                if (percentEl) percentEl.textContent = `${Math.round(safePercent)}%`;
                if (titleMain) titleMain.textContent = done ? doneText : loadingText;
                if (titleSub) titleSub.textContent = done ? doneSubText : loadingSubText;
            };

            if (elements.loaderBar) {
                elements.loaderBar.classList.remove('loader-motion-done');
                elements.loaderBar.classList.add('loader-motion-live');
            }
            if (percentEl) percentEl.classList.add('loader-gradient-text');

            setTone(false);
            updateUI(0, false);

            // 0~98%: 예상 시간 안에서 거의 일정하게 차오르되,
            // 아주 약한 ease-out만 적용해서 기계적으로 보이지 않게 합니다.
            while (true) {
                const elapsed = Date.now() - startedAt;
                const ready = !!(chk && chk());
                const ratio = Math.min(1, elapsed / EXPECTED_MS);
                const smoothRatio = 1 - Math.pow(1 - ratio, 1.18);
                const timedTarget = Math.min(HOLD_LIMIT, HOLD_LIMIT * smoothRatio);

                // 프레임당 이동폭을 부드럽게 제한해서 갑작스러운 점프를 방지합니다.
                const delta = Math.max(0.45, Math.min(2.2, (timedTarget - currentPercent) * 0.34));
                currentPercent = Math.min(timedTarget, currentPercent + delta);
                updateUI(currentPercent, false);

                // 데이터가 준비됐고, 최소 표시 시간도 지났으며, 링이 충분히 찼으면 마무리합니다.
                // 이렇게 해야 75%에서 100%로 후다닥 넘어가는 느낌을 줄일 수 있습니다.
                if (ready && elapsed >= MIN_VISIBLE_MS && currentPercent >= 94) {
                    break;
                }

                // 데이터는 준비됐지만 아직 94%에 못 갔으면 조금 더 빠르게, 그래도 자연스럽게 따라잡습니다.
                if (ready && elapsed >= MIN_VISIBLE_MS && currentPercent < 94) {
                    currentPercent = Math.min(94, currentPercent + 2.4);
                    updateUI(currentPercent, false);
                }

                // 서버가 예상보다 늦으면 98% 근처에서만 조용히 기다립니다. 100%는 실제 완료 후에만 표시합니다.
                if (!ready && elapsed > EXPECTED_MS) {
                    currentPercent = Math.min(HOLD_LIMIT, currentPercent + 0.12);
                    updateUI(currentPercent, false);
                }

                await wait(80);
            }

            // 실제 필수 데이터가 끝난 뒤에만 100%로 부드럽게 마무리합니다.
            const finishStart = currentPercent;
            const finishMs = 120;
            const finishStartedAt = Date.now();
            while (Date.now() - finishStartedAt < finishMs) {
                const t = Math.min(1, (Date.now() - finishStartedAt) / finishMs);
                const eased = 1 - Math.pow(1 - t, 2.4);
                updateUI(finishStart + (100 - finishStart) * eased, false);
                await wait(32);
            }

            setTone(true);
            if (elements.loaderBar) {
                elements.loaderBar.classList.remove('loader-motion-live');
                elements.loaderBar.classList.add('loader-motion-done');
            }

            updateUI(100, true);
            await wait(80);
            console.log('[WS MEASURE] welcome loader animation done', `${Date.now() - startedAt}ms`);
        },
        /* =========================================================
        @SUBSECTION: JS_UI_MANAGER_CONFIRMATION_SCREEN
        완료 화면 표시, 카운트다운, 잠금 화면 자동 복귀
        ========================================================= */
        showConfirmationScreen: (title, detailsHtml) => {

            document.getElementById('confirmation-title').textContent = title;
            document.getElementById('confirmation-details').innerHTML = detailsHtml;
            UIManager.showScreen('confirmation');
            clearTransitionTimers();

            const totalSec = 5;
            let sec = totalSec;
            const cd = document.getElementById('confirmation-countdown');
            const ringDash = 201;

            const showAppToast = (message) => {
                try {
                    document.querySelectorAll('.app-toast').forEach(el => el.remove());
                    const toast = document.createElement('div');
                    toast.className = 'app-toast';
                    toast.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${Utils.esc(message)}</span>`;
                    document.body.appendChild(toast);
                    requestAnimationFrame(() => toast.classList.add('show'));
                    setTimeout(() => {
                        toast.classList.remove('show');
                        setTimeout(() => toast.remove(), 280);

                } catch (_) {}
            };

            const returnNow = () => {
                clearTransitionTimers();
                if (cd) {
                    cd.innerHTML = '<div class="confirm-timer-caption">첫 화면으로 복귀 중...</div>';
                }
                showAppToast('첫 화면으로 복귀합니다');
                document.getElementById('screen-confirmation').classList.add('is-hiding');
                /* [2026-08 수정] confirmation-result-mode 제거를 페이드아웃이 끝난 뒤로 미룹니다.
                   먼저 제거하면 숨겨져 있던 타이틀/뒤로가기 버튼이 되살아나며
                   화면이 사라지는 도중에 레이아웃이 밀려 스크롤 잔상처럼 보였습니다. */
                state.confirmLeaveTimeout2 = setTimeout(() => {
                    document.body.classList.remove('confirmation-result-mode');
                    state.forceSyncOnNextUnlock = true;
                    UIManager.showLockScreen();
                }, 250);
            };

            const renderCountdown = () => {
                const ratio = Math.max(0, Math.min(1, (totalSec - sec) / totalSec));
                const offset = Math.round(ringDash * ratio);
                cd.innerHTML = `
                    <div class="confirm-circular-timer" aria-label="${sec}초 뒤 복귀">
                        <svg viewBox="0 0 74 74" aria-hidden="true">
                            <circle class="confirm-timer-bg" cx="37" cy="37" r="32"></circle>
                            <circle class="confirm-timer-ring" cx="37" cy="37" r="32" style="stroke-dashoffset:${offset}"></circle>
                        </svg>
                        <div class="confirm-timer-text">${sec}</div>
                    </div>
                    <div class="confirm-timer-caption">${sec}초 뒤 첫 화면으로 복귀</div>
                `;
            };

            renderCountdown();
            state.countdownInterval = setInterval(() => {
                sec--;
                if (sec > 0) renderCountdown();
                else returnNow();
            }, 1000);
        }
    };
    /* ===== KEYPAD LOGIC ===== */

    /* =========================================================

    - validateAdminPin 서버 호출은 15단계 서버 통신 지도에서 함께 추적
    ========================================================= */
    const KeypadLogic = {
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_STATE_FLAGS
        로그인 화면 입력 활성 여부/타이핑 상태 플래그
        ========================================================= */
        isUserActive: () => {

        },

        /* =========================================================
        @SUBSECTION: JS_KEYPAD_INIT_DASHBOARD
        키패드 버튼 생성과 대시보드 숫자 갱신
        ========================================================= */
        initializeKeypad: () => {
            if (state.__keypadInited) return;
            state.__keypadInited = true;
            elements.keypadContainer.innerHTML = '';
            [{v:'1'},{v:'2'},{v:'3'},{v:'4'},{v:'5'},{v:'6'},{v:'7'},{v:'8'},{v:'9'},{v:'add',c:`<i class="fa-solid fa-user-plus"></i>`},{v:'0'},{v:'bs',c:`<i class="fa-solid fa-delete-left"></i>`}]
            .forEach(({v,c}) => {
                const btn = document.createElement('button');

                btn.className = 'keypad-btn';
                if (v === 'add') {
                    btn.dataset.key = '+';
                    btn.id = 'keypad-add-btn';
                    btn.addEventListener('click', KeypadLogic.handleAddUser);
                } else if (v === 'bs') {
                    btn.dataset.key = 'Backspace';
                    btn.id = 'keypad-back-btn';
                    btn.addEventListener('click', KeypadLogic.processBackspace);
                } else {
                    btn.dataset.key = v;
                    btn.addEventListener('click', () => KeypadLogic.processKeyInput(v));

        updateDashboard: () => {
            if (!state.allCardData) return;
            
            const normalizeCardStatus = (value) => {
                const s = String(value || '').trim().replace(/\s+/g, '');
                if (s === '사용가능' || s === '대여가능' || s === '가능') return '사용가능';
                if (s === '신청중') return '신청중';
                if (s === '사용중' || s === '대여중') return '사용중';
                if (s === '반납처리중') return '반납처리중';
                if (s === '반납오류') return '반납오류';
                return String(value || '').trim();
            };
            const busyStatuses = ['사용중', '신청중', '반납처리중'];
            const available = state.allCardData.filter(c => normalizeCardStatus(c.status) === '사용가능').length;
            const inUse = state.allCardData.filter(c => busyStatuses.includes(normalizeCardStatus(c.status))).length;
            const elAvail = document.getElementById('dash-available');
