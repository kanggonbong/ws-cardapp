        /* =========================================================
        @SUBSECTION: JS_CARD_LIST_RENDERING
        카드 목록 정렬/필터링/버튼 생성
        ========================================================= */
        displayCardList: () => {
            elements.cardGrid.innerHTML = '';

                if(a.id.includes('해외'))return 1;
                if(b.id.includes('해외'))return -1;
                return parseInt(a.id.replace(/\D/g,'')) - parseInt(b.id.replace(/\D/g,''));
            });
            const icon = state.enteredUsers.length > 1 ? 'fa-utensils' : 'fa-credit-card';
            elements.cardSelectionHeader.innerHTML =
                `<i class="fa-solid ${icon}"></i>${state.enteredUsers.length>1?' 사용할 카드를 선택해주세요.':' 사용할 카드를 선택해주세요.'}`;
            const frag = document.createDocumentFragment();
            sorted.forEach((c, i) => frag.appendChild(CardLogic.createCardButton(c, i)));
            elements.cardGrid.appendChild(frag);
            setTimeout(() => elements.cardGrid.classList.add('is-loaded'), 50);
        },
        createCardButton: (card, idx) => {
            const wrap = document.createElement('div');
            wrap.className = 'card-item-wrapper hybrid-card-slot';
            wrap.dataset.cardId = card.id;
            wrap.style.transitionDelay = `${idx * CARD_APPEAR_DELAY_MS}ms`;

            const rawStatus = String(card.status || '').trim();
            const compactStatus = rawStatus.replace(/\s+/g, '');
            const status = (compactStatus === '대여가능' || compactStatus === '사용가능' || compactStatus === '가능') ? '사용가능'
                : (compactStatus === '대여중' ? '사용중' : rawStatus);
            if (status === '사용가능') wrap.classList.add('card-status-available');
            else if (status === '사용중' || status === '신청중') wrap.classList.add('card-status-inuse', 'disabled');
            else if (status === '반납처리중') wrap.classList.add('card-status-returning', 'disabled');
            else if (status === '반납오류') wrap.classList.add('card-status-unknown', 'disabled');
            else wrap.classList.add('card-status-unknown', 'disabled');

            if (String(card.id || '').includes('해외') || String(card.name || '').includes('해외') || String(card.displayName || '').includes('해외')) wrap.classList.add('special-overseas-card');
            wrap.innerHTML = CardLogic.renderCardButtonHTML(card);
            return wrap;
        },
        /* =========================================================
        @SUBSECTION: JS_PURPOSE_RENT_FLOW
        카드 사용 목적 선택 오버레이와 대여 요청
        ========================================================= */
        openMorphOverlay(card) {
            const cardEl = document.querySelector(`.card-item-wrapper[data-card-id="${card.id}"]`);
            const overlay = document.getElementById('morph-overlay');
            if (cardEl && overlay) {
                const rect = cardEl.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                overlay.style.setProperty('--morph-origin-x', `${centerX}px`);
                overlay.style.setProperty('--morph-origin-y', `${centerY}px`);
            }
            const title = document.getElementById('morph-title');
            const actions = document.getElementById('morph-actions');

            const chip = document.getElementById('purpose-card-chip');
            const subheader = document.getElementById('morph-subheader');
            if (chip) chip.textContent = `${card.displayName} 신청`;
            title.textContent = '사용 목적 선택';
            if (subheader) subheader.textContent = '신청할 용도를 선택해 주세요';
            const buttons = [
                { id: '물품구매', icon: 'fa-box', label: '물품구매', desc: '비품 · 소모품 · 행사 준비물' },
                { id: '식사다과', icon: 'fa-mug-hot', label: '식사다과', desc: '식사 · 간식 · 다과' },
                { id: '특근매식', icon: 'fa-utensils', label: '특근매식', desc: '특근 · 매식비' }
            ];
            actions.innerHTML = buttons.map(CardLogic.renderPurposeButtonHTML).join('');
            CardLogic.resetPurposeConfirmation();

        resetPurposeConfirmation() {
            const overlay = document.getElementById('morph-overlay');
            const finalBtn = document.getElementById('btn-final-rent');
            delete overlay.dataset.selectedPurpose;
            document.querySelectorAll('#morph-actions .purpose-btn[data-purpose]').forEach(btn => {
                btn.classList.remove('selected');
                btn.setAttribute('aria-pressed', 'false');
            });
            if (finalBtn) {
                finalBtn.textContent = '목적을 먼저 선택해 주세요';
                finalBtn.classList.remove('unlocked', 'is-submitting');
                finalBtn.disabled = true;
            }
        },
        selectPurposeForConfirmation(purpose, buttonEl) {
            const overlay = document.getElementById('morph-overlay');
            const finalBtn = document.getElementById('btn-final-rent');
            if (!overlay || !purpose) return;
            overlay.dataset.selectedPurpose = purpose;
            document.querySelectorAll('#morph-actions .purpose-btn[data-purpose]').forEach(btn => {
                const isSelected = btn === buttonEl;
                btn.classList.toggle('selected', isSelected);
                btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
            });
            if (finalBtn) {
                finalBtn.textContent = `${purpose} 목적으로 카드 신청 확정`;
                finalBtn.classList.add('unlocked');
                finalBtn.disabled = false;
            }
        },
        executeSelectedPurposeRent() {
            const overlay = document.getElementById('morph-overlay');
            const finalBtn = document.getElementById('btn-final-rent');
            const cardId = overlay?.dataset.cardId;
            const purpose = overlay?.dataset.selectedPurpose;
            if (!cardId || !purpose || CardLogic._rentInFlight) return;
            if (finalBtn) {
                finalBtn.classList.add('is-submitting');
                finalBtn.textContent = '신청 접수 중...';
                finalBtn.disabled = true;
            }
            CardLogic.submitRentRequest(cardId, purpose);
        },
        closeMorphOverlay() {
            const overlay = document.getElementById('morph-overlay');
            overlay.classList.remove('active');
            CardLogic.resetPurposeConfirmation();
            delete overlay.dataset.cardId;
        },
        submitRentRequest(id, purpose) {
            if (CardLogic._rentInFlight) return;
            CardLogic._rentInFlight = true;

            const names = state.enteredUsers.map(u => u.name).join(', ');
            const item = {
                requestId: Utils.createClientRequestId('rent'),
                cardNumber: id,
                userName: names,
                purpose,
                userExtensions: state.enteredUsers.map(u => u.extension),
                createdAt: Date.now()
            };

            /* @PHASE: FINAL_PATCH_RENT_SHOW_SUCCESS_FIRST
               신청자는 바로 반납하지 않는 운영 흐름이므로, 서버 왕복을 기다리지 않고
               즉시 완료 화면을 보여준 뒤 rentNow를 백그라운드 재시도로 확정합니다. */
            CardLogic.enqueuePendingRentRequest(item);
            CardLogic.applyOptimisticRentState(item);
            CardLogic.closeMorphOverlay();
            UIManager.showConfirmationScreen('신청 완료',
                Utils.createDetailRow('카드번호', id)+
                Utils.createDetailRow('사용자', names)+
                Utils.createDetailRow('사용 목적', purpose)
            );
            CardLogic._rentInFlight = false;

            CardLogic.runRentRequestWithRetry(item, { silent: false }).catch(console.error);
        },
        /* =========================================================
        @SUBSECTION: FINAL_PATCH_RENT_BACKGROUND_SYNC
        카드 신청 즉시 완료 후 rentNow 백그라운드 저장/재시도 큐
        ========================================================= */
        getPendingRentRequests() {
            try {
                const raw = localStorage.getItem(RENT_SYNC_STORAGE_KEY);
                const list = JSON.parse(raw || '[]');
                return Array.isArray(list) ? list.filter(x => x && x.requestId && x.cardNumber) : [];
            } catch(e) {
                return [];
            }
        },
        savePendingRentRequests(list) {
            try {
                localStorage.setItem(RENT_SYNC_STORAGE_KEY, JSON.stringify(Array.isArray(list) ? list : []));
            } catch(e) {}
        },
        enqueuePendingRentRequest(item) {
            const list = CardLogic.getPendingRentRequests().filter(x => x.requestId !== item.requestId);
            list.push(item);
            CardLogic.savePendingRentRequests(list);
        },
        removePendingRentRequest(requestId) {
            const list = CardLogic.getPendingRentRequests().filter(x => x.requestId !== requestId);
            CardLogic.savePendingRentRequests(list);
        },
        applyOptimisticRentState(item) {
            const t = state.allCardData?.find(c => c.id === item.cardNumber);
            if (!t) return;
            /* @PHASE: FINAL_PATCH_RENT_PENDING_STATUS
               신청 즉시 완료 후 서버 확정 전까지는 사용중 계열인 '신청중'으로 표시합니다. */
            t.status = '신청중';
            t.userInfo = t.userInfo || {};
            t.userInfo.userName = item.userName;
            t.userInfo.purpose = item.purpose;
            t.userInfo.receiveDate = Utils.formatDateKR();
            t.savedCart = [];
        },
        async runRentRequestWithRetry(item, opts = {}) {
            if (!item || !item.requestId || !item.cardNumber) return false;
            if (!CardLogic._rentSyncing) CardLogic._rentSyncing = {};
            if (CardLogic._rentSyncing[item.requestId]) return false;
            CardLogic._rentSyncing[item.requestId] = true;

            let lastError = null;
            try {
                for (let i = 0; i < RENT_RETRY_DELAYS_MS.length; i++) {
                    const delay = RENT_RETRY_DELAYS_MS[i];
                    if (delay > 0) await new Promise(res => setTimeout(res, delay));
                    try {
                        const r = await Api.call('rentNow', {
                            cardNumber: item.cardNumber,
                            userName: item.userName,
                            purpose: item.purpose,
                            userExtensions: item.userExtensions || [],
                            requestId: item.requestId
                        });
                        if (r?.status === 'conflict') {
                            CardLogic.removePendingRentRequest(item.requestId);
                            state.pendingPostReturnSync = true;
                            CardLogic.scheduleQuickSync(1, 600);
                            if (!opts.silent) {
                                Swal.fire('신청 확인 필요', '이미 사용 중인 카드입니다. 카드 목록을 다시 확인해 주세요.', 'warning');
                            }
                            return false;
                        }
                        CardLogic.removePendingRentRequest(item.requestId);
                        const t = state.allCardData?.find(c => c.id === item.cardNumber);
                        if (t && String(t.status || '').trim() === '신청중') t.status = '사용중';
                        state.pendingPostReturnSync = true;
                        CardLogic.scheduleQuickSync(1, 900);
                        return true;
                    } catch(e) {
                        lastError = e;
                    }
                }

                if (!opts.silent) {
                    Swal.fire({
                        icon: 'warning',
                        title: '신청 처리중',
                        text: '카드는 신청중으로 표시됩니다.',
                        confirmButtonText: '확인'
                    });
                }
                console.warn('rentNow background retry delayed:', lastError);
                return false;
            } finally {
                delete CardLogic._rentSyncing[item.requestId];
            }
        },
        drainPendingRentRequests() {
            const list = CardLogic.getPendingRentRequests();
            if (!list.length) return;
            list.forEach(item => {
                CardLogic.runRentRequestWithRetry(item, { silent: true }).catch(console.error);
            });
        },
        /* =========================================================
        @SUBSECTION: JS_RETURN_SCREEN_LAYOUT
        반납 화면 제목/버튼/권한 안내 구성
        ========================================================= */
        setupAndShowReturnScreen: (card) => {
            state.currentReturnCard = card;
            const isMeal = card.userInfo.purpose && card.userInfo.purpose.includes('특근');
            const form = document.getElementById('return-form-container');
            const dash = document.getElementById('receipt-dashboard');
            form.innerHTML = '';
            if(dash) { dash.classList.remove('hidden'); form.appendChild(dash); }
            /* @PHASE: FINAL_PATCH_RECEIPT_CARD_STATUS_ONLY - 상단 배치 진행바 제거, 각 영수증 카드 상태만 표시 */
            /* @PHASE: JS_RETURN_SCREEN_TITLE_BADGE - 카드명/사용자/목적 배지 구성 */
            let purposeIcon = 'fa-credit-card';
            if(isMeal) purposeIcon = 'fa-utensils';
            else if(card.userInfo.purpose === '물품구매') purposeIcon = 'fa-box';
            else if(card.userInfo.purpose === '식사다과') purposeIcon = 'fa-mug-hot';
            const purpose = (card.userInfo?.purpose || '').trim();
            const showBadge = purpose && purpose !== '일반카드사용';
            const purposeBadgeClass = isMeal ? 'badge-purpose-meal' :
                (purpose === '물품구매' ? 'badge-purpose-purchase' :
                (purpose === '식사다과' ? 'badge-purpose-dining' : 'badge-purpose-default'));
            document.getElementById('return-screen-title').innerHTML =
                `<div class="return-title-stack">
                    <div class="text-gradient return-card-title">
                        ${Utils.esc(card.displayName)}
                    </div>
                    <div class="return-user-name">
                        (${Utils.esc(card.userInfo.userName)})
                    </div>
                    ${showBadge ? `
                    <div class="card-header-badge ${purposeBadgeClass}" style="margin-top:0;">
                        <i class="fa-solid ${purposeIcon}"></i> ${Utils.esc(purpose)}
                    </div>` : ''}
                </div>`;
            /* @PHASE: JS_RETURN_SCREEN_RECEIPT_CONTROLS - 저장된 장바구니와 버튼/안내 영역 구성 */
            state.receiptCart = Utils.sanitizeReceiptCart(card.savedCart || []);
            /* @PHASE: FINAL_PATCH_RECEIPT_RELOAD_CART_ON_RETURN_SCREEN
             * 첫 화면/로그인 화면을 거쳐 다시 반납 화면에 들어올 때,
             * 비동기 getSavedCarts 로딩이 아직 끝나지 않았거나 card.savedCart가 오래된 값이면
             * 서버에 저장된 장바구니를 카드 단위로 한 번 더 확인해 화면에 복원합니다.
             */
            const receiptReloadToken = Utils.createClientRequestId('receipt_reload');
            state.receiptReloadToken = receiptReloadToken;
            const add = document.createElement('button');
            add.id='add-receipt-btn';
            add.className='simple-btn accent';
            add.innerHTML='<i class="fa-solid fa-plus"></i> 영수증 추가';
            add.onclick=()=>CardLogic.triggerImageSelection(-1);
            const cw = document.createElement('div');
            cw.className='cart-wrapper';
            cw.appendChild(Object.assign(document.createElement('div'),{id:'receipt-cart-container'}));
            const guide = document.createElement('div');
            guide.id = 'submit-guide';
            guide.className = 'submit-guide';
            guide.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> <b>내용(상세 내역)</b>이 비어있는 영수증이 있습니다.';
            let subEl = null;
            if (state.isAdminMode) {
                const sub = document.createElement('button');
                sub.id='submit-cart-btn';
                sub.className='simple-btn primary';
                sub.innerHTML='<i class="fa-solid fa-check"></i> 반납 및 제출';
                sub.onclick=CardLogic.submitCart;
                subEl = sub;
            } else {
                const msg = document.createElement('div');
                msg.style.cssText = `
                    width:100%; padding:16px 14px; border-radius:18px;
                    background: rgba(0,122,255,0.08);
                    box-shadow: inset 3px 3px 7px rgba(163,177,198, 0.7), inset -3px -3px 7px rgba(255,255,255, 0.8);
                    color: var(--text-secondary); font-weight:800; text-align:center; line-height:1.5;
                `;
                msg.innerHTML = `행정실에 방문하여<br><span class="text-gradient">행정실 태블릿</span>에서 <b>[반납 및 제출]</b> 버튼을 눌러주세요`;
                subEl = msg;
            }
            form.append(add, cw, guide, subEl);
            /* @PHASE: JS_RETURN_SCREEN_PERMISSION_LOCK - 최초 사용자만 영수증 추가/제출 가능 */
            const prim = card.userInfo.userName.split(',')[0].trim();
            if (state.enteredUsers[0].name !== prim) {
                add.disabled=true; if(subEl && subEl.tagName==='BUTTON') subEl.disabled=true;
                const m=document.createElement('p');
                m.innerHTML=`<strong>${prim}</strong> 님만 반납 가능합니다.`;
                m.style.cssText='color:var(--danger-color);font-weight:600;margin-top:1rem;text-align:center;';
                form.appendChild(m);
            }
            CardLogic.requestRenderReceiptCart();
            UIManager.showScreen('returnDetails');

            /* @PHASE: FINAL_PATCH_RECEIPT_RELOAD_CART_AFTER_ENTER
             * 화면 표시 직후 저장본을 서버에서 재확인합니다.
             * 사용자가 이미 새 영수증을 추가/수정 중이면 덮어쓰지 않습니다.
             */
            setTimeout(() => {
                const expectedCardId = card && card.id;
                const expectedToken = state.receiptReloadToken;
                if (!expectedCardId) return;
                Api.call('getSavedCarts', [expectedCardId])
                    .then(map => {
                        if (state.receiptReloadToken !== expectedToken) return;
                        if (!state.currentReturnCard || state.currentReturnCard.id !== expectedCardId) return;
                        const loaded = Utils.sanitizeReceiptCart((map && map[expectedCardId]) || []);
                        const hasActiveLocalWork = Array.isArray(state.receiptCart) && state.receiptCart.some(it =>
                            it && ['queued','optimizing','ocr','postprocessing','saving','deleting'].includes(it.processing)
                        );
                        if (hasActiveLocalWork) return;
                        const localJson = JSON.stringify(Utils.sanitizeReceiptCart(state.receiptCart || []));
                        const remoteJson = JSON.stringify(loaded);
                        if (remoteJson && remoteJson !== localJson) {
                            state.receiptCart = loaded;
                            card.savedCart = loaded;
                            if (Array.isArray(state.allCardData)) {
                                const targetCard = state.allCardData.find(c => c && c.id === expectedCardId);
                                if (targetCard) targetCard.savedCart = loaded;
                            }
                            CardLogic.requestRenderReceiptCart();
                        }
                    })
                    .catch(err => console.warn('Saved receipt cart reload skipped:', err));
            }, 120);
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_RENDER_STATE
        현재 receiptCart 상태를 실제 DOM에 반영
        ========================================================= */
        renderReceiptCart: () => {
            const c = document.getElementById('receipt-cart-container');
            if (!c || !state.currentReturnCard) return;
            // 예전 저장본 또는 새로고침 직전 저장본에 남은 processing/saving 상태가
            // 화면에 '영수증 분석 중'으로 되살아나는 것을 방지합니다.
            if (Array.isArray(state.receiptCart)) {
                state.receiptCart.forEach(it => {
                    if (!it) return;
                    const img = String(it.receiptImage || '');
                    const staleProcessing = ['queued','optimizing','ocr','postprocessing','saving','saved','deleting'].includes(it.processing);
                    const batchActive = !!(state.receiptBatchProgress && state.receiptBatchProgress.active);
                    if (staleProcessing && img.startsWith('id:') && !batchActive && !it._uiTransient) delete it.processing;
                });
            }
            const isPrim = state.enteredUsers[0].name === state.currentReturnCard.userInfo.userName.split(',')[0].trim();
            const isMeal = state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근');
            /* @PHASE: JS_RECEIPT_CART_TOTAL_AND_ITEMS - 총액 계산과 장바구니 아이템 HTML 생성 */
            let tot = 0;
            c.innerHTML = state.receiptCart.length ? state.receiptCart.map((it, i) => {
                tot += Number(it.amount||0);
                return CardLogic.renderReceiptCartItemHTML(it, i, isMeal);
            }).join('') : `<div class="cart-placeholder"><i class="fa-regular fa-file-lines"></i><span>추가된 영수증이 없습니다.</span></div>`;
            document.getElementById('receipt-total-display').textContent = `${Utils.nfKR.format(tot)}원`;
            c.classList.toggle('empty-cart', state.receiptCart.length===0);
            /* @PHASE: JS_RECEIPT_CART_GUIDE_AND_SUBMIT_STATE - 누락 안내와 제출 버튼 활성화 상태 갱신 */
            const guideEl = document.getElementById('submit-guide');
            const blockingIssues = CardLogic.getBlockingReceiptIssues();
            const hasBlockingIssue = blockingIssues.length > 0;
            if (guideEl) {
                const failedIssues = blockingIssues.filter(x => ['save_error','error'].includes(x.processing));
                const hasEmpty = state.receiptCart.some(r => ((!isMeal) && !(String(r.usageDetails || '').trim()) && (!r.processing || r.processing==='save_error')) || (r.processing==='save_error'));
                if (failedIssues.length > 0) {
                    guideEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> 저장 실패/분석 실패 영수증이 있습니다. 해당 영수증을 눌러 직접 입력하거나 삭제 후 다시 첨부해 주세요.';
                    guideEl.classList.add('visible');
                } else if (hasEmpty && state.receiptCart.length > 0) {
                    guideEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> 사용내역이 비어 있는 영수증이 있습니다. 제출 전 내용을 확인해 주세요.';
                    guideEl.classList.add('visible');
                } else {
                    // 분석/저장 진행 중에는 빨간 실패 안내를 띄우지 않습니다. 진행 상태는 각 영수증 카드 안에서만 표시합니다.
                    guideEl.classList.remove('visible');
                }
            }
            CardLogic.updateReceiptBatchProgressUI();
            const submitBtn = document.getElementById('submit-cart-btn');
            if (submitBtn) submitBtn.disabled = !(state.receiptCart.length > 0 && isPrim) || hasBlockingIssue;
        },
        updateReceiptBatchProgressUI: () => {
            /* @PHASE: FINAL_PATCH_RECEIPT_BATCH_PROGRESS_REMOVED - 상단 전체 진행바는 사용하지 않음 */
            const box = document.getElementById('receipt-batch-progress');
            if (box) box.classList.add('hidden');
        },
        /* =========================================================
        @SUBSECTION: JS_OPERATIONAL_BLOCKING_GUARDS
        장애/진행중 영수증이 있을 때 반납 제출을 막고 복구 행동을 안내합니다.
        ========================================================= */
        getBlockingReceiptIssues: () => {
            if (!Array.isArray(state.receiptCart)) return [];
            return state.receiptCart
                .map((it, idx) => ({ it, idx }))
                .filter(({ it }) => it && ['queued','optimizing','ocr','postprocessing','saving','deleting','review','save_error','error'].includes(it.processing))
                .map(({ it, idx }) => {
                    const label = CardLogic.getReceiptProcessingLabel(it.processing);
                    const place = String(it.usagePlace || `영수증 ${idx + 1}`);
                    return { idx, processing: it.processing, label, place };
                });
        },
        showBlockingReceiptIssues: async (issues = CardLogic.getBlockingReceiptIssues()) => {
            const failedCount = issues.filter(x => ['save_error','error'].includes(x.processing)).length;
            const activeCount = issues.length - failedCount;
            const msg = failedCount
                ? `확인이 필요한 영수증 ${failedCount}건이 있습니다.`
                : `처리 중인 영수증 ${activeCount}건이 있습니다.`;
            await UIManager.showOperationalError({
                title: '반납 전 확인 필요',
                message: msg,
                icon: failedCount ? 'error' : 'warning',
                steps: failedCount
                    ? ['해당 영수증을 눌러 확인해 주세요.', '필요하면 삭제 후 다시 첨부해 주세요.']
                    : ['영수증 처리가 끝난 뒤 다시 제출해 주세요.']
            });
            const first = issues[0];
            if (first) {
                setTimeout(() => {
                    const el = document.querySelector(`.cart-item[data-index="${first.idx}"]`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.classList.add('highlight');
                        setTimeout(() => el.classList.remove('highlight'), 1600);
                    }
                }, 80);
            }
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_MUTATIONS
        영수증 항목 저장/삭제/실패 복구
        ========================================================= */
        saveCartItemOptimistic: async (item, idx, options = {}) => {
            /* @PHASE: JS_RECEIPT_SAVE_OPTIMISTIC_INSERT - 팝업 값을 먼저 화면 state에 반영 */
            if (options.closeSwal !== false) {
                try { Swal.close(); } catch(e) {}
            }
            /* @PHASE: JS_RECEIPT_PREVIEW_CACHE_PRESERVE - 저장 후 id:DriveFileId로 바뀌어도 화면용 base64 미리보기는 로컬에 유지 */
            const previous = idx > -1 ? (state.receiptCart[idx] || {}) : {};
            const cachedPreview = item.previewImage || item.receiptImagePreview || previous.previewImage || previous.receiptImagePreview || (!String(item.receiptImage || '').startsWith('id:') ? item.receiptImage : '');
            const ghost = { ...previous, ...item, processing: 'saving', _uiTransient: true, needsManualReview: false };
            if (cachedPreview) {
                ghost.previewImage = cachedPreview;
                ghost.receiptImagePreview = cachedPreview;
            }
            let targetIdx = idx;
            if (idx > -1) {
                state.receiptCart[idx] = ghost;
            } else {
                state.receiptCart.push(ghost);
                targetIdx = state.receiptCart.length - 1;
            }
            CardLogic.requestRenderReceiptCart();

            /* @PHASE: JS_RECEIPT_SAVE_AUTOSAVE_AND_FEEDBACK - 서버 저장 후 saved/save_error 상태 표시 */
            try {
                await CardLogic.queueSaveCart(null);
                const it = state.receiptCart[targetIdx];
                if (it && it.processing === 'saving') {
                    it.processing = 'saved';
                    CardLogic.requestRenderReceiptCart();
                    setTimeout(() => {
                        const cur = state.receiptCart[targetIdx];
                        if (cur && cur.processing === 'saved') {
                            delete cur.processing;
                            delete cur._uiTransient;
                            CardLogic.requestRenderReceiptCart();
                        }
                    }, 850);
                }
                CardLogic.continueReviewIfNeeded(idx);
                return true;
            } catch (e) {
                const it = state.receiptCart[targetIdx];
                if (it) it.processing = 'save_error';
                CardLogic.requestRenderReceiptCart();
                try {
                    Swal.fire({toast:true, position:'top', icon:'error', title:'저장 실패 · 네트워크 확인 후 다시 시도해주세요', showConfirmButton:false, timer:2500});
                } catch(_) {}
                console.error(e);
                throw e;
            }
        },
        deleteCartItem: (idx) => {
            Swal.fire({title:'삭제 확인',text:"삭제하시겠습니까?",icon:'warning',showCancelButton:true,confirmButtonText:'삭제',cancelButtonText:'취소',confirmButtonColor:'#d33'})
                .then(r => {
                    if (r.isConfirmed) {
                        const org = [...state.receiptCart];
                        state.receiptCart[idx] = { ...state.receiptCart[idx], processing: 'deleting' };
                        CardLogic.requestRenderReceiptCart();
                        const next = [...state.receiptCart];
                        next.splice(idx, 1);
                        state.receiptCart = next;
                        CardLogic.requestRenderReceiptCart();
                        CardLogic.queueSaveCart(org).catch(e => {
                            state.receiptCart = org;
                            CardLogic.requestRenderReceiptCart();
                            UIManager.handleServerError(e);
                        });
                    }
                });
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_OCR_PIPELINE_BATCH
        여러 영수증을 큐에 넣고 압축/OCR/저장까지 처리
        ========================================================= */
        handleReceiptFilesQueued: async (files) => {
            /* @PHASE: JS_RECEIPT_BATCH_CREATE_GHOST_ITEMS - 파일 수만큼 대기 항목을 먼저 만들어 즉시 표시 */
            const startIdx = state.receiptCart.length;
            const isMeal = !!(state.currentReturnCard && state.currentReturnCard.userInfo && String(state.currentReturnCard.userInfo.purpose || '').includes('특근'));
            const newItems = files.map(() => ({
                receiptImage: '',
                usagePlace: '영수증 분석 대기 중...',
                usageDetails: '',
                amount: '',
                date: '',
                processing: 'queued',
                _uiTransient: true
            }));
            state.receiptCart.push(...newItems);
            state.receiptBatchProgress = { active: true, startIdx, total: files.length, done: 0 };
            CardLogic.requestRenderReceiptCart();

            /* @PHASE: JS_RECEIPT_BATCH_PROCESS_ONE_START - 개별 영수증 1장을 압축/OCR/저장까지 처리 */
            const processOne = async (file, i) => {
                const actualIdx = startIdx + i;
                let b64 = '';

                try {
                    /* @PHASE: JS_RECEIPT_BATCH_OPTIMIZE_IMAGE - 브라우저에서 이미지 압축 후 base64 저장 */
                    state.receiptCart[actualIdx].processing = 'optimizing';
                    state.receiptCart[actualIdx].usagePlace = '영수증 압축 중...';
                    CardLogic.requestRenderReceiptCart();

                    b64 = await CardLogic.resizeAndOptimizeImage(file);
                    state.receiptCart[actualIdx].receiptImage = b64;
                    state.receiptCart[actualIdx].processing = 'ocr';
                    state.receiptCart[actualIdx].usagePlace = '영수증 분석 중...';
                    CardLogic.requestRenderReceiptCart();

                    /* @PHASE: JS_RECEIPT_BATCH_CALL_OCR - 서버 OCR/processReceiptImage 호출 */
                    const ocr = await Api.call('processReceiptImage', b64);
                    const analysisFailed = CardLogic.isReceiptAnalysisFailed(ocr);
                    const recognizedAmount = String(ocr && ocr.amount ? ocr.amount : '');
                    let amt = recognizedAmount;

                    /* @PHASE: JS_RECEIPT_BATCH_POSTPROCESS_RESULT - OCR 결과 검증, 특근매식 상한 적용 준비 */
                    state.receiptCart[actualIdx].processing = 'postprocessing';
                    state.receiptCart[actualIdx].usagePlace = analysisFailed ? '직접 입력 필요' : '분석 완료';
                    CardLogic.requestRenderReceiptCart();

                    if (!analysisFailed && isMeal) {
                        amt = String(Utils.clampMealAmount(amt, state.currentReturnCard.userInfo.userName.split(',').length));
                        CardLogic.showMealAutoAdjustToast(recognizedAmount, amt);
                    }

                    if (!ocr || !ocr.tempFileId) {
                        throw new Error('영수증 이미지를 저장하지 못했습니다. 다시 첨부해 주세요.');
                    }

                    state.receiptCart[actualIdx] = {
                        receiptImage: ocr.tempFileId,
                        previewImage: b64,
                        receiptImagePreview: b64,
                        usagePlace: analysisFailed ? '직접 입력 필요' : (ocr.storeName || '상호명 없음'),
                        usageDetails: isMeal ? '특근매식비' : '',
                        amount: analysisFailed ? '' : amt.replace(/[^\d]/g, ''),
                        date: analysisFailed ? '' : (ocr.date || ''),
                        processing: 'saving',
                        _uiTransient: true,
                        needsManualReview: analysisFailed,
                        analysisMeta: {
                            mediaResolution: ocr && ocr.mediaResolution ? ocr.mediaResolution : '',
                            usedFallback: !!(ocr && ocr.usedFallback),
                            elapsedMs: ocr && ocr.elapsedMs ? ocr.elapsedMs : '',
                            imageSaveError: ocr && ocr.imageSaveError ? ocr.imageSaveError : ''
                        }
                    };
                    Utils.haptic(analysisFailed ? [20, 40, 20] : 18);
                    CardLogic.requestRenderReceiptCart();

                    /* @PHASE: JS_RECEIPT_BATCH_SAVE_CART_DEFERRED
                     * 다중 업로드 중에는 개별 파일마다 저장하지 않고 전체 처리 후 한 번만 저장한다.
                     */
                } catch (err) {
                    console.error('Receipt analysis failed:', err);
                    Utils.haptic([20, 40, 20]);
                    state.receiptCart[actualIdx] = {
                        receiptImage: '',
                        previewImage: b64,
                        receiptImagePreview: b64,
                        usagePlace: '이미지 저장 실패',
                        usageDetails: '',
                        amount: '',
                        date: '',
                        processing: 'error',
                        _uiTransient: true,
                        needsManualReview: true,
                        imageSaveError: String(err && err.message ? err.message : err)
                    };
                }

                if (state.receiptBatchProgress && state.receiptBatchProgress.active) {
                    state.receiptBatchProgress.done = Math.min(state.receiptBatchProgress.total, Number(state.receiptBatchProgress.done || 0) + 1);
                }
                CardLogic.requestRenderReceiptCart();
            };

            /* @PHASE: JS_RECEIPT_BATCH_WORKER_POOL - Apps Script/Gemini 과부하 방지를 위해 동시 처리 수 제한 */
            // Apps Script와 Gemini를 동시에 너무 많이 두드리면 오히려 느려질 수 있어 2개씩만 처리합니다.
            const concurrency = Math.min(2, files.length);
            let nextIndex = 0;
            const workers = Array.from({ length: concurrency }, async () => {
                while (nextIndex < files.length) {
                    const i = nextIndex++;
                    await processOne(files[i], i);
                }
            });

            await Promise.allSettled(workers);

            /* @PHASE: JS_RECEIPT_BATCH_SAVE_CART_ONCE - 전체 배치 처리 완료 후 서버 자동저장을 한 번만 실행 */
            try {
                await CardLogic.queueSaveCart(null);
                /* @PHASE: FINAL_PATCH_RECEIPT_BATCH_REVIEW_STATE - 저장 후 확인필요 항목은 카드에 명확히 남김 */
                state.receiptCart.slice(startIdx, startIdx + files.length).forEach((item, offset) => {
                    const idx = startIdx + offset;
                    const cur = state.receiptCart[idx];
                    if (!cur) return;
                    if (cur.needsManualReview) {
                        cur.processing = 'review';
                        cur._uiTransient = true;
                    } else if (cur.processing === 'saved') {
                        cur._uiTransient = true;
                    }
                });
                CardLogic.requestRenderReceiptCart();
            } catch (e) {
                console.error('Batch cart save failed:', e);
                state.receiptCart.slice(startIdx, startIdx + files.length).forEach((item, offset) => {
                    const idx = startIdx + offset;
                    const cur = state.receiptCart[idx];
                    if (cur && cur.processing !== 'error') {
                        cur.processing = 'save_error';
                        cur._uiTransient = true;
                    }
                });
                CardLogic.requestRenderReceiptCart();
                try {
                    Swal.fire({toast:true, position:'top', icon:'error', title:'저장 실패 · 네트워크를 확인해주세요', showConfirmButton:false, timer:2500});
                } catch (_) {}
            }

            /* @PHASE: JS_RECEIPT_BATCH_MANUAL_REVIEW - 직접 확인이 필요한 항목 안내 및 검토 큐 시작 */
            const manualReviewCount = state.receiptCart
                .slice(startIdx, startIdx + files.length)
                .filter(item => item && item.needsManualReview).length;

            if (manualReviewCount > 0) {
                CardLogic.showReceiptAnalysisFallback(false);
            }
            const hardFailCount = state.receiptCart
                .slice(startIdx, startIdx + files.length)
                .filter(item => item && item.processing === 'error').length;
            if (hardFailCount > 0) {
                await UIManager.showOperationalError({
                    title: '처리 실패',
                    message: `${hardFailCount}건의 영수증을 자동 처리하지 못했습니다.`,
                    icon: 'warning',

        async handleReceiptFiles(fileList) {

                if (subBtn) subBtn.disabled = true;
                try {

                } finally {
                    try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}

                const file = files[0];
                const b64 = await CardLogic.resizeAndOptimizeImage(file);
                const ocr = await Api.call('processReceiptImage', b64);
                if (!ocr || !ocr.tempFileId) {
                    throw new Error('영수증 이미지를 저장하지 못했습니다. 다시 첨부해 주세요.');
                }
                const analysisFailed = CardLogic.isReceiptAnalysisFailed(ocr);
                const recognizedAmount = (ocr.amount || '').toString();
                let amt = recognizedAmount;
                if (state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근')) {
                    amt = String(Utils.clampMealAmount(amt, state.currentReturnCard.userInfo.userName.split(',').length));

                }
                UIManager.setLoading(false);
                if (analysisFailed) {

                }
                /* @PHASE: JS_RECEIPT_REPLACE_OPEN_REVIEW_POPUP - 교체 OCR 결과를 확인 팝업으로 전달 */
                await CardLogic.openOcrPopup({

                    amount: analysisFailed ? '' : amt.replace(/[^\d]/g, ""),
                    date: analysisFailed ? '' : (ocr.date || '')

            } catch (e) {
                UIManager.handleServerError(e);
            } finally {
                try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}
                if (addBtn) addBtn.disabled = false;

        /* =========================================================
        @SUBSECTION: JS_RECEIPT_IMAGE_OPTIMIZATION
        브라우저 canvas로 영수증 이미지를 압축/리사이즈
        ========================================================= */
        resizeAndOptimizeImage: async (file) => {
            if (!file || !String(file.type || '').startsWith('image/')) {
                throw new Error('이미지 파일만 업로드할 수 있습니다.');
            }

            const cfg = RECEIPT_IMAGE_OPTIMIZE_CONFIG;
            const MAX_SIDE = cfg.maxSide;
            const TARGET_BYTES = cfg.targetBytes;
            const QUALITY_STEPS = cfg.qualities;

            const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || ''));
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });

            const canvasToBlob = (canvas, quality) => new Promise((resolve) => {
                canvas.toBlob(resolve, 'image/jpeg', quality);
            });

            // EXIF 회전을 반영하여 ImageBitmap을 생성한다. 실패하면 기존 Image 객체 방식으로 폴백한다.
            const loadImageBitmap = async (imgFile) => {
                if ('createImageBitmap' in window) {
                    try {
                        return await createImageBitmap(imgFile, { imageOrientation: 'from-image' });
                    } catch (e) {
                        console.warn('createImageBitmap failed, fallback to Image object:', e);
                    }
                }
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(imgFile);
                    const img = new Image();
                    img.onload = () => {
                        URL.revokeObjectURL(url);
                        resolve(img);
                    };
                    img.onerror = (e) => {
                        URL.revokeObjectURL(url);
                        reject(e);
                    };
                    img.src = url;
                });
            };

            const img = await loadImageBitmap(file);
            const originalW = img.naturalWidth || img.width;
            const originalH = img.naturalHeight || img.height;

            if (!originalW || !originalH) {
                throw new Error('이미지 크기를 읽을 수 없습니다.');
            }

            const scale = Math.min(1, MAX_SIDE / Math.max(originalW, originalH));
            const width = Math.max(1, Math.round(originalW * scale));
            const height = Math.max(1, Math.round(originalH * scale));

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) throw new Error('이미지 캔버스를 만들 수 없습니다.');

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);

            try {
                if (img && typeof img.close === 'function') img.close();
            } catch (e) {}

            let bestBlob = null;
            for (const quality of QUALITY_STEPS) {
                const blob = await canvasToBlob(canvas, quality);
                if (!blob) continue;
                bestBlob = blob;
                if (blob.size <= TARGET_BYTES) break;
            }

            if (!bestBlob) {
                throw new Error('이미지 변환 실패');
            }

            const dataUrl = await blobToDataUrl(bestBlob);

            return dataUrl;
        },

            const tick = async () => {
                n++;
                try {
                    state.pendingPostReturnSync = true;
                    await CardLogic.handlePendingPostReturnSync();
                } catch(e) {}
                if (n >= attempts) return;
                setTimeout(tick, intervalMs);

            const reqId = ++state.syncReqId;

                if (data && !data.error) {
                    state.allCardData = data.allCards;

                    const inUseIds = state.allCardData
                        .filter(c => c.status === '사용중' || c.status === '신청중' || c.status === '반납처리중')
                        .map(c => c.id);
                    if (inUseIds.length) {
                        const carts = await Api.call('getSavedCarts', inUseIds);
                        state.allCardData.forEach(c => c.savedCart = Utils.sanitizeReceiptCart(carts[c.id] || []));
                        state.lastSyncTs = Date.now();
                    }
                }
            } catch(e) {}

        async submitCart() {

            const blockingIssues = CardLogic.getBlockingReceiptIssues();
            if (blockingIssues.length) {
                await CardLogic.showBlockingReceiptIssues(blockingIssues);
                return;
            }

            /* @PHASE: JS_RETURN_SUBMIT_MISSING_DETAILS_CONFIRM - 일반 영수증의 사용내역 누락 확인 */
            const isMeal = state.currentReturnCard && state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근');
            if (!isMeal && state.receiptCart && state.receiptCart.length) {
                const missing = state.receiptCart
                    .map((it, idx) => ({ it, idx }))
                    .filter(x => !(String(x.it.usageDetails || '').trim()));
                if (missing.length) {
                    const ok = await Swal.fire({
                        title: '입력 확인',
                        html: `<b>${missing.length}건</b>의 사용내역이 비어 있습니다.<br>그래도 제출할까요?`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: '그대로 제출',
                        cancelButtonText: '입력하러 가기'
                    });
                    if (!ok.isConfirmed) {
                        const first = missing[0]?.idx;
                        setTimeout(() => {
                            const el = document.querySelector(`.cart-item[data-index="${first}"]`);
                            if (el) {
                                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                el.classList.add('highlight');
                                setTimeout(() => el.classList.remove('highlight'), 1500);
                            }
                        }, 50);
                        return;
                    }
                }
            }
            /* @PHASE: JS_RETURN_SUBMIT_EMPTY_CART_CONFIRM - 영수증 없이 반납하려는 경우 확인 */
            if (!state.receiptCart.length) {
                const ok = await Swal.fire({title:'영수증 없음',text:'영수증 없이 반납하시겠습니까?',icon:'warning',showCancelButton:true,confirmButtonText:'영수증 없이 반납',cancelButtonText:'취소'});
                if (!ok.isConfirmed) return;
            }

            CardLogic._submitInFlight = true;
            const btn = document.getElementById('submit-cart-btn');
            if(btn) { btn.disabled = true; btn.classList.add('is-loading'); }
            const params = {
                adminPin: state.isAdminMode ? (state.adminPinCache || '') : '',
                cardNumber: state.currentReturnCard.id,
                receiveDate: state.currentReturnCard.userInfo.receiveDate,
                userName: state.enteredUsers.map(u=>u.name).join(', '),
                multiEntries: JSON.stringify(Utils.sanitizeReceiptCart(state.receiptCart))
            };
            let delayedReturnLoadingTimer = null;
            let delayedReturnLoadingShown = false;
            const originalSubmitText = btn ? btn.textContent : '';
            if (btn) btn.textContent = '반납 처리중...';
            try {
                /* @PHASE: JS_RETURN_DELAYED_LOADING - 0.8초 이내 접수는 중앙 로딩을 띄우지 않고 버튼 상태만 표시 */
                delayedReturnLoadingTimer = setTimeout(() => {
                    delayedReturnLoadingShown = true;
                    try {
                        Swal.fire({
                            title: '반납 처리중',
                            allowOutsideClick: false,
                            allowEscapeKey: false,
                            showConfirmButton: false,
                            didOpen: () => { try { Swal.showLoading(); } catch(e) {} }
                        });
                    } catch(e) {}
                }, 800);

                await Api.call('queueReturnRequest', params);
                if (delayedReturnLoadingTimer) clearTimeout(delayedReturnLoadingTimer);
                if (delayedReturnLoadingShown) { try { if (window.Swal && Swal.isVisible()) Swal.close(); } catch(e) {} }

                const t = state.allCardData.find(c => c.id === params.cardNumber);
                if (t) t.status = '반납처리중';
                const returnTotalAmount = (state.receiptCart || []).reduce((sum, it) => sum + (Number(it?.amount || 0) || 0), 0);
                UIManager.showConfirmationScreen('반납 처리 완료',
                    Utils.createDetailRow('카드번호', params.cardNumber) +
                    Utils.createDetailRow('영수증', `${state.receiptCart.length}건 접수`) +
                    Utils.createDetailRow('금액', `${Utils.nfKR.format(returnTotalAmount)}원`)
                );
                state.forceSyncOnNextUnlock = true;
                state.pendingPostReturnSync = true;
                CardLogic.scheduleQuickSync(3, 1200);
            } catch (e) {
                if (delayedReturnLoadingTimer) clearTimeout(delayedReturnLoadingTimer);
                if (delayedReturnLoadingShown) { try { if (window.Swal && Swal.isVisible()) Swal.close(); } catch(_) {} }
                state.lastReturnSubmitError = { cardNumber: params.cardNumber, message: Utils.getErrorMessage(e), at: new Date().toISOString() };
                clearInterval(state.countdownInterval);
                if(btn) { btn.disabled = false; btn.classList.remove('is-loading'); btn.textContent = originalSubmitText || '반납 제출'; }
                await UIManager.showOperationalError({
                    title: '반납 처리 실패',
                    error: e,
                    steps: [
                        '다시 반납 제출을 눌러 주세요.',
                        '반복 실패하면 카드 상태를 확인해 주세요.'
                    ]
                });
            } finally {
                CardLogic._submitInFlight = false;
            }
        }

    };

    /* =========================================================
    @SECTION: REFACTOR_STAGE_6_COMPLETION_NOTE
    6차 장애 상황 UX 정리 완료.
    - OCR/영수증 저장/반납 제출 실패 시 중앙 모달과 복구 행동을 제공합니다.
    - 실패/진행중 영수증이 있으면 반납 제출 버튼을 비활성화합니다.
    - 기존 API명, GAS 흐름, PDF 큐 처리 구조는 변경하지 않았습니다.
    ========================================================= */
    /* =========================================================
    @SECTION: JS_APP_SEQUENCE
    앱 시작/잠금 해제 뒤 데이터 동기화와 로딩 진행률 처리
    ========================================================= */
    async function initializeAppSequence() {
        const reqId = ++state.syncReqId;
        elements.welcomeScreen.classList.remove('hidden');
        elements.welcomeScreen.classList.add('is-visible');
        UIManager.currentScreenElement = elements.welcomeScreen;
        state.currentScreen = 'welcome';
        elements.contentWrapper.style.display = 'flex';
        await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
        requestAnimationFrame(() => elements.lockScreen.classList.add('fade-out'));
        const hideLockAfterFade = () => {
            const onEnd = (ev) => {
                if (ev.propertyName !== 'opacity') return;
                elements.lockScreen.removeEventListener('transitionend', onEnd);
                try { elements.lockScreen.style.display = 'none'; } catch(e) {}
            };
            elements.lockScreen.addEventListener('transitionend', onEnd);
        };
        hideLockAfterFade();
        let isDataLoaded = false;
        const dataPromise = Api.call('getInitialAppData')
            .then(r => { isDataLoaded = true; return r; })
            .catch(e => { isDataLoaded = true; throw e; });
        await UIManager.runRandomLoader(() => isDataLoaded);
        elements.welcomeScreen.classList.remove('is-visible');
        elements.welcomeScreen.classList.add('is-hiding');
        setTimeout(() => {
            elements.welcomeScreen.classList.add('hidden');
            elements.welcomeScreen.classList.remove('is-hiding');
            elements.lockScreen.classList.add('hidden');
        }, 400);
        try {
            const data = await dataPromise;
            if (!data || data.error) throw new Error(data?.error || 'No Data');
            if (reqId !== state.syncReqId) return;
            state.allCardData = data.allCards;
            state.allUsersData = data.allUsers;
            state.lastSyncTs = Date.now();
            setTimeout(() => CardLogic.drainPendingRentRequests(), 800);
            const inUseIds = state.allCardData
                .filter(c => c.status === '사용중' || c.status === '신청중' || c.status === '반납처리중')
                .map(c => c.id);
            if (inUseIds.length) {
                Api.call('getSavedCarts', inUseIds)
                    .then(map => state.allCardData.forEach(c => c.savedCart = Utils.sanitizeReceiptCart(map[c.id] || [])))
                    .catch(console.error);
            }
            UIManager.showScreen('login');
        } catch (e) {
            state.allCardData = [];
            state.allUsersData = [];
            UIManager.showScreen('login');
        }
        UIManager.startInactivityDetection();
    }
    /* =========================================================
    @SECTION: JS_LOCK_SCREEN
    카드 잠금 화면 클릭 → 로더 → 로그인 화면 진입 흐름
    ========================================================= */
    async function handleLockScreenClick() {
        if (state.isAppActive && state.currentScreen !== 'lock') return;
        state.isAppActive = true;
        state.cardTiltActive = false;
        state.forceSyncOnNextUnlock = false;
        state.pendingPostReturnSync = false;
        state.syncPromise = null;
        elements.lockScreen.classList.add('active-pop');
        document.getElementById('lock-text-instruction').classList.add('hide');

        /*
          행정실 키오스크 갱신 규칙:
          - 화면이 다시 켜질 때는 잠금화면으로만 복귀합니다.
          - 실제 카드/사용자 최신 데이터는 잠금화면 카드를 누른 이 순간,
            로딩 화면을 거치며 getInitialAppData로 항상 새로 가져옵니다.
        */
        requestAnimationFrame(() => {
            setTimeout(() => initializeAppSequence(), 0);
        });
    }
    /* =========================================================
    @SECTION: JS_EVENT_LISTENERS
    화면 공통 클릭/키보드/파일 input/카드 tilt 등록
    3차 기준: 이 구역은 이벤트 라우터입니다. 여기서 직접 업무 처리를 늘리지 말고 UIManager/KeypadLogic/CardLogic으로 위임합니다.
    ========================================================= */
    /* =========================================================
    @SUBSECTION: JS_EVENT_LISTENER_MAP
    전역 클릭/키보드/파일 input/뒤로가기 이벤트 바인딩
    라우팅 기준:
    - 잠금화면/뒤로가기/화면 이동: UIManager 또는 initializeAppSequence
    - 내선번호/키보드 입력: KeypadLogic
    - 카드 클릭/목적 선택/최종 신청/영수증/반납 제출: CardLogic
    - 파일 input change: CardLogic.handleReceiptFiles
    ========================================================= */
    function setupEventListeners() {
        elements.screens = {
            login: document.getElementById('screen-login'),
            main: document.getElementById('screen-main'),
            returnDetails: document.getElementById('screen-return-details'),
            confirmation: document.getElementById('screen-confirmation')
        };
        elements.btnBack = document.getElementById('btn-back');
        elements.welcomeScreen = document.getElementById('welcome-screen');
        elements.mainTitle = document.getElementById('main-title-container');
        let adminTapCount = 0;
        let adminTapTimer = null;
        function resetAdminTap(){
            adminTapCount = 0;
            if (adminTapTimer) clearTimeout(adminTapTimer);
            adminTapTimer = null;
        }
        if (elements.mainTitle) {
            elements.mainTitle.addEventListener('click', async () => {
                adminTapCount++;
                if (!adminTapTimer) adminTapTimer = setTimeout(resetAdminTap, 1500);
                if (adminTapCount >= 5) {
                    resetAdminTap();
                    if (state.isAdminMode) {
                        const r = await Swal.fire({
                            title: '관리자 모드',
                            text: '관리자 모드를 해제(잠금)할까요?',
                            icon: 'question',
                            showCancelButton: true,
                            confirmButtonText: '해제',
                            cancelButtonText: '유지'
                        });
                        if (r.isConfirmed) setAdminMode(false);
                        return;
                    }
                    const res = await Swal.fire({
                        title: '행정실 PIN 입력',
                        input: 'password',
                        inputAttributes: { autocapitalize: 'off', inputmode: 'numeric' },
                        confirmButtonText: '확인',
                        showCancelButton: true,
                        cancelButtonText: '취소',
                    });
                    if (res.isConfirmed) {
                        const pin = String(res.value || '').trim();
                        const result = await Api.call('validateAdminPin', pin);
                        if (result && result.ok) {
                            setAdminMode(true, pin);
                        } else if (result && result.locked) {
                            Swal.fire('잠시 후 다시 시도', `PIN 입력이 잠겼습니다. 약 ${result.remainingSeconds || 300}초 후 다시 시도해 주세요.`, 'warning');
                        } else {
                            const msg = result && result.remainingAttempts != null
                                ? `PIN이 올바르지 않습니다. 남은 시도: ${result.remainingAttempts}회`
                                : 'PIN이 올바르지 않습니다.';
                            Swal.fire('실패', msg, 'error');
                        }
                    }
                }
            });
        }
        elements.lockScreen = document.getElementById('lock-screen');
        elements.glassCardContainer = document.getElementById('glass-card-container');
        elements.contentWrapper = document.querySelector('.content-wrapper');
        elements.loaderBar = document.getElementById('loader-bar');
        elements.keypadContainer = document.getElementById('keypadContainer');
        elements.keypadDisplay = document.getElementById('keypadDisplay');
        elements.keypadSubmitBtn = document.getElementById('keypad-submit-btn');
        elements.loginInstruction = document.getElementById('login-instruction');
        elements.loginUserTags = document.getElementById('login-user-tags');
        elements.cardGrid = document.getElementById('cardGrid');
        elements.cardSelectionHeader = document.getElementById('card-selection-header');

        /*
          행정실 태블릿 화면 깨움 처리:
          태블릿 키오스크에서 화면이 꺼졌다가 다시 보이면 서버를 호출하지 않고 세션만 청소한 뒤
          잠금화면으로 복귀합니다. PC 개발/테스트 환경에서는 탭 전환만으로 잠금화면에 가지 않도록 제한합니다.
          최신 데이터 갱신은 잠금화면 카드 터치 시 로딩 단계에서만 실행됩니다.
        */
        function isKioskTabletDevice() {
            const ua = navigator.userAgent || '';
            const platform = navigator.platform || '';
            const hasTouch = (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            const shortSide = Math.min(window.innerWidth || 0, window.innerHeight || 0);
            const longSide = Math.max(window.innerWidth || 0, window.innerHeight || 0);
            const tabletSize = shortSide >= 600 && shortSide <= 1100 && longSide >= 800 && longSide <= 1400;
            const isiPad = /iPad/i.test(ua) || (platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
            const isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
            return hasTouch && (isiPad || isAndroidTablet || tabletSize);
        }

        function hasActiveReceiptWork(){
            try {
                const cart = Array.isArray(state.receiptCart) ? state.receiptCart : [];
                return cart.some(it => {
                    const status = String((it && (it.status || it.phase)) || '').toLowerCase();
                    return !!(it && (it.processing || it.isProcessing || it.isSaving || ['queued','ocr','saving','save_error','processing'].includes(status)));
                }) || !!CardLogic._submitInFlight;
            } catch(e) { return false; }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            if (!isKioskTabletDevice()) return;
            if (state.currentScreen === 'lock') return;
            try {
                if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                    // 영수증 입력/저장/관리자 확인 등 사용자가 조작 중인 모달은 강제로 닫지 않습니다.
                    return;
                }
            } catch(e) {}
            if (hasActiveReceiptWork()) return;
            UIManager.showLockScreen();
        });

        elements.glassCardContainer.addEventListener('click', handleLockScreenClick);
        elements.btnBack.addEventListener('click', UIManager.resetToLogin);
        document.addEventListener('click', (e) => {
            const cardEl = e.target.closest('.card-item-wrapper[data-card-id]');
            if (cardEl && elements.cardGrid.contains(cardEl)) {
                const card = state.allCardData?.find(c => c.id === cardEl.dataset.cardId);
                if (card && ['사용가능','대여가능','사용 가능','대여 가능'].includes(String(card.status || '').trim())) {
                    /* @PHASE: FINAL_PATCH_CARD_SELECT_FEEDBACK - 목적 선택 전 카드 자체 선택 애니메이션 */
                    cardEl.classList.add('rent-clicked');
                    setTimeout(() => {
                        try { CardLogic.openMorphOverlay(card); } finally {
                            setTimeout(() => cardEl.classList.remove('rent-clicked'), 260);
                        }
                    }, 150);
                    return;
                }
            }

            const purposeBtn = e.target.closest('.purpose-btn[data-purpose]');
            const morphActions = document.getElementById('morph-actions');
            if (purposeBtn && morphActions && morphActions.contains(purposeBtn)) {
                const overlay = document.getElementById('morph-overlay');
                const cardId = overlay?.dataset.cardId;
                if (cardId) {
                    CardLogic.selectPurposeForConfirmation(purposeBtn.dataset.purpose, purposeBtn);
                    return;
                }
            }

            const finalRentBtn = e.target.closest('#btn-final-rent');
            if (finalRentBtn) {
                CardLogic.executeSelectedPurposeRent();
                return;
            }

            const cartDeleteBtn = e.target.closest('.cart-item-delete, .cart-item-delete-wide');
            if (cartDeleteBtn) {
                const cartItem = cartDeleteBtn.closest('.cart-item[data-index]');
                const cartContainer = document.getElementById('receipt-cart-container');
                if (cartItem && cartContainer && cartContainer.contains(cartItem)) {
                    const prim = state.currentReturnCard?.userInfo?.userName?.split(',')[0]?.trim();
                    if (!prim || state.enteredUsers[0]?.name !== prim) return;
                    e.stopPropagation();
                    CardLogic.deleteCartItem(cartItem.dataset.index);
                    return;
                }
            }

            const cartItem = e.target.closest('.cart-item[data-index]');
            const cartContainer = document.getElementById('receipt-cart-container');
            if (cartItem && cartContainer && cartContainer.contains(cartItem)) {
                const prim = state.currentReturnCard?.userInfo?.userName?.split(',')[0]?.trim();
                if (!prim || state.enteredUsers[0]?.name !== prim) return;
                if (cartItem.classList.contains('processing')) return;
                const idx = Number(cartItem.dataset.index);
                if (Number.isInteger(idx) && state.receiptCart[idx]) {
                    CardLogic.openOcrPopup(state.receiptCart[idx], idx);
                }
            }
        });
        const fileInput = document.getElementById('receipt-file-input');
        if (fileInput) {
            fileInput.addEventListener('change', e => {
                if (e.target.files && e.target.files.length) { CardLogic.handleReceiptFiles(e.target.files); }
            });
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (Swal.isVisible()) { Swal.close(); return; }
                const overlay = document.getElementById('morph-overlay');
                if (overlay && overlay.classList.contains('active')) { e.preventDefault(); CardLogic.closeMorphOverlay(); return; }
                switch(state.currentScreen) {
                    case 'returnDetails': UIManager.showScreen('main'); break;
                    case 'main': UIManager.resetToLogin(); break;
                    case 'login': UIManager.showLockScreen(); break;
                }
                return;
            }
            if (Swal.isVisible() || state.currentScreen !== 'login') return;
            if (e.key >= '0' && e.key <= '9') KeypadLogic.processKeyInput(e.key);
            else if (e.key === 'Enter') { e.preventDefault(); if (!elements.keypadSubmitBtn.disabled) KeypadLogic.processLogin(); }
            else if (e.key === '+') { e.preventDefault(); KeypadLogic.handleAddUser(); }
            else if (e.key === 'Backspace') { e.preventDefault(); KeypadLogic.processBackspace(); }
        });
        window.addEventListener('beforeunload', (e) => {
            const unsafeStates = ['queued', 'optimizing', 'ocr', 'postprocessing', 'saving', 'save_error'];
            const hasUnsavedReceiptWork = Array.isArray(state.receiptCart) &&
                state.receiptCart.some(it => it && unsafeStates.includes(it.processing));

            if (hasUnsavedReceiptWork || state.syncInFlight) {
                e.preventDefault();
                return '';
            }
        });
        const cont = elements.glassCardContainer;
        const card = document.getElementById('glass-card');
        if(cont && card) {
            let rect;
            const cache = () => rect = cont.getBoundingClientRect();
            window.addEventListener('resize', cache);
            cont.addEventListener('pointerenter', cache);
            const onMove = e => {
                if (!state.cardTiltActive || !rect || state.currentScreen !== 'lock') return;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                card.style.transform = `rotateX(${((cy-rect.top)/rect.height-.5)*-10}deg) rotateY(${((cx-rect.left)/rect.width-.5)*10}deg)`;
            };
            document.body.addEventListener('mousemove', onMove);
            document.body.addEventListener('touchmove', onMove);
            cont.addEventListener('pointerleave', () => { if(state.cardTiltActive) card.style.transform = 'rotateX(0) rotateY(0)'; });
            cache();
        }
    }
    /* =========================================================
    @SECTION: JS_CONFIRMATION
    완료 화면 렌더링 수정 위치:
    @SUBSECTION: JS_UI_MANAGER_CONFIRMATION_SCREEN
    ========================================================= */
    return {
        init: () => {
            setupEventListeners();
            KeypadLogic.initializeKeypad();
        }
    };
})();
/* =========================================================
  @SECTION: JS_BOOTSTRAP
  DOM 준비 후 앱 시작. 새 초기화 로직은 CardApp.init 안에 추가합니다.
========================================================= */
document.addEventListener('DOMContentLoaded', () => {
    try { CardApp.init(); }
    catch (e) { Swal.fire('Error', 'Init Fail: ' + e.message, 'error'); }
});

/* =========================================================
  @SECTION: REFACTOR_STAGE_3_COMPLETION_NOTE
  3차 JS 책임 분리 강화 완료 기록
  - 실제 파일 분리 없이 단일 HTML 구조 유지
  - UIManager / KeypadLogic / CardLogic / Receipt / Event Router 책임 경계 강화
  - 기존 함수명, API 호출명, rentNow/returnCard/submitReturn 흐름 유지
  - 4차에서는 CSS/디자인 책임 정리와 override 역할 정리를 진행합니다.
========================================================= */
</script>


<!-- =========================================================
  @SECTION: PWA_SERVICE_WORKER_REGISTER
  GitHub Pages PWA 설치 조건 충족을 위한 service worker 등록
========================================================= -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((error) => {
        console.warn('Service Worker registration failed:', error);
      });
    });
  }
</script>


<script>
(function(){
  function animateDashboardCounts(){
    const avail=document.getElementById('dash-available');
    const inuse=document.getElementById('dash-inuse');
    const fill=document.getElementById('dash-mini-fill');
    const percent=document.getElementById('dash-progress-percent');

    if(!avail || !inuse) return;

    const a=parseInt(avail.textContent||'0',10)||0;
    const b=parseInt(inuse.textContent||'0',10)||0;
    const total=a+b;
    const ratio=total>0?(b/total)*100:0;

    if(fill) fill.style.width=ratio+'%';
    if(percent) percent.textContent=Math.round(ratio)+'%';
  }

  const observer=new MutationObserver(()=>{
    animateDashboardCounts();
  });

  window.addEventListener('load',()=>{
    const a=document.getElementById('dash-available');
    const b=document.getElementById('dash-inuse');

    if(a) observer.observe(a,{childList:true});
    if(b) observer.observe(b,{childList:true});

    animateDashboardCounts();
  });
})();
</script>

<script id="woosung-fast-touch-keypad-final">
/* =========================================================
  @SECTION: WOOSUNG_FAST_TOUCH_KEYPAD_FINAL
  모바일/태블릿 키패드 빠른 터치 반응 보정
========================================================= */
(function() {
  const isFastTouchDevice = () => {
    try {
      return (
        window.matchMedia &&
        window.matchMedia('(pointer: coarse)').matches
      ) || navigator.maxTouchPoints > 0;
    } catch (e) {
      return navigator.maxTouchPoints > 0;
    }
  };

  if (!isFastTouchDevice()) return;

  let suppressTrustedClickUntil = 0;
  let lastFastButton = null;
  let lastFastTouchAt = 0;
  let dispatchingSyntheticClick = false;

  const FAST_CLICK_SUPPRESS_MS = 650;
  const TOUCHSTART_GUARD_MS = 420;

  function getFastKeypadButton(target) {
    if (!target || !target.closest) return null;
    const btn = target.closest(
      '#screen-login .keypad-btn, ' +
      '#screen-login #keypad-submit-btn, ' +
      '#screen-login #keypad-add-btn, ' +
      '#screen-login #keypad-back-btn'
    );
    if (!btn) return null;
    if (btn.disabled || btn.getAttribute('aria-disabled') === 'true') return null;
    return btn;
  }

  function pressVisual(btn) {
    try {
      btn.classList.remove('pressed');
      void btn.offsetWidth;
      btn.classList.add('pressed');
      clearTimeout(btn.__woosungFastPressedTimer);
      btn.__woosungFastPressedTimer = setTimeout(() => {
        btn.classList.remove('pressed');
      }, 95);
    } catch (e) {}
  }

  function haptic() {
    try {
      if (navigator && typeof navigator.vibrate === 'function') {
        navigator.vibrate(8);
      }
    } catch (e) {}
  }

  function runButtonNow(btn, ev) {
    const now = Date.now();

    // pointerdown과 touchstart가 동시에 오는 브라우저에서 중복 방지
    if (lastFastButton === btn && now - lastFastTouchAt < TOUCHSTART_GUARD_MS) {
      if (ev && ev.cancelable) ev.preventDefault();
      if (ev) ev.stopPropagation();
      return;
    }

    lastFastButton = btn;
    lastFastTouchAt = now;
    suppressTrustedClickUntil = now + FAST_CLICK_SUPPRESS_MS;

    if (ev && ev.cancelable) ev.preventDefault();
    if (ev) ev.stopPropagation();

    pressVisual(btn);
    haptic();

    // 기존 click 핸들러를 그대로 재사용하되, 손가락 닿는 순간 실행
    dispatchingSyntheticClick = true;
    try {
      btn.click();
    } finally {
      setTimeout(() => {
        dispatchingSyntheticClick = false;
      }, 0);
    }
  }

  function handlePointerDown(ev) {
    if (!isFastTouchDevice()) return;
    if (ev.pointerType && ev.pointerType !== 'touch' && ev.pointerType !== 'pen') return;

    const btn = getFastKeypadButton(ev.target);
    if (!btn) return;

    runButtonNow(btn, ev);
  }

  function handleTouchStart(ev) {
    if (!isFastTouchDevice()) return;

    const btn = getFastKeypadButton(ev.target);
    if (!btn) return;

    runButtonNow(btn, ev);
  }

  function suppressDelayedClick(ev) {
    if (!isFastTouchDevice()) return;

    const btn = getFastKeypadButton(ev.target);
    if (!btn) return;

    // pointerdown에서 직접 실행한 synthetic click은 허용
    if (dispatchingSyntheticClick || ev.isTrusted === false) return;

    // 손가락을 뗄 때 뒤늦게 발생하는 실제 click은 중복 방지
    if (Date.now() < suppressTrustedClickUntil && btn === lastFastButton) {
      if (ev.cancelable) ev.preventDefault();
      ev.stopImmediatePropagation();
      ev.stopPropagation();
    }
  }

  function applyFastTouchCss() {
    if (document.getElementById('woosung-fast-touch-keypad-style')) return;

    const style = document.createElement('style');
    style.id = 'woosung-fast-touch-keypad-style';
    style.textContent = `
      @media (pointer: coarse) {
        #screen-login .keypad-grid,
        #screen-login .keypad-btn,
        #screen-login #keypad-submit-btn,
        #screen-login #keypad-add-btn,
        #screen-login #keypad-back-btn {
          touch-action: manipulation !important;
          -webkit-tap-highlight-color: transparent !important;
        }

        #screen-login .keypad-btn,
        #screen-login #keypad-submit-btn {
          transition:
            transform 0.045s ease,
            box-shadow 0.045s ease,
            color 0.045s ease,
            filter 0.045s ease !important;
          will-change: transform;
        }

        #screen-login .keypad-btn.pressed {
          transform: scale(0.97) !important;
        }

        #screen-login #keypad-submit-btn.pressed {
          transform: scale(0.985) !important;
        }
      }
    `;
    document.head.appendChild(style);
  }

  function initFastTouch() {
    applyFastTouchCss();

    // capture 단계에서 먼저 처리해야 기존 click보다 즉시 반응함
    document.addEventListener('pointerdown', handlePointerDown, {
      capture: true,
      passive: false
    });

    // 일부 구형 iOS WebView 대응
    document.addEventListener('touchstart', handleTouchStart, {
      capture: true,
      passive: false
    });

    document.addEventListener('click', suppressDelayedClick, {
      capture: true,
      passive: false
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initFastTouch, { once: true });
  } else {
    initFastTouch();
  }
})();
</script>
