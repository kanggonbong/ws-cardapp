<script>
/* ===== APP CONFIG ===== */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const WORKER_API_URL = 'https://wscard.kang7762ek.workers.dev';
const isMobile = window.matchMedia('(max-width: 767px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
/* ===== API BRIDGE ===== */
const Api = {
    call: async (func, ...args) => {
        if (IS_GAS) {
            return new Promise((resolve, reject) => {
                google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[func](...args);
            });
        }

        const response = await fetch(WORKER_API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ func, args })
        });

        const data = await response.json();
        if (!response.ok || !data.ok) {
            throw new Error(data && data.error ? data.error : `HTTP_${response.status}`);
        }
        return data.result;
    }
};
function triggerKeypadVisualPress(key){
    try{
        let selector = null;
        if (/^[0-9]$/.test(String(key))) selector = `.keypad-btn[data-key="${key}"]`;
        else if (key === 'Backspace') selector = '#keypad-back-btn';
        else if (key === 'Enter') selector = '#keypad-submit-btn';
        else if (key === '+') selector = '#keypad-add-btn';
        if (!selector) return;
        const btn = document.querySelector(selector);
        if (!btn) return;
        btn.classList.remove('pressed');
        void btn.offsetWidth;
        btn.classList.add('pressed');
        clearTimeout(btn._pressedTimer);
        btn._pressedTimer = setTimeout(() => {
            btn.classList.remove('pressed');
        }, 120);
    } catch(e) {}
}
/* ===== APP ROOT ===== */
const CardApp = (function() {
    const MEAL_CAP_PER_PERSON = 9000;
    const INACTIVITY_MS = 3 * 60 * 1000;
    const CARD_APPEAR_DELAY_MS = 50;
    /* ===== APP STATE ===== */
    let state = {
        syncReqId: 0,
        cartSaveTimer: null,
        cartSaveToken: 0,
        _renderReceiptScheduled: false,
        syncPromise: null,
        syncInFlight: false,
        lastSyncTs: null,
        allCardData: null,
        allUsersData: null,
        keypadValues: [null, null, null, null],
        inputTimers: [null, null, null, null],
        activeDigitIndex: 0,
        enteredUsers: [],
        currentReturnCard: null,
        receiptCart: [],
        pendingEditIndex: -1,
        currentScreen: 'lock',
        isAppActive: false,
        __keypadInited: false,
        cardTiltActive: true,
        countdownInterval: null,
        inactivityTimer: null,
        confirmLeaveTimeout1: null,
        confirmLeaveTimeout2: null,
        loginTyping: false,
        isAdminMode: false,
        adminSince: null,
        adminPinCache: null,
        pendingPostReturnSync: false,
        forceSyncOnNextUnlock: false
    };
    let elements = {};
    async function safeUpdate(updateFn, serverCallFn, rollbackFn, cardId) {
        let originalCardData = null;
        if (cardId) {
            const target = state.allCardData.find(c => c.id === cardId);
            originalCardData = JSON.parse(JSON.stringify(target));
        }
        try {
            updateFn(state, cardId);
            await serverCallFn();
        } catch (e) {
            if (cardId && originalCardData) Object.assign(state.allCardData.find(c => c.id === cardId), originalCardData);
            if (rollbackFn) rollbackFn(e);
            throw e;
        }
    }
    function setAdminMode(on, pin=null){
        state.isAdminMode = !!on;
        if (state.isAdminMode) {
            const ts = new Date().toISOString();
            state.adminSince = ts;
            if (pin) {
                state.adminPinCache = String(pin);
            }
            Swal.fire({toast:true, position:'top', icon:'success', title:'행정실 관리자 모드 ON', showConfirmButton:false, timer:1800});
        } else {
            state.adminSince = null;
            state.adminPinCache = null;
            Swal.fire({toast:true, position:'top', icon:'info', title:'관리자 모드 OFF', showConfirmButton:false, timer:1800});
        }
    }
    /* ===== UTILS ===== */
    const Utils = {
        nfKR: new Intl.NumberFormat('ko-KR'),
        formatDateKR(d=new Date()){
            try{
                const parts=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
                const get=k=>parts.find(p=>p.type===k)?.value;
                return `${get('year')}-${get('month')}-${get('day')}`;
            }catch(e){
                return new Date().toISOString().split('T')[0];
            }
        },
        esc(s=''){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); },
        createDetailRow(label, content){
            return `<div class="detail-row"><span class="detail-row-label">${this.esc(label)}</span><span class="detail-row-content">${this.esc(content)}</span></div>`;
        },
        celebrate(){ try{ confetti({particleCount:120,spread:80,origin:{y:.6}}); }catch(_){} },
        clampMealAmount(amt, cnt){
            const entered=parseInt((amt||'').replace(/[^\d]/g,''),10)||0;
            const cap=(Math.max(1,cnt))*MEAL_CAP_PER_PERSON;
            const clamped=Math.min(entered,cap);
            if(entered>cap) Swal.fire({toast:true,position:'top',icon:'info',title:`금액 상한액 적용`,html:`${cnt}명 상한액(${this.nfKR.format(cap)}원)으로<br>자동 조정되었습니다.`,showConfirmButton:false,timer:3500});
            return clamped;
        },
        getSmartIcon(place, details){

            if(t.match(/마트|편의점|이마트|홈플러스|cu|gs25|세븐일레븐|쇼핑|구매/))return 'fa-cart-shopping';
            if(t.match(/문구|사무|복사|인쇄|용지/))return 'fa-stapler';

        async runRandomLoader(chk) {
            const step1Text = '학교 시스템 연결 중...';
            const step2Text = '보안 정보 확인 중...';
            const doneText = '시스템 접속 완료';

            const titleMain = document.getElementById('loader-title-main');
            const titleSub = document.getElementById('loader-title-sub');
            const percentEl = document.getElementById('loader-percent');
            const step1El = document.getElementById('loader-step-1');
            const step2El = document.getElementById('loader-step-2');

            const wait = (ms) => new Promise(r => setTimeout(r, ms));

            let currentStep = 1;
            let currentPercent = 0;

            const stepVisuals = {
                1: {
                    bar: 'linear-gradient(90deg,#3b82f6 0%,#2563eb 100%)',
                    percent: 'linear-gradient(135deg,#2563eb 0%,#3b82f6 100%)'
                },
                2: {
                    bar: 'linear-gradient(90deg,#3b82f6 0%,#6366f1 58%,#7c3aed 100%)',
                    percent: 'linear-gradient(135deg,#2563eb 0%,#7c3aed 100%)'
                },
                3: {
                    bar: 'linear-gradient(90deg,#10b981 0%,#2563eb 100%)',
                    percent: 'linear-gradient(135deg,#10b981 0%,#2563eb 100%)'
                }
            };

            const setStep = (step) => {
                currentStep = step;
                if (step1El && step2El) {
                    step1El.classList.remove('active', 'done');
                    step2El.classList.remove('active', 'done');

                    if (step === 1) {
                        step1El.classList.add('active');
                    } else if (step === 2) {
                        step1El.classList.add('done');
                        step2El.classList.add('active');
                    } else {
                        step1El.classList.add('done');
                        step2El.classList.add('done');
                    }
                }

                const visual = stepVisuals[step] || stepVisuals[1];
                if (elements.loaderBar) elements.loaderBar.style.background = visual.bar;
                if (percentEl) {
                    percentEl.style.background = visual.percent;
                    percentEl.style.webkitBackgroundClip = 'text';
                    percentEl.style.webkitTextFillColor = 'transparent';
                    percentEl.style.backgroundClip = 'text';
                }
            };

            const updateUI = (percent, text) => {
                const safePercent = Math.max(0, Math.min(100, percent));
                if (elements.loaderBar) elements.loaderBar.style.width = `${safePercent}%`;
                if (percentEl) percentEl.textContent = `${Math.round(safePercent)}%`;

                if (currentStep === 1) {
                    if (titleMain) titleMain.textContent = '시스템 연결 중';
                    if (titleSub) titleSub.textContent = '안전하게 접속을 준비하고 있습니다';
                } else if (currentStep === 2) {
                    if (titleMain) titleMain.textContent = '보안 확인 중';
                    if (titleSub) titleSub.textContent = '보안 토큰과 사용자 정보를 검증하고 있습니다';
                } else {
                    if (titleMain) titleMain.textContent = '시스템 접속 완료';
                    if (titleSub) titleSub.textContent = '로그인 화면으로 이동합니다';
                }

            };

            if (elements.loaderBar) {
                elements.loaderBar.style.transition = 'width 140ms linear, background 240ms ease';
            }
            if (percentEl) {
                percentEl.style.transition = 'background 240ms ease';
            }

            setStep(1);
            updateUI(0, step1Text);

            while (!(chk && chk())) {
                if (currentPercent < 48) {
                    setStep(1);
                    currentPercent = Math.min(48, currentPercent + 4.0);
                    updateUI(currentPercent, step1Text);
                    await wait(110);
                    continue;
                }

                setStep(2);
                if (currentPercent < 90) {
                    currentPercent = Math.min(90, currentPercent + 2.8);
                    updateUI(currentPercent, step2Text);
                    await wait(110);
                } else {
                    currentPercent = Math.min(97, currentPercent + 0.55);
                    updateUI(currentPercent, step2Text);
                    await wait(170);
                }
            }

            setStep(3);
            if (elements.loaderBar) {
                elements.loaderBar.style.transition = 'width 220ms ease-out, background 240ms ease';
            }
            updateUI(100, doneText);
            await wait(700);
        }
    };
    /* ===== KEYPAD LOGIC ===== */
    const KeypadLogic = {
        isUserActive: () => {
            if (state.currentScreen !== 'login') return false;

        },
        markTyping: () => { if (state.currentScreen === 'login') state.loginTyping = true; },
        clearTyping: () => { state.loginTyping = false; },
        initializeKeypad: () => {
            if (state.__keypadInited) return;
            state.__keypadInited = true;
            elements.keypadContainer.innerHTML = '';
            [{v:'1'},{v:'2'},{v:'3'},{v:'4'},{v:'5'},{v:'6'},{v:'7'},{v:'8'},{v:'9'},{v:'add',c:`<i class="fa-solid fa-user-plus"></i>`},{v:'0'},{v:'bs',c:`<i class="fa-solid fa-delete-left"></i>`}]
            .forEach(({v,c}) => {
                const btn = document.createElement('button');

                    btn.dataset.key = '+';

                    btn.addEventListener('click', KeypadLogic.handleAddUser);

                    btn.dataset.key = 'Backspace';
                    btn.id = 'keypad-back-btn';
                    btn.addEventListener('click', KeypadLogic.processBackspace);
                } else {
                    btn.dataset.key = v;
                    btn.addEventListener('click', () => KeypadLogic.processKeyInput(v));
                }
                btn.innerHTML = `<span class="btn-icon">${c||v}</span>`;
                elements.keypadContainer.appendChild(btn);
            });
            elements.keypadSubmitBtn.addEventListener('click', () => KeypadLogic.processLogin());
        },
        updateDashboard: () => {
            if (!state.allCardData) return;
            const total = state.allCardData.length;
            const inUse = state.allCardData.filter(c => c.status === '사용중').length;
            const available = total - inUse;
            const elAvail = document.getElementById('dash-available');
            const elInuse = document.getElementById('dash-inuse');
            if(elAvail) elAvail.textContent = available;
            if(elInuse) elInuse.textContent = inUse;
        },
        renderDisplay: () => {
            document.querySelectorAll('#keypadDisplay .digit-box').forEach((box, i) => {
                const data = state.keypadValues[i];
                box.className = 'digit-box'; // reset
                box.textContent = '';
                if (data) {
                    box.classList.add('filled');
                    box.textContent = data.value;
                    if (data.masked) {
                        box.classList.add('masked');
                    }
                }
            });
        },
        processKeyInput: (k) => {
            triggerKeypadVisualPress(k);
            if (state.activeDigitIndex > 3) return;
            KeypadLogic.markTyping();
            const idx = state.activeDigitIndex;
            state.keypadValues[idx] = { value: k, masked: false };
            KeypadLogic.renderDisplay();
            if (state.inputTimers[idx]) clearTimeout(state.inputTimers[idx]);
            state.inputTimers[idx] = setTimeout(() => {
                if (state.keypadValues[idx]) {
                    state.keypadValues[idx].masked = true;
                    KeypadLogic.renderDisplay();
                }
            }, 700);
            if (state.activeDigitIndex < 3) state.activeDigitIndex++;
        },
        processBackspace: () => {
            triggerKeypadVisualPress('Backspace');
            KeypadLogic.markTyping();
            const idx = state.activeDigitIndex > 3 ? 3 : (state.keypadValues[state.activeDigitIndex] ? state.activeDigitIndex : state.activeDigitIndex - 1);
            if (idx >= 0) {
                if (state.inputTimers[idx]) clearTimeout(state.inputTimers[idx]);
                state.keypadValues[idx] = null;
                state.activeDigitIndex = idx;
                KeypadLogic.renderDisplay();
            }
            const hasTags = state.enteredUsers && state.enteredUsers.length > 0;
            state.loginTyping = state.keypadValues.some(v => v !== null) || hasTags;
        },
        handleAddUser: () => {
            triggerKeypadVisualPress('+');

                return Swal.fire({
                    toast: true,

            }
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            if (ext.length !== 4) return Swal.fire('알림', '내선번호 4자리를 입력해주세요.', 'warning');
            const user = state.allUsersData.find(u => u.extension === ext);
            if (!user) return Swal.fire('조회 실패', '해당 내선번호를 찾을 수 없습니다.', 'error');
            if (state.enteredUsers.some(u => u.name === user.name)) return Swal.fire('알림', '이미 추가된 사용자입니다.', 'info');
            KeypadLogic.markTyping();

        runSecurityScan: () => new Promise(resolve => {

    const EmbedBridge = {
        notify(type, payload = {}) {

                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'WS_CARD', type, ...payload }, '*');
                }
            } catch (e) {}
        }
    };
    /* ===== CARD / RECEIPT LOGIC ===== */
    const CardLogic = {
        requestRenderReceiptCart: () => {
            if (state._renderReceiptScheduled) return;
            state._renderReceiptScheduled = true;
            requestAnimationFrame(() => {
                state._renderReceiptScheduled = false;
                CardLogic.renderReceiptCart();
            });
        },
        queueSaveCart: (backupCart = null) => new Promise((resolve, reject) => {
            const token = ++state.cartSaveToken;
            if (state.cartSaveTimer) clearTimeout(state.cartSaveTimer);
            state.cartSaveTimer = setTimeout(async () => {
                try {
                    await Api.call('saveCartToMasterFile', {
                        cardId: state.currentReturnCard.id,
                        cartData: state.receiptCart.map(({processing, ...r}) => r)
                    });
                    if (token === state.cartSaveToken) {
                        state.receiptCart.forEach((it, idx) => {
                            if (it && it.processing === 'saving') {
                                it.processing = 'saved';
                                setTimeout(() => {
                                    const cur = state.receiptCart[idx];
                                    if (cur && cur.processing === 'saved') {
                                        delete cur.processing;
                                        CardLogic.requestRenderReceiptCart();
                                    }
                                }, 850);
                            }
                        });
                        CardLogic.requestRenderReceiptCart();
                    }
                    resolve(true);
                } catch (e) {
                    if (backupCart && token === state.cartSaveToken) {
                        state.receiptCart = backupCart;
                        CardLogic.requestRenderReceiptCart();
                    }
                    reject(e);
                }
            }, 450);
        }),
        // 다중 업로드 후 OCR 완료 시 자동 검수(입력) 모드: 새로 추가된 항목들을 순서대로 열어줌
        startReviewMode: (startIdx, count) => {
            try {
                const isMeal = !!(state.currentReturnCard && state.currentReturnCard.userInfo && String(state.currentReturnCard.userInfo.purpose||'').includes('특근'));
                const q = [];
                for (let i = 0; i < count; i++) {
                    const idx = startIdx + i;
                    const it = state.receiptCart[idx];
                    if (!it || it.processing === 'error') continue;
                    // 특근매식비는 기본 내역이 자동 입력되므로 검수 큐에서 제외
                    if (!isMeal && !String(it.usageDetails||'').trim()) q.push(idx);
                }
                state.reviewQueue = q;
                if (state.reviewQueue.length) {
                    // 첫 항목 자동 오픈 + 내용칸 자동 포커스
                    setTimeout(() => CardLogic.openOcrPopup(state.receiptCart[state.reviewQueue[0]], state.reviewQueue[0]), 150);
                }
            } catch(e) {}
        },
        continueReviewIfNeeded: (savedIdx) => {
            try {
                if (!state.reviewQueue || !state.reviewQueue.length) return;
                if (state.reviewQueue[0] !== savedIdx) return;
                state.reviewQueue.shift();
                if (state.reviewQueue.length) {
                    const nextIdx = state.reviewQueue[0];
                    // 다음 영수증으로 넘어가기 전 짧은 로딩 토스트 표시(사용자 혼동 방지)
                    try{
                        if (window.Swal) {
                            Swal.fire({
                                title: '다음 영수증 불러오는 중...',
                                text: '잠시만 기다려 주세요',
                                showConfirmButton: false,
                                allowOutsideClick: false,
                                allowEscapeKey: false,
                                backdrop: true,
                                didOpen: () => { try { Swal.showLoading(); } catch(e){} }
                            });
                        }
                    } catch(e) {}
                    setTimeout(() => { try{ if(window.Swal) Swal.close(); }catch(e){}; CardLogic.openOcrPopup(state.receiptCart[nextIdx], nextIdx); }, 650);
                }
            } catch(e) {}
        },
        isReceiptAnalysisFailed: (ocr) => {
            if (!ocr || ocr.ok === false) return true;
            const place = String(ocr.storeName || '').trim();
            const amount = String(ocr.amount || '').trim();
            return !place && !amount;
        },
        showReceiptAnalysisFallback: (isReplacement = false) => {
            try {
                Swal.fire({
                    icon: 'warning',
                    title: '영수증 인식 실패',
                    text: isReplacement
                        ? '영수증 자동 분석에 실패했어요. 직접 입력창에서 내용만 적어 주세요.'
                        : '영수증 자동 분석에 실패했어요. 직접 입력으로 계속 진행해 주세요.',
                    confirmButtonColor: '#007aff'
                });
            } catch (e) {}
        },
        triggerImageSelection: async (editIndex = -1) => {
            state.pendingEditIndex = editIndex;
            const input = document.getElementById('receipt-file-input');
            if (!input) return;
            if (editIndex > -1) input.removeAttribute('multiple');
            else input.setAttribute('multiple', '');
            input.value = '';
            EmbedBridge.notify('UPLOAD_PICKER_OPEN');
            if (state._uploadPickerTimer) clearTimeout(state._uploadPickerTimer);
            state._uploadPickerTimer = setTimeout(() => {
                EmbedBridge.notify('UPLOAD_PICKER_TIMEOUT');
            }, 12000);
            input.click();
        },
        displayCardList: () => {
            elements.cardGrid.innerHTML = '';
            elements.cardGrid.classList.remove('is-loaded');
            if (!state.allCardData) return;
            const sorted = [...state.allCardData].sort((a,b) => {

            });

            elements.cardSelectionHeader.innerHTML =
                `<i class="fa-solid ${icon}"></i>${state.enteredUsers.length>1?' 사용할 카드를 선택해주세요.':' 사용할 카드를 선택해주세요.'}`;

        async submitRentRequest(id, purpose) {
            CardLogic.closeMorphOverlay();
            const names = state.enteredUsers.map(u => u.name).join(', ');
            const params = { cardNumber: id, userName: names, purpose, userExtensions: state.enteredUsers.map(u => u.extension) };
            await safeUpdate(
                (state, cardId) => {
                    const t = state.allCardData.find(c => c.id === cardId);
                    if (t) {
                        t.status = '사용중';
                        t.userInfo = t.userInfo || {};
                        t.userInfo.userName = names;
                        t.userInfo.purpose = purpose;
                        t.userInfo.receiveDate = Utils.formatDateKR();
                        t.savedCart = [];
                    }
                    UIManager.showConfirmationScreen('신청 완료',
                        Utils.createDetailRow('카드번호', id)+
                        Utils.createDetailRow('사용자', names)+
                        Utils.createDetailRow('사용 목적', purpose)
                    );
                    state.pendingPostReturnSync = true;
                },
                async () => {
                    const r = await Api.call('rentNow', params);
                    if(r?.status==="conflict") throw new Error('ALREADY_IN_USE');
                    if(r?.status==="defer") await Api.call('queueRentRequest', params);
                    state.pendingPostReturnSync = true;
                    CardLogic.scheduleQuickSync(2, 900);
                },
                (e) => {
                    clearInterval(state.countdownInterval);
                    UIManager.showScreen('main');
                    Swal.fire(e.message==='ALREADY_IN_USE'?'신청 실패':'서버 오류', e.message==='ALREADY_IN_USE'?'이미 사용중입니다.':'오류가 발생했습니다.', e.message==='ALREADY_IN_USE'?'warning':'error');
                    CardLogic.displayCardList();
                },
                id
            );
        },

        },
        renderReceiptCart: () => {
            const c = document.getElementById('receipt-cart-container');
            if (!c || !state.currentReturnCard) return;
            const isPrim = state.enteredUsers[0].name === state.currentReturnCard.userInfo.userName.split(',')[0].trim();
            const isMeal = state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근');
            let tot = 0;
            c.innerHTML = state.receiptCart.length ? state.receiptCart.map((it, i) => {
                tot += Number(it.amount||0);
                const needDetails = (!isMeal) && !(String(it.usageDetails || '').trim());
                const isProcessing = (it.processing === 'saving' || it.processing === 'analyzing' || it.processing === 'deleting');
                const isSaved = it.processing === 'saved';
                const needWarn = needDetails || (it.processing === 'save_error');
                // 미입력(또는 저장 실패) 내역이 있을 때 경고 표시
                const cls = (isProcessing ? 'processing' : '') + (isSaved ? ' saved' : '') + (needWarn ? ' needs-details' : '');
                if(it.processing === 'error') {
                    return `<div class="cart-item needs-details" data-index="${i}">
                         <div class="cart-item-icon" style="color:var(--danger-color);"><i class="fa-solid fa-triangle-exclamation"></i></div>
                         <div class="cart-item-info">
                            <span class="cart-item-place" style="color:var(--danger-color);">분석 실패</span>
                            <span class="cart-item-details">탭하여 직접 입력해주세요</span>
                         </div>
                         <div class="cart-item-amount-box"></div>
                         <button class="cart-item-delete"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
                }
                return `<div class="cart-item ${cls}" data-index="${i}" ${isProcessing?`data-processing-text="${it.processing==='deleting'?'삭제 중...':(it.processing==='analyzing'?'분석 중...':'저장 중...')}"`:''}>
                    <div class="cart-item-icon">
                        ${it.processing==='analyzing'
                            ? `<div class="mini-scanner"><div class="mini-paper"></div><div class="mini-beam"></div></div>`
                            : (needWarn ? `<i class="fa-solid fa-triangle-exclamation"></i>` : `<i class="fa-solid ${Utils.getSmartIcon(it.usagePlace, it.usageDetails)}"></i>`)}
                    </div>
                    <div class="cart-item-info">
                        <span class="cart-item-place">${Utils.esc(it.usagePlace)||'상호명 없음'}</span>
                        <span class="cart-item-details">${it.processing==='save_error' ? '저장 실패 · 탭하여 재시도' : (Utils.esc(it.usageDetails)||'내역 없음')}</span>
                    </div>
                    <div class="cart-item-amount-box"><span class="cart-item-amount">${Utils.nfKR.format(Number(it.amount||0))}원</span></div>
                    ${!isProcessing?`<button class="cart-item-delete"><i class="fa-solid fa-trash"></i></button>`:''}
                </div>`;
            }).join('') : `<div class="cart-placeholder"><i class="fa-regular fa-file-lines"></i><span>추가된 영수증이 없습니다.</span></div>`;
            document.getElementById('receipt-total-display').textContent = `${Utils.nfKR.format(tot)}원`;
            c.classList.toggle('empty-cart', state.receiptCart.length===0);
            // UX 아이디어 3 적용: 제출 가이드 보이기/숨기기
            const guideEl = document.getElementById('submit-guide');
            if (guideEl) {
                const hasEmpty = state.receiptCart.some(r => ((!isMeal) && !(String(r.usageDetails || '').trim()) && (!r.processing || r.processing==='save_error')) || (r.processing==='save_error'));
                if (hasEmpty && state.receiptCart.length > 0) {
                    guideEl.classList.add('visible');
                } else {
                    guideEl.classList.remove('visible');
                }
            }
            const submitBtn = document.getElementById('submit-cart-btn');
            if (submitBtn) submitBtn.disabled = !(state.receiptCart.length > 0 && isPrim);
            if (isPrim) {
                c.querySelectorAll('.cart-item:not(.processing)').forEach(e => e.onclick=()=>CardLogic.openOcrPopup(state.receiptCart[e.dataset.index], e.dataset.index));
                c.querySelectorAll('.cart-item-delete').forEach(e => {
                    e.onclick=(ev)=>{ev.stopPropagation();CardLogic.deleteCartItem(e.closest('.cart-item').dataset.index);}
                });
            }
        },
        saveCartItemOptimistic: async (item, idx) => {
            // 입력 완료 후, 화면(검수 흐름)은 즉시 다음 영수증으로 넘어가고
            // 백그라운드에서 조용히 저장합니다. 저장 실패 시 빨간 경고로 표시합니다.
            Swal.close();
            const ghost = { ...item, processing: 'saving' };
            let targetIdx = idx;
            if (idx > -1) {
                state.receiptCart[idx] = ghost;
            } else {
                state.receiptCart.push(ghost);
                targetIdx = state.receiptCart.length - 1;
            }
            CardLogic.requestRenderReceiptCart();
            // UX: 저장을 기다리지 않고 바로 다음 입력으로 진행
            CardLogic.continueReviewIfNeeded(idx);
            // 백그라운드 저장
            CardLogic.queueSaveCart(null).then(() => {
                // queueSaveCart 내부에서 'saving' 표시는 일괄 제거되지만,
                // 토큰 경쟁 상황을 대비해 여기서도 안전 처리
                const it = state.receiptCart[targetIdx];
                if (it && it.processing === 'saving') {
                    it.processing = 'saved';
                    CardLogic.requestRenderReceiptCart();
                    setTimeout(() => {
                        const cur = state.receiptCart[targetIdx];
                        if (cur && cur.processing === 'saved') {
                            delete cur.processing;
                            CardLogic.requestRenderReceiptCart();
                        }
                    }, 850);
                }
            }).catch((e) => {
                // 저장 실패 표시 (사용자가 탭해서 재시도/수정 가능)
                const it = state.receiptCart[targetIdx];
                if (it) it.processing = 'save_error';
                CardLogic.requestRenderReceiptCart();
                try {
                    Swal.fire({toast:true, position:'top', icon:'error', title:'저장 실패 · 네트워크 확인 후 다시 시도해주세요', showConfirmButton:false, timer:2500});
                } catch(_) {}
                console.error(e);
            });
        },
        deleteCartItem: (idx) => {
            Swal.fire({title:'삭제 확인',text:"삭제하시겠습니까?",icon:'warning',showCancelButton:true,confirmButtonText:'삭제',cancelButtonText:'취소',confirmButtonColor:'#d33'})
                .then(r => {
                    if (r.isConfirmed) {
                        const org = [...state.receiptCart];
                        state.receiptCart[idx] = { ...state.receiptCart[idx], processing: 'deleting' };
                        CardLogic.requestRenderReceiptCart();
                        const next = [...state.receiptCart];
                        next.splice(idx, 1);
                        state.receiptCart = next;
                        CardLogic.requestRenderReceiptCart();
                        CardLogic.queueSaveCart(org).catch(e => {
                            state.receiptCart = org;
                            CardLogic.requestRenderReceiptCart();
                            UIManager.handleServerError(e);
                        });
                    }
                });
        },
        async handleReceiptFiles(fileList) {
            if (!fileList || !fileList.length || !state.currentReturnCard) return;
            EmbedBridge.notify('UPLOAD_START');
            const editIndex = state.pendingEditIndex;
            state.pendingEditIndex = -1;
            const files = Array.from(fileList);
            try { if (state._uploadPickerTimer) clearTimeout(state._uploadPickerTimer); } catch(e) {}
            const addBtn = document.getElementById('add-receipt-btn');
            const subBtn = document.getElementById('submit-cart-btn');
            if (addBtn) addBtn.disabled = true;
            if (subBtn) subBtn.disabled = true;
            try {
                if (editIndex > -1) {
                    UIManager.setLoading(true, '영수증 교체 분석 중...', 'receipt');
                    const file = files[0];
                    const b64 = await CardLogic.resizeAndOptimizeImage(file);
                    const ocr = await Api.call('processReceiptImage', b64);
                    const analysisFailed = CardLogic.isReceiptAnalysisFailed(ocr);
                    let amt = (ocr.amount || '').toString();
                    if (state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근')) {
                        amt = String(Utils.clampMealAmount(amt, state.currentReturnCard.userInfo.userName.split(',').length));
                    }
                    UIManager.setLoading(false);
                    if (analysisFailed) {
                        CardLogic.showReceiptAnalysisFallback(true);
                    }
                    await CardLogic.openOcrPopup({
                        receiptImage: b64,
                        usagePlace: analysisFailed ? '' : (ocr.storeName || ''),
                        usageDetails: (state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근') ? '특근매식비' : ''),
                        amount: analysisFailed ? '' : amt.replace(/[^\d]/g, ""),
                        date: analysisFailed ? '' : (ocr.date || '')
                    }, editIndex);
                    return;
                }
                UIManager.setLoading(true, `${files.length}장의 영수증을 분석 중...`, 'receipt');
                const startIdx = state.receiptCart.length;
                const newItems = files.map(() => ({
                    receiptImage: '', usagePlace: '분석 중...', usageDetails: '', amount: '', date: '', processing: 'analyzing'
                }));
                state.receiptCart.push(...newItems);
                CardLogic.requestRenderReceiptCart();
                const processPromises = files.map(async (file, i) => {
                    const actualIdx = startIdx + i;
                    try {
                        const b64 = await CardLogic.resizeAndOptimizeImage(file);
                        state.receiptCart[actualIdx].receiptImage = b64;
                        CardLogic.requestRenderReceiptCart();
                        const ocr = await Api.call('processReceiptImage', b64);
                        const analysisFailed = CardLogic.isReceiptAnalysisFailed(ocr);
                        let amt = (ocr.amount || '').toString();
                        if (state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근')) {
                            amt = String(Utils.clampMealAmount(amt, state.currentReturnCard.userInfo.userName.split(',').length));
                        }
                        state.receiptCart[actualIdx] = {
                            receiptImage: b64,
                            usagePlace: analysisFailed ? '직접 입력 필요' : (ocr.storeName || ''),
                            usageDetails: (state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근') ? '특근매식비' : ''),
                            amount: analysisFailed ? '' : amt.replace(/[^\d]/g, ""),
                            date: analysisFailed ? '' : (ocr.date || ''),
                            processing: 'pending-save',
                            needsManualReview: analysisFailed
                        };
                    } catch (err) {
                        state.receiptCart[actualIdx].processing = 'error';
                        state.receiptCart[actualIdx].usagePlace = '분석 실패';
                    }
                    CardLogic.requestRenderReceiptCart();
                });
                await Promise.all(processPromises);
                const manualReviewCount = state.receiptCart.slice(startIdx, startIdx + files.length).filter(item => item && item.needsManualReview).length;
                UIManager.setLoading(true, '분석 완료! 저장 중...', 'receipt');
                const itemsToSave = state.receiptCart.filter(item => item.processing !== 'error');
                state.receiptCart.forEach(item => {
                    if (item && item.processing && item.processing !== 'error') delete item.processing;
                    if (item && item.needsManualReview) delete item.needsManualReview;
                });
                await Api.call('saveCartToMasterFile', { cardId: state.currentReturnCard.id, cartData: itemsToSave });
                UIManager.setLoading(false);
                if (manualReviewCount > 0) {
                    CardLogic.showReceiptAnalysisFallback(false);
                }
                CardLogic.requestRenderReceiptCart();
                // OCR 완료 후 자동 검수 모드(첫 항목 자동 오픈)
                CardLogic.startReviewMode(startIdx, files.length);
            } catch (e) {
                UIManager.handleServerError(e);
            } finally {
                try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}
                if (addBtn) addBtn.disabled = false;
                if (subBtn) subBtn.disabled = false;
                CardLogic.requestRenderReceiptCart();
            }
            EmbedBridge.notify('UPLOAD_END');
        },
        resizeAndOptimizeImage: (file) => new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = e => {
                const i = new Image();
                i.onload = () => {
                    const MAX = 1200;
                    let w=i.width, h=i.height;
                    if (w>h){ if(w>MAX){h*=MAX/w;w=MAX;} }
                    else { if(h>MAX){w*=MAX/h;h=MAX;} }
                    const c = document.createElement('canvas');
                    c.width=w; c.height=h;
                    c.getContext('2d').drawImage(i,0,0,w,h);
                    c.toBlob(b => {
                        if(!b) return rej(new Error('이미지 변환 실패'));
                        const fr=new FileReader();
                        fr.onload=()=>res(fr.result);
                        fr.onerror=rej;
                        fr.readAsDataURL(b);
                    }, 'image/jpeg', 0.78);
                };
                i.onerror=rej;
                i.src=e.target.result;
            };
            r.onerror=rej;
            r.readAsDataURL(file);
        }),

        scheduleQuickSync: (attempts = 3, intervalMs = 1200) => {
            // 짧은 기간만 서버 최신화 재시도(무한 폴링 방지)
            if (!attempts || attempts <= 0) return;
            let n = 0;
            const tick = async () => {
                n++;
                try {
                    state.pendingPostReturnSync = true;
                    await CardLogic.handlePendingPostReturnSync();
                } catch(e) {}
                if (n >= attempts) return;
                setTimeout(tick, intervalMs);
            };
            setTimeout(tick, intervalMs);
        },
        handlePendingPostReturnSync: async () => {
            const reqId = ++state.syncReqId;
            if (!state.pendingPostReturnSync) return;
            state.pendingPostReturnSync = false;
            try {
                const data = await Api.call('getInitialAppData');
                if (data && !data.error) {
                    state.allCardData = data.allCards;
                    state.allUsersData = data.allUsers;
                    state.lastSyncTs = Date.now();
                    const inUseIds = state.allCardData
                        .filter(c => c.status === '사용중' || c.status === '반납처리중')
                        .map(c => c.id);
                    if (inUseIds.length) {
                        const carts = await Api.call('getSavedCarts', inUseIds);
                        state.allCardData.forEach(c => c.savedCart = carts[c.id] || []);
                        state.lastSyncTs = Date.now();
                    }
                }
            } catch(e) {}
        },
        async submitCart() {
            if (!state.isAdminMode) {
                await Swal.fire('제출 불가', '행정실 태블릿(관리자 모드)에서만 제출할 수 있습니다.', 'warning');
                return;
            }
            const isMeal = state.currentReturnCard && state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근');
            if (!isMeal && state.receiptCart && state.receiptCart.length) {
                const missing = state.receiptCart
                    .map((it, idx) => ({ it, idx }))
                    .filter(x => !(String(x.it.usageDetails || '').trim()));
                if (missing.length) {
                    const ok = await Swal.fire({
                        title: '입력 확인',
                        html: `<b>${missing.length}건</b>의 영수증에 <b>사용내역(내용)</b>이 비어 있습니다.<br>그래도 제출할까요?`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: '그대로 제출',
                        cancelButtonText: '입력하러 가기'
                    });

                        const first = missing[0]?.idx;
                        setTimeout(() => {
                            const el = document.querySelector(`.cart-item[data-index="${first}"]`);
                            if (el) {
                                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                el.classList.add('highlight');
                                setTimeout(() => el.classList.remove('highlight'), 1500);
                            }
                        }, 50);
                        return;
                    }
                }
            }
            if (!state.receiptCart.length) {
                const ok = await Swal.fire({title:'영수증 없음',text:'진행하시겠습니까?',icon:'warning',showCancelButton:true});
                if (!ok.isConfirmed) return;
            }
            const btn = document.getElementById('submit-cart-btn');
            if(btn) { btn.disabled = true; btn.classList.add('is-loading'); }
            const params = {
                adminPin: state.isAdminMode ? (state.adminPinCache || '') : '',
                cardNumber: state.currentReturnCard.id,
                receiveDate: state.currentReturnCard.userInfo.receiveDate,
                userName: state.enteredUsers.map(u=>u.name).join(', '),
                multiEntries: JSON.stringify(state.receiptCart)
            };
            await safeUpdate(
                (state, cardId) => {
                    const t = state.allCardData.find(c => c.id === cardId);
                    if (t) {
                        // 반납 요청 직후: 다른 사용자가 신청하지 못하도록 '반납처리중'으로 표시
                        t.status = '반납처리중';
                    }
                    UIManager.showConfirmationScreen('반납 요청 완료',
                    Utils.createDetailRow('카드번호', params.cardNumber) +
                    Utils.createDetailRow('처리 상태', `${state.receiptCart.length}건 반납`)
                );
                    state.forceSyncOnNextUnlock = true;
                },
                async () => {
                    await Api.call('queueReturnRequest', params);
                    state.pendingPostReturnSync = true;
                    CardLogic.scheduleQuickSync(3, 1200);
                },
                (e) => {
                    clearInterval(state.countdownInterval);
                    if(btn) { btn.disabled = false; btn.classList.remove('is-loading'); }
                    Swal.fire('실패', '다시 시도해주세요.', 'error').then(UIManager.showLockScreen);
                },
                params.cardNumber
            );
        }
    };
    async function initializeAppSequence() {
        const reqId = ++state.syncReqId;
        elements.welcomeScreen.classList.remove('hidden');
        elements.welcomeScreen.classList.add('is-visible');
        UIManager.currentScreenElement = elements.welcomeScreen;
        state.currentScreen = 'welcome';
        elements.contentWrapper.style.display = 'flex';
        await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
        requestAnimationFrame(() => elements.lockScreen.classList.add('fade-out'));
        const hideLockAfterFade = () => {
            const onEnd = (ev) => {
                if (ev.propertyName !== 'opacity') return;
                elements.lockScreen.removeEventListener('transitionend', onEnd);
                try { elements.lockScreen.style.display = 'none'; } catch(e) {}
            };
            elements.lockScreen.addEventListener('transitionend', onEnd);
        };
        hideLockAfterFade();
        let isDataLoaded = false;
        const dataPromise = Api.call('getInitialAppData')
            .then(r => { isDataLoaded = true; return r; })
            .catch(e => { isDataLoaded = true; throw e; });
        await UIManager.runRandomLoader(() => isDataLoaded);
        elements.welcomeScreen.classList.remove('is-visible');
        elements.welcomeScreen.classList.add('is-hiding');
        setTimeout(() => {
            elements.welcomeScreen.classList.add('hidden');
            elements.welcomeScreen.classList.remove('is-hiding');
            elements.lockScreen.classList.add('hidden');
        }, 400);
        try {
            const data = await dataPromise;
            if (!data || data.error) throw new Error(data?.error || 'No Data');
            if (reqId !== state.syncReqId) return;
            state.allCardData = data.allCards;
            state.allUsersData = data.allUsers;
            state.lastSyncTs = Date.now();
            const inUseIds = state.allCardData
                .filter(c => c.status === '사용중' || c.status === '반납처리중')
                .map(c => c.id);
            if (inUseIds.length) {
                Api.call('getSavedCarts', inUseIds)
                    .then(map => state.allCardData.forEach(c => c.savedCart = map[c.id] || []))
                    .catch(console.error);
            }
            UIManager.showScreen('login');
        } catch (e) {
            state.allCardData = [];
            state.allUsersData = [];
            UIManager.showScreen('login');
        }
        UIManager.startInactivityDetection();
    }
    async function handleLockScreenClick() {
        if (state.isAppActive && state.currentScreen !== 'lock') return;
        state.isAppActive = true;
        state.cardTiltActive = false;
        elements.lockScreen.classList.add('active-pop');
        document.getElementById('lock-text-instruction').classList.add('hide');
        const hasData = Array.isArray(state.allCardData) && state.allCardData.length &&
                        Array.isArray(state.allUsersData) && state.allUsersData.length;
        const stale = !state.lastSyncTs || (Date.now() - state.lastSyncTs > 5000);
        const needSync = stale || state.forceSyncOnNextUnlock || state.pendingPostReturnSync;
        if (hasData && needSync && !state.syncInFlight) {
            state.forceSyncOnNextUnlock = false;
            state.pendingPostReturnSync = true;
            state.syncInFlight = true;
            state.syncPromise = (async () => {
                try { await CardLogic.handlePendingPostReturnSync(); }
                finally { state.syncInFlight = false; }
            })();
        }
        if (hasData) {
            elements.contentWrapper.style.display = 'flex';
            document.body.style.pointerEvents = 'auto';
            document.body.style.overflow = 'hidden';
            elements.welcomeScreen.classList.remove('hidden');
            elements.welcomeScreen.classList.add('is-visible');
            if (elements.loaderBar) elements.loaderBar.style.width = '0%';
            requestAnimationFrame(() => {
                elements.lockScreen.classList.add('fade-out');
                requestAnimationFrame(() => {
                    try { elements.lockScreen.style.display = 'none'; } catch(e) {}
                    elements.lockScreen.classList.add('hidden');
                });
            });
            await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
            const t0 = Date.now();
            await UIManager.runRandomLoader(() => (Date.now() - t0) > 1000);
            elements.welcomeScreen.classList.remove('is-visible');
            elements.welcomeScreen.classList.add('is-hiding');
            setTimeout(() => {
                try { elements.welcomeScreen.classList.add('hidden'); } catch(e) {}
                try { elements.welcomeScreen.classList.remove('is-hiding'); } catch(e) {}
            }, 300);
            UIManager.showScreenImmediate('login');
            UIManager.startInactivityDetection();
            return;
        }
        requestAnimationFrame(() => { setTimeout(() => initializeAppSequence(), 0); });
    }

            else if (e.key === 'Enter') { e.preventDefault(); if (!elements.keypadSubmitBtn.disabled) KeypadLogic.processLogin(); }
            else if (e.key === '+') { e.preventDefault(); KeypadLogic.handleAddUser(); }
            else if (e.key === 'Backspace') { e.preventDefault(); KeypadLogic.processBackspace(); }
        });
        window.addEventListener('beforeunload', (e) => {
            if (state.receiptCart.length > 0 || state.syncInFlight) { e.preventDefault();  return ''; }
        });
        const cont = elements.glassCardContainer;
        const card = document.getElementById('glass-card');
        if(cont && card) {
            let rect;
            const cache = () => rect = cont.getBoundingClientRect();
            window.addEventListener('resize', cache);
            cont.addEventListener('pointerenter', cache);
            const onMove = e => {
                if (!state.cardTiltActive || !rect || state.currentScreen !== 'lock') return;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                card.style.transform = `rotateX(${((cy-rect.top)/rect.height-.5)*-10}deg) rotateY(${((cx-rect.left)/rect.width-.5)*10}deg)`;
            };
            document.body.addEventListener('mousemove', onMove);
            document.body.addEventListener('touchmove', onMove);
            cont.addEventListener('pointerleave', () => { if(state.cardTiltActive) card.style.transform = 'rotateX(0) rotateY(0)'; });
            cache();
        }
    }
    UIManager.showConfirmationScreen = (title, detailsHtml) => {
        Utils.celebrate();
        document.getElementById('confirmation-title').textContent = title;
        document.getElementById('confirmation-details').innerHTML = detailsHtml;
        UIManager.showScreen('confirmation');
        clearTransitionTimers();
        let sec = 3;
        const cd = document.getElementById('confirmation-countdown');
        cd.textContent = `${sec}초 후 복귀`;
        state.countdownInterval = setInterval(() => {
            sec--;
            if (sec > 0) { cd.textContent = `${sec}초 후 복귀`; }
            else {
                clearInterval(state.countdownInterval);
                state.countdownInterval = null;
                cd.textContent = "복귀 중...";
                state.confirmLeaveTimeout1 = setTimeout(() => {
                    document.getElementById('screen-confirmation').classList.add('is-hiding');
                    state.confirmLeaveTimeout2 = setTimeout(() => { state.forceSyncOnNextUnlock = true; UIManager.showLockScreen(); }, 400);
                }, 500);
            }
        }, 1000);
    };
    return {
        init: () => {
            setupEventListeners();
            KeypadLogic.initializeKeypad();
        }
    };
})();
/* ===== BOOTSTRAP ===== */
document.addEventListener('DOMContentLoaded', () => {
    try { CardApp.init(); }
    catch (e) { Swal.fire('Error', 'Init Fail: ' + e.message, 'error'); }
});
</script>
