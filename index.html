    ========================================================= */
    /* =========================================================
    @SECTION: JS_CARD_LOGIC
    카드 목록, 대여/반납, 영수증 OCR, 장바구니 저장 흐름
    ========================================================= */
    const CardLogic = {
        /* =========================================================
        @SUBSECTION: JS_CARD_VISIBILITY_TEMPLATES
        카드 표시 조건과 카드/목적/영수증 HTML 템플릿
        ========================================================= */
        isCardVisibleToCurrentUsers: (card) => {
            const allowedUsers = Array.isArray(card?.allowedUsers)
                ? card.allowedUsers
                : (card?.visibleTo ? [card.visibleTo] : null);
            if (!allowedUsers || allowedUsers.length === 0) return true;
            const currentNames = state.enteredUsers.map(u => u.name);
            return allowedUsers.some(name => currentNames.includes(name));
        },
        getCurrentReturnMealHeadcount() {
            // 내선번호 1개를 1명으로 봅니다. 같은 내선번호가 중복 입력되면 1명으로만 계산합니다.
            const enteredExtCount = Array.isArray(state.enteredUsers)
                ? new Set(state.enteredUsers.map(u => String(u.extension || '').trim()).filter(Boolean)).size
                : 0;
            const fromCardNames = new Set(String(state.currentReturnCard?.userInfo?.userName || '')
                .split(',')
                .map(x => x.trim())
                .filter(Boolean)).size;
            return Math.max(1, enteredExtCount || fromCardNames || 1);
        },
        renderCardButtonHTML: (card) => {
            const rawStatus = String(card.status || '').trim();
            const compactStatus = rawStatus.replace(/\s+/g, '');
            const status = (compactStatus === '대여가능' || compactStatus === '사용가능' || compactStatus === '가능') ? '사용가능'
                : (compactStatus === '대여중' ? '사용중' : rawStatus);
            const isAvailable = status === '사용가능';
            const isRentPending = status === '신청중';
            const isInUse = status === '사용중';
            const isReturning = status === '반납처리중';
            const isReturnError = status === '반납오류';
            const statusLabel = isAvailable ? '신청 가능' : (isRentPending ? '신청중' : (isInUse ? '사용중' : (isReturning ? '반납 처리중' : (isReturnError ? '반납 오류' : (status || '상태 확인')))));
            const rawDate = card.userInfo && card.userInfo.receiveDate ? String(card.userInfo.receiveDate) : '';
            const borrowDate = rawDate ? rawDate.slice(5, 10).replace('-', '/') : '';
            const dateHTML = ((isInUse || isRentPending) && borrowDate)
                ? `<span class="card-borrow-date">대여일 ${Utils.esc(borrowDate)}</span>`
                : '';
            const badgeHTML = (isInUse || isRentPending)
                ? `<span class="status-badge hybrid-status-badge inuse-only-badge">${isRentPending ? '신청중' : '사용중'}</span>`
                : (isReturnError ? `<span class="status-badge hybrid-status-badge inuse-only-badge">반납오류</span>` : '');

            return `
            <div class="card-grid-btn hybrid-card-btn" aria-label="${Utils.esc(card.displayName)} ${Utils.esc(statusLabel)}">
                <div class="hybrid-card-topline">
                    <span class="hybrid-card-chip"></span>
                    <span class="hybrid-card-state-dot"></span>
                </div>
                <div class="hybrid-card-texts">
                    <span class="card-name">${Utils.esc(card.displayName)}</span>
                    ${dateHTML}
                </div>
            </div>
            ${badgeHTML}
        `;
        },
        /* =========================================================
        @SUBSECTION: JS_CARD_REQUEST_DOMAIN
        4단계 카드신청 도메인. 카드 목록 렌더링, 목적 선택, 최종 신청 버튼, rentNow 호출 흐름을 담당합니다.
        주의: 목적 버튼 클릭만으로 대여하지 않고, 최종 신청 버튼에서만 실제 대여 처리합니다.
        ========================================================= */
        getSelectedPurposeList(rootEl) {
            if (!rootEl) return [];
            const raw = String(rootEl.dataset.selectedPurposes || rootEl.dataset.selectedPurpose || '').trim();
            if (!raw) return [];
            const order = CardLogic.getPurposeOptions().map(x => x.id);
            const list = raw.split('|').map(x => x.trim()).filter(Boolean);
            return Array.from(new Set(list)).sort((a, b) => {
                const ai = order.indexOf(a);
                const bi = order.indexOf(b);
                return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });
        },
        setSelectedPurposeList(rootEl, list) {
            if (!rootEl) return [];
            const order = CardLogic.getPurposeOptions().map(x => x.id);
            const clean = Array.from(new Set((Array.isArray(list) ? list : []).map(x => String(x || '').trim()).filter(Boolean)))
                .sort((a, b) => {
                    const ai = order.indexOf(a);
                    const bi = order.indexOf(b);
                    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
                });
            rootEl.dataset.selectedPurposes = clean.join('|');
            if (clean.length) rootEl.dataset.selectedPurpose = clean.join(' / ');
            else delete rootEl.dataset.selectedPurpose;
            return clean;
        },
        getPurposeLabelFromList(list) {
            return (Array.isArray(list) ? list : []).filter(Boolean).join(' / ');
        },
        renderPurposeButtonHTML: (btn) => `
            <button class="purpose-btn" type="button" data-purpose="${Utils.esc(btn.id)}" aria-pressed="false" aria-label="${Utils.esc(btn.label)} ${Utils.esc(btn.desc || '')}">
                <span class="purpose-icon-wrap"><i class="fa-solid ${btn.icon}"></i></span>
                <span class="purpose-text-wrap">
                    <span class="purpose-title">${Utils.esc(btn.label)}</span>
                    <span class="purpose-desc">${Utils.esc(btn.desc || '')}</span>
                </span>
                <span class="purpose-chevron" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
            </button>
        `,
        
        getCurrentReturnPurposeList() {
            const raw = String(state.currentReturnCard?.userInfo?.purpose || '').trim();
            if (!raw) return [];
            const selected = [];
            if (/물품/.test(raw)) selected.push('물품구매');
            if (/식사|다과/.test(raw)) selected.push('식사다과');
            if (/특근|매식/.test(raw)) selected.push('특근매식');
            const order = CardLogic.getPurposeOptions().map(x => x.id);
            return Array.from(new Set(selected)).sort((a, b) => order.indexOf(a) - order.indexOf(b));
        },
        getReceiptPurposeConfig(purposeList = CardLogic.getCurrentReturnPurposeList()) {
            const list = Array.isArray(purposeList) ? purposeList : [];
            const hasMeal = list.includes('특근매식');
            const generalPurposes = list.filter(x => x !== '특근매식');
            return {
                purposeList: list,
                hasMeal,
                mealOnly: hasMeal && generalPurposes.length === 0,
                allowMealToggle: hasMeal && generalPurposes.length > 0,
                generalPurposes
            };
        },
        getDefaultGeneralReceiptToneFromPurposes(purposeList = CardLogic.getCurrentReturnPurposeList()) {
            const list = Array.isArray(purposeList) ? purposeList : [];
            if (list.includes('물품구매')) return 'purchase';
            if (list.includes('식사다과')) return 'dining';
            return 'purchase';
        },
        getReceiptPopupToneFromPurposeText(storeText = '', detailsText = '', purposeList = CardLogic.getCurrentReturnPurposeList()) {
            const list = Array.isArray(purposeList) ? purposeList : [];
            const allowPurchase = list.length === 0 || list.includes('물품구매');
            const allowDining = list.includes('식사다과');
            const detailsOnly = String(detailsText || '').toLowerCase();
            const diningPattern = /식사|식대|다과|간식|간담회|회식|음료|커피|카페|차|빵|베이커리|김밥|도시락|한식|중식|일식|양식|분식|설렁탕|해장국|국밥|곰탕|찌개|냉면|버거|피자|치킨|식당/;
            const purchasePattern = /물품|비품|소모품|구매|행사|준비물|사무|문구|인쇄|복사|재료|용품/;

            if (allowDining && !allowPurchase) return 'dining';
            if (allowPurchase && !allowDining) return 'purchase';
            if (allowDining && diningPattern.test(detailsOnly)) return 'dining';
            if (allowPurchase && purchasePattern.test(detailsOnly)) return 'purchase';
            return CardLogic.getDefaultGeneralReceiptToneFromPurposes(list);
        },
        getReceiptPurposeFromTone(tone, purposeList = CardLogic.getCurrentReturnPurposeList()) {
            const list = Array.isArray(purposeList) ? purposeList : [];
            const general = list.filter(x => x !== '특근매식');
            if (tone === 'dining' && general.includes('식사다과')) return '식사다과';
            if (tone === 'purchase' && general.includes('물품구매')) return '물품구매';
            if (general.length === 1) return general[0];
            if (general.includes('물품구매')) return '물품구매';
            if (general.includes('식사다과')) return '식사다과';
            return '';
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_DOMAIN_CART
        영수증 장바구니 도메인 시작. 아래 OCR/파일/팝업/자동저장/삭제 흐름은 모두 대표 영수증 기준입니다.
        @SUBSECTION: JS_RECEIPT_CART_RENDERING
        영수증 장바구니 아이템 HTML과 상태 오버레이 렌더링
        ========================================================= */
        // 변경 부분: 오버레이 로직 전면 개편 (분석중, 저장중, 저장완료를 부드럽게 연결)
        renderReceiptCartItemHTML: (it, i, isMealContext=false) => {
            
            const processing = String(it.processing || '');
            const itemIsMeal = Utils.isMealExpenseItem(it);
            const needDetails = (!itemIsMeal) && !(String(it.usageDetails || '').trim());
            const isAnalysisPhase = ['queued', 'optimizing', 'ocr', 'postprocessing'].includes(processing);
            const isSaving = processing === 'saving';
            const isSaved = processing === 'saved';
            const isReview = processing === 'review' || !!it.needsManualReview;
            const isProcessing = isAnalysisPhase || isSaving || processing === 'deleting';
            const showOverlay = isAnalysisPhase || isSaving || isSaved;
            const needWarn = needDetails || isReview || processing === 'save_error';
            const cls = [
                isProcessing ? 'processing' : '',
                isAnalysisPhase ? 'analysis-phase' : '',
                isSaving ? 'saving' : '',
                showOverlay ? 'overlay-phase' : '',
                isSaved ? 'saved' : '',
                isReview ? 'needs-review' : '',
                needWarn ? 'needs-details' : ''
            ].filter(Boolean).join(' ');

            let overlayTitle = CardLogic.getReceiptProcessingLabel(processing);
            if (isSaved) overlayTitle = '저장완료';

            const displayAmount = (it.amount === '' || it.amount == null) ? '' : `${Utils.nfKR.format(Number(it.amount || 0))}원`;
            
            const getSemanticReceiptMeta = (item, isMealItem) => {
                if (isMealItem) {
                    return { icon: 'fa-utensils', tone: 'icon-tone-meal', badgeClass: 'tag-meal', semanticType: 'meal' };
                }
                const purposeList = CardLogic.getCurrentReturnPurposeList();
                const semanticType = CardLogic.getReceiptPopupToneFromPurposeText('', item?.usageDetails || '', purposeList);
                if (semanticType === 'dining') {
                    return { icon: 'fa-mug-hot', tone: 'icon-tone-cafe', badgeClass: 'tag-dining', semanticType: 'dining' };
                }
                if (semanticType === 'purchase') {
                    return { icon: 'fa-box-open', tone: 'icon-tone-shopping', badgeClass: String(item?.usageDetails || '').trim() ? 'tag-purchase' : 'tag-neutral', semanticType: 'purchase' };
                }
                return { icon: 'fa-box-open', tone: 'icon-tone-shopping', badgeClass: 'tag-neutral', semanticType: 'neutral' };
            };

            if (processing === 'error') {
                return `<div class="cart-item needs-details needs-review operational-blocked" data-index="${i}">
                     <div class="cart-item-info">
                        <span class="cart-item-place receipt-analysis-failed-text">분석실패</span>
                        <span class="cart-item-details">터치해서 직접 입력하거나 삭제 후 다시 첨부하세요 <span class="review-pointer"><i class="fa-solid fa-hand-pointer"></i></span></span>
                     </div>
                     <div class="cart-item-amount-box"></div>
                     <button class="cart-item-delete-wide" type="button">삭제</button>
                </div>`;
            }

            if (showOverlay) {
                let iconHTML = `<div class="breathing-dot" aria-hidden="true"></div>`;
                if (isSaved) iconHTML = `<div class="saved-check-mark"><i class="fa-solid fa-check"></i></div>`;

                const bgPlace = (isSaving || isSaved) ? (Utils.esc(it.usagePlace) || '상호명 없음') : '';
                const bgDetails = (isSaving || isSaved) ? (Utils.esc(it.usageDetails) || '') : '';
                const bgAmount = (isSaving || isSaved) ? displayAmount : '';

                return `<div class="cart-item ${cls}" data-index="${i}" data-processing-text="${Utils.esc(CardLogic.getReceiptProcessingLabel(processing))}">
                    <div class="cart-item-info">
                        <span class="cart-item-place">${bgPlace}</span>
                        <span class="cart-item-details">${bgDetails}</span>
                    </div>
                    <div class="cart-item-amount-box"><span class="cart-item-amount">${bgAmount}</span></div>
                    <div class="processing-overlay">
                        ${iconHTML}
                        <span class="processing-title">${Utils.esc(overlayTitle)}</span>
                    </div>
                </div>`;
            }

            const placeText = processing === 'save_error'
                ? '저장실패'
                : (isReview ? '확인필요' : (Utils.esc(it.usagePlace) || '상호명 없음'));
            const detailTextRaw = processing === 'save_error'
                ? '터치하여 다시 저장하거나 삭제 후 다시 첨부하세요'
                : (isReview
                    ? '사용처/금액/내용을 확인한 뒤 저장해 주세요'
                    : String(it.usageDetails || '').trim());
            
            const adjustedNote = '';
            const semanticMeta = getSemanticReceiptMeta(it, itemIsMeal);
            const displayIcon = semanticMeta.icon;
            const displayToneClass = semanticMeta.tone;
            const detailBadgeClass = semanticMeta.badgeClass;
            const detailBadgeText = detailTextRaw ? `#${String(detailTextRaw).replace(/^#+/, '')}` : '#내역없음';
            const detailBadgeHTML = `<span class="receipt-detail-hashtag ${detailTextRaw ? detailBadgeClass : 'tag-neutral'}">${Utils.esc(detailBadgeText)}</span>`;

            return `<div class="cart-item with-inline-actions ${cls} ${itemIsMeal ? 'meal-expense-item' : ''}" data-index="${i}" ${processing?`data-processing-text="${Utils.esc(CardLogic.getReceiptProcessingLabel(processing))}"`:''}>
                <div class="cart-item-icon ${displayToneClass}" aria-hidden="true"><i class="fa-solid ${displayIcon}"></i></div>
                <div class="cart-item-info">
                    <span class="cart-item-place">${placeText}</span>
                    <span class="cart-item-details">${detailBadgeHTML}${adjustedNote}${needWarn ? ` <span class="review-pointer"><i class="fa-solid fa-hand-pointer"></i></span>` : ''}</span>
                </div>
                <div class="cart-item-amount-box"><span class="cart-item-amount">${displayAmount}</span></div>
                ${!isProcessing?`<button class="cart-item-delete-wide" type="button" aria-label="영수증 삭제">삭제</button>`:''}
            </div>`;
        },
        requestRenderReceiptCart: () => {
            if (state._renderReceiptScheduled) return;
            state._renderReceiptScheduled = true;
            requestAnimationFrame(() => {
                state._renderReceiptScheduled = false;
                CardLogic.renderReceiptCart();
            });
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_AUTOSAVE
        영수증 장바구니 저장을 debounce 처리하고 저장 완료 표시
        ========================================================= */
        queueSaveCart: (backupCart = null) => new Promise((resolve, reject) => {
            
            const token = ++state.cartSaveToken;
            state.cartSavePending = state.cartSavePending || [];
            state.cartSavePending.push({ resolve, reject, backupCart, token });

            if (state.cartSaveTimer) clearTimeout(state.cartSaveTimer);
            state.cartSaveTimer = setTimeout(async () => {
                const pending = state.cartSavePending || [];
                state.cartSavePending = [];
                state.cartSaveTimer = null;

                try {
                    const hasUnpersistedReceiptImage = state.receiptCart.some(it => {
                        const img = String((it && it.receiptImage) || '');
                        return !!(img && !img.startsWith('id:'));
                    });
                    if (hasUnpersistedReceiptImage) {
                        throw new Error('RECEIPT_IMAGE_NOT_PERSISTED');
                    }

                    
                    const saveRes = await Api.call('saveCartToMasterFile', {
                        cardId: state.currentReturnCard.id,
                        cartData: Utils.sanitizeReceiptCart(state.receiptCart)
                    });
                    
                    if (!saveRes || saveRes.status !== 'success') {
                        const msg = saveRes && (saveRes.message || saveRes.error) ? (saveRes.message || saveRes.error) : 'RECEIPT_CART_SAVE_NOT_CONFIRMED';
                        throw new Error(msg);
                    }

                    
                    const confirmedCart = Utils.sanitizeReceiptCart(state.receiptCart);
                    if (state.currentReturnCard) {
                        state.currentReturnCard.savedCart = confirmedCart;
                    }
                    if (Array.isArray(state.allCardData) && state.currentReturnCard) {
                        const targetCard = state.allCardData.find(c => c && c.id === state.currentReturnCard.id);
                        if (targetCard) targetCard.savedCart = confirmedCart;
                    }

                    
                    state.receiptCart.forEach((it, idx) => {
                        if (it && it.processing === 'saving') {
                            it.processing = 'saved';
                            setTimeout(() => {
                                const cur = state.receiptCart[idx];
                                if (cur && cur.processing === 'saved') {
                                    delete cur.processing;
                                    delete cur._uiTransient;
                                    const refreshedCart = Utils.sanitizeReceiptCart(state.receiptCart);
                                    if (state.currentReturnCard) state.currentReturnCard.savedCart = refreshedCart;
                                    if (Array.isArray(state.allCardData) && state.currentReturnCard) {
                                        const targetCard = state.allCardData.find(c => c && c.id === state.currentReturnCard.id);
                                        if (targetCard) targetCard.savedCart = refreshedCart;
                                    }
                                    CardLogic.requestRenderReceiptCart();
                                }
                            }, 850);
                        }
                    });
                    CardLogic.requestRenderReceiptCart();
                    pending.forEach(p => p.resolve(true));
                } catch (e) {
                    
                    const rollback = [...pending].reverse().find(p => p.backupCart);
                    if (rollback && rollback.backupCart) {
                        state.receiptCart = rollback.backupCart;
                        CardLogic.requestRenderReceiptCart();
                    }
                    pending.forEach(p => p.reject(e));
                }
            }, 220);
        }),
        startReviewMode: (startIdx, count) => {
            try {
                const isMeal = !!(state.currentReturnCard && state.currentReturnCard.userInfo && String(state.currentReturnCard.userInfo.purpose||'').includes('특근'));
                const q = [];
                for (let i = 0; i < count; i++) {
                    const idx = startIdx + i;
                    const it = state.receiptCart[idx];
                    if (!it || it.processing === 'error') continue;
                    if (!isMeal && !String(it.usageDetails||'').trim()) q.push(idx);
                }
                state.reviewQueue = q;
            } catch(e) {}
        },
        continueReviewIfNeeded: (savedIdx) => {
            try {
                if (!state.reviewQueue || !state.reviewQueue.length) return;
                if (state.reviewQueue[0] !== savedIdx) return;
                state.reviewQueue.shift();
                if (state.reviewQueue.length) {
                    const nextIdx = state.reviewQueue[0];
                    try{
                        if (window.Swal) {
                            Swal.fire({
                                title: '다음 영수증 준비중',
                                text: '',
                                showConfirmButton: false,
                                allowOutsideClick: false,
                                allowEscapeKey: false,
                                backdrop: true,
                                didOpen: () => { try { Swal.showLoading(); } catch(e){} }
                            });
                        }
                    } catch(e) {}
                    setTimeout(() => { try{ if(window.Swal) Swal.close(); }catch(e){}; CardLogic.openOcrPopup(state.receiptCart[nextIdx], nextIdx); }, 650);
                }
            } catch(e) {}
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_OCR_HELPERS
        OCR 결과 검증, 처리 상태 라벨, 사용자 안내 toast
        ========================================================= */
        isReceiptAnalysisFailed: (ocr) => {
            if (!ocr || ocr.ok === false) return true;
            const place = String(ocr.storeName || '').trim();
            const amount = String(ocr.amount || '').replace(/[^\d]/g, '').trim();

            // 금액은 필수입니다. 상호명이 비면 제출 데이터 품질이 떨어져서 직접 확인 대상으로 둡니다.
            return !place || !amount;
        },
        // 변경 부분: getReceiptProcessingLabel 처리 상태 추가 매핑
        getReceiptProcessingLabel: (processing) => {
            switch (processing) {
                case 'queued': return '분석 대기중';
                case 'optimizing': return '이미지 준비중';
                case 'ocr': return '분석중';
                case 'postprocessing': return '분석 완료';
                case 'saving': return '저장중';
                case 'saved': return '저장완료';
                case 'review': return '확인필요';
                case 'deleting': return '삭제중';
                case 'save_error': return '저장실패';
                case 'error': return '분석실패';
                default: return '처리중';
            }
        },
        showMealAutoAdjustToast: () => {
            // 자동 금액 보정 안내 모달/토스트는 비활성화 상태를 유지합니다.
        },
        showReceiptAnalysisFallback: (isReplacement = false) => {
            try {
                if (!isReplacement) {
                    Swal.fire({
                        toast: true,
                        position: 'top',
                        icon: 'warning',
                        title: '확인 필요',
                        text: '영수증을 눌러 내용을 확인해 주세요.',
                        showConfirmButton: false,
                        timer: 2200,
                        timerProgressBar: true,
                        backdrop: false
                    });
                    return;
                }
                Swal.fire({
                    icon: 'warning',
                    title: '인식 실패',
                    text: isReplacement
                        ? '자동 분석에 실패했습니다. 직접 입력해 주세요.'
                        : '자동 분석에 실패했습니다. 직접 입력해 주세요.',
                    confirmButtonColor: '#007aff'
                });
            } catch (e) {}
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_UPLOAD_ENTRY
        영수증 파일 선택창 열기와 upload picker 상태 전달
        ========================================================= */
        triggerImageSelection: async (editIndex = -1) => {
            // 이미 분석/저장 작업이 진행 중이면 파일 선택창을 다시 열지 않는다.
            const hasActiveUpload = Array.isArray(state.receiptCart) && state.receiptCart.some(it =>
                it && ['queued', 'optimizing', 'ocr', 'postprocessing', 'saving'].includes(it.processing)
            );
            if (hasActiveUpload) {
                try {
                    Swal.fire({
                        toast: true,
                        position: 'top',
                        icon: 'warning',
                        title: '영수증 처리중',
                        showConfirmButton: false,
                        timer: 1500
                    });
                } catch (e) {}
                return;
            }

            Utils.haptic(12);
            state.pendingEditIndex = editIndex;
            const input = document.getElementById('receipt-file-input');
            if (!input) return;
            if (editIndex > -1) input.removeAttribute('multiple');
            else input.setAttribute('multiple', '');
            input.value = '';
            EmbedBridge.notify('UPLOAD_PICKER_OPEN');
            if (state._uploadPickerTimer) clearTimeout(state._uploadPickerTimer);
            state._uploadPickerTimer = setTimeout(() => {
                EmbedBridge.notify('UPLOAD_PICKER_TIMEOUT');
            }, 12000);
            input.click();
        },
        /* =========================================================
        @SUBSECTION: JS_CARD_LIST_RENDERING
        카드 목록 정렬/필터링/버튼 생성
        ========================================================= */
        displayCardList: () => {
            elements.cardGrid.innerHTML = '';
            elements.cardGrid.classList.remove('is-loaded');
            if (!state.allCardData) return;
            const visibleCards = state.allCardData.filter(CardLogic.isCardVisibleToCurrentUsers);
            const sorted = [...visibleCards].sort((a,b) => {
                if(a.id.includes('해외'))return 1;
                if(b.id.includes('해외'))return -1;
                return parseInt(a.id.replace(/\D/g,'')) - parseInt(b.id.replace(/\D/g,''));
            });
            const icon = state.enteredUsers.length > 1 ? 'fa-utensils' : 'fa-credit-card';
            elements.cardSelectionHeader.innerHTML =
                `<i class="fa-solid ${icon}"></i>${state.enteredUsers.length>1?' 사용할 카드를 선택해주세요.':' 사용할 카드를 선택해주세요.'}`;
            const frag = document.createDocumentFragment();
            sorted.forEach((c, i) => frag.appendChild(CardLogic.createCardButton(c, i)));
            elements.cardGrid.appendChild(frag);
            setTimeout(() => elements.cardGrid.classList.add('is-loaded'), 50);
        },
        createCardButton: (card, idx) => {
            const wrap = document.createElement('div');
            wrap.className = 'card-item-wrapper hybrid-card-slot';
            wrap.dataset.cardId = card.id;
            wrap.style.transitionDelay = `${idx * CARD_APPEAR_DELAY_MS}ms`;

            const rawStatus = String(card.status || '').trim();
            const compactStatus = rawStatus.replace(/\s+/g, '');
            const status = (compactStatus === '대여가능' || compactStatus === '사용가능' || compactStatus === '가능') ? '사용가능'
                : (compactStatus === '대여중' ? '사용중' : rawStatus);
            if (status === '사용가능') wrap.classList.add('card-status-available');
            else if (status === '사용중' || status === '신청중') wrap.classList.add('card-status-inuse', 'disabled');
            else if (status === '반납처리중') wrap.classList.add('card-status-returning', 'disabled');
            else if (status === '반납오류') wrap.classList.add('card-status-unknown', 'disabled');
            else wrap.classList.add('card-status-unknown', 'disabled');

            if (String(card.id || '').includes('해외') || String(card.name || '').includes('해외') || String(card.displayName || '').includes('해외')) wrap.classList.add('special-overseas-card');
            wrap.innerHTML = CardLogic.renderCardButtonHTML(card);
            return wrap;
        },
        /* =========================================================
        @SUBSECTION: JS_PURPOSE_RENT_FLOW
        카드 사용 목적 선택 오버레이와 대여 요청
        ========================================================= */

        
        getPurposeOptions() {
            return [
                { id: '물품구매', icon: 'fa-box-open', label: '물품구매', desc: '비품 · 소모품 · 행사 준비물', tone: 'purchase' },
                { id: '식사다과', icon: 'fa-mug-hot', label: '식사다과', desc: '식사 · 간식 · 다과', tone: 'dining' },
                { id: '특근매식', icon: 'fa-utensils', label: '특근매식', desc: '특근 · 매식비', tone: 'meal' }
            ];
        },
        openPurposeFlight(card, sourceEl) {
            try {
                if (CardLogic._flightCard || !card || !sourceEl) return;
                const overlay = document.getElementById('purpose-flight-overlay');
                const layer = document.getElementById('purpose-flight-layer');
                if (!overlay || !layer) {
                    CardLogic.openMorphOverlay(card);
                    return;
                }

                const firstRect = sourceEl.getBoundingClientRect();
                const computed = window.getComputedStyle(sourceEl);
                const radius = computed.borderRadius || '24px';
                const isOverseas = String(card.id || '').includes('해외') || String(card.name || '').includes('해외') || String(card.displayName || '').includes('해외');
                const options = CardLogic.getPurposeOptions();
                const isMobile = window.innerWidth < 768;
                const targetW = Math.min(isMobile ? window.innerWidth - 32 : 410, window.innerWidth - 28);
                const targetH = isMobile ? Math.min(360, window.innerHeight - 72) : 340;
                const targetLeft = (window.innerWidth - targetW) / 2;
                const targetTop = Math.max(18, (window.innerHeight - targetH) / 2);
                const targetCenterX = targetLeft + targetW / 2;
                const targetCenterY = targetTop + targetH / 2;
                const firstCenterX = firstRect.left + firstRect.width / 2;
                const firstCenterY = firstRect.top + firstRect.height / 2;
                const deltaX = firstCenterX - targetCenterX;
                const deltaY = firstCenterY - targetCenterY;
                const scaleX = firstRect.width / targetW;
                const scaleY = firstRect.height / targetH;

                const flyer = document.createElement('div');
                flyer.className = 'purpose-flying-card';
                flyer.dataset.cardId = card.id;
                flyer.style.top = `${targetTop}px`;
                flyer.style.left = `${targetLeft}px`;
                flyer.style.width = `${targetW}px`;
                flyer.style.height = `${targetH}px`;
                flyer.style.borderRadius = radius;
                flyer.style.boxShadow = '0 12px 24px rgba(31,65,117,.16)';
                flyer.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0) scale(${scaleX}, ${scaleY}) rotateY(0deg)`;
                flyer.innerHTML = `
                    <div class="purpose-flying-face purpose-flight-front purpose-flight-radius-inherit ${isOverseas ? 'is-overseas' : ''}">
                        <div class="purpose-flight-card-header">
                            <span class="flight-chip" aria-hidden="true"></span>
                            <span class="purpose-flight-available-label">AVAILABLE</span>
                        </div>
                        <div>
                            <div class="flight-card-name">${Utils.esc(card.displayName || card.id || '')}</div>
                            <div class="flight-card-meta">WOOSUNG CARD</div>
                        </div>
                    </div>
                    <div class="purpose-flying-face purpose-flight-back purpose-flight-radius-inherit">
                        <div class="flight-purpose-top flight-content-fade">
                            <div>
                                <h3 class="flight-purpose-title" data-flight-title="1">목적을 먼저 선택해 주세요</h3>
                                <p class="flight-purpose-sub" data-flight-sub="1">카드 신청 목적을 하나 이상 선택하면 신청 확정 버튼이 활성화됩니다.</p>
                            </div>
                            <button class="flight-cancel-btn" type="button" data-flight-close="1">취소</button>
                        </div>
                        <div class="flight-purpose-list flight-content-fade">
                            ${options.map(btn => `
                                <button class="flight-purpose-btn tone-${Utils.esc(btn.tone || 'default')}" type="button" data-flight-purpose="${Utils.esc(btn.id)}" aria-pressed="false" data-flight-tone="${Utils.esc(btn.tone || 'default')}" aria-label="${Utils.esc(btn.label)} ${Utils.esc(btn.desc || '')}">
                                    <span class="flight-purpose-icon"><i class="fa-solid ${btn.icon}"></i></span>
                                    <span class="flight-purpose-copy"><strong>${Utils.esc(btn.label)}</strong><span>${Utils.esc(btn.desc || '')}</span></span>
                                </button>
                            `).join('')}
                        </div>
                        <button class="flight-final-btn flight-content-fade" type="button" data-flight-final="1" disabled><span>목적 선택 후 신청 확정</span></button>
                    </div>
                `;

                layer.appendChild(flyer);
                CardLogic._flightCard = flyer;
                CardLogic._flightSource = sourceEl;
                CardLogic._flightSourceCard = card;
                CardLogic._flightTarget = { left: targetLeft, top: targetTop, width: targetW, height: targetH };
                delete flyer.dataset.selectedPurpose;
                delete flyer.dataset.selectedPurposes;
                sourceEl.classList.add('flight-source-hidden');
                document.body.classList.add('purpose-flight-open');

                overlay.style.display = 'block';
                overlay.setAttribute('aria-hidden', 'false');
                layer.setAttribute('aria-hidden', 'false');
                overlay.offsetHeight;
                overlay.classList.add('active');

                flyer.querySelectorAll('[data-flight-purpose]').forEach(btn => {
                    btn.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        CardLogic.selectPurposeInFlight(btn.dataset.flightPurpose, btn);
                    });
                });
                const closeBtn = flyer.querySelector('[data-flight-close]');
                if (closeBtn) closeBtn.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    CardLogic.closePurposeFlight();
                });
                const finalBtn = flyer.querySelector('[data-flight-final]');
                if (finalBtn) finalBtn.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    CardLogic.executePurposeFlightRent();
                });
                overlay.onclick = () => CardLogic.closePurposeFlight();

                flyer.offsetHeight;
                requestAnimationFrame(() => {
                    flyer.style.borderRadius = isMobile ? '22px' : '24px';
                    flyer.style.boxShadow = '0 26px 52px rgba(31,65,117,.30)';
                    flyer.style.transform = 'translate3d(0, 0, 0) scale(1, 1) rotateY(180deg)';
                    flyer.classList.add('flipped');
                });
            } catch (err) {
                console.error('purpose flight failed', err);
                CardLogic.cleanupPurposeFlight();
                CardLogic.openMorphOverlay(card);
            }
        },
        selectPurposeInFlight(purpose, buttonEl) {
            const flyer = CardLogic._flightCard;
            if (!flyer || !purpose) return;
            const current = CardLogic.getSelectedPurposeList(flyer);
            const exists = current.includes(purpose);
            const next = exists ? current.filter(x => x !== purpose) : current.concat(purpose);
            const selected = CardLogic.setSelectedPurposeList(flyer, next);
            flyer.querySelectorAll('[data-flight-purpose]').forEach(btn => {
                const isSelected = selected.includes(btn.dataset.flightPurpose);
                btn.classList.toggle('selected', isSelected);
                btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
            });
            const label = CardLogic.getPurposeLabelFromList(selected);
            const title = flyer.querySelector('[data-flight-title]');
            const sub = flyer.querySelector('[data-flight-sub]');
            if (title) title.textContent = selected.length ? '신청 목적 확인' : '목적을 먼저 선택해 주세요';
            if (sub) sub.textContent = selected.length
                ? `${label} 용도로 신청을 확정할 수 있습니다.`
                : '카드 신청 목적을 하나 이상 선택하면 신청 확정 버튼이 활성화됩니다.';
            const finalBtn = flyer.querySelector('[data-flight-final]');
            if (finalBtn) {
                finalBtn.innerHTML = selected.length ? `<span>${label} 용도로 신청 확정</span>` : '<span>목적 선택 후 신청 확정</span>';
                finalBtn.disabled = !selected.length;
                finalBtn.classList.remove('final-purchase', 'final-dining', 'final-meal', 'final-default', 'unlocked');
                if (selected.length) {
                    const tone = selected.length === 1 ? (buttonEl?.dataset?.flightTone || 'default') : 'default';
                    finalBtn.classList.add('unlocked', `final-${tone}`);
                }
            }
        },
        executePurposeFlightRent() {
            const flyer = CardLogic._flightCard;
            const card = CardLogic._flightSourceCard;
            const purpose = CardLogic.getPurposeLabelFromList(CardLogic.getSelectedPurposeList(flyer));
            if (!flyer || !card || !purpose || CardLogic._rentInFlight) return;
            const finalBtn = flyer.querySelector('[data-flight-final]');
            if (finalBtn) {
                finalBtn.disabled = true;
                finalBtn.innerHTML = '<span>신청 접수 중...</span>';
                finalBtn.classList.add('is-submitting');
            }
            const cardId = card.id;
            CardLogic.cleanupPurposeFlight();
            CardLogic.submitRentRequest(cardId, purpose);
        },
        closePurposeFlight() {
            const flyer = CardLogic._flightCard;
            const source = CardLogic._flightSource;
            const overlay = document.getElementById('purpose-flight-overlay');
            if (!flyer || !source) {
                CardLogic.cleanupPurposeFlight();
                return;
            }
            try {
                if (overlay) overlay.classList.remove('active');
                const originRect = source.getBoundingClientRect();
                const radius = window.getComputedStyle(source).borderRadius || '24px';
                const target = CardLogic._flightTarget || {
                    left: parseFloat(flyer.style.left) || 0,
                    top: parseFloat(flyer.style.top) || 0,
                    width: parseFloat(flyer.style.width) || flyer.offsetWidth,
                    height: parseFloat(flyer.style.height) || flyer.offsetHeight
                };
                const targetCenterX = target.left + target.width / 2;
                const targetCenterY = target.top + target.height / 2;
                const originCenterX = originRect.left + originRect.width / 2;
                const originCenterY = originRect.top + originRect.height / 2;
                const deltaX = originCenterX - targetCenterX;
                const deltaY = originCenterY - targetCenterY;
                const scaleX = originRect.width / target.width;
                const scaleY = originRect.height / target.height;
                flyer.classList.remove('flipped');
                flyer.classList.remove('flying-card-active');
                flyer.style.borderRadius = radius;
                flyer.style.boxShadow = '0 10px 20px rgba(31,65,117,.10)';
                flyer.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0) scale(${scaleX}, ${scaleY}) rotateY(0deg)`;
                setTimeout(() => CardLogic.cleanupPurposeFlight(), 540);
            } catch (err) {
                CardLogic.cleanupPurposeFlight();
            }
        },
        cleanupPurposeFlight() {
            const overlay = document.getElementById('purpose-flight-overlay');
            const layer = document.getElementById('purpose-flight-layer');
            if (CardLogic._flightCard) {
                try { CardLogic._flightCard.remove(); } catch(e) {}
            }
            if (CardLogic._flightSource) {
                CardLogic._flightSource.classList.remove('flight-source-hidden');
            }
            if (overlay) {
                overlay.classList.remove('active');
                overlay.style.display = 'none';
                overlay.setAttribute('aria-hidden', 'true');
                overlay.onclick = null;
            }
            if (layer) layer.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('purpose-flight-open');
            CardLogic._flightCard = null;
            CardLogic._flightSource = null;
            CardLogic._flightSourceCard = null;
            CardLogic._flightTarget = null;
        },
        openMorphOverlay(card) {
            const cardEl = document.querySelector(`.card-item-wrapper[data-card-id="${card.id}"]`);
            const overlay = document.getElementById('morph-overlay');
            if (cardEl && overlay) {
                const rect = cardEl.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                overlay.style.setProperty('--morph-origin-x', `${centerX}px`);
                overlay.style.setProperty('--morph-origin-y', `${centerY}px`);
            }
            const title = document.getElementById('morph-title');
            const actions = document.getElementById('morph-actions');
            const closeBtn = document.getElementById('close-morph-btn');
            overlay.dataset.cardId = card.id;
            const chip = document.getElementById('purpose-card-chip');
            const subheader = document.getElementById('morph-subheader');
            if (chip) chip.textContent = `${card.displayName} 신청`;
            title.textContent = '사용 목적 선택';
            if (subheader) subheader.textContent = '여러 용도로 사용할 수 있으면 중복 선택해 주세요';
            const buttons = [
                { id: '물품구매', icon: 'fa-box', label: '물품구매', desc: '비품 · 소모품 · 행사 준비물' },
                { id: '식사다과', icon: 'fa-mug-hot', label: '식사다과', desc: '식사 · 간식 · 다과' },
                { id: '특근매식', icon: 'fa-utensils', label: '특근매식', desc: '특근 · 매식비' }
            ];
            actions.innerHTML = buttons.map(CardLogic.renderPurposeButtonHTML).join('');
            CardLogic.resetPurposeConfirmation();
            closeBtn.onclick = CardLogic.closeMorphOverlay;
            overlay.classList.add('active');
        },
        resetPurposeConfirmation() {
            const overlay = document.getElementById('morph-overlay');
            const finalBtn = document.getElementById('btn-final-rent');
            delete overlay.dataset.selectedPurpose;
            delete overlay.dataset.selectedPurposes;
            document.querySelectorAll('#morph-actions .purpose-btn[data-purpose]').forEach(btn => {
                btn.classList.remove('selected');
                btn.setAttribute('aria-pressed', 'false');
            });
            if (finalBtn) {
                finalBtn.textContent = '목적을 먼저 선택해 주세요';
                finalBtn.classList.remove('unlocked', 'is-submitting');
                finalBtn.disabled = true;
            }
        },
        selectPurposeForConfirmation(purpose, buttonEl) {
            const overlay = document.getElementById('morph-overlay');
            const finalBtn = document.getElementById('btn-final-rent');
            if (!overlay || !purpose) return;
            const current = CardLogic.getSelectedPurposeList(overlay);
            const exists = current.includes(purpose);
            const selected = CardLogic.setSelectedPurposeList(overlay, exists ? current.filter(x => x !== purpose) : current.concat(purpose));
            document.querySelectorAll('#morph-actions .purpose-btn[data-purpose]').forEach(btn => {
                const isSelected = selected.includes(btn.dataset.purpose);
                btn.classList.toggle('selected', isSelected);
                btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
            });
            const label = CardLogic.getPurposeLabelFromList(selected);
            if (finalBtn) {
                finalBtn.textContent = selected.length ? `${label} 용도로 카드 신청 확정` : '목적을 먼저 선택해 주세요';
                finalBtn.classList.toggle('unlocked', !!selected.length);
                finalBtn.disabled = !selected.length;
            }
        },
        executeSelectedPurposeRent() {
            const overlay = document.getElementById('morph-overlay');
            const finalBtn = document.getElementById('btn-final-rent');
            const cardId = overlay?.dataset.cardId;
            const purpose = CardLogic.getPurposeLabelFromList(CardLogic.getSelectedPurposeList(overlay));
            if (!cardId || !purpose || CardLogic._rentInFlight) return;
            if (finalBtn) {
                finalBtn.classList.add('is-submitting');
                finalBtn.innerHTML = '<span>신청 접수 중...</span>';
                finalBtn.disabled = true;
            }
            CardLogic.submitRentRequest(cardId, purpose);
        },
        closeMorphOverlay() {
            const overlay = document.getElementById('morph-overlay');
            overlay.classList.remove('active');
            CardLogic.resetPurposeConfirmation();
            delete overlay.dataset.cardId;
        },
        submitRentRequest(id, purpose) {
            if (CardLogic._rentInFlight) return;
            CardLogic._rentInFlight = true;

            const names = state.enteredUsers.map(u => u.name).join(', ');
            const item = {
                requestId: Utils.createClientRequestId('rent'),
                usageSessionId: Utils.createClientRequestId('usage'),
                cardNumber: id,
                userName: names,
                purpose,
                userExtensions: state.enteredUsers.map(u => u.extension),
                createdAt: Date.now()
            };

            
            CardLogic.enqueuePendingRentRequest(item);
            CardLogic.applyOptimisticRentState(item);
            CardLogic.closeMorphOverlay();
            UIManager.showConfirmationScreen('신청 완료',
                Utils.createDetailRow('카드번호', id)+
                Utils.createDetailRow('사용자', names)+
                Utils.createDetailRow('사용 목적', purpose)
            );
            CardLogic._rentInFlight = false;

            CardLogic.runRentRequestWithRetry(item, { silent: false }).catch(console.error);
        },
        
        getPendingRentRequests() {
            try {
                const raw = localStorage.getItem(RENT_SYNC_STORAGE_KEY);
                const list = JSON.parse(raw || '[]');
                return Array.isArray(list) ? list.filter(x => x && x.requestId && x.cardNumber) : [];
            } catch(e) {
                return [];
            }
        },
        savePendingRentRequests(list) {
            try {
                localStorage.setItem(RENT_SYNC_STORAGE_KEY, JSON.stringify(Array.isArray(list) ? list : []));
            } catch(e) {}
        },
        enqueuePendingRentRequest(item) {
            const list = CardLogic.getPendingRentRequests().filter(x => x.requestId !== item.requestId);
            list.push(item);
            CardLogic.savePendingRentRequests(list);
        },
        removePendingRentRequest(requestId) {
            const list = CardLogic.getPendingRentRequests().filter(x => x.requestId !== requestId);
            CardLogic.savePendingRentRequests(list);
        },
        applyOptimisticRentState(item) {
            const t = state.allCardData?.find(c => c.id === item.cardNumber);
            if (!t) return;
            
            t.status = '신청중';
            t.userInfo = t.userInfo || {};
            t.userInfo.userName = item.userName;
            t.userInfo.purpose = item.purpose;
            t.userInfo.receiveDate = Utils.formatDateKR();
            t.userInfo.usageSessionId = item.usageSessionId || item.requestId || '';
            t.savedCart = [];
        },
        async runRentRequestWithRetry(item, opts = {}) {
            if (!item || !item.requestId || !item.cardNumber) return false;
            if (!CardLogic._rentSyncing) CardLogic._rentSyncing = {};
            if (CardLogic._rentSyncing[item.requestId]) return false;
            CardLogic._rentSyncing[item.requestId] = true;

            let lastError = null;
            try {
                for (let i = 0; i < RENT_RETRY_DELAYS_MS.length; i++) {
                    const delay = RENT_RETRY_DELAYS_MS[i];
                    if (delay > 0) await new Promise(res => setTimeout(res, delay));
                    try {
                        const r = await Api.call('rentNow', {
                            cardNumber: item.cardNumber,
                            userName: item.userName,
                            purpose: item.purpose,
                            userExtensions: item.userExtensions || [],
                            requestId: item.requestId,
                            usageSessionId: item.usageSessionId || item.requestId || ''
                        });
                        if (r?.status === 'conflict') {
                            CardLogic.removePendingRentRequest(item.requestId);
                            state.pendingPostReturnSync = true;
                            CardLogic.scheduleQuickSync(1, 600);
                            if (!opts.silent) {
                                Swal.fire('신청 확인 필요', '이미 사용 중인 카드입니다. 카드 목록을 다시 확인해 주세요.', 'warning');
                            }
                            return false;
                        }
                        CardLogic.removePendingRentRequest(item.requestId);
                        const t = state.allCardData?.find(c => c.id === item.cardNumber);
                        if (t && String(t.status || '').trim() === '신청중') {
                            t.status = '사용중';
                            t.userInfo = t.userInfo || {};
                            t.userInfo.usageSessionId = (r && r.usageSessionId) || item.usageSessionId || item.requestId || '';
                        }
                        state.pendingPostReturnSync = true;
                        CardLogic.scheduleQuickSync(1, 900);
                        return true;
                    } catch(e) {
                        lastError = e;
                    }
                }

                if (!opts.silent) {
                    Swal.fire({
                        icon: 'warning',
                        title: '신청 처리중',
                        text: '카드는 신청중으로 표시됩니다.',
                        confirmButtonText: '확인'
                    });
                }
                return false;
            } finally {
                delete CardLogic._rentSyncing[item.requestId];
            }
        },
        drainPendingRentRequests() {
            const list = CardLogic.getPendingRentRequests();
            if (!list.length) return;
            list.forEach(item => {
                CardLogic.runRentRequestWithRetry(item, { silent: true }).catch(console.error);
            });
        },
        /* =========================================================
        @SUBSECTION: JS_RETURN_SCREEN_LAYOUT
        반납 화면 제목/버튼/권한 안내 구성
        ========================================================= */
        setupAndShowReturnScreen: (card) => {

            document.getElementById('return-screen-title').innerHTML =

                    </div>
                    <div class="return-user-name">
                        (${Utils.esc(card.userInfo.userName)})
                    </div>
                    ${showBadge ? `
                    <div class="card-header-badge card-header-badge--flush ${purposeBadgeClass}">
                        <i class="fa-solid ${purposeIcon}"></i> ${Utils.esc(purpose)}
                    </div>` : ''}
                </div>`;
            
            state.receiptCart = Utils.sanitizeReceiptCart(card.savedCart || []);
            
            const receiptReloadToken = Utils.createClientRequestId('receipt_reload');
            state.receiptReloadToken = receiptReloadToken;
            const add = document.createElement('button');
            add.id='add-receipt-btn';
            add.className='simple-btn accent receipt-dropzone-btn';
            add.innerHTML='<span class="receipt-dropzone-main">+ 영수증 첨부</span><span class="receipt-dropzone-sub">#클릭 또는 드래그</span>';
            add.onclick=()=>CardLogic.triggerImageSelection(-1);
            ['dragenter','dragover'].forEach(evtName => {
                add.addEventListener(evtName, (ev) => {

                        add.classList.add('drag-over');
                        const sub = add.querySelector('.receipt-dropzone-sub');
                        if (sub) sub.textContent = '여기에 놓으면 영수증이 추가됩니다';
                    }
                });
            });
            ['dragleave','dragend'].forEach(evtName => {
                add.addEventListener(evtName, (ev) => {
                    ev.preventDefault();
                    ev.stopPropagation();
                    add.classList.remove('drag-over');
                    const sub = add.querySelector('.receipt-dropzone-sub');
                    if (sub) sub.textContent = '#클릭 또는 드래그';
                });
            });
            add.addEventListener('drop', (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                add.classList.remove('drag-over');
                const sub = add.querySelector('.receipt-dropzone-sub');
                if (sub) sub.textContent = '#클릭 또는 드래그';
                if (add.disabled) return;
                const droppedFiles = ev.dataTransfer && ev.dataTransfer.files ? ev.dataTransfer.files : null;
                if (droppedFiles && droppedFiles.length) CardLogic.handleReceiptFiles(droppedFiles);
            });
            const cw = document.createElement('div');
            cw.className='cart-wrapper';
            cw.appendChild(Object.assign(document.createElement('div'),{id:'receipt-cart-container'}));
            const guide = document.createElement('div');
            guide.id = 'submit-guide';
            guide.className = 'submit-guide';
            guide.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> <b>내용(상세 내역)</b>이 비어있는 영수증이 있습니다.';
            let subEl = null;
            if (state.isAdminMode) {
                const sub = document.createElement('button');
                sub.id='submit-cart-btn';
                sub.className='simple-btn primary';
                sub.innerHTML='<i class="fa-solid fa-check"></i> 반납 및 제출';

                    width:100%; padding:16px 14px; border-radius:18px;

                    color: var(--text-secondary); font-weight:800; text-align:center; line-height:1.5;

                msg.innerHTML = `※ 행정실 카드 반납 시 태블릿의 <b class="return-submit-emphasis">[반납 및 제출]</b> 버튼을 꼭 눌러주세요.`;
                subEl = msg;
            }
            returnTray.appendChild(cw);
            form.append(returnTray, add, guide, subEl);
            
            
            const prim = card.userInfo.userName.split(',')[0].trim();
            if (state.enteredUsers[0].name !== prim) {
                add.disabled=true; if(subEl && subEl.tagName==='BUTTON') subEl.disabled=true;
                const m=document.createElement('p');
                m.innerHTML=`<strong>${prim}</strong> 님만 반납 가능합니다.`;
                m.style.cssText='color:var(--danger-color);font-weight:600;margin-top:1rem;text-align:center;';

            CardLogic.requestRenderReceiptCart();
            UIManager.showScreen('returnDetails');

            
            setTimeout(() => {
                const expectedCardId = card && card.id;
                const expectedToken = state.receiptReloadToken;
                if (!expectedCardId) return;
                Api.call('getSavedCarts', [expectedCardId])
                    .then(map => {
                        if (state.receiptReloadToken !== expectedToken) return;
                        if (!state.currentReturnCard || state.currentReturnCard.id !== expectedCardId) return;
                        const loaded = Utils.sanitizeReceiptCart((map && map[expectedCardId]) || []);
                        const hasActiveLocalWork = Array.isArray(state.receiptCart) && state.receiptCart.some(it =>
                            it && ['queued','optimizing','ocr','postprocessing','saving','deleting'].includes(it.processing)
                        );
                        if (hasActiveLocalWork) return;
                        const localJson = JSON.stringify(Utils.sanitizeReceiptCart(state.receiptCart || []));
                        const remoteJson = JSON.stringify(loaded);
                        if (remoteJson && remoteJson !== localJson) {
                            state.receiptCart = loaded;
                            card.savedCart = loaded;
                            if (Array.isArray(state.allCardData)) {
                                const targetCard = state.allCardData.find(c => c && c.id === expectedCardId);
                                if (targetCard) targetCard.savedCart = loaded;
                            }
                            CardLogic.requestRenderReceiptCart();
                        }
                    })
                    .catch(() => {});
            }, 120);
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_RENDER_STATE
        현재 receiptCart 상태를 실제 DOM에 반영
        ========================================================= */
        renderReceiptCart: () => {
            const c = document.getElementById('receipt-cart-container');
            if (!c || !state.currentReturnCard) return;
            // 예전 저장본 또는 새로고침 직전 저장본에 남은 processing/saving 상태가
            // 화면에 '영수증 분석 중'으로 되살아나는 것을 방지합니다.
            if (Array.isArray(state.receiptCart)) {
                state.receiptCart.forEach(it => {
                    if (!it) return;
                    const img = String(it.receiptImage || '');
                    const staleProcessing = ['queued','optimizing','ocr','postprocessing','saving','saved','deleting'].includes(it.processing);
                    const batchActive = !!(state.receiptBatchProgress && state.receiptBatchProgress.active);
                    if (staleProcessing && img.startsWith('id:') && !batchActive && !it._uiTransient) delete it.processing;
                });
            }
            const isPrim = state.enteredUsers[0].name === state.currentReturnCard.userInfo.userName.split(',')[0].trim();
            const isMeal = state.currentReturnCard.userInfo.purpose && state.currentReturnCard.userInfo.purpose.includes('특근');
            
            let tot = 0;
            c.innerHTML = state.receiptCart.length ? state.receiptCart.map((it, i) => {
                tot += Number(it.amount||0);
                return CardLogic.renderReceiptCartItemHTML(it, i, isMeal);
            }).join('') : `<div class="cart-placeholder"><i class="fa-regular fa-file-lines"></i><span>추가된 영수증이 없습니다.</span></div>`;
            document.getElementById('receipt-total-display').textContent = `${Utils.nfKR.format(tot)}원`;
            c.classList.toggle('empty-cart', state.receiptCart.length===0);
            
            const guideEl = document.getElementById('submit-guide');
            const blockingIssues = CardLogic.getBlockingReceiptIssues();
            const hasBlockingIssue = blockingIssues.length > 0;
            if (guideEl) {
                const failedIssues = blockingIssues.filter(x => ['save_error','error'].includes(x.processing));
                const hasEmpty = state.receiptCart.some(r => ((!Utils.isMealExpenseItem(r)) && !(String(r.usageDetails || '').trim()) && (!r.processing || r.processing==='save_error')) || (r.processing==='save_error'));
                if (failedIssues.length > 0) {
                    guideEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> 저장 실패/분석 실패 영수증이 있습니다. 해당 영수증을 눌러 직접 입력하거나 삭제 후 다시 첨부해 주세요.';
                    guideEl.classList.add('visible');
                } else if (hasEmpty && state.receiptCart.length > 0) {
                    guideEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> 사용내역이 비어 있는 영수증이 있습니다. 제출 전 내용을 확인해 주세요.';
                    guideEl.classList.add('visible');
                } else {
                    // 분석/저장 진행 중에는 빨간 실패 안내를 띄우지 않습니다. 진행 상태는 각 영수증 카드 안에서만 표시합니다.
                    guideEl.classList.remove('visible');
                }
            }
            CardLogic.updateReceiptBatchProgressUI();
            const submitBtn = document.getElementById('submit-cart-btn');
            if (submitBtn) submitBtn.disabled = !(state.receiptCart.length > 0 && isPrim) || hasBlockingIssue;
        },
        updateReceiptBatchProgressUI: () => {
            
            const box = document.getElementById('receipt-batch-progress');
            if (box) box.classList.add('hidden');
        },
        /* =========================================================
        @SUBSECTION: JS_OPERATIONAL_BLOCKING_GUARDS
        장애/진행중 영수증이 있을 때 반납 제출을 막고 복구 행동을 안내합니다.
        ========================================================= */
        getBlockingReceiptIssues: () => {
            if (!Array.isArray(state.receiptCart)) return [];
            return state.receiptCart
                .map((it, idx) => ({ it, idx }))
                .filter(({ it }) => it && ['queued','optimizing','ocr','postprocessing','saving','deleting','review','save_error','error'].includes(it.processing))
                .map(({ it, idx }) => {
                    const label = CardLogic.getReceiptProcessingLabel(it.processing);
                    const place = String(it.usagePlace || `영수증 ${idx + 1}`);
                    return { idx, processing: it.processing, label, place };
                });
        },
        showBlockingReceiptIssues: async (issues = CardLogic.getBlockingReceiptIssues()) => {
            const failedCount = issues.filter(x => ['save_error','error'].includes(x.processing)).length;
            const activeCount = issues.length - failedCount;
            const msg = failedCount
                ? `확인이 필요한 영수증 ${failedCount}건이 있습니다.`
                : `처리 중인 영수증 ${activeCount}건이 있습니다.`;
            await UIManager.showOperationalError({
                title: '반납 전 확인 필요',
                message: msg,
                icon: failedCount ? 'error' : 'warning',
                steps: failedCount
                    ? ['해당 영수증을 눌러 확인해 주세요.', '필요하면 삭제 후 다시 첨부해 주세요.']
                    : ['영수증 처리가 끝난 뒤 다시 제출해 주세요.']
            });
            const first = issues[0];
            if (first) {
                setTimeout(() => {
                    const el = document.querySelector(`.cart-item[data-index="${first.idx}"]`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.classList.add('highlight');
                        setTimeout(() => el.classList.remove('highlight'), 1600);
                    }
                }, 80);
            }
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_MUTATIONS
        영수증 항목 저장/삭제/실패 복구
        ========================================================= */
        saveCartItemOptimistic: async (item, idx, options = {}) => {
            
            if (options.closeSwal !== false) {
                try { Swal.close(); } catch(e) {}
            }
            
            const previous = idx > -1 ? (state.receiptCart[idx] || {}) : {};
            const cachedPreview = item.previewImage || item.receiptImagePreview || previous.previewImage || previous.receiptImagePreview || (!String(item.receiptImage || '').startsWith('id:') ? item.receiptImage : '');
            const ghost = { ...previous, ...item, processing: 'saving', _uiTransient: true, needsManualReview: false };
            if (cachedPreview) {
                ghost.previewImage = cachedPreview;
                ghost.receiptImagePreview = cachedPreview;
            }
            let targetIdx = idx;
            if (idx > -1) {
                state.receiptCart[idx] = ghost;
            } else {
                state.receiptCart.push(ghost);
                targetIdx = state.receiptCart.length - 1;
            }
            CardLogic.requestRenderReceiptCart();

            
            try {
                await CardLogic.queueSaveCart(null);
                const it = state.receiptCart[targetIdx];
                if (it && it.processing === 'saving') {
                    it.processing = 'saved';
                    CardLogic.requestRenderReceiptCart();
                    setTimeout(() => {
                        const cur = state.receiptCart[targetIdx];
                        if (cur && cur.processing === 'saved') {
                            delete cur.processing;
                            delete cur._uiTransient;
                            CardLogic.requestRenderReceiptCart();
                        }
                    }, 850);
                }
                CardLogic.continueReviewIfNeeded(idx);
                return true;
            } catch (e) {
                const it = state.receiptCart[targetIdx];
                if (it) it.processing = 'save_error';
                CardLogic.requestRenderReceiptCart();
                try {
                    Swal.fire({toast:true, position:'top', icon:'error', title:'저장 실패 · 네트워크 확인 후 다시 시도해주세요', showConfirmButton:false, timer:2500});
                } catch(_) {}
                console.error(e);
                throw e;
            }
        },
        deleteCartItem: (idx) => {
            Swal.fire({title:'삭제 확인',text:"삭제하시겠습니까?",icon:'warning',showCancelButton:true,confirmButtonText:'삭제',cancelButtonText:'취소',confirmButtonColor:'#d33'})
                .then(r => {
                    if (r.isConfirmed) {
                        const org = [...state.receiptCart];
                        state.receiptCart[idx] = { ...state.receiptCart[idx], processing: 'deleting' };
                        CardLogic.requestRenderReceiptCart();
                        const next = [...state.receiptCart];
                        next.splice(idx, 1);
                        state.receiptCart = next;
                        CardLogic.requestRenderReceiptCart();
                        CardLogic.queueSaveCart(org).catch(e => {
                            state.receiptCart = org;
                            CardLogic.requestRenderReceiptCart();
                            UIManager.handleServerError(e);
                        });
                    }
                });
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_OCR_PIPELINE_BATCH
        여러 영수증을 큐에 넣고 압축/OCR/저장까지 처리
        ========================================================= */

        processReceiptQueueItem: async (file, actualIdx, forceMealOnly) => {
            let b64 = '';

            try {
                state.receiptCart[actualIdx].processing = 'optimizing';
                state.receiptCart[actualIdx].usagePlace = CardLogic.isReceiptPdfFile(file) ? 'PDF 첫 페이지 변환 중...' : '영수증 압축 중...';
                CardLogic.requestRenderReceiptCart();

                b64 = await CardLogic.prepareReceiptUploadImage(file);
                state.receiptCart[actualIdx].receiptImage = b64;
                state.receiptCart[actualIdx].processing = 'ocr';
                state.receiptCart[actualIdx].usagePlace = '영수증 분석 중...';
                CardLogic.requestRenderReceiptCart();

                const ocr = await Api.call('processReceiptImage', b64);
                const analysisFailed = CardLogic.isReceiptAnalysisFailed(ocr);
                const recognizedAmount = String(ocr && ocr.amount ? ocr.amount : '');
                let amt = recognizedAmount;

                state.receiptCart[actualIdx].processing = 'postprocessing';
                state.receiptCart[actualIdx].usagePlace = analysisFailed ? '직접 입력 필요' : '분석 완료';
                CardLogic.requestRenderReceiptCart();

                if (!ocr || !ocr.tempFileId) {
                    throw new Error('영수증 이미지를 저장하지 못했습니다. 다시 첨부해 주세요.');
                }

                const rawRecognizedAmount = analysisFailed ? '' : amt.replace(/[^\d]/g, '');
                const mealCountForReceipt = CardLogic.getCurrentReturnMealHeadcount();
                const mealAmountInfo = forceMealOnly && rawRecognizedAmount ? Utils.getMealAdjustedAmount(rawRecognizedAmount, mealCountForReceipt) : null;
                state.receiptCart[actualIdx] = {
                    receiptImage: ocr.tempFileId,
                    previewImage: b64,
                    receiptImagePreview: b64,
                    usagePlace: analysisFailed ? '직접 입력 필요' : (ocr.storeName || '상호명 없음'),
                    usageDetails: forceMealOnly ? '특근매식비' : '',
                    amount: mealAmountInfo ? String(mealAmountInfo.amount) : rawRecognizedAmount,
                    originalAmount: rawRecognizedAmount,
                    isMealExpense: !!forceMealOnly,
                    purpose: forceMealOnly ? '특근매식비' : CardLogic.getReceiptPurposeFromTone(CardLogic.getDefaultGeneralReceiptToneFromPurposes()),
                    mealHeadcount: mealCountForReceipt,
                    mealLimitAmount: mealAmountInfo ? String(mealAmountInfo.mealLimitAmount) : '',
                    mealOverAmount: mealAmountInfo ? String(Math.max(0, mealAmountInfo.originalAmount - mealAmountInfo.amount)) : '',
                    date: analysisFailed ? '' : (ocr.date || ''),
                    processing: 'saving',
                    _uiTransient: true,
                    needsManualReview: analysisFailed,
                    analysisMeta: {
                        mediaResolution: ocr && ocr.mediaResolution ? ocr.mediaResolution : '',
                        usedFallback: !!(ocr && ocr.usedFallback),
                        elapsedMs: ocr && ocr.elapsedMs ? ocr.elapsedMs : '',
                        imageSaveError: ocr && ocr.imageSaveError ? ocr.imageSaveError : ''
                    }
                };
                Utils.haptic(analysisFailed ? [20, 40, 20] : 18);
                CardLogic.requestRenderReceiptCart();
            } catch (err) {
                console.error('Receipt analysis failed:', err);
                Utils.haptic([20, 40, 20]);
                state.receiptCart[actualIdx] = {
                    receiptImage: '',
                    previewImage: b64,
                    receiptImagePreview: b64,
                    usagePlace: '이미지 저장 실패',
                    usageDetails: '',
                    amount: '',
                    date: '',
                    processing: 'error',
                    _uiTransient: true,
                    needsManualReview: true,
                    imageSaveError: String(err && err.message ? err.message : err)
                };
            }

            if (state.receiptBatchProgress && state.receiptBatchProgress.active) {
                state.receiptBatchProgress.done = Math.min(state.receiptBatchProgress.total, Number(state.receiptBatchProgress.done || 0) + 1);
            }
            CardLogic.requestRenderReceiptCart();
        },
        markReceiptBatchSaveSuccess: (startIdx, count) => {
            state.receiptCart.slice(startIdx, startIdx + count).forEach((item, offset) => {
                const idx = startIdx + offset;
                const cur = state.receiptCart[idx];
                if (!cur) return;
                if (cur.needsManualReview) {
                    cur.processing = 'review';
                    cur._uiTransient = true;
                } else if (cur.processing === 'saved') {
                    cur._uiTransient = true;
                }
            });
            CardLogic.requestRenderReceiptCart();
        },
        markReceiptBatchSaveFailure: (startIdx, count) => {
            state.receiptCart.slice(startIdx, startIdx + count).forEach((item, offset) => {
                const idx = startIdx + offset;
                const cur = state.receiptCart[idx];
                if (cur && cur.processing !== 'error') {
                    cur.processing = 'save_error';
                    cur._uiTransient = true;
                }
            });
            CardLogic.requestRenderReceiptCart();
            try {
                Swal.fire({toast:true, position:'top', icon:'error', title:'저장 실패 · 네트워크를 확인해주세요', showConfirmButton:false, timer:2500});
            } catch (_) {}
        },
        finalizeReceiptBatchSave: async (startIdx, count) => {
            try {
                await CardLogic.queueSaveCart(null);
                CardLogic.markReceiptBatchSaveSuccess(startIdx, count);
            } catch (e) {
                console.error('Batch cart save failed:', e);
                CardLogic.markReceiptBatchSaveFailure(startIdx, count);
            }
        },
        notifyReceiptBatchPostProcessing: async (startIdx, count) => {
            const batchItems = state.receiptCart.slice(startIdx, startIdx + count);
            const manualReviewCount = batchItems.filter(item => item && item.needsManualReview).length;

            if (manualReviewCount > 0) {
                CardLogic.showReceiptAnalysisFallback(false);
            }

            const hardFailCount = batchItems.filter(item => item && item.processing === 'error').length;
            if (hardFailCount > 0) {
                await UIManager.showOperationalError({
                    title: '처리 실패',
                    message: `${hardFailCount}건의 영수증을 자동 처리하지 못했습니다.`,
                    icon: 'warning',
                    steps: ['실패한 영수증을 눌러 직접 입력합니다.', '이미지 저장 실패라면 삭제 후 다시 첨부합니다.', '반납 제출은 실패 항목을 정리한 뒤 가능합니다.']
                });
            }
        },
        finishReceiptBatchProgress: () => {
            if (state.receiptBatchProgress) {
                state.receiptBatchProgress.done = state.receiptBatchProgress.total;
                CardLogic.requestRenderReceiptCart();
                setTimeout(() => {
                    if (state.receiptBatchProgress) {
                        state.receiptBatchProgress.active = false;
                        CardLogic.requestRenderReceiptCart();
                    }
                }, 1200);
            }
        },
        handleReceiptFilesQueued: async (files) => {
            
            const startIdx = state.receiptCart.length;
            const receiptPurposeConfig = CardLogic.getReceiptPurposeConfig();
            const forceMealOnly = receiptPurposeConfig.mealOnly;
            const newItems = files.map((file) => ({
                receiptImage: '',
                usagePlace: CardLogic.isReceiptPdfFile(file) ? 'PDF 분석 대기 중...' : '영수증 분석 대기 중...',
                usageDetails: '',
                amount: '',
                date: '',
                processing: 'queued',
                _uiTransient: true
            }));
            state.receiptCart.push(...newItems);
            state.receiptBatchProgress = { active: true, startIdx, total: files.length, done: 0 };
            CardLogic.requestRenderReceiptCart();


            
            // Apps Script와 Gemini를 동시에 너무 많이 두드리면 오히려 느려질 수 있어 2개씩만 처리합니다.
            const concurrency = Math.min(2, files.length);
            let nextIndex = 0;
            const workers = Array.from({ length: concurrency }, async () => {
                while (nextIndex < files.length) {
                    const i = nextIndex++;
                    await CardLogic.processReceiptQueueItem(files[i], startIdx + i, forceMealOnly);
                }
            });

            await Promise.allSettled(workers);

            
            await CardLogic.finalizeReceiptBatchSave(startIdx, files.length);
            await CardLogic.notifyReceiptBatchPostProcessing(startIdx, files.length);
            CardLogic.finishReceiptBatchProgress();

            CardLogic.requestRenderReceiptCart();
            CardLogic.startReviewMode(startIdx, files.length);
        },

            }
            if (!files.length) {
                try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}

                    if (addBtn) addBtn.disabled = false;
                    if (subBtn) subBtn.disabled = false;
                    CardLogic.requestRenderReceiptCart();

            if (subBtn) subBtn.disabled = true;
            
            try {

                const b64 = await CardLogic.prepareReceiptUploadImage(file);

                    receiptImagePreview: b64,

                    amount: analysisFailed ? '' : amt.replace(/[^\d]/g, ""),
                    originalAmount: analysisFailed ? '' : amt.replace(/[^\d]/g, ""),
                    isMealExpense: false,

            } catch (e) {
                UIManager.handleServerError(e);
            } finally {
                try { document.getElementById('receipt-file-input').value = ''; } catch (e) {}
                if (addBtn) addBtn.disabled = false;
