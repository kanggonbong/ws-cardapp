        /* =========================================================
        @SUBSECTION: JS_RECEIPT_PDF_AND_IMAGE_PREP
        이미지/PDF 첨부를 OCR용 이미지 dataURL로 변환
        ========================================================= */
        isReceiptPdfFile: (file) => !!(file && (String(file.type || '').toLowerCase() === 'application/pdf' || /\.pdf$/i.test(String(file.name || '')))),
        isReceiptSupportedFile: (file) => !!(file && (String(file.type || '').startsWith('image/') || CardLogic.isReceiptPdfFile(file))),
        ensurePdfRendererLoaded: async () => {
            if (window.pdfjsLib && window.pdfjsLib.getDocument) {
                try {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                } catch (e) {}
                return window.pdfjsLib;
            }
            await new Promise((resolve, reject) => {
                const existing = document.querySelector('script[data-receipt-pdfjs]');
                if (existing) {
                    existing.addEventListener('load', resolve, { once:true });
                    existing.addEventListener('error', reject, { once:true });
                    return;
                }
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                s.async = true;
                s.dataset.receiptPdfjs = '1';
                s.onload = resolve;
                s.onerror = () => reject(new Error('PDF 변환 모듈을 불러오지 못했습니다. 네트워크를 확인해 주세요.'));
                document.head.appendChild(s);
            });
            if (!window.pdfjsLib || !window.pdfjsLib.getDocument) throw new Error('PDF 변환 모듈을 사용할 수 없습니다.');
            try {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            } catch (e) {}
            return window.pdfjsLib;
        },
        renderPdfFirstPageToImage: async (file) => {
            const pdfjs = await CardLogic.ensurePdfRendererLoaded();
            const arrayBuffer = await file.arrayBuffer();
            let pdfDoc = null;
            try {
                pdfDoc = await pdfjs.getDocument({ data: arrayBuffer }).promise;
                if (!pdfDoc || !pdfDoc.numPages) throw new Error('PDF 페이지를 찾을 수 없습니다.');
                const page = await pdfDoc.getPage(1);
                const baseViewport = page.getViewport({ scale: 1 });
                const maxSide = Math.max(1200, Number(RECEIPT_IMAGE_OPTIMIZE_CONFIG && RECEIPT_IMAGE_OPTIMIZE_CONFIG.maxSide || 1800));
                const scale = Math.min(2.4, Math.max(1.2, maxSide / Math.max(baseViewport.width, baseViewport.height)));
                const viewport = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(viewport.width));
                canvas.height = Math.max(1, Math.round(viewport.height));
                const ctx = canvas.getContext('2d', { alpha:false });
                if (!ctx) throw new Error('PDF 변환 캔버스를 만들 수 없습니다.');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                await page.render({ canvasContext: ctx, viewport }).promise;
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.88));
                if (!blob) throw new Error('PDF 첫 페이지 이미지 변환 실패');
                return await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(String(reader.result || ''));
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                throw new Error('PDF 첫 페이지를 이미지로 변환하지 못했습니다. PDF를 이미지로 저장한 뒤 다시 첨부해 주세요.');
            } finally {
                try { if (pdfDoc && typeof pdfDoc.destroy === 'function') pdfDoc.destroy(); } catch (e) {}
            }
        },
        prepareReceiptUploadImage: async (file) => {
            if (CardLogic.isReceiptPdfFile(file)) {
                return await CardLogic.renderPdfFirstPageToImage(file);
            }
            return await CardLogic.resizeAndOptimizeImage(file);
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_IMAGE_OPTIMIZATION
        브라우저 canvas로 영수증 이미지를 압축/리사이즈
        ========================================================= */
        resizeAndOptimizeImage: async (file) => {
            if (!file || !String(file.type || '').startsWith('image/')) {
                throw new Error('이미지 또는 PDF 파일만 업로드할 수 있습니다.');
            }

            const cfg = RECEIPT_IMAGE_OPTIMIZE_CONFIG;
            const MAX_SIDE = cfg.maxSide;
            const TARGET_BYTES = cfg.targetBytes;
            const QUALITY_STEPS = cfg.qualities;

            const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || ''));
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });

            const canvasToBlob = (canvas, quality) => new Promise((resolve) => {
                canvas.toBlob(resolve, 'image/jpeg', quality);
            });

            // EXIF 회전을 반영하여 ImageBitmap을 생성한다. 실패하면 기존 Image 객체 방식으로 폴백한다.
            const loadImageBitmap = async (imgFile) => {
                if ('createImageBitmap' in window) {
                    try {
                        return await createImageBitmap(imgFile, { imageOrientation: 'from-image' });
                    } catch (e) {
                        // Image 객체 방식으로 폴백합니다.
                    }
                }
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(imgFile);
                    const img = new Image();
                    img.onload = () => {
                        URL.revokeObjectURL(url);
                        resolve(img);
                    };
                    img.onerror = (e) => {
                        URL.revokeObjectURL(url);
                        reject(e);
                    };
                    img.src = url;
                });
            };

            const img = await loadImageBitmap(file);
            const originalW = img.naturalWidth || img.width;
            const originalH = img.naturalHeight || img.height;

            if (!originalW || !originalH) {
                throw new Error('이미지 크기를 읽을 수 없습니다.');
            }

            const scale = Math.min(1, MAX_SIDE / Math.max(originalW, originalH));
            const width = Math.max(1, Math.round(originalW * scale));
            const height = Math.max(1, Math.round(originalH * scale));

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) throw new Error('이미지 캔버스를 만들 수 없습니다.');

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);

            try {
                if (img && typeof img.close === 'function') img.close();
            } catch (e) {}

            let bestBlob = null;
            for (const quality of QUALITY_STEPS) {
                const blob = await canvasToBlob(canvas, quality);
                if (!blob) continue;
                bestBlob = blob;
                if (blob.size <= TARGET_BYTES) break;
            }

            if (!bestBlob) {
                throw new Error('이미지 변환 실패');
            }

            const dataUrl = await blobToDataUrl(bestBlob);

            return dataUrl;
        },

                        if (badge) badge.classList.remove('badge-auto', 'badge-review', 'badge-required');

                        if (!hasValue) {
                            group.classList.add('ocr-required');
                            if (badge) {
                                badge.classList.add('badge-required');
                                badge.textContent = '입력필요';
                                badge.style.display = 'inline-flex';
                            }
                            return;
                        }

                        if (status === 'auto') {
                            group.classList.add('ocr-auto');
                            if (badge) {
                                badge.classList.add('badge-auto');
                                badge.textContent = '자동입력';
                                badge.style.display = 'inline-flex';
                            }
                            return;
                        }

                        if (status === 'review') {
                            group.classList.add('ocr-review');
                            if (badge) {
                                badge.classList.add('badge-review');
                                badge.textContent = '확인필요';
                                badge.style.display = 'inline-flex';
                            }
                            return;
                        }

                        group.classList.add('ocr-manual');
                        if (badge) badge.style.display = 'none';
                    };
                    const markFieldManual = (inputEl) => {
                        if (!inputEl) return;
                        const group = inputEl.closest('.swal-input-group-new');
                        if (!group) return;
                        group.dataset.ocrStatus = 'manual';
                        updateReceiptFieldVisual(inputEl);
                    };
                    const useGeneral = document.getElementById('swal-use-general');
                    const useMeal = document.getElementById('swal-use-meal');
                    const mealPanel = document.getElementById('swal-meal-panel');
                    const mealSummary = document.getElementById('swal-meal-summary');
                    const mealCountValue = CardLogic.getCurrentReturnMealHeadcount();
                    let mealBaseAmount = String(originalAmountValue || (amount ? amount.value : '') || '').replace(/[^\d]/g, '');
                    const getMealBaseAmount = () => String(mealBaseAmount || originalAmountValue || (amount ? amount.value : '') || '').replace(/[^\d]/g, '');
                    const isMealMode = () => !!(useMeal && useMeal.getAttribute('aria-pressed') === 'true');
                    const getCurrentGeneralTone = () => getReceiptPopupToneFromText(
                        store ? store.value : storeValue,
                        details ? details.value : detailsValue
                    );
                    const applyReceiptPopupTone = (tone) => {
                        const pop = Swal.getPopup();
                        if (!pop) return;
                        pop.classList.remove('receipt-tone-purchase', 'receipt-tone-dining', 'receipt-tone-meal');
                        pop.classList.add(`receipt-tone-${tone || 'purchase'}`);
                    };
                    const syncReceiptPopupTone = () => applyReceiptPopupTone(isMealMode() ? 'meal' : getCurrentGeneralTone());
                    const recalcMealAmount = () => {
                        if (!isMealMode()) return;
                        const raw = getMealBaseAmount();
                        const info = Utils.getMealAdjustedAmount(raw, mealCountValue);
                        if (amount) amount.value = info.amount ? Utils.nfKR.format(info.amount) : '';
                    };
                    const restoreGeneralAmount = () => {
                        const raw = getMealBaseAmount();
                        if (amount) amount.value = raw ? Utils.nfKR.format(Number(raw)) : '';
                    };
                    const setMealMode = (on) => {
                        const nextOn = receiptPurposeConfig.mealOnly ? true : (receiptPurposeConfig.allowMealToggle ? !!on : false);
                        if (useGeneral) {
                            useGeneral.classList.toggle('active', !nextOn);
                            useGeneral.setAttribute('aria-pressed', nextOn ? 'false' : 'true');
                        }
                        if (useMeal) {
                            useMeal.classList.toggle('active', !!nextOn);
                            useMeal.setAttribute('aria-pressed', nextOn ? 'true' : 'false');
                        }
                        if (mealPanel) mealPanel.style.display = 'none';
                        if (details) {
                            if (nextOn) {
                                mealBaseAmount = getMealBaseAmount();
                                details.value = '특근매식비';
                                details.readOnly = true;
                                recalcMealAmount();
                            } else {
                                details.readOnly = false;
                                if (details.value === '특근매식비') details.value = '';
                                restoreGeneralAmount();
                            }
                        } else if (nextOn) {
                            mealBaseAmount = getMealBaseAmount();
                            recalcMealAmount();
                        } else {
                            restoreGeneralAmount();
                        }
                        syncReceiptPopupTone();
                        [store, amount, details].forEach(updateReceiptFieldVisual);
                    };
                    [store, amount, details].forEach(updateReceiptFieldVisual);
                    store.addEventListener('input', () => { markFieldManual(store); if (!isMealMode()) syncReceiptPopupTone(); });
                    details.addEventListener('input', () => { markFieldManual(details); if (!isMealMode()) syncReceiptPopupTone(); });
                    amount.oninput = (e) => {
                        markFieldManual(e.target);
                        const v = e.target.value.replace(/[^\d]/g, '');
                        mealBaseAmount = v;
                        e.target.value = v ? Utils.nfKR.format(parseInt(v)) : '';
                        recalcMealAmount();
                        updateReceiptFieldVisual(e.target);
                    };
                    if (useGeneral && receiptPurposeConfig.allowMealToggle) useGeneral.onclick = () => setMealMode(false);
                    if (useMeal && receiptPurposeConfig.allowMealToggle) useMeal.onclick = () => setMealMode(true);
                    setMealMode(isMeal);
                    const handleEnter = (e, nextElem) => {
                        if (e.key === 'Enter') {
                            e.preventDefault(); e.stopPropagation();
                            if (nextElem) nextElem.focus();
                            else Swal.getConfirmButton().click();
                        }
                    };
                    store.onkeydown = e => handleEnter(e, amount);
                    amount.onkeydown = e => handleEnter(e, details);
                    details.onkeydown = e => handleEnter(e, null);
                    
                    if (isMobile || isReceiptTouchDevice) {
                        const receiptInputs = [store, amount, details].filter(Boolean);
                        const blurReceiptInput = () => {
                            const active = document.activeElement;
                            if (active && receiptInputs.includes(active)) active.blur();
                        };
                        requestAnimationFrame(blurReceiptInput);
                        setTimeout(blurReceiptInput, 80);
                        setTimeout(blurReceiptInput, 260);

                        const focusHandler = (e) => {
                            setTimeout(() => {
                                try { e.target.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (_) {}
                            }, 300);
                        };

                        const unlockForUserEdit = (e) => {
                            const input = e.currentTarget;
                            if (!input) return;
                            if (input.id === 'swal-details' && isMealMode()) return;
                            input.readOnly = false;
                            setTimeout(() => {
                                try { input.focus({ preventScroll: true }); } catch (_) { input.focus(); }
                                focusHandler({ target: input });
                            }, 0);
                        };

                        receiptInputs.forEach((input) => {
                            input.dataset.wsOriginalReadonly = input.readOnly ? '1' : '0';
                            if (input.dataset.wsOriginalReadonly !== '1') input.readOnly = true;
                            input.addEventListener('focus', focusHandler);
                            input.addEventListener('touchstart', unlockForUserEdit, { passive: true });
                            input.addEventListener('pointerdown', unlockForUserEdit, { passive: true });
                        });
                    } else {
                        setTimeout(() => store.focus(), 100);
                    }
                    if (!isMeal && !(isMobile || isReceiptTouchDevice)) {
                        setTimeout(() => {
                            const detailsInput = document.getElementById('swal-details');
                            if (detailsInput) {
                                detailsInput.focus();
                                const len = detailsInput.value.length;
                                detailsInput.setSelectionRange(len, len);
                            }
                        }, 400);
                    }
                },
                
                didClose: () => {
                    try {
                        const prev = document.body.dataset.prevOverflow ?? '';
                        document.body.style.overflow = prev;
                        delete document.body.dataset.prevOverflow;
                    } catch(e) {}
                    try {
                        const vv = window.visualViewport;
                        if (vv && window.__vvHandlerForSwal) {
                            vv.removeEventListener('resize', window.__vvHandlerForSwal);
                            vv.removeEventListener('scroll', window.__vvHandlerForSwal);
                            delete window.__vvHandlerForSwal;
                        }
                    } catch(e) {}
                },
                
                preConfirm: () => {
                    const [store, amtStr, detailsInput] = ['swal-store', 'swal-amount', 'swal-details'].map(id => document.getElementById(id).value);
                    const useMeal = document.getElementById('swal-use-meal');
                    const isMealExpense = !!(useMeal && useMeal.getAttribute('aria-pressed') === 'true');
                    const mealHeadcount = CardLogic.getCurrentReturnMealHeadcount();
                    let details = isMealExpense ? '특근매식비' : detailsInput;
                    if (!store || !amtStr || !details) return Swal.showValidationMessage('모든 항목을 입력하세요');
                    if (!String(data.receiptImage || '').startsWith('id:')) {
                        return Swal.showValidationMessage('영수증 이미지가 저장되지 않았습니다. 이미지를 다시 첨부해 주세요.');
                    }
                    const rawAmount = amtStr.replace(/[^\d]/g, "");
                    const originalAmount = String(data.originalAmount || rawAmount).replace(/[^\d]/g, "") || rawAmount;
                    const calcBaseAmount = isMealExpense ? originalAmount : rawAmount;
                    let amount = rawAmount;
                    let mealLimitAmount = '';
                    let mealOverAmount = '';
                    if (isMealExpense) {
                        const info = Utils.getMealAdjustedAmount(calcBaseAmount, mealHeadcount);
                        amount = String(info.amount);
                        mealLimitAmount = String(info.mealLimitAmount);
                        mealOverAmount = String(Math.max(0, info.originalAmount - info.amount));
                    }
                    const cachedPreview = data.previewImage || data.receiptImagePreview || '';
                    const generalTone = CardLogic.getReceiptPopupToneFromPurposeText(store, details, CardLogic.getCurrentReturnPurposeList());
                    const receiptPurpose = isMealExpense ? '특근매식비' : CardLogic.getReceiptPurposeFromTone(generalTone);
                    return {
                        usagePlace: store,
                        usageDetails: details,
                        amount,
                        originalAmount,
                        isMealExpense,
                        purpose: receiptPurpose,
                        mealHeadcount: isMealExpense ? mealHeadcount : '',
                        mealLimitAmount,
                        mealOverAmount,
                        receiptImage: data.receiptImage,
                        receiptImagePreview: cachedPreview,
                        previewImage: cachedPreview,
                        date: data.date||''
                    };
                }
            }).then(async (res) => {
                if (!(res.isConfirmed && res.value)) return;
                
                try {
                    await CardLogic.saveCartItemOptimistic(res.value, editIndex, { closeSwal: false });
                    try {
                        Swal.fire({
                            toast: true,
                            position: 'top',
                            icon: 'success',
                            title: '저장 완료',
                            showConfirmButton: false,
                            timer: 1500,
                            timerProgressBar: false
                        });
                    } catch(e) {}
                } catch (e) {
                    await UIManager.showOperationalError({
                        title: '저장 실패',
                        message: '영수증 정보가 저장되지 않았습니다.',
                        error: e,
                        steps: [
                            '실패 표시가 있는 영수증을 다시 눌러 저장해 주세요.',
                            '계속 실패하면 삭제 후 다시 첨부해 주세요.'
                        ],
                        confirmButtonText: '확인'
                    });
                }
            });
        },
        /* =========================================================
        @SUBSECTION: JS_SYNC_HELPERS
        대여/반납 직후 서버 상태 재동기화
        ========================================================= */
        scheduleQuickSync: (attempts = 3, intervalMs = 1200) => {
            if (!attempts || attempts <= 0) return;
            let n = 0;
            const tick = async () => {
                n++;
                try {
                    state.pendingPostReturnSync = true;
                    await CardLogic.handlePendingPostReturnSync();
                } catch(e) {}
                if (n >= attempts) return;
                setTimeout(tick, intervalMs);
            };
            setTimeout(tick, intervalMs);
        },
        handlePendingPostReturnSync: async () => {
            const reqId = ++state.syncReqId;
            if (!state.pendingPostReturnSync) return;
            state.pendingPostReturnSync = false;
            try {
                const data = await Api.call('getInitialAppData');
                if (data && !data.error) {
                    state.allCardData = data.allCards;
                    state.allUsersData = data.allUsers;
                    state.lastSyncTs = Date.now();
                    const inUseIds = state.allCardData
                        .filter(c => c.status === '사용중' || c.status === '신청중' || c.status === '반납처리중')
                        .map(c => c.id);
                    if (inUseIds.length) {
                        const carts = await Api.call('getSavedCarts', inUseIds);
                        state.allCardData.forEach(c => c.savedCart = Utils.sanitizeReceiptCart(carts[c.id] || []));
                        state.lastSyncTs = Date.now();
                    }
                }
            } catch(e) {}
        },
        /* =========================================================
        @SUBSECTION: JS_RETURN_SUBMIT_FLOW
        관리자 모드 반납 제출 및 optimistic 상태 변경
        ========================================================= */
        async submitCart() {
            
            if (!state.isAdminMode) {
                await Swal.fire('제출 불가', '관리자 모드에서만 반납 제출할 수 있습니다.', 'warning');
                return;
            }
            if (CardLogic._submitInFlight) return;
            const blockingIssues = CardLogic.getBlockingReceiptIssues();
            if (blockingIssues.length) {
                await CardLogic.showBlockingReceiptIssues(blockingIssues);
                return;
            }

            
            const isMeal = false;
            if (state.receiptCart && state.receiptCart.length) {
                const missing = state.receiptCart
                    .map((it, idx) => ({ it, idx }))
                    .filter(x => !Utils.isMealExpenseItem(x.it) && !(String(x.it.usageDetails || '').trim()));
                if (missing.length) {
                    const ok = await Swal.fire({
                        title: '입력 확인',
                        html: `<b>${missing.length}건</b>의 사용내역이 비어 있습니다.<br>그래도 제출할까요?`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: '그대로 제출',
                        cancelButtonText: '입력하러 가기'
                    });
                    if (!ok.isConfirmed) {
                        const first = missing[0]?.idx;
                        setTimeout(() => {
                            const el = document.querySelector(`.cart-item[data-index="${first}"]`);
                            if (el) {
                                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                el.classList.add('highlight');
                                setTimeout(() => el.classList.remove('highlight'), 1500);
                            }
                        }, 50);
                        return;
                    }
                }
            }
            
            if (!state.receiptCart.length) {
                const ok = await Swal.fire({title:'영수증 없음',text:'영수증 없이 반납하시겠습니까?',icon:'warning',showCancelButton:true,confirmButtonText:'영수증 없이 반납',cancelButtonText:'취소'});
                if (!ok.isConfirmed) return;
            }

            CardLogic._submitInFlight = true;
            const btn = document.getElementById('submit-cart-btn');
            if(btn) { btn.disabled = true; btn.classList.add('is-loading'); }
            const params = {
                adminPin: state.isAdminMode ? (state.adminPinCache || '') : '',
                cardNumber: state.currentReturnCard.id,
                receiveDate: state.currentReturnCard.userInfo.receiveDate,
                userName: state.enteredUsers.map(u=>u.name).join(', '),
                purpose: state.currentReturnCard?.userInfo?.purpose || '',
                usageSessionId: state.currentReturnCard?.userInfo?.usageSessionId || '',
                requestId: Utils.createClientRequestId('return'),
                multiEntries: JSON.stringify(Utils.sanitizeReceiptCart(state.receiptCart))
            };
            let delayedReturnLoadingTimer = null;
            let delayedReturnLoadingShown = false;
            const originalSubmitText = btn ? btn.textContent : '';
            if (btn) btn.textContent = '반납 처리중...';
            try {
                
                delayedReturnLoadingTimer = setTimeout(() => {
                    delayedReturnLoadingShown = true;
                    try {
                        Swal.fire({
                            title: '반납 처리중',
                            allowOutsideClick: false,
                            allowEscapeKey: false,
                            showConfirmButton: false,
                            didOpen: () => { try { Swal.showLoading(); } catch(e) {} }
                        });
                    } catch(e) {}
                }, 800);

                await Api.call('queueReturnRequest', params);
                if (delayedReturnLoadingTimer) clearTimeout(delayedReturnLoadingTimer);
                if (delayedReturnLoadingShown) { try { if (window.Swal && Swal.isVisible()) Swal.close(); } catch(e) {} }

                const t = state.allCardData.find(c => c.id === params.cardNumber);
                if (t) t.status = '반납처리중';
                const returnTotalAmount = (state.receiptCart || []).reduce((sum, it) => sum + (Number(it?.amount || 0) || 0), 0);
                UIManager.showConfirmationScreen('반납 처리 완료',
                    Utils.createDetailRow('카드번호', params.cardNumber) +
                    Utils.createDetailRow('영수증', `${state.receiptCart.length}건 접수`) +
                    Utils.createDetailRow('금액', `${Utils.nfKR.format(returnTotalAmount)}원`)
                );
                state.forceSyncOnNextUnlock = true;
                state.pendingPostReturnSync = true;
                CardLogic.scheduleQuickSync(3, 1200);
            } catch (e) {
                if (delayedReturnLoadingTimer) clearTimeout(delayedReturnLoadingTimer);
                if (delayedReturnLoadingShown) { try { if (window.Swal && Swal.isVisible()) Swal.close(); } catch(_) {} }
                state.lastReturnSubmitError = { cardNumber: params.cardNumber, message: Utils.getErrorMessage(e), at: new Date().toISOString() };
                clearInterval(state.countdownInterval);
                if(btn) { btn.disabled = false; btn.classList.remove('is-loading'); btn.textContent = originalSubmitText || '반납 제출'; }
                await UIManager.showOperationalError({
                    title: '반납 처리 실패',
                    error: e,
                    steps: [
                        '다시 반납 제출을 눌러 주세요.',
                        '반복 실패하면 카드 상태를 확인해 주세요.'
                    ]
                });
            } finally {
                CardLogic._submitInFlight = false;
            }
        }

    };

    
    /* =========================================================
    @SECTION: JS_APP_SEQUENCE
    앱 시작/잠금 해제 뒤 데이터 동기화와 로딩 진행률 처리
    ========================================================= */
    async function initializeAppSequence() {
        const reqId = ++state.syncReqId;
        elements.welcomeScreen.classList.remove('hidden');
        elements.welcomeScreen.classList.add('is-visible');
        UIManager.currentScreenElement = elements.welcomeScreen;
        state.currentScreen = 'welcome';
        elements.contentWrapper.style.display = 'flex';
        await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
        requestAnimationFrame(() => elements.lockScreen.classList.add('fade-out'));
        const hideLockAfterFade = () => {
            const onEnd = (ev) => {
                if (ev.propertyName !== 'opacity') return;
                elements.lockScreen.removeEventListener('transitionend', onEnd);
                try { elements.lockScreen.style.display = 'none'; } catch(e) {}
            };
            elements.lockScreen.addEventListener('transitionend', onEnd);
        };
        hideLockAfterFade();
        let isDataLoaded = false;
        const dataPromise = Api.call('getInitialAppData')
            .then(r => { isDataLoaded = true; return r; })
            .catch(e => { isDataLoaded = true; throw e; });
        await UIManager.runRandomLoader(() => isDataLoaded);
        elements.welcomeScreen.classList.remove('is-visible');
        elements.welcomeScreen.classList.add('is-hiding');
        setTimeout(() => {
            elements.welcomeScreen.classList.add('hidden');
            elements.welcomeScreen.classList.remove('is-hiding');
            elements.lockScreen.classList.add('hidden');
        }, 400);
        try {
            const data = await dataPromise;
            if (!data || data.error) throw new Error(data?.error || 'No Data');
            if (reqId !== state.syncReqId) return;
            state.allCardData = data.allCards;
            state.allUsersData = data.allUsers;
            state.lastSyncTs = Date.now();
            setTimeout(() => CardLogic.drainPendingRentRequests(), 800);
            const inUseIds = state.allCardData
                .filter(c => c.status === '사용중' || c.status === '신청중' || c.status === '반납처리중')
                .map(c => c.id);
            if (inUseIds.length) {
                Api.call('getSavedCarts', inUseIds)
                    .then(map => state.allCardData.forEach(c => c.savedCart = Utils.sanitizeReceiptCart(map[c.id] || [])))
                    .catch(console.error);
            }
            UIManager.showScreen('login');
        } catch (e) {
            state.allCardData = [];
            state.allUsersData = [];
            UIManager.showScreen('login');
        }
        UIManager.startInactivityDetection();
    }
    /* =========================================================
    @SECTION: JS_LOCK_SCREEN
    카드 잠금 화면 클릭 → 로더 → 로그인 화면 진입 흐름
    ========================================================= */
    async function handleLockScreenClick() {
        if (state.isAppActive && state.currentScreen !== 'lock') return;
        state.isAppActive = true;
        state.cardTiltActive = false;
        state.forceSyncOnNextUnlock = false;
        state.pendingPostReturnSync = false;
        state.syncPromise = null;
        elements.lockScreen.classList.add('active-pop');
        document.getElementById('lock-text-instruction').classList.add('hide');

        /*
          행정실 키오스크 갱신 규칙:
          - 화면이 다시 켜질 때는 잠금화면으로만 복귀합니다.
          - 실제 카드/사용자 최신 데이터는 잠금화면 카드를 누른 이 순간,
            로딩 화면을 거치며 getInitialAppData로 항상 새로 가져옵니다.
        */
        requestAnimationFrame(() => {
            setTimeout(() => initializeAppSequence(), 0);
        });
    }

    function bindAdminModeGesture() {
        let adminTapCount = 0;
        let adminTapTimer = null;
        function resetAdminTap(){
            adminTapCount = 0;
            if (adminTapTimer) clearTimeout(adminTapTimer);
            adminTapTimer = null;
        }
        if (elements.mainTitle) {
            elements.mainTitle.addEventListener('click', async () => {
                adminTapCount++;
                if (!adminTapTimer) adminTapTimer = setTimeout(resetAdminTap, 1500);
                if (adminTapCount >= 5) {
                    resetAdminTap();
                    if (state.isAdminMode) {
                        const r = await Swal.fire({
                            title: '관리자 모드',
                            text: '관리자 모드를 해제(잠금)할까요?',
                            icon: 'question',
                            showCancelButton: true,
                            confirmButtonText: '해제',
                            cancelButtonText: '유지'
                        });
                        if (r.isConfirmed) setAdminMode(false);
                        return;
                    }
                    const res = await Swal.fire({
                        title: '행정실 PIN 입력',
                        input: 'password',
                        inputAttributes: { autocapitalize: 'off', inputmode: 'numeric' },
                        confirmButtonText: '확인',
                        showCancelButton: true,
                        cancelButtonText: '취소',
                    });
                    if (res.isConfirmed) {
                        const pin = String(res.value || '').trim();
                        const result = await Api.call('validateAdminPin', pin);
                        if (result && result.ok) {
                            setAdminMode(true, pin);
                        } else if (result && result.locked) {
                            Swal.fire('잠시 후 다시 시도', `PIN 입력이 잠겼습니다. 약 ${result.remainingSeconds || 300}초 후 다시 시도해 주세요.`, 'warning');
                        } else {
                            const msg = result && result.remainingAttempts != null
                                ? `PIN이 올바르지 않습니다. 남은 시도: ${result.remainingAttempts}회`
                                : 'PIN이 올바르지 않습니다.';
                            Swal.fire('실패', msg, 'error');
                        }
                    }
                }
            });
        }
    }

    function isKioskTabletDevice() {
        const ua = navigator.userAgent || '';
        const platform = navigator.platform || '';
        const hasTouch = (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        const shortSide = Math.min(window.innerWidth || 0, window.innerHeight || 0);
        const longSide = Math.max(window.innerWidth || 0, window.innerHeight || 0);
        const isiPad = /iPad/i.test(ua) || (platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
        const isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
        // PC/노트북 터치스크린 또는 브라우저 크기만으로 태블릿으로 오판하지 않도록
        // visibilitychange 복귀 잠금은 명확한 iPad/Android 태블릿에서만 실행합니다.
        return hasTouch && (isiPad || isAndroidTablet);
    }

    function hasActiveReceiptWork(){
        try {
            const cart = Array.isArray(state.receiptCart) ? state.receiptCart : [];
            return cart.some(it => {
                const status = String((it && (it.status || it.phase)) || '').toLowerCase();
                return !!(it && (it.processing || it.isProcessing || it.isSaving || ['queued','ocr','saving','save_error','processing'].includes(status)));
            }) || !!CardLogic._submitInFlight;
        } catch(e) { return false; }
    }

    function bindKioskVisibilityReturn() {
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            if (!isKioskTabletDevice()) return;
            if (state.currentScreen === 'lock') return;
            try {
                if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                    // 영수증 입력/저장/관리자 확인 등 사용자가 조작 중인 모달은 강제로 닫지 않습니다.
                    return;
                }
            } catch(e) {}
            if (hasActiveReceiptWork()) return;
            UIManager.showLockScreen();
        });
    }

    function bindMainActionHandlers() {
        elements.glassCardContainer.addEventListener('click', handleLockScreenClick);
        elements.btnBack.addEventListener('click', UIManager.resetToLogin);
        document.addEventListener('click', (e) => {
            const cardEl = e.target.closest('.card-item-wrapper[data-card-id]');
            if (cardEl && elements.cardGrid.contains(cardEl)) {
                const card = state.allCardData?.find(c => c.id === cardEl.dataset.cardId);
                if (card && ['사용가능','대여가능','사용 가능','대여 가능'].includes(String(card.status || '').trim())) {
                    
                    CardLogic.openPurposeFlight(card, cardEl);
                    return;
                }
            }

            const purposeBtn = e.target.closest('.purpose-btn[data-purpose]');
            const morphActions = document.getElementById('morph-actions');
            if (purposeBtn && morphActions && morphActions.contains(purposeBtn)) {
                const overlay = document.getElementById('morph-overlay');
                const cardId = overlay?.dataset.cardId;
                if (cardId) {
                    CardLogic.selectPurposeForConfirmation(purposeBtn.dataset.purpose, purposeBtn);
                    return;
                }
            }

            const finalRentBtn = e.target.closest('#btn-final-rent');
            if (finalRentBtn) {
                CardLogic.executeSelectedPurposeRent();
                return;
            }

            const cartDeleteBtn = e.target.closest('.cart-item-delete, .cart-item-delete-wide');
            if (cartDeleteBtn) {
                const cartItem = cartDeleteBtn.closest('.cart-item[data-index]');
                const cartContainer = document.getElementById('receipt-cart-container');
                if (cartItem && cartContainer && cartContainer.contains(cartItem)) {
                    const prim = state.currentReturnCard?.userInfo?.userName?.split(',')[0]?.trim();
                    if (!prim || state.enteredUsers[0]?.name !== prim) return;
                    e.stopPropagation();
                    CardLogic.deleteCartItem(cartItem.dataset.index);
                    return;
                }
            }

            const cartItem = e.target.closest('.cart-item[data-index]');
            const cartContainer = document.getElementById('receipt-cart-container');
            if (cartItem && cartContainer && cartContainer.contains(cartItem)) {
                const prim = state.currentReturnCard?.userInfo?.userName?.split(',')[0]?.trim();
                if (!prim || state.enteredUsers[0]?.name !== prim) return;
                if (cartItem.classList.contains('processing')) return;
                const idx = Number(cartItem.dataset.index);
                if (Number.isInteger(idx) && state.receiptCart[idx]) {
                    CardLogic.openOcrPopup(state.receiptCart[idx], idx);
                }
            }
        });
    }

    function bindReceiptFileInput() {
        const fileInput = document.getElementById('receipt-file-input');
        if (fileInput) {
            fileInput.addEventListener('change', e => {
                if (e.target.files && e.target.files.length) { CardLogic.handleReceiptFiles(e.target.files); }
            });
        }
    }

    function bindKeyboardShortcuts() {
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (Swal.isVisible()) { Swal.close(); return; }
                const overlay = document.getElementById('morph-overlay');
                if (overlay && overlay.classList.contains('active')) { e.preventDefault(); CardLogic.closeMorphOverlay(); return; }
                switch(state.currentScreen) {
                    case 'returnDetails': UIManager.showScreen('main'); break;
                    case 'main': UIManager.resetToLogin(); break;
                    case 'login': UIManager.showLockScreen(); break;
                }
                return;
            }
            if (Swal.isVisible() || state.currentScreen !== 'login') return;
            if (e.key >= '0' && e.key <= '9') KeypadLogic.processKeyInput(e.key);
            else if (e.key === 'Enter') { e.preventDefault(); if (!elements.keypadSubmitBtn.disabled) KeypadLogic.processLogin(); }
            else if (e.key === '+') { e.preventDefault(); KeypadLogic.handleAddUser(); }
            else if (e.key === 'Backspace') { e.preventDefault(); KeypadLogic.processBackspace(); }
        });
    }

    function bindBeforeUnloadGuard() {
        window.addEventListener('beforeunload', (e) => {
            const unsafeStates = ['queued', 'optimizing', 'ocr', 'postprocessing', 'saving', 'save_error'];
            const hasUnsavedReceiptWork = Array.isArray(state.receiptCart) &&
                state.receiptCart.some(it => it && unsafeStates.includes(it.processing));

            if (hasUnsavedReceiptWork || state.syncInFlight) {
                e.preventDefault();
                return '';
            }
        });
    }

    function bindLockCardTilt() {
        const cont = elements.glassCardContainer;
        const card = document.getElementById('glass-card');
        if(cont && card) {
            let rect;
            const cache = () => rect = cont.getBoundingClientRect();
            window.addEventListener('resize', cache);
            cont.addEventListener('pointerenter', cache);
            const onMove = e => {
                if (!state.cardTiltActive || !rect || state.currentScreen !== 'lock') return;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                card.style.transform = `rotateX(${((cy-rect.top)/rect.height-.5)*-10}deg) rotateY(${((cx-rect.left)/rect.width-.5)*10}deg)`;
            };
            document.body.addEventListener('mousemove', onMove);
            document.body.addEventListener('touchmove', onMove);
            cont.addEventListener('pointerleave', () => { if(state.cardTiltActive) card.style.transform = 'rotateX(0) rotateY(0)'; });
            cache();
        }
    }

    function setupEventListeners() {
        initializeDomElementRefs();
        bindAdminModeGesture();
        bindKioskVisibilityReturn();
        bindMainActionHandlers();
        bindReceiptFileInput();
        bindKeyboardShortcuts();
        bindBeforeUnloadGuard();
        bindLockCardTilt();
    }
    /* =========================================================
    @SECTION: JS_CONFIRMATION
    완료 화면 렌더링 수정 위치:
    @SUBSECTION: JS_UI_MANAGER_CONFIRMATION_SCREEN
    ========================================================= */
    return {
        init: () => {
            restoreAdminModeFromStorage();
            setupEventListeners();
            KeypadLogic.initializeKeypad();
        }
    };
})();
/* =========================================================
  @SECTION: JS_BOOTSTRAP
  DOM 준비 후 앱 시작. 새 초기화 로직은 CardApp.init 안에 추가합니다.
========================================================= */
document.addEventListener('DOMContentLoaded', () => {
    try { CardApp.init(); }
    catch (e) { Swal.fire('Error', 'Init Fail: ' + e.message, 'error'); }
});

<script>
(function(){
  function animateDashboardCounts(){
    const avail=document.getElementById('dash-available');
    const inuse=document.getElementById('dash-inuse');
    const fill=document.getElementById('dash-mini-fill');
    const percent=document.getElementById('dash-progress-percent');

    if(!avail || !inuse) return;

    const a=parseInt(avail.textContent||'0',10)||0;
    const b=parseInt(inuse.textContent||'0',10)||0;
    const total=a+b;
    const ratio=total>0?(b/total)*100:0;

    if(fill) fill.style.width=ratio+'%';
    if(percent) percent.textContent=Math.round(ratio)+'%';
  }

  const observer=new MutationObserver(()=>{
    animateDashboardCounts();
  });

  window.addEventListener('load',()=>{
    const a=document.getElementById('dash-available');
    const b=document.getElementById('dash-inuse');

    if(a) observer.observe(a,{childList:true});
    if(b) observer.observe(b,{childList:true});

    animateDashboardCounts();
  });
})();
</script>

<script id="woosung-fast-touch-keypad-final">

(function() {
  const isFastTouchDevice = () => {
    try {
      return (
        window.matchMedia &&
        window.matchMedia('(pointer: coarse)').matches
      ) || navigator.maxTouchPoints > 0;
    } catch (e) {
      return navigator.maxTouchPoints > 0;
    }
  };

  if (!isFastTouchDevice()) return;

  let suppressTrustedClickUntil = 0;
  let lastFastButton = null;
  let lastFastTouchAt = 0;
  let dispatchingSyntheticClick = false;

  const FAST_CLICK_SUPPRESS_MS = 650;
  const TOUCHSTART_GUARD_MS = 420;

  function getFastKeypadButton(target) {
    if (!target || !target.closest) return null;
    const btn = target.closest(
      '#screen-login .keypad-btn, ' +
      '#screen-login #keypad-submit-btn, ' +
      '#screen-login #keypad-add-btn, ' +
      '#screen-login #keypad-back-btn'
    );
    if (!btn) return null;
    if (btn.disabled || btn.getAttribute('aria-disabled') === 'true') return null;
    return btn;
  }

  function pressVisual(btn) {
    try {
      btn.classList.remove('pressed');
      void btn.offsetWidth;
      btn.classList.add('pressed');
      clearTimeout(btn.__woosungFastPressedTimer);
      btn.__woosungFastPressedTimer = setTimeout(() => {
        btn.classList.remove('pressed');
      }, 95);
    } catch (e) {}
  }

  function haptic() {
    try {
      if (navigator && typeof navigator.vibrate === 'function') {
        navigator.vibrate(8);
      }
    } catch (e) {}
  }

  function runButtonNow(btn, ev) {
    const now = Date.now();

    // pointerdown과 touchstart가 동시에 오는 브라우저에서 중복 방지
    if (lastFastButton === btn && now - lastFastTouchAt < TOUCHSTART_GUARD_MS) {
      if (ev && ev.cancelable) ev.preventDefault();
      if (ev) ev.stopPropagation();
      return;
    }

    lastFastButton = btn;
    lastFastTouchAt = now;
    suppressTrustedClickUntil = now + FAST_CLICK_SUPPRESS_MS;

    if (ev && ev.cancelable) ev.preventDefault();
    if (ev) ev.stopPropagation();

    pressVisual(btn);
    haptic();

    // 기존 click 핸들러를 그대로 재사용하되, 손가락 닿는 순간 실행
    dispatchingSyntheticClick = true;
    try {
      btn.click();
    } finally {
      setTimeout(() => {
        dispatchingSyntheticClick = false;
      }, 0);
    }
  }

  function handlePointerDown(ev) {
    if (!isFastTouchDevice()) return;
    if (ev.pointerType && ev.pointerType !== 'touch' && ev.pointerType !== 'pen') return;

    const btn = getFastKeypadButton(ev.target);
    if (!btn) return;

    runButtonNow(btn, ev);
  }

  function handleTouchStart(ev) {
    if (!isFastTouchDevice()) return;

    const btn = getFastKeypadButton(ev.target);
    if (!btn) return;

    runButtonNow(btn, ev);
  }

  function suppressDelayedClick(ev) {
    if (!isFastTouchDevice()) return;

    const btn = getFastKeypadButton(ev.target);
    if (!btn) return;

    // pointerdown에서 직접 실행한 synthetic click은 허용
    if (dispatchingSyntheticClick || ev.isTrusted === false) return;

    // 손가락을 뗄 때 뒤늦게 발생하는 실제 click은 중복 방지
    if (Date.now() < suppressTrustedClickUntil && btn === lastFastButton) {
      if (ev.cancelable) ev.preventDefault();
      ev.stopImmediatePropagation();
      ev.stopPropagation();
    }
  }

  function applyFastTouchCss() {
    if (document.getElementById('woosung-fast-touch-keypad-style')) return;

    const style = document.createElement('style');
    style.id = 'woosung-fast-touch-keypad-style';
    style.textContent = `
      @media (pointer: coarse) {
        #screen-login .keypad-grid,
        #screen-login .keypad-btn,
        #screen-login #keypad-submit-btn,
        #screen-login #keypad-add-btn,
        #screen-login #keypad-back-btn {
          touch-action: manipulation !important;
          -webkit-tap-highlight-color: transparent !important;
        }

        #screen-login .keypad-btn,
        #screen-login #keypad-submit-btn {
          transition:
            transform 0.045s ease,
            box-shadow 0.045s ease,
            color 0.045s ease,
            filter 0.045s ease !important;
          will-change: transform;
        }

        #screen-login .keypad-btn.pressed {
          transform: scale(0.97) !important;
        }

        #screen-login #keypad-submit-btn.pressed {
          transform: scale(0.985) !important;
        }
      }
    `;
    document.head.appendChild(style);
  }

  function initFastTouch() {
    applyFastTouchCss();
    // pointerdown/touchstart에서 btn.click()을 강제 실행하던 빠른 터치 보정은
    // 기존 click 핸들러와 시각 효과를 중복 실행시킬 수 있어 비활성화합니다.
    // touch-action CSS만 유지해 브라우저 기본 click 지연을 최소화합니다.
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initFastTouch, { once: true });
  } else {
    initFastTouch();
  }
})();
</script>
