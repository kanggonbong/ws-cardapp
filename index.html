<!DOCTYPE html>
<!--
  =========================================================
  우성고 카드 시스템 - single-file maintenance build
  =========================================================
  @SECTION: FILE_MAINTENANCE_MAP

  이 파일은 "파일 분리 없는 단일 HTML" 기준을 유지합니다.
  HTML / CSS / JS를 별도 파일로 분리하지 않고, @SECTION / @SUBSECTION / @PHASE / FINAL_PATCH
  주석을 책갈피처럼 사용해 유지보수합니다.

  @PHASE: REFACTOR_STAGE_1_STRUCTURE_MAP
  @PHASE: REFACTOR_STAGE_2_DEAD_CODE_CLEANUP
  @PHASE: REFACTOR_STAGE_3_JS_RESPONSIBILITY
  @PHASE: REFACTOR_STAGE_4_CSS_DESIGN_RESPONSIBILITY
  @PHASE: REFACTOR_STAGE_5_FINAL_GUIDE_STABILIZATION
  이번 1~5차 작업의 목적은 기능 변경이 아니라 "수정 동선, JS 책임 경계, CSS/디자인 책임 경계, 최종 수정 가이드 고정"입니다.
  - 기존 함수명과 실행 흐름 유지
  - CSS/HTML/JS의 책임 구역을 먼저 지도화
  - 이후 2차~5차 리팩터링에서 제거/이동/정리를 안전하게 진행할 기준점 마련

  AI_EDIT_GUIDE
  - 서버 호출/Worker 전환: @SECTION: JS_API_BRIDGE
  - 전역 상태 추가/삭제: @SECTION: JS_STATE
  - 공용 포맷/검증/escape: @SECTION: JS_UTILS
  - 화면 전환/잠금/로딩: @SECTION: JS_UI_MANAGER
  - 로그인 키패드/사용자 추가: @SECTION: JS_KEYPAD_LOGIC
  - 카드 목록/대여/반납/영수증: @SECTION: JS_CARD_LOGIC
  - 영수증 업로드/OCR: @SUBSECTION: JS_RECEIPT_OCR_PIPELINE_BATCH
  - 영수증 수정 팝업: @SUBSECTION: JS_RECEIPT_EDIT_POPUP
  - 최종 반납 제출: @SUBSECTION: JS_RETURN_SUBMIT_FLOW
  - 전역 클릭/키보드 이벤트: @SECTION: JS_EVENT_LISTENERS
  - 최종 디자인 보정: @SECTION: CSS_FINAL_OVERRIDES_INDEX
  - 4차 디자인 토큰/화면별 수정 계약: @SECTION: CSS_DESIGN_RESPONSIBILITY_CONTRACT
  - 5차 최종 수정 체크리스트: @SECTION: FINAL_MAINTENANCE_GUIDE

  SINGLE_FILE_RULES_FOR_AI
  - HTML/JS/CSS는 이 HTML 한 파일 안에서 유지한다.
  - GAS는 Code.gs 한 파일 안에서 유지한다.
  - 파일 분리, 빌드 도구 도입, 대규모 함수명 변경은 하지 않는다.
  - 새 기능은 가장 가까운 @SECTION 안에서만 수정한다.
  - CSS 최종 보정은 기존 규칙 삭제보다 아래쪽 override를 우선한다.
  - 7차 이후 카드 색상은 FINAL_PATCH_REFACTOR_STAGE_7_CSS_DIET_AND_THEME_LOCK의 토큰을 우선 수정한다.
  - API 이름이나 반환 필드를 바꾸면 Code.gs의 WebAppApi handlers도 같이 확인한다.

  FINAL_MAINTENANCE_GUIDE
  - 새 수정은 항상 아래 순서로 위치를 찾는다.
    1) 화면/기능 이름으로 @SECTION 검색
    2) JS 변경이면 JS_RESPONSIBILITY_CONTRACT 확인
    3) CSS 변경이면 CSS_DESIGN_RESPONSIBILITY_CONTRACT 확인
    4) 단순 색상 변경이면 FINAL_PATCH_REFACTOR_STAGE_4_DESIGN_SYSTEM의 토큰 우선 수정
    5) 기존 규칙을 삭제하기보다 FINAL_PATCH에 사유를 남기고 override
  - 운영에서 사용하지 않는 기능 기준
    * 부속/내역첨부 UI는 사용하지 않는다.
    * 기타운영 목적은 신규 카드 신청 UI에서 사용하지 않는다.
    * 목적은 물품구매 / 식사다과 / 특근매식 기준을 유지한다.
  - 중요 흐름 보존
    * 4단계 카드신청: 목적 선택 -> 선택 강조 -> 최종 신청 버튼 -> rentNow 처리
    * 5단계 카드반납: 영수증 OCR/수정/저장 -> 반납 제출 -> PDF 생성/Drive 저장/시트 기록
    * PDF 생성 실패/반납 큐 실패는 조용히 성공 처리하지 않는다.
    * 6차 장애 UX: OCR/저장/반납 제출 실패 시 제출 차단, 중앙 안내, 복구 행동을 명확히 표시한다.

  REFACTOR_ROADMAP
  1차: 구조 지도 재배치 / 검색 동선 고정
  2차: 죽은 코드, 중복 주석, 잔여 패치 정리
  3차: JS 책임 분리 강화 / UIManager, CardLogic, Receipt, Event Router 경계 고정
  4차: CSS/디자인 책임 정리 / 화면별 디자인 수정 동선 고정
  5차: 최종 가이드 고정 및 잔여 패치 안정화 / 완료
========================================================= -->

    <script>
      /* @SECTION: JS_SWAL_TOAST_BACKDROP_PATCH
         토스트 알림은 배경 레이어를 띄우지 않게 해서
         영수증 분석/저장 오버레이와 SweetAlert 배경이 겹쳐 화면이 반만 흐려지는 현상을 방지합니다.

         FINAL_PATCH_MOBILE_STABILITY_SCRIPT_SAFE
         - CDN 지연/실패/캐시 상태에서 Swal이 아직 준비되지 않은 경우에도 DOMContentLoaded/load 시점에 재시도합니다.
         - 이미 패치된 경우에는 중복 래핑하지 않습니다.
         - SweetAlert 자체가 로드되지 못한 경우에는 조용히 통과하여 앱 초기화를 막지 않습니다.
      */
      (function installSwalToastBackdropPatch() {
        function patch() {
          if (!window.Swal || window.Swal.__wsToastBackdropPatched) return false;
          const originalFire = window.Swal.fire.bind(window.Swal);
          window.Swal.fire = function patchedSwalFire(...args) {
            if (args.length === 1 && args[0] && typeof args[0] === 'object' && args[0].toast === true) {
              args[0] = Object.assign({ backdrop: false, heightAuto: false }, args[0]);
            }
            return originalFire(...args);
          };
          window.Swal.__wsToastBackdropPatched = true;
          return true;
        }

        if (patch()) return;
        window.addEventListener('DOMContentLoaded', patch, { once: true });
        window.addEventListener('load', patch, { once: true });
      })();
    </script>



    <!-- =========================================================

      3) CSS_MOBILE_SAFETY_PATCH / CSS_FINAL_* / FINAL_PATCH_*
         - 모바일 안정화, SweetAlert, 영수증 오버레이, 최종 테마 색상 보정입니다.

      CSS_EDIT_MAP
      - 색상/그림자 토큰: @SECTION: CSS_THEME_BASE, @SECTION: CSS_THEME_BLUE_OVERRIDE
      - 잠금화면 카드: @SECTION: CSS_LOCK_SCREEN, @SECTION: FINAL_PATCH_REFACTOR_STAGE_7_CSS_DIET_AND_THEME_LOCK
      - 로딩화면: @SECTION: CSS_WELCOME_LOADER
      - 내선번호/키패드: @SECTION: CSS_LOGIN_KEYPAD
      - 카드신청 스마트랙: @SECTION: CSS_CARD_SELECTION, @SECTION: CSS_SMART_RACK_SKEUOMORPHISM_THEME
      - 카드 목적 선택: @SECTION: CSS_PURPOSE_MORPH_OVERLAY
      - 카드반납/영수증: @SECTION: CSS_RECEIPT_RETURN, @SECTION: CSS_RECEIPT_CART_ITEMS
      - SweetAlert 모달: @SECTION: CSS_SWAL_MODAL
      - 모바일 보정: @SECTION: CSS_RESPONSIVE_BREAKPOINTS, CSS_MOBILE_* 계열
      - 최종 테마/핫픽스: @SECTION: CSS_FINAL_OVERRIDES_INDEX

    <!-- =========================================================
      @SECTION: CSS_DESIGN_RESPONSIBILITY_CONTRACT
      4차 CSS/디자인 책임 정리 기준

      DESIGN_EDIT_RULES
      - 색상만 바꿀 때: @SECTION: FINAL_PATCH_REFACTOR_STAGE_7_CSS_DIET_AND_THEME_LOCK 의 :root 토큰을 먼저 수정합니다.
      - 화면 배치만 바꿀 때: CSS_APP_LAYOUT / CSS_RESPONSIVE_BREAKPOINTS / 해당 화면 SECTION을 수정합니다.
      - 컴포넌트 모양만 바꿀 때: 버튼, 카드, 장바구니, SweetAlert 등 가장 가까운 COMPONENT SECTION에서 수정합니다.
      - 최종 테마 보정은 파일 하단 FINAL_PATCH 계열에서만 추가합니다.
      - 같은 selector를 여러 곳에서 고칠 때는 아래쪽 override가 우선한다는 점을 주석으로 남깁니다.

      CSS_RESPONSIBILITY_BUCKETS
      1) TOKENS
         - 색상, 그림자, 카드 그라데이션, 상태색
         - 대표 위치: CSS_THEME_BASE, CSS_THEME_BLUE_OVERRIDE, FINAL_PATCH_REFACTOR_STAGE_7_CSS_DIET_AND_THEME_LOCK
      2) LAYOUT
         - 화면 중앙 정렬, 컨테이너 폭, 그리드, 반응형 기준
         - 대표 위치: CSS_APP_LAYOUT, CSS_RESPONSIVE_BREAKPOINTS
      3) COMPONENTS
         - 키패드 버튼, 카드 슬롯, 목적 버튼, 영수증 장바구니, SweetAlert 입력폼

      4) SCREEN_SKINS
         - 잠금화면, 로딩화면, 내선번호, 카드신청, 카드반납처럼 화면 단위 감성/톤
         - 대표 위치: CSS_LOCK_SCREEN, CSS_WELCOME_LOADER, CSS_RECEIPT_RETURN, SMART_RACK 계열
      5) FINAL_OVERRIDES
         - 누적 패치의 최종 우선순위 정리
         - 대표 위치: CSS_FINAL_* / FINAL_PATCH_* / FINAL_PATCH_REFACTOR_STAGE_7_CSS_DIET_AND_THEME_LOCK

      STAGE_4_NOTE
      - 이번 4차에서는 대규모 CSS 재배열 대신 "디자인 수정 책임"을 토큰화하고, 최종 카드/잠금 색상은 토큰 기반으로 재고정합니다.
      - 기존 동작, HTML 구조, JS 함수명, GAS 연동은 변경하지 않습니다.
    ========================================================= -->

/* ===== UX ENHANCEMENT PACK ===== */

/* Title chiseled effect */
#main-title-container .inset-box h2{
  color:#1f4175 !important;
  text-shadow:
    -1px -1px 1px rgba(110,138,176,0.35),
    1px 1px 1px rgba(255,255,255,0.92) !important;
}

/* Logo shimmer */
.school-mark--title{
  position:relative;
  overflow:hidden;
}
.school-mark--title::after{
  content:'';
  position:absolute;
  top:-120%;
  left:-180%;
  width:70%;
  height:300%;
  transform:rotate(24deg);
  background:linear-gradient(
    90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.0) 35%,
    rgba(255,255,255,0.55) 50%,
    rgba(255,255,255,0.0) 65%,
    rgba(255,255,255,0) 100%
  );
  animation:logoShimmer 7s ease-in-out infinite;
  pointer-events:none;
}
@keyframes logoShimmer{
  0%,82%{left:-180%;}
  100%{left:220%;}
}

/* Current digit breathing cursor */
#keypadDisplay .digit-box.current-active{
  position:relative;
}
#keypadDisplay .digit-box.current-active::after{
  content:'';
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#2563eb;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px rgba(37,99,235,0.55);
  animation:cursorPulse 1.1s ease-in-out infinite;
}
@keyframes cursorPulse{
  0%,100%{
    opacity:.25;
    transform:translate(-50%,-50%) scale(.8);
  }
  50%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.18);
  }
}

/* Filled digit */
#keypadDisplay .digit-box.filled{
  width:48px !important;
  height:48px !important;
  border-radius:14px !important;
  color:#2563eb !important;
  font-size:1.35rem !important;
  font-weight:700 !important;
  background:linear-gradient(180deg,#fbfdff 0%,#e8eff8 100%) !important;
  border:1px solid rgba(37,99,235,0.22) !important;
  box-shadow:
    5px 5px 11px rgba(110,138,176,0.20),
    -5px -5px 11px rgba(255,255,255,0.95),
    inset 1px 1px 0 rgba(255,255,255,0.74) !important;
  animation:digitDotPop .18s ease-out both;
  transition:transform .2s ease, box-shadow .2s ease;
}

/* Masked digit inset morph */
#keypadDisplay .digit-box.masked{
  width:18px !important;
  height:18px !important;
  border-radius:50% !important;
  font-size:0 !important;
  color:transparent !important;
  background:linear-gradient(180deg,#5d9ff3 0%,#2d66d3 100%) !important;
  border:none !important;
  box-shadow:
    inset 3px 3px 6px rgba(15,32,65,0.36),
    inset -1px -1px 2px rgba(255,255,255,0.22),
    0 1px 0 rgba(255,255,255,0.6) !important;
  animation:
    digitFlipMask .22s cubic-bezier(.4,0,.2,1) forwards,
    pulse-breathing 2s infinite ease-in-out .25s;
}

@keyframes digitFlipMask{
  0%{
    transform:scale(1.08) rotateX(0deg);
    opacity:.72;
  }
  50%{
    transform:scale(.78) rotateX(90deg);
    opacity:.45;
  }
  100%{
    transform:scale(1) rotateX(0deg);
    opacity:1;
  }
}

/* Main user premium indicator */
#main-user-box{
  position:relative;
  border:1px solid transparent !important;
  background-image:
    linear-gradient(#f1f5fb,#dfe9f7),
    linear-gradient(135deg,#7cb8ff,#2563eb) !important;
  background-origin:border-box !important;
  background-clip:padding-box,border-box !important;
}
.main-user-icon{
  position:relative;
}
.main-user-icon::after{
  content:'';
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#10b981;
  right:-1px;
  bottom:-1px;
  border:1.5px solid #fff;
  animation:liveDotPulse 1.6s infinite ease-in-out;
}
@keyframes liveDotPulse{
  0%,100%{
    transform:scale(.85);
    opacity:.65;
    box-shadow:0 0 0 0 rgba(16,185,129,.4);
  }
  50%{
    transform:scale(1.18);
    opacity:1;
    box-shadow:0 0 6px 2px rgba(16,185,129,.18);
  }
}

/* Dashboard pulse */
.stat-item:last-child .stat-label{
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.stat-item:last-child .stat-label::before{
  content:'';
  width:6px;
  height:6px;
  border-radius:50%;
  background:#f59e0b;
  box-shadow:0 0 6px #f59e0b;
  animation:orangePulse 1.8s infinite ease-in-out;
}
@keyframes orangePulse{
  0%,100%{opacity:.4;transform:scale(.9);}
  50%{opacity:1;transform:scale(1.2);}
}

/* Dashboard progress */
.header-dashboard{
  display:grid !important;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}
.dashboard-progress-container{
  width:56px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.dash-mini-track{
  width:100%;
  height:6px;
  border-radius:999px;
  overflow:hidden;
  padding:1px;
  background:#dce7f5 !important;
  box-shadow:
    inset 1px 1px 3px rgba(126,156,198,0.22),
    inset -1px -1px 3px rgba(255,255,255,0.8) !important;
}
.dash-mini-fill{
  width:0%;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#7cb8ff,#2563eb) !important;
  transition:width .45s cubic-bezier(.25,1,.5,1);
}
.dash-progress-caption{
  font-size:.62rem;
  font-weight:800;
  color:#6882a8;
}



/* =========================================================
  @SECTION: CSS_SMART_RACK_SKEUOMORPHISM_THEME
  라이트 스키오모피즘: 뉴모피즘 보관함 트레이 + 고대비 실물 카드 슬롯
  - 디자인 컨셉만 적용
  - 기존 카드 클릭 로직 / GAS / 타이머 / 로그인 흐름은 유지
========================================================= */
#card-list-container{
  width:100%;
}
#cardGrid{
  position:relative;
  display:grid !important;
  grid-template-columns:repeat(3,1fr) !important;
  gap:18px !important;
  width:100%;
  padding:20px !important;
  border-radius:30px !important;
  background:
    radial-gradient(circle at 18% 10%, rgba(255,255,255,.38) 0%, transparent 28%),
    linear-gradient(180deg,#cbd5e1 0%,#d8e3f0 52%,#c3cfdd 100%) !important;
  border:1px solid rgba(255,255,255,.72) !important;
  box-shadow:
    inset 7px 7px 16px rgba(30,41,59,.22),
    inset -7px -7px 16px rgba(255,255,255,.78),
    0 12px 28px rgba(31,65,117,.08) !important;
  overflow:visible;
}
#cardGrid::before{
  content:'';
  position:absolute;
  top:-11px;
  left:22px;
  z-index:3;
  padding:4px 11px;
  border-radius:999px;
  font-size:.62rem;
  font-weight:950;
  letter-spacing:.08em;
  color:#475569;
  background:linear-gradient(180deg,#f8fbff 0%,#e8eff8 100%);
  border:1px solid rgba(255,255,255,.82);
  box-shadow:4px 4px 10px rgba(51,65,85,.14),-4px -4px 10px rgba(255,255,255,.86);
}
.card-item-wrapper.hybrid-card-slot{
  aspect-ratio:1.45 / 1 !important;
  border-radius:22px !important;
  display:flex !important;
  position:relative !important;
  overflow:visible !important;
  opacity:0;
  transform:translateY(16px) scale(.985);
  transition:
    opacity .32s ease,
    transform .42s cubic-bezier(.34,1.56,.64,1),
    box-shadow .18s ease,
    filter .18s ease !important;
  box-shadow:none !important;
  background:transparent !important;
  filter:none !important;
}
#cardGrid.is-loaded .card-item-wrapper.hybrid-card-slot{
  opacity:1;
  transform:translateY(0) scale(1);
}
.card-item-wrapper.hybrid-card-slot .hybrid-card-btn{
  width:100%;
  height:100%;
  padding:14px 12px 12px !important;
  border-radius:22px !important;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  position:relative;
  overflow:hidden;
  border:none;
  background:transparent;
}
/* [상태 1] 보관함에 실제로 꽂혀 있는 카드: 대여 가능 */
.card-item-wrapper.hybrid-card-slot.card-status-available{
  cursor:pointer !important;
  background:
    linear-gradient(120deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(135deg,#1e293b 0%,#0f172a 58%,#203a43 100%) !important;
  border:1px solid rgba(255,255,255,.18) !important;
  box-shadow:
    2px 10px 20px rgba(15,23,42,.28),
    inset 1px 1px 0 rgba(255,255,255,.22),
    inset -1px -1px 0 rgba(0,0,0,.22) !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-available::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 5px);
  mix-blend-mode:screen;
  pointer-events:none;
  opacity:.65;
}
.card-item-wrapper.hybrid-card-slot.card-status-available::after{
  content:'';
  position:absolute;
  inset:-4px;
  border-radius:26px;
  border:2.5px solid rgba(37,99,235,.86);
  filter:drop-shadow(0 0 7px rgba(37,99,235,.42));
  pointer-events:none;
  animation:smartRackBluePulse 2.15s ease-in-out infinite;
}
/* 특수/식대 성격 카드는 초록빛 메탈 카드로 구분 */
.card-item-wrapper.hybrid-card-slot.special-overseas-card.card-status-available,
.card-item-wrapper.hybrid-card-slot.meal-style.card-status-available{
  background:
    linear-gradient(120deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(135deg,#064e3b 0%,#022c22 68%,#064e3b 100%) !important;
}
/* [상태 2] 카드가 밖으로 나간 자리: 깊게 파인 빈 트레이 */
.card-item-wrapper.hybrid-card-slot.card-status-inuse,
.card-item-wrapper.hybrid-card-slot.card-status-returning,
.card-item-wrapper.hybrid-card-slot.card-status-unknown{
  cursor:not-allowed !important;
  opacity:1 !important;
  filter:none !important;
  background:
    radial-gradient(circle at 45% 34%, rgba(255,255,255,.055) 0%, transparent 42%),
    linear-gradient(180deg,#475569 0%,#334155 50%,#1e293b 100%) !important;
  border:1px solid rgba(255,255,255,.10) !important;
  box-shadow:
    inset 7px 7px 15px rgba(0,0,0,.46),
    inset -4px -4px 10px rgba(255,255,255,.075),
    1px 1px 0 rgba(255,255,255,.18) !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-inuse::before,
.card-item-wrapper.hybrid-card-slot.card-status-returning::before,
.card-item-wrapper.hybrid-card-slot.card-status-unknown::before{
  content:'';
  position:absolute;
  inset:10px;
  border-radius:16px;
  border:1.5px dashed rgba(203,213,225,.16);
  pointer-events:none;
}
/* 기존 로직상 반납처리중은 비활성 슬롯으로 유지하되 초록 계열 힌트만 살짝 표시 */
.card-item-wrapper.hybrid-card-slot.card-status-returning{
  box-shadow:
    inset 7px 7px 15px rgba(0,0,0,.42),
    inset -4px -4px 10px rgba(255,255,255,.07),
    0 0 0 1px rgba(16,185,129,.18) !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-available:hover{
  transform:translateY(-2px) scale(1.014) !important;
  filter:brightness(1.035);
  box-shadow:
    3px 14px 24px rgba(15,23,42,.30),
    inset 1px 1px 0 rgba(255,255,255,.26),
    inset -1px -1px 0 rgba(0,0,0,.22) !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-available:active{
  transform:scale(.955) translateY(1px) !important;
  filter:none;
  box-shadow:
    1px 5px 10px rgba(15,23,42,.24),
    inset 5px 5px 10px rgba(0,0,0,.28),
    inset -3px -3px 8px rgba(255,255,255,.10) !important;
}
/* @PHASE: FINAL_PATCH_CARD_SELECT_FEEDBACK - 카드 클릭 시 선택 피드백 애니메이션 */
.card-item-wrapper.hybrid-card-slot.card-status-available.rent-clicked{
  animation:cardSelectPop .28s cubic-bezier(.22,1,.36,1) both !important;
}
.card-item-wrapper.hybrid-card-slot.card-status-available.rent-clicked::after{
  opacity:1 !important;
  border-color:rgba(96,165,250,.96) !important;
  filter:drop-shadow(0 0 12px rgba(96,165,250,.62)) !important;
}
@keyframes cardSelectPop{
  0%{transform:translateY(0) scale(1);}
  45%{transform:translateY(-6px) scale(1.045);}
  100%{transform:translateY(-3px) scale(1.02);}
}
.card-item-wrapper.hybrid-card-slot.card-status-inuse:hover,
.card-item-wrapper.hybrid-card-slot.card-status-returning:hover,
.card-item-wrapper.hybrid-card-slot.card-status-unknown:hover{
  transform:none !important;
  filter:none !important;
}
.card-item-wrapper.hybrid-card-slot .hybrid-card-topline{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:14px;
  position:relative;
  z-index:3;
}
.hybrid-card-chip{
  width:24px;
  height:16px;
  border-radius:4px;
  background:linear-gradient(135deg,#fde68a 0%,#f59e0b 52%,#92400e 100%) !important;
  box-shadow:
    inset 1px 1px 2px rgba(255,255,255,.55),
    inset -1px -1px 1px rgba(0,0,0,.22),
    0 2px 5px rgba(0,0,0,.22);
  opacity:.96;
}
.hybrid-card-state-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#60a5fa;
  box-shadow:0 0 11px rgba(96,165,250,.82);
}
.card-status-inuse .hybrid-card-chip,
.card-status-returning .hybrid-card-chip,
.card-status-unknown .hybrid-card-chip{
  opacity:0 !important;
}
.card-status-inuse .hybrid-card-state-dot,
.card-status-unknown .hybrid-card-state-dot{
  background:rgba(148,163,184,.22);
  box-shadow:none;
}
.card-status-returning .hybrid-card-state-dot{
  background:#10b981;
  box-shadow:0 0 10px rgba(16,185,129,.42);
}
.card-item-wrapper.hybrid-card-slot .hybrid-card-visual{
  width:100% !important;
  height:auto !important;
  flex:1;
  min-height:18px;
  margin:0 !important;
  border-radius:15px !important;
  background:linear-gradient(120deg,rgba(255,255,255,.18),rgba(255,255,255,.045)) !important;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.18) !important;
  border:1px solid rgba(255,255,255,.10) !important;
  position:relative;
  z-index:2;
}
.card-item-wrapper.hybrid-card-slot .hybrid-card-visual::before,
.card-item-wrapper.hybrid-card-slot .hybrid-card-visual::after{
  display:none !important;
}
.card-status-inuse .hybrid-card-visual,
.card-status-returning .hybrid-card-visual,
.card-status-unknown .hybrid-card-visual{
  background:repeating-linear-gradient(135deg,rgba(15,23,42,.12) 0 7px,rgba(255,255,255,.035) 7px 14px) !important;
  border:1px dashed rgba(203,213,225,.10) !important;
  box-shadow:inset 2px 2px 5px rgba(0,0,0,.16) !important;
}
.hybrid-card-texts{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
  position:relative;
  z-index:3;
}
.card-item-wrapper.hybrid-card-slot .card-name{
  margin:0 !important;
  font-size:1.08rem !important;
  font-weight:950 !important;
  letter-spacing:-.04em;
  line-height:1.05;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-status-available .card-name{
  color:#ffffff !important;
  text-shadow:0 2px 6px rgba(0,0,0,.32);
}
.card-status-inuse .card-name,
.card-status-returning .card-name,
.card-status-unknown .card-name{
  color:rgba(226,232,240,.34) !important;
  text-shadow:none !important;
}
.hybrid-card-sub-label{
  font-size:.72rem;
  font-weight:850;
  letter-spacing:-.02em;
}
.card-status-available .hybrid-card-sub-label{color:rgba(255,255,255,.72);}
.card-status-inuse .hybrid-card-sub-label,
.card-status-returning .hybrid-card-sub-label,
.card-status-unknown .hybrid-card-sub-label{color:rgba(226,232,240,.18);}
.card-item-wrapper.hybrid-card-slot .card-usage-meta{
  margin-top:2px !important;
  font-size:.68rem !important;
  font-weight:850 !important;
  color:rgba(226,232,240,.30) !important;
  max-width:100% !important;
}
.hybrid-status-badge.status-badge{
  top:10px !important;
  right:10px !important;
  z-index:4;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px !important;
  border-radius:999px !important;
  font-size:.68rem !important;
  font-weight:950 !important;
  letter-spacing:-.02em;
  backdrop-filter:none !important;
}
.card-status-available .hybrid-status-badge{
  color:#1d4ed8 !important;
  background:rgba(255,255,255,.94) !important;
  border:1px solid rgba(255,255,255,.76) !important;
  box-shadow:0 6px 14px rgba(15,23,42,.18) !important;
}
.card-status-inuse .hybrid-status-badge{
  color:rgba(226,232,240,.58) !important;
  background:rgba(15,23,42,.32) !important;
  border:1px solid rgba(226,232,240,.08) !important;
  box-shadow:none !important;
}
.card-status-returning .hybrid-status-badge{
  color:#34d399 !important;
  background:rgba(2,44,34,.35) !important;
  border:1px solid rgba(16,185,129,.18) !important;
  box-shadow:none !important;
}
.card-status-unknown .hybrid-status-badge{
  color:rgba(226,232,240,.50) !important;
  background:rgba(15,23,42,.30) !important;
  border:1px solid rgba(226,232,240,.08) !important;
  box-shadow:none !important;
}
@keyframes smartRackBluePulse{
  0%,100%{opacity:.34;transform:scale(.985);}
  50%{opacity:1;transform:scale(1.016);}
}
@media (max-width:1023px){
  #cardGrid{grid-template-columns:repeat(2,1fr) !important;gap:14px !important;padding:14px !important;}
  .card-item-wrapper.hybrid-card-slot{aspect-ratio:1.38 / 1 !important;}
}

  #cardGrid{gap:12px !important;padding:12px !important;border-radius:24px !important;}
  #cardGrid::before{left:16px;font-size:.56rem;}
  .card-item-wrapper.hybrid-card-slot{border-radius:20px !important;}
  .card-item-wrapper.hybrid-card-slot .hybrid-card-btn{border-radius:20px !important;padding:12px 10px 10px !important;}
  .card-item-wrapper.hybrid-card-slot .card-name{font-size:1rem !important;}
  .hybrid-status-badge.status-badge{font-size:.62rem !important;padding:4px 7px !important;}
}

/* 대여 가능: 글자 설명 없이 카드명만 중앙에 배치 */

.card-item-wrapper.hybrid-card-slot.card-status-available .hybrid-status-badge,

.card-item-wrapper.hybrid-card-slot.card-status-available .card-usage-meta,

.card-item-wrapper.hybrid-card-slot.card-status-inuse .hybrid-card-topline,

/* =========================================================
  @SECTION: CSS_FINAL_PORTRAIT_VERTICAL_SPACE_FIX
  모바일/태블릿 세로모드 하단 여백 보정

/* =========================================================
  @SECTION: CSS_FINAL_HOTFIX_SWAL_AND_LOADING_OVERLAY
  SweetAlert 토스트/로딩 오버레이 겹침 방지 최종 패치
  - 토스트 배경 레이어가 반쪽 화면처럼 보이는 현상 방지
  - 분석/저장 오버레이와 SweetAlert z-index 기준 통일
========================================================= */
.swal2-container {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100dvh !important;
  max-width: none !important;
  max-height: none !important;
  margin: 0 !important;
  overflow: visible !important;
  z-index: 10080 !important;
}

.swal2-container.swal2-backdrop-show {
  background: rgba(15, 23, 42, 0.28) !important;
  backdrop-filter: blur(6px) !important;
  -webkit-backdrop-filter: blur(6px) !important;
}

.swal2-container:has(.swal2-toast),
.swal2-container.swal2-top,
.swal2-container.swal2-top-start,
.swal2-container.swal2-top-end {
  background: transparent !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  pointer-events: none !important;
}

.swal2-container:has(.swal2-toast) .swal2-toast,
.swal2-container.swal2-top .swal2-toast,
.swal2-container.swal2-top-start .swal2-toast,
.swal2-container.swal2-top-end .swal2-toast {
  pointer-events: auto !important;
}

#loadingOverlay,
#security-scan-overlay {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100dvh !important;
  max-width: none !important;
  max-height: none !important;
  margin: 0 !important;
}

#loadingOverlay {
  z-index: 10040 !important;
}

#security-scan-overlay {
  z-index: 10050 !important;
}

body.swal2-shown.swal2-height-auto {
  height: auto !important;
}

/* =========================================================
  @SECTION: FINAL_PATCH_REFACTOR_STAGE_7_CSS_DIET_AND_THEME_LOCK
  7차 CSS 최종 다이어트 / 최종 테마 잠금
  - 오래된 뮤트 블루 카드 패치는 제거하고, 현재 운영 색상은 아래 토큰 한 곳에 고정합니다.
  - 삭제가 위험한 과거 override는 보존하되, 카드 색상/그림자/hover는 이 섹션이 최종 우선순위를 가집니다.
  - 카드 색을 바꿀 때는 selector를 흩어 고치지 말고 이 :root 토큰부터 수정합니다.
========================================================= */
:root{
  --ws-final-card-blue-start:#1f4f9a;
  --ws-final-card-blue-end:#3b7fd8;
  --ws-final-lock-blue-start:#173a7a;
  --ws-final-lock-blue-end:#2f73d6;
  --ws-final-card-red-start:#9c3442;
  --ws-final-card-red-end:#cf5d68;
  --ws-final-card-blue-shadow:rgba(31,79,154,0.26);
  --ws-final-card-red-shadow:rgba(156,52,66,0.26);
  --ws-final-card-ring-blue:rgba(145,188,245,0.52);
  --ws-final-card-ring-red:rgba(247,176,185,0.54);
}

/* [1단계 잠금화면] 최종 운영 카드 색상 */

  border:1px solid rgba(255,255,255,0.24) !important;

    18px 18px 40px rgba(23,58,122,0.30),

@media (hover:hover) and (pointer:fine){

      0 14px 27px rgba(31,79,154,0.32),

  GAS 환경이면 google.script.run, 외부 환경이면 Worker API 호출
========================================================= */
const Api = {
    /* @SUBSECTION: JS_API_TIMEOUT_POLICY
       일반 서버 접수 API는 빠르게 실패를 알려주고, OCR/이미지 계열은 더 긴 시간을 허용합니다. */
    timeoutMs(func){
        const f = String(func || '');
        if (f === 'processReceiptImage') return 90000;
        if (f === 'saveReceiptImageOnly') return 60000;
        if (f === 'saveCartToMasterFile') return 45000;
        if (f === 'queueReturnRequest') return 30000;
        if (f === 'rentNow') return 25000;
        if (f === 'getReceiptImagePreview') return 30000;
        return 30000;
    },
    timeoutError(func, ms){
        return new Error(`${func} 요청이 ${Math.round(ms/1000)}초 안에 완료되지 않았습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.`);
    },
    withTimeout(promise, func){
        const ms = Api.timeoutMs(func);
        let timer = null;
        const timeout = new Promise((_, reject) => {
            timer = setTimeout(() => reject(Api.timeoutError(func, ms)), ms);
        });
        return Promise.race([promise, timeout]).finally(() => { if (timer) clearTimeout(timer); });
    },
    call: async (func, ...args) => {
        if (IS_GAS) {
            return Api.withTimeout(new Promise((resolve, reject) => {
                try {
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[func](...args);
                } catch (e) {
                    reject(e);
                }
            }), func);
        }

        const timeoutMs = Api.timeoutMs(func);
        const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
        let response;
        try {
            response = await fetch(WORKER_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ func, args, apiSecret: API_SHARED_SECRET }),
                signal: controller ? controller.signal : undefined
            });
        } catch (e) {
            if (e && e.name === 'AbortError') throw Api.timeoutError(func, timeoutMs);
            throw e;
        } finally {
            if (timer) clearTimeout(timer);
        }

        const rawText = await response.text();
        let data;
        try {
            data = rawText ? JSON.parse(rawText) : {};
        } catch (e) {
            const snippet = String(rawText || '').replace(/\s+/g, ' ').slice(0, 160);
            throw new Error(`응답을 해석하지 못했습니다. ${snippet ? '응답 일부: ' + snippet : ''}`);
        }
        if (!response.ok || !data.ok) {
            throw new Error(data && data.error ? data.error : `HTTP_${response.status}`);
        }
        return data.result;
    }
};

function triggerKeypadVisualPress(key){
    try{
        let selector = null;
        if (/^[0-9]$/.test(String(key))) selector = `.keypad-btn[data-key="${key}"]`;
        else if (key === 'Backspace') selector = '#keypad-back-btn';
        else if (key === 'Enter') selector = '#keypad-submit-btn';
        else if (key === '+') selector = '#keypad-add-btn';
        if (!selector) return;
        const btn = document.querySelector(selector);
        if (!btn) return;
        btn.classList.remove('pressed');
        void btn.offsetWidth;
        btn.classList.add('pressed');
        clearTimeout(btn._pressedTimer);
        btn._pressedTimer = setTimeout(() => {
            btn.classList.remove('pressed');
        }, 120);
    } catch(e) {}
}

        startInactivityDetection: () => {
            if (!UIManager._inactivityHandler) UIManager._inactivityHandler = () => UIManager.resetInactivityTimer();
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            const events = isTouch
                ? ['touchstart','touchmove','keydown','scroll']
                : ['mousemove','keydown','click','scroll'];
            events.forEach(evt => {
                document.removeEventListener(evt, UIManager._inactivityHandler, {capture:true});
                document.addEventListener(evt, UIManager._inactivityHandler, {passive:true,capture:true});
            });

        /* =========================================================
        @SUBSECTION: JS_UI_MANAGER_LOADER_SEQUENCE
        초기 연결/보안 확인 로더 진행 애니메이션
        ========================================================= */
        async runRandomLoader(chk) {
            const step1Text = '학교 시스템 연결 중...';
            const step2Text = '보안 정보 확인 중...';
            const doneText = '시스템 접속 완료';

            const titleMain = document.getElementById('loader-title-main');
            const titleSub = document.getElementById('loader-title-sub');
            const percentEl = document.getElementById('loader-percent');
            const step1El = document.getElementById('loader-step-1');
            const step2El = document.getElementById('loader-step-2');

            const wait = (ms) => new Promise(r => setTimeout(r, ms));

            let currentStep = 1;
            let currentPercent = 0;

            const stepVisuals = {
                1: {
                    bar: 'linear-gradient(90deg,#3b82f6 0%,#2563eb 100%)',
                    percent: 'linear-gradient(135deg,#2563eb 0%,#3b82f6 100%)'
                },
                2: {
                    bar: 'linear-gradient(90deg,#3b82f6 0%,#6366f1 58%,#7c3aed 100%)',
                    percent: 'linear-gradient(135deg,#2563eb 0%,#7c3aed 100%)'
                },
                3: {
                    bar: 'linear-gradient(90deg,#10b981 0%,#2563eb 100%)',
                    percent: 'linear-gradient(135deg,#10b981 0%,#2563eb 100%)'
                }
            };

            const setStep = (step) => {
                currentStep = step;
                if (step1El && step2El) {
                    step1El.classList.remove('active', 'done');
                    step2El.classList.remove('active', 'done');

                    if (step === 1) {
                        step1El.classList.add('active');
                    } else if (step === 2) {
                        step1El.classList.add('done');
                        step2El.classList.add('active');
                    } else {
                        step1El.classList.add('done');
                        step2El.classList.add('done');
                    }
                }

                const visual = stepVisuals[step] || stepVisuals[1];
                if (elements.loaderBar) elements.loaderBar.style.background = visual.bar;
                if (percentEl) {
                    percentEl.style.background = visual.percent;
                    percentEl.style.webkitBackgroundClip = 'text';
                    percentEl.style.webkitTextFillColor = 'transparent';
                    percentEl.style.backgroundClip = 'text';
                }
            };

            const updateUI = (percent, text) => {
                const safePercent = Math.max(0, Math.min(100, percent));
                if (elements.loaderBar) elements.loaderBar.style.width = `${safePercent}%`;
                if (percentEl) percentEl.textContent = `${Math.round(safePercent)}%`;

                if (currentStep === 1) {
                    if (titleMain) titleMain.textContent = '시스템 연결 중...';
                    if (titleSub) titleSub.textContent = '안전하게 접속을 준비하고 있습니다';
                } else if (currentStep === 2) {
                    if (titleMain) titleMain.textContent = '보안 확인 중...';
                    if (titleSub) titleSub.textContent = '보안 토큰과 사용자 정보를 검증하고 있습니다';
                } else {
                    if (titleMain) titleMain.textContent = '시스템 접속 완료';
                    if (titleSub) titleSub.textContent = '로그인 화면으로 이동합니다';
                }

            };

            if (elements.loaderBar) {
                elements.loaderBar.style.transition = 'width 140ms linear, background 240ms ease';
            }
            if (percentEl) {
                percentEl.style.transition = 'background 240ms ease';
            }

            setStep(1);
            updateUI(0, step1Text);

            while (!(chk && chk())) {
                if (currentPercent < 48) {
                    setStep(1);
                    currentPercent = Math.min(48, currentPercent + 4.0);
                    updateUI(currentPercent, step1Text);
                    await wait(110);
                    continue;
                }

                setStep(2);
                if (currentPercent < 90) {
                    currentPercent = Math.min(90, currentPercent + 2.8);
                    updateUI(currentPercent, step2Text);
                    await wait(110);
                } else {
                    currentPercent = Math.min(97, currentPercent + 0.55);
                    updateUI(currentPercent, step2Text);
                    await wait(170);
                }
            }

            setStep(3);
            if (elements.loaderBar) {
                elements.loaderBar.style.transition = 'width 220ms ease-out, background 240ms ease';
            }
            updateUI(100, doneText);
            await wait(700);
        },
        /* =========================================================
        @SUBSECTION: JS_UI_MANAGER_CONFIRMATION_SCREEN
        완료 화면 표시, 카운트다운, 잠금 화면 자동 복귀
        ========================================================= */
        showConfirmationScreen: (title, detailsHtml) => {
            Utils.haptic([30, 50, 30]);
            document.getElementById('confirmation-title').textContent = title;
            document.getElementById('confirmation-details').innerHTML = detailsHtml;
            UIManager.showScreen('confirmation');
            clearTransitionTimers();

            const totalSec = 5;
            let sec = totalSec;
            const cd = document.getElementById('confirmation-countdown');
            const ringDash = 201;

            const showAppToast = (message) => {
                try {
                    document.querySelectorAll('.app-toast').forEach(el => el.remove());
                    const toast = document.createElement('div');
                    toast.className = 'app-toast';
                    toast.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${Utils.esc(message)}</span>`;
                    document.body.appendChild(toast);
                    requestAnimationFrame(() => toast.classList.add('show'));
                    setTimeout(() => {
                        toast.classList.remove('show');
                        setTimeout(() => toast.remove(), 280);
                    }, 1800);
                } catch (_) {}
            };

            const returnNow = () => {
                clearTransitionTimers();
                if (cd) {
                    cd.innerHTML = '<div class="confirm-timer-caption">첫 화면으로 복귀 중...</div>';
                }
                showAppToast('첫 화면으로 복귀합니다');
                document.getElementById('screen-confirmation').classList.add('is-hiding');
                state.confirmLeaveTimeout2 = setTimeout(() => { state.forceSyncOnNextUnlock = true; UIManager.showLockScreen(); }, 250);
            };

            const renderCountdown = () => {
                const ratio = Math.max(0, Math.min(1, (totalSec - sec) / totalSec));
                const offset = Math.round(ringDash * ratio);
                cd.innerHTML = `
                    <div class="confirm-circular-timer" aria-label="${sec}초 뒤 복귀">
                        <svg viewBox="0 0 74 74" aria-hidden="true">
                            <circle class="confirm-timer-bg" cx="37" cy="37" r="32"></circle>
                            <circle class="confirm-timer-ring" cx="37" cy="37" r="32" style="stroke-dashoffset:${offset}"></circle>
                        </svg>
                        <div class="confirm-timer-text">${sec}</div>
                    </div>
                    <div class="confirm-timer-caption">${sec}초 뒤 첫 화면으로 복귀</div>
                `;
            };

            renderCountdown();
            state.countdownInterval = setInterval(() => {
                sec--;
                if (sec > 0) renderCountdown();
                else returnNow();
            }, 1000);
        }
    };
    /* ===== KEYPAD LOGIC ===== */
    /* Login keypad input, display masking, and security scan flow. */
    /* =========================================================
    @SECTION: JS_KEYPAD_LOGIC
    로그인 키패드, 내선번호 입력, 추가 사용자, 보안 스캔 처리
    3차 기준: KeypadLogic은 사용자 식별까지만 담당하고, 카드신청/반납 업무 흐름은 CardLogic으로 넘깁니다.
    ========================================================= */
    const KeypadLogic = {
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_STATE_FLAGS
        로그인 화면 입력 활성 여부/타이핑 상태 플래그
        ========================================================= */
        isUserActive: () => {
            if (state.currentScreen !== 'login') return false;
            return !!state.loginTyping;
        },
        markTyping: () => { if (state.currentScreen === 'login') state.loginTyping = true; },
        clearTyping: () => { state.loginTyping = false; },
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_INIT_DASHBOARD
        키패드 버튼 생성과 대시보드 숫자 갱신
        ========================================================= */
        initializeKeypad: () => {
            if (state.__keypadInited) return;
            state.__keypadInited = true;
            elements.keypadContainer.innerHTML = '';
            [{v:'1'},{v:'2'},{v:'3'},{v:'4'},{v:'5'},{v:'6'},{v:'7'},{v:'8'},{v:'9'},{v:'add',c:`<i class="fa-solid fa-user-plus"></i>`},{v:'0'},{v:'bs',c:`<i class="fa-solid fa-delete-left"></i>`}]
            .forEach(({v,c}) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'keypad-btn';
                if (v === 'add') {
                    btn.dataset.key = '+';
                    btn.id = 'keypad-add-btn';
                    btn.addEventListener('click', KeypadLogic.handleAddUser);
                } else if (v === 'bs') {
                    btn.dataset.key = 'Backspace';
                    btn.id = 'keypad-back-btn';
                    btn.addEventListener('click', KeypadLogic.processBackspace);
                } else {
                    btn.dataset.key = v;
                    btn.addEventListener('click', () => KeypadLogic.processKeyInput(v));
                }
                btn.innerHTML = `<span class="btn-icon">${c||v}</span>`;
                elements.keypadContainer.appendChild(btn);
            });
            elements.keypadSubmitBtn.addEventListener('click', () => { if (!elements.keypadSubmitBtn.disabled) KeypadLogic.processLogin(); });
            KeypadLogic.updateLoginPreviewAndActions();
        },
        updateDashboard: () => {
            if (!state.allCardData) return;
            /* @PHASE: FINAL_PATCH_RENT_PENDING_DASHBOARD_COUNT
               '신청중'은 사용중 계열이지만 대여가능 카드 수를 0으로 오인하지 않도록
               대여가능은 실제 '사용가능' 상태만 직접 집계하고, 사용중 계열은 별도로 집계합니다. */
            const normalizeCardStatus = (value) => {
                const s = String(value || '').trim().replace(/\s+/g, '');
                if (s === '사용가능' || s === '대여가능' || s === '가능') return '사용가능';
                if (s === '신청중') return '신청중';
                if (s === '사용중' || s === '대여중') return '사용중';
                if (s === '반납처리중') return '반납처리중';
                if (s === '반납오류') return '반납오류';
                return String(value || '').trim();
            };
            const busyStatuses = ['사용중', '신청중', '반납처리중'];
            const available = state.allCardData.filter(c => normalizeCardStatus(c.status) === '사용가능').length;
            const inUse = state.allCardData.filter(c => busyStatuses.includes(normalizeCardStatus(c.status))).length;
            const elAvail = document.getElementById('dash-available');
            const elInuse = document.getElementById('dash-inuse');
            if(elAvail) elAvail.textContent = available;
            if(elInuse) elInuse.textContent = inUse;
        },
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_DIGIT_INPUT
        숫자 표시, 마스킹, 입력/삭제 처리
        ========================================================= */
        updateLoginPreviewAndActions: () => {
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            const hasFullPin = ext.length === 4;
            const hasUsers = Array.isArray(state.enteredUsers) && state.enteredUsers.length > 0;
            const addBtn = document.getElementById('keypad-add-btn');
            const submitBtn = document.getElementById('keypad-submit-btn');
            const preview = document.getElementById('login-user-preview');
            const instruction = document.getElementById('login-instruction');
            const badgeText = document.getElementById('dash-badge-text');
            const badgeIcon = document.getElementById('dash-badge-icon');
            const centerScreen = document.getElementById('dash-center-screen');

            if (addBtn) addBtn.disabled = !hasFullPin;
            if (submitBtn) submitBtn.disabled = !(hasFullPin || hasUsers);

            if (preview) {
                preview.classList.add('hidden');
                preview.textContent = '';
                preview.classList.remove('invalid');
            }

            if (centerScreen) centerScreen.classList.remove('success', 'invalid');
            if (!instruction) return;

            instruction.classList.remove('login-ready', 'login-invalid', 'hidden');

            // 동행자 추가 직후에는 방금 입력한 내선번호만 잠깐 보여주고,
            // 이후에는 중앙 상태창을 다시 현재 입력 대기 상태로 되돌립니다.
            if (state._showAddedFeedback && state._lastAddedExt) {
                instruction.classList.add('login-ready');
                instruction.innerHTML = `<span class="login-added-ext">[${Utils.esc(state._lastAddedExt)}]</span> 추가완료`;
                if (centerScreen) centerScreen.classList.add('success');
                if (badgeText) badgeText.textContent = '추가 성공';
                if (badgeIcon) badgeIcon.className = 'fa-solid fa-user-plus';
                return;
            }

            if (hasFullPin && Array.isArray(state.allUsersData)) {
                const user = state.allUsersData.find(u => String(u.extension) === ext);
                if (user) {
                    instruction.classList.add('login-ready');
                    instruction.innerHTML = '<span class="login-ready-keyword">로그인</span> 준비완료';
                    if (centerScreen) centerScreen.classList.add('success');
                    if (badgeText) badgeText.textContent = '확인 완료';
                    if (badgeIcon) badgeIcon.className = 'fa-solid fa-circle-check';
                } else {
                    instruction.classList.add('login-invalid');
                    instruction.innerHTML = '번호 확인 필요';
                    if (centerScreen) centerScreen.classList.add('invalid');
                    if (badgeText) badgeText.textContent = '조회 실패';
                    if (badgeIcon) badgeIcon.className = 'fa-solid fa-circle-exclamation';
                }
            } else if (ext.length > 0) {
                instruction.textContent = `${ext.length}자리 입력됨`;
                if (badgeText) badgeText.textContent = '입력 중';
                if (badgeIcon) badgeIcon.className = 'fa-solid fa-keyboard';
            } else {
                instruction.textContent = '내선번호 입력';
                if (badgeText) badgeText.textContent = '대기 중';
                if (badgeIcon) badgeIcon.className = 'fa-solid fa-keyboard';
            }
        },
        renderDisplay: () => {
            document.querySelectorAll('#keypadDisplay .digit-wrapper').forEach((wrap, i) => {
                const box = wrap.querySelector('.digit-box');
                if (!box) return;
                const data = state.keypadValues[i];

                // filled / masked 상태만 안전하게 초기화합니다.
                // 다른 레이아웃/애니메이션 클래스가 추가되어도 같이 지워지지 않도록 보호합니다.
                box.classList.remove('filled', 'masked', 'current-active');
                wrap.classList.remove('active-cursor');
                box.textContent = '';

                if (data) {
                    if (data.masked) {
                        box.classList.add('masked');
                    } else {
                        box.classList.add('filled');
                        box.textContent = data.value;
                    }
                }

                if (i === state.activeDigitIndex && state.activeDigitIndex < 4 && !state.keypadValues[i]) {
                    wrap.classList.add('active-cursor');
                    box.classList.add('current-active');
                }
            });
            KeypadLogic.updateLoginPreviewAndActions();
        },
        processKeyInput: (k) => {
            triggerKeypadVisualPress(k);
            Utils.haptic(8);
            if (state.activeDigitIndex > 3) return;
            KeypadLogic.markTyping();
            const idx = state.activeDigitIndex;
            state.keypadValues[idx] = { value: k, masked: false };
            KeypadLogic.renderDisplay();
            if (state.inputTimers[idx]) clearTimeout(state.inputTimers[idx]);
            state.inputTimers[idx] = setTimeout(() => {
                if (state.keypadValues[idx]) {
                    state.keypadValues[idx].masked = true;
                    KeypadLogic.renderDisplay();
                }
            }, 700);
            if (state.activeDigitIndex < 3) state.activeDigitIndex++;
        },
        processBackspace: () => {
            triggerKeypadVisualPress('Backspace');
            Utils.haptic(8);
            KeypadLogic.markTyping();
            const idx = state.activeDigitIndex > 3 ? 3 : (state.keypadValues[state.activeDigitIndex] ? state.activeDigitIndex : state.activeDigitIndex - 1);
            if (idx >= 0) {
                if (state.inputTimers[idx]) clearTimeout(state.inputTimers[idx]);
                state.keypadValues[idx] = null;
                state.activeDigitIndex = idx;
                KeypadLogic.renderDisplay();
            }
            const hasTags = state.enteredUsers && state.enteredUsers.length > 0;
            state.loginTyping = state.keypadValues.some(v => v !== null) || hasTags;
        },
        /* =========================================================
        @SUBSECTION: JS_KEYPAD_USER_CHIPS
        추가 사용자 등록/삭제 및 로그인 사용자 칩 표시
        ========================================================= */
        handleAddUser: () => {
            triggerKeypadVisualPress('+');
            if (document.getElementById('keypad-add-btn')?.disabled) return;
            Utils.haptic(18);
            if (state.enteredUsers.length >= 5) {
                return Swal.fire({
                    toast: true,
                    position: 'top',
                    icon: 'warning',
                    title: '인원 초과',
                    text: '최대 5명(메인1+추가4)까지 설정 가능합니다.',
                    showConfirmButton: false,
                    timer: 2000
                });
            }
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            if (ext.length !== 4) return Swal.fire('알림', '내선번호 4자리를 입력해주세요.', 'warning');
            const user = state.allUsersData.find(u => String(u.extension) === ext);
            if (!user) return Swal.fire('조회 실패', '해당 내선번호를 찾을 수 없습니다.', 'error');
            if (state.enteredUsers.some(u => String(u.extension) === ext)) return Swal.fire('알림', '이미 추가된 사용자입니다.', 'info');
            KeypadLogic.markTyping();
            state.enteredUsers.push({ extension: ext, name: user.name, role: user.role });
            state._lastAddedExt = ext;
            state._showAddedFeedback = true;
            if (state._addedFeedbackTimer) clearTimeout(state._addedFeedbackTimer);
            state.keypadValues = [null, null, null, null];
            state.activeDigitIndex = 0;
            KeypadLogic.renderDisplay();
            KeypadLogic.renderLoginUserTags();
            state._addedFeedbackTimer = setTimeout(() => {
                state._showAddedFeedback = false;
                if (state.currentScreen === 'login') KeypadLogic.updateLoginPreviewAndActions();
            }, 1500);
        },
        renderLoginUserTags: () => {
            const inline = document.getElementById('login-user-inline');
            const panel = document.getElementById('login-user-panel');
            const instruction = document.getElementById('login-instruction');
            const instructionArea = document.getElementById('login-instruction-area');
            const mainBox = document.getElementById('main-user-box');
            if (!inline || !panel || !mainBox) return;

            inline.innerHTML = '';
            mainBox.innerHTML = '';
            inline.classList.remove('hidden');

            if (!state.enteredUsers || state.enteredUsers.length === 0) {
                panel.classList.add('hidden');
                if (instructionArea) instructionArea.classList.remove('has-users');
                if (instruction) {
                    instruction.classList.remove('hidden', 'login-ready', 'login-invalid');
                    instruction.textContent = '내선번호 입력';
                }
                inline.classList.add('hidden');
                KeypadLogic.updateLoginPreviewAndActions();
                return;
            }

            panel.classList.remove('hidden');
            if (instructionArea) instructionArea.classList.add('has-users');
            if (instruction) instruction.classList.remove('hidden');

            const mainUser = state.enteredUsers[0];
            const mainExt = Utils.esc(String(mainUser.extension || ''));
            mainBox.innerHTML = `
                <div class="main-user-info">
                    <span class="main-user-icon"><i class="fa-solid fa-user-shield"></i></span>
                    <span class="main-user-text">
                        <span class="main-user-role">대표 사용자</span>
                        <span class="name"><span class="main-name-highlight">${mainExt}</span><span class="main-name-suffix"> 등록됨</span></span>
                    </span>
                </div>
                <button class="main-reset-btn" id="btn-remove-main" type="button" title="전체 초기화" aria-label="전체 사용자 초기화">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            `;
            const btnRemoveMain = document.getElementById('btn-remove-main');
            if (btnRemoveMain) {
                btnRemoveMain.onclick = (e) => {
                    e.stopPropagation();
                    state.enteredUsers = [];
                    state.keypadValues = [null, null, null, null];
                    state.activeDigitIndex = 0;
                    state._lastAddedExt = null;
                    state._showAddedFeedback = false;
                    if (state._addedFeedbackTimer) clearTimeout(state._addedFeedbackTimer);
                    KeypadLogic.clearTyping();
                    KeypadLogic.renderDisplay();
                    KeypadLogic.renderLoginUserTags();
                };
            }

            const extraUsers = state.enteredUsers.slice(1);
            extraUsers.forEach((u, i) => {
                const chip = document.createElement('div');
                chip.className = 'companion-chip';
                const extLabel = Utils.esc(String(u.extension || ''));
                chip.innerHTML = `
                    <div class="name-wrapper">
                        <span class="name">${extLabel}</span>
                    </div>
                    <button class="companion-remove-btn" type="button" aria-label="내선번호 ${extLabel} 삭제">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                const removeBtn = chip.querySelector('.companion-remove-btn');
                if (removeBtn) {
                    removeBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        Utils.haptic(8);
                        const realIndex = state.enteredUsers.findIndex(x => x.name === u.name && x.extension === u.extension);
                        if (realIndex > -1) {
                            state.enteredUsers.splice(realIndex, 1);
                            KeypadLogic.renderLoginUserTags();
                            KeypadLogic.renderDisplay();
                        }
                    });
                }
                inline.appendChild(chip);
            });
            KeypadLogic.updateLoginPreviewAndActions();
        },
        /* =========================================================
        @SUBSECTION: JS_LOGIN_PROCESS
        내선번호 검증, 사용자 확정, 카드 반납 여부 판단
        ========================================================= */
        async processLogin() {
            if (document.getElementById('keypad-submit-btn')?.disabled) return;
            triggerKeypadVisualPress('Enter');
            Utils.haptic(18);
            const ext = state.keypadValues.map(v => v ? v.value : '').join('');
            UIManager.stopInactivityDetection();
            if (!state.allUsersData) {
                UIManager.setLoading(true, '데이터 로딩 중...');
                await Api.call('getInitialAppData')
                    .then(d => { state.allCardData = d.allCards; state.allUsersData = d.allUsers; })
                    .catch(UIManager.handleServerError);
                UIManager.setLoading(false);
            }
            if (state.enteredUsers.length === 0) {
                if (ext.length !== 4) {
                    elements.keypadDisplay.classList.add('shake');
                    setTimeout(()=>elements.keypadDisplay.classList.remove('shake'), 500);
                    return UIManager.startInactivityDetection();
                }
                const user = state.allUsersData.find(u => String(u.extension) === ext);
                if (!user) {
                    elements.keypadDisplay.classList.add('shake');
                    setTimeout(()=>elements.keypadDisplay.classList.remove('shake'), 500);
                    state.keypadValues = [null,null,null,null];
                    state.activeDigitIndex=0;
                    KeypadLogic.renderDisplay();
                    return UIManager.startInactivityDetection();
                }
                state.enteredUsers.push({ extension: ext, name: user.name, role: user.role });
            }
            Utils.haptic([20, 40, 20]);
            KeypadLogic.clearTyping();
            document.getElementById('main-welcome-message').innerHTML =
                `<i class="fa-solid fa-hand-sparkles"></i> <strong>${state.enteredUsers.map(u=>u.name).join(', ')}</strong> 님 환영합니다`;
            await KeypadLogic.runSecurityScan();
            if (state.syncPromise) {
                UIManager.setLoading(true, '최신 카드 상태 확인 중...', 'receipt');
                try { await state.syncPromise; } catch(e) {}
                UIManager.setLoading(false);
                state.syncPromise = null;
            }
            const mainUser = state.enteredUsers[0].name;
            const cardToReturn = state.allCardData.find(c => c.status === "사용중" && c.userInfo && c.userInfo.userName.includes(mainUser));
            if (cardToReturn) {
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                await new Promise(r => setTimeout(r, 250));
                CardLogic.setupAndShowReturnScreen(cardToReturn);
                UIManager.showScreen('returnDetails');
            }
            state.keypadValues = [null,null,null,null];
            state.activeDigitIndex = 0;
            KeypadLogic.renderDisplay();
            UIManager.startInactivityDetection();
        },
        /* =========================================================
        @SUBSECTION: JS_LOGIN_SECURITY_SCAN
        로그인 성공 후 신원 확인 애니메이션
        ========================================================= */
        runSecurityScan: () => new Promise(resolve => {
            const overlay = document.getElementById('security-scan-overlay');
            const box = document.getElementById('scan-box');
            const icon = document.getElementById('scan-icon');
            const text = document.getElementById('scan-text');
            box.classList.remove('success', 'scanning');
            overlay.classList.remove('exit');
            icon.className = 'fa-solid fa-user scan-icon';
            text.textContent = '신원 확인 중...';
            text.style.color = 'var(--text-primary)';
            text.classList.remove('fade-out');
            text.classList.add('fade-in');
            overlay.classList.add('active');
            void box.offsetWidth;
            box.classList.add('scanning');
            setTimeout(() => {
                box.classList.remove('scanning');
                box.classList.add('success');
                icon.className = 'fa-solid fa-check scan-icon';
                text.classList.remove('fade-in');
                text.classList.add('fade-out');
                setTimeout(() => {
                    text.textContent = '신원 확인 완료!';
                    text.style.color = 'var(--primary-color)';
                    text.classList.remove('fade-out');
                    text.classList.add('fade-in');
                }, 180);
                setTimeout(() => {
                    overlay.classList.add('exit');
                    document.querySelector('.content-wrapper').style.display = 'flex';
                    CardLogic.displayCardList();
                    UIManager.showScreen('main');
                    setTimeout(() => {
                        overlay.classList.remove('active', 'exit');
                        resolve();
                    }, 450);
                }, 800);
            }, 1150);
        })
    };
    /* =========================================================
    @SECTION: JS_EMBED_BRIDGE
    외부 embed/iframe 환경과 통신할 때 사용하는 bridge
    ========================================================= */
    const EmbedBridge = {
        notify(type, payload = {}) {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'WS_CARD', type, ...payload }, '*');
                }
            } catch (e) {}
        }
    };
    /* =========================================================
    @SECTION: JS_MODULE_4_CARD_LOGIC
    카드 목록, 대여/반납, 영수증 OCR, 장바구니, 제출 흐름을 담당
    ========================================================= */
    /* =========================================================
    @SECTION: JS_CARD_LOGIC
    카드 목록, 대여/반납, 영수증 OCR, 장바구니 저장 흐름
    ========================================================= */
    const CardLogic = {
        /* =========================================================
        @SUBSECTION: JS_CARD_VISIBILITY_TEMPLATES
        카드 표시 조건과 카드/목적/영수증 HTML 템플릿
        ========================================================= */
        isCardVisibleToCurrentUsers: (card) => {
            const allowedUsers = Array.isArray(card?.allowedUsers)
                ? card.allowedUsers
                : (card?.visibleTo ? [card.visibleTo] : null);
            if (!allowedUsers || allowedUsers.length === 0) return true;
            const currentNames = state.enteredUsers.map(u => u.name);
            return allowedUsers.some(name => currentNames.includes(name));
        },
        renderCardButtonHTML: (card) => {
            const rawStatus = String(card.status || '').trim();
            const compactStatus = rawStatus.replace(/\s+/g, '');
            const status = (compactStatus === '대여가능' || compactStatus === '사용가능' || compactStatus === '가능') ? '사용가능'
                : (compactStatus === '대여중' ? '사용중' : rawStatus);
            const isAvailable = status === '사용가능';
            const isRentPending = status === '신청중';
            const isInUse = status === '사용중';
            const isReturning = status === '반납처리중';
            const isReturnError = status === '반납오류';
            const statusLabel = isAvailable ? '신청 가능' : (isRentPending ? '신청중' : (isInUse ? '사용중' : (isReturning ? '반납 처리중' : (isReturnError ? '반납 오류' : (status || '상태 확인')))));
            const rawDate = card.userInfo && card.userInfo.receiveDate ? String(card.userInfo.receiveDate) : '';
            const borrowDate = rawDate ? rawDate.slice(5, 10).replace('-', '/') : '';
            const dateHTML = ((isInUse || isRentPending) && borrowDate)
                ? `<span class="card-borrow-date">대여일 ${Utils.esc(borrowDate)}</span>`
                : '';
            const badgeHTML = (isInUse || isRentPending)
                ? `<span class="status-badge hybrid-status-badge inuse-only-badge">${isRentPending ? '신청중' : '사용중'}</span>`
                : (isReturnError ? `<span class="status-badge hybrid-status-badge inuse-only-badge">반납오류</span>` : '');

            return `
            <div class="card-grid-btn hybrid-card-btn" aria-label="${Utils.esc(card.displayName)} ${Utils.esc(statusLabel)}">
                <div class="hybrid-card-topline">
                    <span class="hybrid-card-chip"></span>
                    <span class="hybrid-card-state-dot"></span>
                </div>
                <div class="hybrid-card-texts">
                    <span class="card-name">${Utils.esc(card.displayName)}</span>
                    ${dateHTML}
                </div>
            </div>
            ${badgeHTML}
        `;
        },
        /* =========================================================
        @SUBSECTION: JS_CARD_REQUEST_DOMAIN
        4단계 카드신청 도메인. 카드 목록 렌더링, 목적 선택, 최종 신청 버튼, rentNow 호출 흐름을 담당합니다.
        주의: 목적 버튼 클릭만으로 대여하지 않고, 최종 신청 버튼에서만 실제 대여 처리합니다.
        ========================================================= */
        renderPurposeButtonHTML: (btn) => `
            <button class="purpose-btn" type="button" data-purpose="${Utils.esc(btn.id)}" aria-label="${Utils.esc(btn.label)} ${Utils.esc(btn.desc || '')}">
                <span class="purpose-icon-wrap"><i class="fa-solid ${btn.icon}"></i></span>
                <span class="purpose-text-wrap">
                    <span class="purpose-title">${Utils.esc(btn.label)}</span>
                    <span class="purpose-desc">${Utils.esc(btn.desc || '')}</span>
                </span>
                <span class="purpose-chevron" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
            </button>
        `,
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_DOMAIN_CART
        영수증 장바구니 도메인 시작. 아래 OCR/파일/팝업/자동저장/삭제 흐름은 모두 대표 영수증 기준입니다.
        @SUBSECTION: JS_RECEIPT_CART_RENDERING
        영수증 장바구니 아이템 HTML과 상태 오버레이 렌더링
        ========================================================= */
        // 변경 부분: 오버레이 로직 전면 개편 (분석중, 저장중, 저장완료를 부드럽게 연결)
        renderReceiptCartItemHTML: (it, i, isMeal) => {
            /* @PHASE: FINAL_PATCH_RECEIPT_ITEM_STAGE_UI - 상단 진행바 대신 카드 내부 단계 표시 */
            const processing = String(it.processing || '');
            const needDetails = (!isMeal) && !(String(it.usageDetails || '').trim());
            const isAnalysisPhase = ['queued', 'optimizing', 'ocr', 'postprocessing'].includes(processing);
            const isSaving = processing === 'saving';
            const isSaved = processing === 'saved';
            const isReview = processing === 'review' || !!it.needsManualReview;
            const isProcessing = isAnalysisPhase || isSaving || processing === 'deleting';
            const showOverlay = isAnalysisPhase || isSaving || isSaved;
            const needWarn = needDetails || isReview || processing === 'save_error';
            const cls = [
                isProcessing ? 'processing' : '',
                isAnalysisPhase ? 'analysis-phase' : '',
                isSaving ? 'saving' : '',
                showOverlay ? 'overlay-phase' : '',
                isSaved ? 'saved' : '',
                isReview ? 'needs-review' : '',
                needWarn ? 'needs-details' : ''
            ].filter(Boolean).join(' ');

            let overlayTitle = CardLogic.getReceiptProcessingLabel(processing);
            if (isSaved) overlayTitle = '저장완료';

            const displayAmount = (it.amount === '' || it.amount == null) ? '' : `${Utils.nfKR.format(Number(it.amount || 0))}원`;

            if (processing === 'error') {
                return `<div class="cart-item needs-details needs-review operational-blocked" data-index="${i}">
                     <div class="cart-item-icon" style="color:var(--danger-color);"><i class="fa-solid fa-triangle-exclamation"></i></div>
                     <div class="cart-item-info">
                        <span class="cart-item-place" style="color:var(--danger-color);">분석실패</span>
                        <span class="cart-item-details">터치해서 직접 입력하거나 삭제 후 다시 첨부하세요 <span class="review-pointer"><i class="fa-solid fa-hand-pointer"></i></span></span>
                     </div>
                     <div class="cart-item-amount-box"></div>
                     <button class="cart-item-delete-wide" type="button">삭제</button>
                </div>`;
            }

            if (showOverlay) {
                let iconHTML = `<div class="breathing-dot" aria-hidden="true"></div>`;
                if (isSaved) iconHTML = `<div class="saved-check-mark"><i class="fa-solid fa-check"></i></div>`;

                const bgPlace = (isSaving || isSaved) ? (Utils.esc(it.usagePlace) || '상호명 없음') : '';
                const bgDetails = (isSaving || isSaved) ? (Utils.esc(it.usageDetails) || '') : '';
                const bgAmount = (isSaving || isSaved) ? displayAmount : '';

                return `<div class="cart-item ${cls}" data-index="${i}" data-processing-text="${Utils.esc(CardLogic.getReceiptProcessingLabel(processing))}">
                    <div class="cart-item-icon">
                        ${isAnalysisPhase ? `<div class="mini-scanner"><div class="mini-paper"></div><div class="mini-beam"></div></div>` : `<i class="fa-solid ${Utils.getSmartIcon(it.usagePlace, it.usageDetails)}"></i>`}
                    </div>
                    <div class="cart-item-info">
                        <span class="cart-item-place">${bgPlace}</span>
                        <span class="cart-item-details">${bgDetails}</span>
                    </div>
                    <div class="cart-item-amount-box"><span class="cart-item-amount">${bgAmount}</span></div>
                    <div class="processing-overlay">
                        ${iconHTML}
                        <span class="processing-title">${Utils.esc(overlayTitle)}</span>
                    </div>
                </div>`;
            }

            const placeText = processing === 'save_error'
                ? '저장실패'
                : (isReview ? '확인필요' : (Utils.esc(it.usagePlace) || '상호명 없음'));
            const detailText = processing === 'save_error'
                ? '터치하여 다시 저장하거나 삭제 후 다시 첨부하세요'
                : (isReview
                    ? '사용처/금액/내용을 확인한 뒤 저장해 주세요'
                    : (Utils.esc(it.usageDetails) || '내역 없음'));

            return `<div class="cart-item with-inline-actions ${cls}" data-index="${i}" ${processing?`data-processing-text="${Utils.esc(CardLogic.getReceiptProcessingLabel(processing))}"`:''}>
                <div class="cart-item-icon">
                    ${needWarn ? `<i class="fa-solid fa-triangle-exclamation"></i>` : `<i class="fa-solid ${Utils.getSmartIcon(it.usagePlace, it.usageDetails)}"></i>`}
                </div>
                <div class="cart-item-info">
                    <span class="cart-item-place">${placeText}</span>
                    <span class="cart-item-details">${detailText}${needWarn ? ` <span class="review-pointer"><i class="fa-solid fa-hand-pointer"></i></span>` : ''}</span>
                </div>
                <div class="cart-item-amount-box"><span class="cart-item-amount">${displayAmount}</span></div>
                ${!isProcessing?`<button class="cart-item-delete-wide" type="button" aria-label="영수증 삭제">삭제</button>`:''}
            </div>`;
        },
        requestRenderReceiptCart: () => {
            if (state._renderReceiptScheduled) return;
            state._renderReceiptScheduled = true;
            requestAnimationFrame(() => {
                state._renderReceiptScheduled = false;
                CardLogic.renderReceiptCart();
            });
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_CART_AUTOSAVE
        영수증 장바구니 저장을 debounce 처리하고 저장 완료 표시
        ========================================================= */
        queueSaveCart: (backupCart = null) => new Promise((resolve, reject) => {
            /* @PHASE: JS_RECEIPT_AUTOSAVE_COLLECT_PENDING - 빠르게 들어오는 저장 요청을 debounce 큐로 묶음 */
            const token = ++state.cartSaveToken;
            state.cartSavePending = state.cartSavePending || [];
            state.cartSavePending.push({ resolve, reject, backupCart, token });

            if (state.cartSaveTimer) clearTimeout(state.cartSaveTimer);
            state.cartSaveTimer = setTimeout(async () => {
                const pending = state.cartSavePending || [];
                state.cartSavePending = [];
                state.cartSaveTimer = null;

                try {
                    const hasUnpersistedReceiptImage = state.receiptCart.some(it => {
                        const img = String((it && it.receiptImage) || '');
                        return !!(img && !img.startsWith('id:'));
                    });
                    if (hasUnpersistedReceiptImage) {
                        throw new Error('RECEIPT_IMAGE_NOT_PERSISTED');
                    }

                    /* @PHASE: JS_RECEIPT_AUTOSAVE_SERVER_CALL - 현재 장바구니를 master 파일에 저장 */
                    const saveRes = await Api.call('saveCartToMasterFile', {
                        cardId: state.currentReturnCard.id,
                        cartData: Utils.sanitizeReceiptCart(state.receiptCart)
                    });
                    /* @PHASE: FINAL_PATCH_RECEIPT_SAVE_CONFIRM
                       서버 응답이 진짜 성공인지 확인해 화면의 저장완료 오인을 막습니다. */
                    if (!saveRes || saveRes.status !== 'success') {
                        const msg = saveRes && (saveRes.message || saveRes.error) ? (saveRes.message || saveRes.error) : 'RECEIPT_CART_SAVE_NOT_CONFIRMED';
                        throw new Error(msg);
                    }

                    /* @PHASE: FINAL_PATCH_RECEIPT_SAVE_LOCAL_CACHE_SYNC
                     * 서버 저장 성공이 확인되면 현재 카드 객체에도 savedCart를 즉시 반영합니다.
                     * 이전 버전은 서버에는 저장됐어도 화면에서 첫 화면으로 나갔다가 다시 들어오면
                     * card.savedCart가 예전 값이라 영수증이 없는 것처럼 보일 수 있었습니다.
                     */
                    const confirmedCart = Utils.sanitizeReceiptCart(state.receiptCart);
                    if (state.currentReturnCard) {
                        state.currentReturnCard.savedCart = confirmedCart;
                    }
                    if (Array.isArray(state.allCardData) && state.currentReturnCard) {
                        const targetCard = state.allCardData.find(c => c && c.id === state.currentReturnCard.id);
                        if (targetCard) targetCard.savedCart = confirmedCart;
                    }

                    /* @PHASE: JS_RECEIPT_AUTOSAVE_SUCCESS_MARK - saving 상태를 saved로 잠깐 표시 후 정리 */
                    state.receiptCart.forEach((it, idx) => {
                        if (it && it.processing === 'saving') {
                            it.processing = 'saved';
                            setTimeout(() => {
                                const cur = state.receiptCart[idx];
                                if (cur && cur.processing === 'saved') {
                                    delete cur.processing;
                                    delete cur._uiTransient;
                                    const refreshedCart = Utils.sanitizeReceiptCart(state.receiptCart);
                                    if (state.currentReturnCard) state.currentReturnCard.savedCart = refreshedCart;
                                    if (Array.isArray(state.allCardData) && state.currentReturnCard) {
                                        const targetCard = state.allCardData.find(c => c && c.id === state.currentReturnCard.id);
                                        if (targetCard) targetCard.savedCart = refreshedCart;
                                    }
                                    CardLogic.requestRenderReceiptCart();
                                }
                            }, 850);
                        }
                    });
                    CardLogic.requestRenderReceiptCart();
                    pending.forEach(p => p.resolve(true));
                } catch (e) {
                    /* @PHASE: JS_RECEIPT_AUTOSAVE_ROLLBACK - 실패 시 전달받은 backupCart로 복구 */
                    const rollback = [...pending].reverse().find(p => p.backupCart);
                    if (rollback && rollback.backupCart) {
                        state.receiptCart = rollback.backupCart;
                        CardLogic.requestRenderReceiptCart();
                    }
                    pending.forEach(p => p.reject(e));
                }
            }, 220);
        }),
        startReviewMode: (startIdx, count) => {
            try {
                const isMeal = !!(state.currentReturnCard && state.currentReturnCard.userInfo && String(state.currentReturnCard.userInfo.purpose||'').includes('특근'));
                const q = [];
                for (let i = 0; i < count; i++) {
                    const idx = startIdx + i;
                    const it = state.receiptCart[idx];
                    if (!it || it.processing === 'error') continue;
                    if (!isMeal && !String(it.usageDetails||'').trim()) q.push(idx);
                }
                state.reviewQueue = q;
            } catch(e) {}
        },
        continueReviewIfNeeded: (savedIdx) => {
            try {
                if (!state.reviewQueue || !state.reviewQueue.length) return;
                if (state.reviewQueue[0] !== savedIdx) return;
                state.reviewQueue.shift();
                if (state.reviewQueue.length) {
                    const nextIdx = state.reviewQueue[0];
                    try{
                        if (window.Swal) {
                            Swal.fire({
                                title: '다음 영수증 준비중',
                                text: '',
                                showConfirmButton: false,
                                allowOutsideClick: false,
                                allowEscapeKey: false,
                                backdrop: true,
                                didOpen: () => { try { Swal.showLoading(); } catch(e){} }
                            });
                        }
                    } catch(e) {}
                    setTimeout(() => { try{ if(window.Swal) Swal.close(); }catch(e){}; CardLogic.openOcrPopup(state.receiptCart[nextIdx], nextIdx); }, 650);
                }
            } catch(e) {}
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_OCR_HELPERS
        OCR 결과 검증, 처리 상태 라벨, 사용자 안내 toast
        ========================================================= */
        isReceiptAnalysisFailed: (ocr) => {
            if (!ocr || ocr.ok === false) return true;
            const place = String(ocr.storeName || '').trim();
            const amount = String(ocr.amount || '').replace(/[^\d]/g, '').trim();

            // 금액은 필수입니다. 상호명이 비면 제출 데이터 품질이 떨어져서 직접 확인 대상으로 둡니다.
            return !place || !amount;
        },
        // 변경 부분: getReceiptProcessingLabel 처리 상태 추가 매핑
        getReceiptProcessingLabel: (processing) => {
            switch (processing) {
                case 'queued': return '분석 대기중';
                case 'optimizing': return '이미지 준비중';
                case 'ocr': return '분석중';
                case 'postprocessing': return '분석 완료';
                case 'saving': return '저장중';
                case 'saved': return '저장완료';
                case 'review': return '확인필요';
                case 'deleting': return '삭제중';
                case 'save_error': return '저장실패';
                case 'error': return '분석실패';
                default: return '처리중';
            }
        },
        showMealAutoAdjustToast: (originalAmount, adjustedAmount) => {
            // 자동 금액 보정 안내 모달/토스트 비활성화
            // 화면 깨짐과 반쪽 흐림 현상을 막기 위해 사용자에게 알림을 띄우지 않습니다.
            // 금액 보정 로직 자체는 기존대로 실행되고, 최종 보정된 금액만 화면/장바구니에 반영됩니다.
            const from = String(originalAmount || '').replace(/[^\d]/g, '');
            const to = String(adjustedAmount || '').replace(/[^\d]/g, '');

                console.info(
                    `특근매식 금액 자동 조정: OCR ${Utils.nfKR.format(Number(from))}원 -> ${Utils.nfKR.format(Number(to))}원`

        },
        showReceiptAnalysisFallback: (isReplacement = false) => {

                    confirmButtonColor: '#007aff'
                });
            } catch (e) {}
        },
        /* =========================================================
        @SUBSECTION: JS_RECEIPT_UPLOAD_ENTRY
        영수증 파일 선택창 열기와 upload picker 상태 전달
        ========================================================= */
        triggerImageSelection: async (editIndex = -1) => {

                    });
