    function bindMainActionHandlers() {
        elements.glassCardContainer.addEventListener('click', handleLockScreenClick);
        elements.btnBack.addEventListener('click', UIManager.resetToLogin);
        document.addEventListener('click', (e) => {
            const cardEl = e.target.closest('.card-item-wrapper[data-card-id]');
            if (cardEl && elements.cardGrid.contains(cardEl)) {
                const card = state.allCardData?.find(c => c.id === cardEl.dataset.cardId);
                if (card && ['사용가능','대여가능','사용 가능','대여 가능'].includes(String(card.status || '').trim())) {
                    
                    CardLogic.openPurposeFlight(card, cardEl);
                    return;
                }
            }

            const purposeBtn = e.target.closest('.purpose-btn[data-purpose]');
            const morphActions = document.getElementById('morph-actions');
            if (purposeBtn && morphActions && morphActions.contains(purposeBtn)) {
                const overlay = document.getElementById('morph-overlay');
                const cardId = overlay?.dataset.cardId;
                if (cardId) {
                    CardLogic.selectPurposeForConfirmation(purposeBtn.dataset.purpose, purposeBtn);
                    return;
                }
            }

            const finalRentBtn = e.target.closest('#btn-final-rent');
            if (finalRentBtn) {
                CardLogic.executeSelectedPurposeRent();
                return;
            }

            const cartDeleteBtn = e.target.closest('.cart-item-delete, .cart-item-delete-wide');
            if (cartDeleteBtn) {
                const cartItem = cartDeleteBtn.closest('.cart-item[data-index]');
                const cartContainer = document.getElementById('receipt-cart-container');
                if (cartItem && cartContainer && cartContainer.contains(cartItem)) {
                    const prim = state.currentReturnCard?.userInfo?.userName?.split(',')[0]?.trim();
                    if (!prim || state.enteredUsers[0]?.name !== prim) return;
                    e.stopPropagation();
                    CardLogic.deleteCartItem(cartItem.dataset.index);
                    return;
                }
            }

            const cartItem = e.target.closest('.cart-item[data-index]');
            const cartContainer = document.getElementById('receipt-cart-container');
            if (cartItem && cartContainer && cartContainer.contains(cartItem)) {
                const prim = state.currentReturnCard?.userInfo?.userName?.split(',')[0]?.trim();
                if (!prim || state.enteredUsers[0]?.name !== prim) return;
                if (cartItem.classList.contains('processing')) return;
                const idx = Number(cartItem.dataset.index);
                if (Number.isInteger(idx) && state.receiptCart[idx]) {
                    CardLogic.openOcrPopup(state.receiptCart[idx], idx);
                }
            }
        });
    }

    function bindKeyboardShortcuts() {
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (Swal.isVisible()) { Swal.close(); return; }
                const overlay = document.getElementById('morph-overlay');
                if (overlay && overlay.classList.contains('active')) { e.preventDefault(); CardLogic.closeMorphOverlay(); return; }
                switch(state.currentScreen) {
                    case 'returnDetails': UIManager.showScreen('main'); break;
                    case 'main': UIManager.resetToLogin(); break;
                    case 'login': UIManager.showLockScreen(); break;
                }
                return;
            }
            if (Swal.isVisible() || state.currentScreen !== 'login') return;
            if (e.key >= '0' && e.key <= '9') KeypadLogic.processKeyInput(e.key);
            else if (e.key === 'Enter') { e.preventDefault(); if (!elements.keypadSubmitBtn.disabled) KeypadLogic.processLogin(); }
            else if (e.key === '+') { e.preventDefault(); KeypadLogic.handleAddUser(); }
            else if (e.key === 'Backspace') { e.preventDefault(); KeypadLogic.processBackspace(); }
        });
    }

    function bindBeforeUnloadGuard() {
        window.addEventListener('beforeunload', (e) => {
            const unsafeStates = ['queued', 'optimizing', 'ocr', 'postprocessing', 'saving', 'save_error'];
            const hasUnsavedReceiptWork = Array.isArray(state.receiptCart) &&
                state.receiptCart.some(it => it && unsafeStates.includes(it.processing));

            if (hasUnsavedReceiptWork || state.syncInFlight) {
                e.preventDefault();
                return '';
            }
        });
    }

    function bindLockCardTilt() {
        const cont = elements.glassCardContainer;
        const card = document.getElementById('glass-card');
        if(cont && card) {
            let rect;
            const cache = () => rect = cont.getBoundingClientRect();
            window.addEventListener('resize', cache);
            cont.addEventListener('pointerenter', cache);
            const onMove = e => {
                if (!state.cardTiltActive || !rect || state.currentScreen !== 'lock') return;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                card.style.transform = `rotateX(${((cy-rect.top)/rect.height-.5)*-10}deg) rotateY(${((cx-rect.left)/rect.width-.5)*10}deg)`;
            };
            document.body.addEventListener('mousemove', onMove);
            document.body.addEventListener('touchmove', onMove);
            cont.addEventListener('pointerleave', () => { if(state.cardTiltActive) card.style.transform = 'rotateX(0) rotateY(0)'; });
            cache();
        }
    }

    // 기존 click 핸들러와 시각 효과를 중복 실행시킬 수 있어 비활성화합니다.

  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initFastTouch, { once: true });
  } else {
    initFastTouch();
  }
})();
</script>

<script id="ws-v152-office-tablet-detector">
(function() {
  function syncOfficeTabletClass() {
    try {
      var viewport = window.visualViewport;
      var w = Math.round((viewport && viewport.width) || window.innerWidth || document.documentElement.clientWidth || 0);
      var h = Math.round((viewport && viewport.height) || window.innerHeight || document.documentElement.clientHeight || 0);
      var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0 || (navigator.msMaxTouchPoints || 0) > 0;
      var isPortrait = h >= w;
      var looksLikeOfficeTablet = hasTouch && isPortrait && w >= 600 && w <= 1400 && h >= 650;
      document.body.classList.toggle('office-tablet-portrait', !!looksLikeOfficeTablet);
    } catch (e) {}
  }
  syncOfficeTabletClass();
  window.addEventListener('resize', syncOfficeTabletClass, { passive: true });
  window.addEventListener('orientationchange', syncOfficeTabletClass, { passive: true });
  document.addEventListener('visibilitychange', syncOfficeTabletClass, { passive: true });
})();
</script>
















<script id="ws-tablet-bottom-action-dock-controller">
(function() {
  var body = document.body;
  var dock = document.getElementById('tablet-bottom-action-dock');
  var homeProxy = document.getElementById('tablet-home-action');
  var submitProxy = document.getElementById('tablet-return-action');
  if (!body || !dock || !homeProxy || !submitProxy) return;

  var syncQueued = false;

  function getOriginalSubmit() {
    return document.querySelector('#screen-return-details #submit-cart-btn');
  }

  function syncDock() {
    syncQueued = false;
    var screen = body.getAttribute('data-current-screen') || '';
    var isTablet = body.classList.contains('office-tablet-portrait');
    var dockActive = isTablet && (screen === 'main' || screen === 'returnDetails');
    var submitActive = dockActive && screen === 'returnDetails';
    var originalSubmit = getOriginalSubmit();

    dock.setAttribute('aria-hidden', dockActive ? 'false' : 'true');
    homeProxy.tabIndex = dockActive ? 0 : -1;
    submitProxy.tabIndex = submitActive ? 0 : -1;

    if (originalSubmit) {
      var nextHtml = originalSubmit.innerHTML || '<i class="fa-solid fa-check" aria-hidden="true"></i><span>반납 및 제출</span>';
      if (submitProxy.innerHTML !== nextHtml) submitProxy.innerHTML = nextHtml;
      if (submitProxy.disabled !== !!originalSubmit.disabled) submitProxy.disabled = !!originalSubmit.disabled;
      var label = (originalSubmit.textContent || '반납 및 제출').trim();
      if (submitProxy.getAttribute('aria-label') !== label) submitProxy.setAttribute('aria-label', label);
      submitProxy.hidden = false;
    } else {
      submitProxy.disabled = true;
      submitProxy.hidden = true;
    }
  }

  function queueSync() {
    if (syncQueued) return;
    syncQueued = true;
    requestAnimationFrame(syncDock);
  }

  homeProxy.addEventListener('click', function() {
    var originalHome = document.getElementById('btn-back');
    if (originalHome) originalHome.click();
  });

  submitProxy.addEventListener('click', function() {
    var originalSubmit = getOriginalSubmit();
    if (originalSubmit && !originalSubmit.disabled) originalSubmit.click();
  });

  var bodyObserver = new MutationObserver(queueSync);
  bodyObserver.observe(body, {
    attributes: true,
    attributeFilter: ['class', 'data-current-screen']
  });

  var returnRoot = document.getElementById('screen-return-details');
  if (returnRoot) {
    var returnObserver = new MutationObserver(queueSync);
    returnObserver.observe(returnRoot, {
      attributes: true,
      attributeFilter: ['disabled'],
      childList: true,
      characterData: true,
      subtree: true
    });
  }

  window.addEventListener('resize', queueSync, { passive: true });
  window.addEventListener('orientationchange', queueSync, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', queueSync, { passive: true });
  }
  document.addEventListener('visibilitychange', queueSync, { passive: true });
  queueSync();
})();
</script>

<style id="ws-auto-fit-style">
/* =========================================================
   [2026-08 추가] 화면 세로 자동 맞춤 (ws-auto-fit)
   - PC / 노트북처럼 세로 높이가 제각각인 환경에서
     UI 전체를 같은 비율로 축소/확대해 항상 한 화면에 꽉 차게 만듭니다.
   - 레이아웃 구조는 전혀 건드리지 않고 배율만 바꾸므로
     어느 해상도에서든 보이는 모양이 동일합니다.
   - 고정 오버레이(잠금화면/로딩/영수증 시트/파동/토스트/하단독)는
     모두 .content-wrapper 바깥에 있어 배율의 영향을 받지 않습니다.
   ========================================================= */
body.ws-auto-fit .content-wrapper {
  height: 100dvh;
  min-height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
}

body.ws-auto-fit .container {
  transform: scale(var(--ws-fit-scale, 1));
  transform-origin: center center;
}

/* 배율 계산이 끝나기 전 한 프레임 깜빡임 방지 */
body.ws-auto-fit:not(.ws-auto-fit-ready) .container {
  visibility: hidden;
}
</style>

<script id="ws-auto-fit-controller">
/* =========================================================
   화면 세로 자동 맞춤 컨트롤러
   - 세로가 남으면 키우고, 모자라면 줄여서 스크롤이 생기지 않게 합니다.
   - 마우스를 쓰는 PC/노트북에서만 동작합니다. (태블릿 터치 환경은 기존 그대로)
   - 주소 뒤에 ?nofit=1 을 붙이면 이 기능을 끌 수 있습니다.
   ========================================================= */
(function () {
  'use strict';

  var MIN_SCALE = 0.55;   // 이보다 더 줄이지 않음 (너무 작아지면 가독성 문제)
  var MAX_SCALE = 1.60;   // 이보다 더 키우지 않음
  var SAFE_GAP  = 12;     // 위아래 최소 여백(px)

  function isDisabled() {
    try {
      if (location.search.indexOf('nofit=1') >= 0) return true;
    } catch (e) {}
    return false;
  }

  function isDesktopLike() {
    try {
      // 마우스/트랙패드 환경이면서 화면이 충분히 넓을 때만 적용
      var finePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
      var wideEnough = window.innerWidth >= 1024;
      var isOfficeTablet = document.body.classList.contains('office-tablet-portrait');
      return !!finePointer && wideEnough && !isOfficeTablet;
    } catch (e) {
      return false;
    }
  }

  var wrapper = null;
  var container = null;
  var rafId = 0;
  var enabled = false;

  function resolveNodes() {
    if (!wrapper) wrapper = document.querySelector('.content-wrapper');
    if (!container && wrapper) container = wrapper.querySelector('.container');
    return !!(wrapper && container);
  }

  function applyScale() {
    rafId = 0;
    if (!enabled || !resolveNodes()) return;

    // offsetHeight / offsetWidth 는 레이아웃 기준값이라 transform 배율의 영향을 받지 않습니다.
    var naturalH = container.offsetHeight;
    var naturalW = container.offsetWidth;
    if (!naturalH || !naturalW) return;

    var availH = (window.innerHeight || document.documentElement.clientHeight) - SAFE_GAP * 2;
    var availW = wrapper.clientWidth || window.innerWidth;
    if (availH <= 0 || availW <= 0) return;

    var scale = Math.min(availH / naturalH, availW / naturalW);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));

    var rounded = Math.round(scale * 1000) / 1000;
    var current = parseFloat(document.body.style.getPropertyValue('--ws-fit-scale')) || 0;
    if (Math.abs(current - rounded) > 0.002) {
      document.body.style.setProperty('--ws-fit-scale', String(rounded));
    }

    if (!document.body.classList.contains('ws-auto-fit-ready')) {
      document.body.classList.add('ws-auto-fit-ready');
    }
  }

  function schedule() {
    if (!enabled) return;
    if (rafId) return;
    rafId = window.requestAnimationFrame(applyScale);
  }

  function enable() {
    if (enabled) return;
    if (!resolveNodes()) return;
    enabled = true;
    document.body.classList.add('ws-auto-fit');
    schedule();
  }

  function disable() {
    if (!enabled) return;
    enabled = false;
    document.body.classList.remove('ws-auto-fit', 'ws-auto-fit-ready');
    document.body.style.removeProperty('--ws-fit-scale');
  }

  function refreshMode() {
    if (isDisabled()) { disable(); return; }
    if (isDesktopLike()) { enable(); schedule(); }
    else { disable(); }
  }

  function init() {
    if (!resolveNodes()) {
      window.setTimeout(init, 120);
      return;
    }

    refreshMode();

    window.addEventListener('resize', function () { refreshMode(); schedule(); }, { passive: true });
    window.addEventListener('orientationchange', function () { refreshMode(); schedule(); }, { passive: true });

    // 화면 전환 / 완료 모드 전환 등 body 상태가 바뀔 때마다 다시 계산
    try {
      new MutationObserver(function () { refreshMode(); schedule(); })
        .observe(document.body, { attributes: true, attributeFilter: ['class', 'data-current-screen'] });
    } catch (e) {}

    // 내용물 자체가 늘거나 줄 때(목록 렌더링 등) 다시 계산
    try {
      if (window.ResizeObserver) {
        new ResizeObserver(function () { schedule(); }).observe(container);
      }
    } catch (e) {}

    // 웹폰트가 늦게 적용되면 높이가 변하므로 한 번 더
    try {
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { schedule(); });
      }
    } catch (e) {}

    window.setTimeout(schedule, 400);
    window.setTimeout(schedule, 1200);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
