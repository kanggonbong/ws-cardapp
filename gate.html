<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <title>우성고 카드 시스템 설치</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />

  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="우성고카드" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <style>
    :root {
      --primary: #2563eb;
      --text: #1f4175;
      --sub: #6882a8;
      --bg: #d6e3f3;
      --gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 55%, #1d4ed8 100%);
      --shadow-dark: rgba(110, 138, 176, 0.30);
      --shadow-light: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #f5f9fe 0%, #e4edf8 32%, #d6e3f3 100%);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      text-align: center;
    }

    .hide {
      display: none !important;
    }

    .wrap {
      width: min(420px, 94vw);
    }

    .card {
      padding: 32px 24px;
      border-radius: 34px;
      background: linear-gradient(180deg, #f1f5fb 0%, #dce7f5 100%);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow:
        18px 18px 34px var(--shadow-dark),
        -12px -12px 26px var(--shadow-light),
        inset 1px 1px 0 rgba(255, 255, 255, 0.72);
    }

    .app-icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 22px;
      filter: drop-shadow(0 8px 15px rgba(37, 99, 235, 0.15));
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.72rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .desc {
      margin: 0;
      color: var(--sub);
      line-height: 1.55;
      font-size: 0.96rem;
      font-weight: 700;
      word-break: keep-all;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fbfdff 0%, #e8eff8 100%);
      border: 1px solid rgba(255, 255, 255, 0.82);
      color: #4d6fa6;
      font-size: 0.86rem;
      font-weight: 800;
    }

    .guide {
      margin-top: 20px;
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, #fbfdff 0%, #e8eff8 100%);
      border: 1px solid rgba(255, 255, 255, 0.82);
      text-align: left;
    }

    .guide-title {
      display: block;
      margin-bottom: 10px;
      color: var(--primary);
      font-weight: 900;
      font-size: 0.96rem;
    }

    .guide ol {
      margin: 0;
      padding-left: 20px;
    }

    .guide li {
      margin: 8px 0;
      color: #36527f;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .btns {
      width: 100%;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      background: var(--gradient);
      color: #fff;
      font-weight: 900;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.20);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn.secondary {
      background: linear-gradient(180deg, #fbfdff 0%, #e8eff8 100%);
      color: var(--primary);
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 18px rgba(110, 138, 176, 0.12);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .small {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #8ea2bf;
      font-weight: 700;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="app-icon">
        <img src="./assets/icon-192.png" alt="우성고 카드 아이콘">
      </div>

      <h1>우성고 카드 시스템</h1>
      <p class="desc" id="topMsg">설치 환경을 확인하고 있습니다.</p>

      <span class="badge" id="envBadge">확인 중...</span>

      <div id="iosGuide" class="guide hide">
        <span class="guide-title">iPhone 설치 방법</span>
        <ol>
          <li>공유 버튼을 누릅니다.</li>
          <li>더보기를 누른 뒤 홈 화면에 추가를 선택합니다.</li>
          <li>오른쪽 위 추가를 누르면 완료됩니다.</li>
        </ol>
      </div>

      <div class="btns">
        <a id="chromeInstallBtn" class="btn hide" href="#">
          Chrome에서 설치하기
        </a>

        <button id="installBtn" class="btn hide" type="button">
          앱 설치하기
        </button>

        <a id="goAppBtn" class="btn secondary hide" href="./index.html">
          앱 바로가기
        </a>
      </div>

      <div id="androidSmallText" class="small hide">
        설치가 안 되면 Chrome 메뉴(⋮) → 홈 화면에 추가
      </div>

      <div id="defaultSmallText" class="small">
        이미 설치했다면 홈 화면의 우성고카드 아이콘을 눌러 실행하세요.
      </div>
    </div>
  </div>

<script>
  const APP_PAGE_URL = "https://kanggonbong.github.io/ws-cardapp/";
  const GATE_PAGE_URL = "https://kanggonbong.github.io/ws-cardapp/gate.html";

  const $ = (id) => document.getElementById(id);
  let deferredPrompt = null;

  function show(id) {
    $(id).classList.remove("hide");
  }

  function hide(id) {
    $(id).classList.add("hide");
  }

  function setChromeIntent() {
    const cleanUrl = GATE_PAGE_URL.replace("https://", "");
    $("chromeInstallBtn").href =
      `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(GATE_PAGE_URL)};end`;
  }

  function isInstalledMode() {
    return window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
    });
  }

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredPrompt = event;
    show("installBtn");
  });

  document.addEventListener("DOMContentLoaded", () => {
    const ua = navigator.userAgent.toLowerCase();

    const isAndroid = /android/.test(ua);
    const isiOS = /iphone|ipad|ipod/.test(ua);

    const isSamsung = /samsungbrowser/.test(ua);
    const isKakao = /kakaotalk/.test(ua);
    const isNaver = /naver/.test(ua);
    const isInstagram = /instagram/.test(ua);
    const isFacebook = /fbav|fban/.test(ua);
    const isLine = /\bline\b/.test(ua);

    const isChrome =
      isAndroid &&
      /chrome/.test(ua) &&
      !isSamsung &&
      !isKakao &&
      !isNaver &&
      !isInstagram &&
      !isFacebook &&
      !isLine &&
      !/edg\//.test(ua) &&
      !/opr\//.test(ua);

    setChromeIntent();

    $("installBtn").onclick = async () => {
      if (!deferredPrompt) {
        alert("설치가 안 되면 Chrome 메뉴(⋮) → 홈 화면에 추가를 선택해 주세요.");
        return;
      }

      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    };

    if (isInstalledMode()) {
      window.location.replace(APP_PAGE_URL);
      return;
    }

    if (isAndroid && !isChrome) {
      $("envBadge").innerText = "Android";
      $("topMsg").innerText = "안정적인 설치를 위해 Chrome 브라우저를 이용해주세요.";
      show("chromeInstallBtn");
      show("goAppBtn");
      return;
    }

    if (isAndroid && isChrome) {
      $("envBadge").innerText = "Android Chrome";
      $("topMsg").innerText = "아래 버튼으로 앱을 설치하거나 바로 사용할 수 있습니다.";
      show("goAppBtn");
      show("androidSmallText");
      return;
    }

    if (isiOS) {
      $("envBadge").innerText = "iPhone";
      $("topMsg").innerText = "홈 화면에 추가하면 앱처럼 사용할 수 있습니다.";
      show("iosGuide");
      show("goAppBtn");
      return;
    }

    $("envBadge").innerText = "PC / 기타";
    $("topMsg").innerText = "휴대폰 카메라로 QR을 찍어 접속해주세요.";
    show("goAppBtn");
  });
</script>
</body>
</html>
