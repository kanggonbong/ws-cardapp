<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <title>우성고 카드 시스템 설치</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />

  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="우성고카드" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

  <style>
    :root{
      --bg:#d6e3f3;
      --primary:#2563eb;
      --text:#1f4175;
      --sub:#6882a8;
      --danger:#ef4444;
      --shadow-dark:rgba(110,138,176,.30);
      --shadow-light:rgba(255,255,255,.95);
      --gradient:linear-gradient(135deg,#3b82f6 0%,#2563eb 55%,#1d4ed8 100%);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      width:100%;
      min-height:100%;
      margin:0;
      font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top left,#f5f9fe 0%,#e4edf8 32%,#d6e3f3 100%);
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .hide{display:none!important}

    .wrap{
      width:min(420px,94vw);
      position:relative;
      z-index:10;
    }

    .card{
      padding:32px 24px;
      border-radius:34px;
      text-align:center;
      background:linear-gradient(180deg,#f1f5fb 0%,#dce7f5 100%);
      border:1px solid rgba(255,255,255,.62);
      box-shadow:
        18px 18px 34px var(--shadow-dark),
        -12px -12px 26px var(--shadow-light),
        inset 1px 1px 0 rgba(255,255,255,.72);
    }

    .app-icon{
      width:86px;
      height:86px;
      margin:0 auto 16px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .app-icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      border-radius:22px;
      filter:drop-shadow(0 8px 15px rgba(37,99,235,.15));
    }

    h1{
      margin:0 0 8px;
      font-size:1.72rem;
      font-weight:900;
      letter-spacing:-.04em;
    }

    .desc{
      margin:0;
      color:var(--sub);
      line-height:1.55;
      font-size:0.95rem;
      font-weight:700;
      word-break:keep-all;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:16px;
      padding:6px 12px;
      border-radius:999px;
      background:linear-gradient(180deg,#fbfdff 0%,#e8eff8 100%);
      border:1px solid rgba(255,255,255,.82);
      color:#4d6fa6;
      font-size:0.85rem;
      font-weight:800;
    }

    .warn{
      margin-top:12px;
      padding:11px 12px;
      border-radius:14px;
      background:linear-gradient(180deg,#fff2f2 0%,#ffe6e6 100%);
      color:var(--danger);
      font-size:0.86rem;
      font-weight:800;
      line-height:1.5;
    }

    ol{
      list-style:none;
      padding:0;
      margin:20px 0 0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    li{
      display:flex;
      align-items:center;
      gap:10px;
      text-align:left;
      padding:12px 14px;
      border-radius:16px;
      background:linear-gradient(180deg,#fbfdff 0%,#e8eff8 100%);
      border:1px solid rgba(255,255,255,.82);
      color:#36527f;
      font-size:0.92rem;
      font-weight:700;
      line-height:1.45;
    }

    li i{
      width:32px;
      height:32px;
      flex:0 0 32px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#dbeafe 0%,#bfdbfe 100%);
      color:var(--primary);
      font-size:0.9rem;
    }

    .btns{
      width:100%;
      margin-top:24px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .primary-btn,
    .link-btn{
      width:100%;
      border:0;
      border-radius:16px;
      padding:15px;
      background:var(--gradient);
      color:#fff;
      font-weight:900;
      font-size:1.04rem;
      cursor:pointer;
      box-shadow:0 10px 20px rgba(37,99,235,.20);
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .link-btn.secondary,
    .primary-btn.secondary{
      background:linear-gradient(180deg,#fbfdff 0%,#e8eff8 100%);
      color:#2563eb;
      border:1px solid rgba(255,255,255,.82);
      box-shadow:0 8px 18px rgba(110,138,176,.12);
    }

    .primary-btn:active,
    .link-btn:active{transform:scale(.98)}

    .small{
      margin-top:18px;
      font-size:0.8rem;
      color:#8ea2bf;
      font-weight:600;
      line-height:1.5;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="app-icon">
        <img src="./assets/icon-192.png" alt="우성고 카드 아이콘">
      </div>

      <h1>우성고 카드 시스템</h1>
      <p class="desc" id="topMsg">최적의 설치 환경을 확인하고 있습니다.</p>

      <span class="badge" id="envBadge">분석 중...</span>

      <div id="warnMsg" class="warn hide">
        카톡/네이버/삼성인터넷 등에서는 설치 방식이 다를 수 있습니다.<br>
        안정적인 설치를 위해 Chrome 브라우저 사용을 권장합니다.
      </div>

      <ol id="steps"></ol>

      <div class="btns">
        <a id="chromeBtn" class="link-btn hide" href="#">
          <i class="fab fa-chrome"></i>
          Chrome에서 설치하기
        </a>

        <button id="installBtn" class="primary-btn hide" type="button">
          <i class="fa-solid fa-download"></i>
          앱 설치하기
        </button>

        <button id="copyBtn" class="link-btn secondary hide" type="button">
          <i class="fa-solid fa-copy"></i>
          주소 복사하기
        </button>

        <a id="goAppBtn" class="link-btn secondary hide" href="./index.html">
          <i class="fa-solid fa-arrow-right"></i>
          카드 시스템 바로 열기
        </a>
      </div>

      <div class="small">
        이미 설치했다면 홈 화면의 <b>우성고카드</b> 아이콘을 눌러 실행하세요.
      </div>
    </div>
  </div>

<script>
  const APP_PAGE_URL = "https://kanggonbong.github.io/ws-cardapp/";
  const GATE_PAGE_URL = "https://kanggonbong.github.io/ws-cardapp/gate.html";

  const $ = (id) => document.getElementById(id);

  let deferredPrompt = null;

  function setSteps(arr){
    const ol = $("steps");
    ol.innerHTML = arr.map(v => `<li>${v}</li>`).join("");
    ol.style.display = arr.length ? "flex" : "none";
  }

  function show(id){
    $(id).classList.remove("hide");
  }

  function hide(id){
    $(id).classList.add("hide");
  }

  function setChromeIntent(){
    const cleanUrl = GATE_PAGE_URL.replace("https://", "");
    $("chromeBtn").href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(GATE_PAGE_URL)};end`;
  }

  function isInstalledMode(){
    return window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    show("installBtn");

    $("topMsg").innerText = "설치 준비가 완료되었습니다.";
    setSteps([
      `<i class="fa-solid fa-download"></i><span>아래 <b>앱 설치하기</b> 버튼을 누르세요.</span>`,
      `<i class="fa-solid fa-check"></i><span>설치 확인창에서 <b>설치</b>를 누르면 완료됩니다.</span>`
    ]);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    const ua = navigator.userAgent.toLowerCase();

    const isAndroid = /android/.test(ua);
    const isiOS = /iphone|ipad|ipod/.test(ua);

    const isSamsung = /samsungbrowser/.test(ua);
    const isKakao = /kakaotalk/.test(ua);
    const isNaver = /naver/.test(ua);
    const isInstagram = /instagram/.test(ua);
    const isFacebook = /fbav|fban/.test(ua);
    const isLine = /\bline\b/.test(ua);

    const isInApp = isKakao || isNaver || isInstagram || isFacebook || isLine;
    const isChrome =
      isAndroid &&
      /chrome/.test(ua) &&
      !isSamsung &&
      !isKakao &&
      !isNaver &&
      !isInstagram &&
      !isFacebook &&
      !isLine &&
      !/edg\//.test(ua) &&
      !/opr\//.test(ua);

    setChromeIntent();

    $("copyBtn").onclick = async () => {
      try {
        await navigator.clipboard.writeText(GATE_PAGE_URL);
        alert("주소가 복사되었습니다.");
      } catch (e) {
        prompt("아래 주소를 복사해 주세요.", GATE_PAGE_URL);
      }
    };

    $("installBtn").onclick = async () => {
      if (!deferredPrompt) {
        alert("설치 버튼이 아직 준비되지 않았습니다. Chrome 오른쪽 위 메뉴(⋮)에서 [앱 설치] 또는 [홈 화면에 추가]를 선택해 주세요.");
        return;
      }

      deferredPrompt.prompt();

      const { outcome } = await deferredPrompt.userChoice;

      if (outcome === "accepted") {
        hide("installBtn");
        $("topMsg").innerText = "설치가 완료되었습니다.";
        setSteps([
          `<i class="fa-solid fa-house"></i><span>홈 화면에 생긴 <b>우성고카드</b> 아이콘으로 실행하세요.</span>`
        ]);
      }

      deferredPrompt = null;
    };

    if (isInstalledMode()) {
      window.location.replace(APP_PAGE_URL);
      return;
    }

    if (isAndroid) {
      $("envBadge").innerText = isChrome ? "Android Chrome" : "Android 브라우저";

      if (!isChrome) {
        $("topMsg").innerText = "안정적인 설치를 위해 Chrome 브라우저를 이용해주세요.";
        show("warnMsg");
        show("chromeBtn");
        show("copyBtn");

        setSteps([
          `<i class="fab fa-chrome"></i><span>아래 <b>Chrome에서 설치하기</b> 버튼을 누르세요.</span>`,
          `<i class="fa-solid fa-download"></i><span>Chrome으로 열린 뒤 <b>앱 설치하기</b> 버튼을 누르세요.</span>`,
          `<i class="fa-solid fa-house"></i><span>설치 후 홈 화면 아이콘으로 실행하면 됩니다.</span>`
        ]);

        return;
      }

      $("topMsg").innerText = "앱 설치 준비 중입니다.";
      setSteps([
        `<i class="fa-solid fa-spinner"></i><span>잠시 후 <b>앱 설치하기</b> 버튼이 나타납니다.</span>`,
        `<i class="fa-solid fa-ellipsis-vertical"></i><span>버튼이 안 뜨면 Chrome 메뉴(⋮) → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.</span>`
      ]);

      setTimeout(() => {
        if (!deferredPrompt) {
          $("topMsg").innerHTML = "설치 버튼이 표시되지 않으면<br>Chrome 메뉴에서 추가해주세요.";
          show("goAppBtn");
          setSteps([
            `<i class="fa-solid fa-ellipsis-vertical"></i><span>Chrome 오른쪽 위 <b>점 3개 메뉴(⋮)</b>를 누르세요.</span>`,
            `<i class="fa-solid fa-download"></i><span><b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 선택하세요.</span>`,
            `<i class="fa-solid fa-house"></i><span>설치 후 홈 화면 아이콘으로 실행하세요.</span>`
          ]);
        }
      }, 2500);

      return;
    }

    if (isiOS) {
      $("envBadge").innerText = "iPhone / iOS";
      $("topMsg").innerText = "아이폰은 홈 화면에 추가하면 앱처럼 사용할 수 있습니다.";
      show("goAppBtn");

      setSteps([
        `<i class="fa-solid fa-share-from-square"></i><span>화면 아래 또는 위의 <b>공유 버튼</b>을 누르세요.</span>`,
        `<i class="fa-solid fa-ellipsis"></i><span><b>더보기</b>를 누른 뒤 <b>홈 화면에 추가</b>를 선택하세요.</span>`,
        `<i class="fa-solid fa-plus"></i><span>오른쪽 위 <b>추가</b>를 누르면 홈 화면에 아이콘이 생깁니다.</span>`
      ]);

      return;
    }

    $("envBadge").innerText = "PC / 기타";
    $("topMsg").innerText = "휴대폰 카메라로 QR을 찍어 접속해주세요.";
    show("goAppBtn");
    setSteps([
      `<i class="fa-solid fa-mobile-screen"></i><span>이 페이지는 모바일 설치 안내용입니다.</span>`
    ]);
  });
</script>
</body>
</html>
